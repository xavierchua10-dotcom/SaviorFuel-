<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>SaviorFuel — Food Tracker</title>
<meta name="description" content="Log your meals and macros. A free food tracker by Savior, built to pair with SaviorFit Logger.">
<link rel="icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaviorFuel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN SYSTEM — copied 1:1 from SaviorFit Logger (IronLedger
     repo) so SaviorFuel matches it visually out of the box. Keep
     these tokens in sync by hand if the Logger's palette ever
     changes; there's no shared stylesheet between the two repos.
     ========================================================= */
  :root{
    --bg:#14161a;
    --panel:#1c1f24;
    --panel-2:#242830;
    --panel-3:#2a2f38;
    --line:#2e333b;
    --text:#e9e6df;
    --text-dim:#8b9098;
    --text-faint:#82878f;
    --accent:#f2b134;
    --accent-dim:#7a6224;
    --accent-rgb:242,177,52;
    --accent-2:#c1443c;
    --accent-2-dim:#4a2321;
    --success:#5fb86a;
    --success-dim:#233821;
    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --radius-xl:20px;
    --radius-pill:999px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    /* Subtle depth for cards — one soft, low-opacity shadow, not a
       dramatic drop shadow. Same value in both themes; a plain dark
       shadow reads fine against a light card too. */
    --card-shadow:0 1px 2px rgba(0,0,0,0.14), 0 4px 10px rgba(0,0,0,0.10);
    /* Fixed, theme-independent — the header stays exactly as it was
       in both themes, per request, so it does not reference any of
       the swappable tokens above. */
    --header-bg:rgba(16,18,21,0.72);
    --header-text:#e9e6df;
    --header-text-faint:#82878f;
    --header-accent:#f2b134;
    --header-line:#2e333b;
  }

  /* ---------- Light theme — swaps the neutral/surface tokens only.
     --accent/--success/--accent-2 are deliberately darker here than
     their dark-mode values (not just reused) since the originals
     don't have enough contrast against a light background for text
     use (tab labels, ring percentages, captions), not just fills. */
  body[data-theme="light"]{
    --bg:#f6f4f0;
    --panel:#ffffff;
    --panel-2:#f0eee7;
    --panel-3:#e4e1d8;
    --line:#ddd9cf;
    --text:#22201c;
    --text-dim:#6b6860;
    --text-faint:#706c61;
    --accent:#966000;
    --accent-dim:#f0dfb8;
    --accent-rgb:150,96,0;
    --accent-2:#a5372f;
    --accent-2-dim:#f6dcda;
    --success:#31703e;
    --success-dim:#e2f2e4;
  }
  /* Verified against actual WCAG contrast math, not eyeballed —
     text-faint/accent/success above are the minimum darkening each
     needed to clear 4.5:1 against every background they're actually
     used on (cards, the tab bar, caption backgrounds). Accent going
     darker breaks fixed dark (#1c1500) text sitting on an accent-
     colored background (.category-pill.active, .unit-toggle button
     .active) — was already borderline in the old lighter accent,
     definitively fails now. Dark-mode's much brighter accent still
     works fine with dark text, so these are light-theme-only
     overrides rather than changing the shared rules.  */
  body[data-theme="light"] .category-pill.active{color:#fff;}
  body[data-theme="light"] .unit-toggle button.active{color:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;}
  button:active, [data-action]:active{
    filter:brightness(1.2);
    transition:filter 70ms ease-out;
  }
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background-color:var(--bg);
    background-image:linear-gradient(rgba(20,22,26,0.88), rgba(20,22,26,0.88)), url('images/bg-nutrition.webp');
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    overflow:hidden;
  }
  /* Toggled off via Settings > Appearance — plain background color
     only, no illustration. */
  body[data-bg-art="off"] #app{background-image:none;}

  /* ---------- Topbar (same structure/classes as SaviorFit Logger) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--header-line);
    background:var(--header-bg);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--header-text);
  }
  .topbar h1 span{color:var(--header-accent);}
  .topbar h1 small{
    display:inline-block;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.02em;
    text-transform:none;
    color:var(--header-text-faint);
    margin-left:8px;
  }
  .topbar h1 small::before{content:'-\00A0';}

  /* ---------- Main content area ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 16px calc(90px + var(--safe-bottom));
  }

  /* Every tab's first card needs the top inset #view no longer
     provides itself. */
  #view > *:first-child{
    margin-top:16px;
  }

  /* Fade+shift tab transition — same treatment as SaviorFit Logger's
     switchTabWithFade, so switching tabs feels identical across both
     apps. See switchTab() below. */
  #view.subtab-fade-out{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 140ms ease, transform 140ms ease;
  }
  #view.subtab-fade-in{
    opacity:1;
    transform:translateY(0);
    transition:opacity 160ms ease, transform 160ms ease;
  }

  /* Extra bottom room on Insights so the last row/card isn't hidden
     behind the sticky Today / Trends bar (mirrors SaviorFit Logger's
     body.has-progress-subtab rule). */
  body.has-insights-subtab main#view{
    padding-bottom:calc(136px + var(--safe-bottom));
  }

  /* ---------- Bottom nav stack (tab bar + optional Insights sub-tab bar) ---------- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    z-index:20;
  }

  /* ---------- Insights sub-tab bar (Today / Trends) — same pattern as
     SaviorFit Logger's Volume overview / Exercise progression bar ---------- */
  .insights-subtabbar{
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
  }
  .insights-subtabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-weight:700;
    padding:12px 6px;
    cursor:pointer;
  }
  .insights-subtabbar button + button{border-left:1px solid var(--line);}
  .insights-subtabbar button.active{color:var(--accent);background:var(--panel-3);}
  .insights-subtabbar button:active{opacity:0.85;}

  /* ---------- Bottom tab bar (same classes as SaviorFit Logger) ---------- */
  .tabbar{
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
  }
  .tabbar button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:10px 4px 8px;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--accent);}
  .tab-glyph svg{width:22px;height:22px;}

  /* ---------- Empty state (same pattern as SaviorFit Logger) ---------- */
  .empty.tab-empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--text-dim);
    padding:60px 24px;
    gap:14px;
  }
  .empty .glyph{
    width:48px;height:48px;
    color:var(--text-faint);
  }
  .empty p{margin:0;font-size:14px;line-height:1.5;}

  /* ---------- Cards (same pattern as SaviorFit Logger) ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px 14px 12px;
    margin-bottom:14px;
    box-shadow:var(--card-shadow);
  }

  /* ---------- Buttons (same pattern as SaviorFit Logger) ---------- */
  .btn-primary{
    display:block;
    width:100%;
    background:var(--accent);
    color:#1c1500;
    border:none;
    border-radius:var(--radius-xl);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px;
    cursor:pointer;
  }

  /* ---------- Macro summary + bars ---------- */
  /* No longer sticky/pinned — scrolls away with the rest of the
     content like a normal card, now that it's styled like one
     (rounded corners, border, shadow). Pinning it while everything
     else scrolled underneath looked like it was floating oddly. */
  .macro-cal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .macro-collapse-toggle{
    background:var(--panel-3);border:none;border-radius:50%;
    width:28px;height:28px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:pointer;padding:0;
  }
  .macro-collapse-toggle svg{width:16px;height:16px;transition:transform 0.2s ease;}
  .macro-collapse-toggle:active{background:var(--panel-2);}
  .macro-cal-row-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .reset-log-btn{
    background:none; border:1px solid var(--accent-2-dim); color:var(--accent-2);
    font-size:15px; line-height:1; padding:0;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .reset-log-btn:active{background:var(--accent-2-dim);}
  .macro-cal-row .num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
  .macro-cal-row .num span{font-size:14px;font-weight:500;color:var(--text-faint);}
  .macro-bar-row{margin-bottom:5px;}
  .macro-bar-row:last-child{margin-bottom:0;}

  .macro-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:3px;}
  .macro-bar-label b{color:var(--text);}
  .macro-bar-track{height:5px;border-radius:var(--radius-pill);background:var(--panel-3);overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);}
  .macro-bar-fill.protein{background:var(--success);}
  .macro-bar-fill.carbs{background:#5fa8d6;}
  .macro-bar-fill.fat{background:var(--accent-2);}
  .macro-bar-fill.fiber{background:#a97c50;}
  .macro-bar-fill.sugar{background:#d67ab1;}
  .macro-bar-fill.sodium{background:#4fc3c9;}
  .macro-bar-fill.over{background:var(--accent-2);}

  /* ---------- Quick-add meal form (inside the Add Meal sheet) ---------- */
  #addMealBody .field-row{display:flex;gap:8px;margin-bottom:8px;}
  /* Persistent label above each numeric field — the old placeholder
     text ("kcal", "protein g") explained what a field was only while
     it was empty; once a value got typed or prefilled from a search
     pick, it vanished, leaving bare unlabeled numbers. */
  .field-labeled{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .field-labeled label{font-size:11px;font-weight:600;color:var(--text-faint);padding:0 2px;}

  /* ---------- Meal category picker (inside Add Meal overlay) ---------- */
  .category-picker{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-bottom:12px;
  }
  .category-pill{
    background:var(--panel-2); border:1px solid var(--line);
    color:var(--text-dim); font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:var(--radius-pill); cursor:pointer;
  }
  .category-pill.active{background:var(--accent); border-color:var(--accent); color:#1c1500;}
  .category-pill:active{filter:brightness(1.1);}

  /* Small category tag shown on each meal row and as section headers
     in the grouped Log/History lists. */
  .category-section-label{
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);
    margin:16px 0 6px; padding:0 2px;
  }
  .category-section-label:first-child{margin-top:0;}
  .category-section-total{float:right; color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-weight:400; letter-spacing:0;}

  /* Subtler in-card category label for History's single-list view —
     just a small text row between groups of meal rows, no card/border
     of its own, unlike Log's standalone .category-section-label. */
  .inline-category-label{
    font-family:'Oswald',sans-serif; font-size:10.5px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);
    padding:10px 0 4px;
  }
  .inline-category-label:first-child{padding-top:0;}

  /* Brief glow on the sheet right after a food gets picked from
     search/scan — confirms the fill worked without needing a toast
     or alert. Class is added once by openAddMealOverlay() and
     removed via setTimeout, so it plays once per open. */
  @keyframes addMealGlow{
    0%{ box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.55), 0 0 18px 2px rgba(var(--accent-rgb),0.35); border-color:var(--accent); }
    100%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),0); border-color:var(--line); }
  }
  .add-meal-sheet.glow-once{
    animation:addMealSheetIn 0.22s cubic-bezier(0.16, 1, 0.3, 1), addMealGlow 900ms ease-out;
  }
  /* Same glow, no sheet slide-in — for the meal row itself once it
     lands in the Log list, confirming it was actually added. */
  .meal-row.glow-once{
    animation:addMealGlow 900ms ease-out;
    border-radius:var(--radius-sm);
  }
  #addMealBody input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
  }
  #addMealBody input:focus{outline:none;border-color:var(--accent);}
  #addMealBody input::placeholder{color:var(--text-faint);}

  /* ---------- Meal list rows ---------- */
  .meal-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .meal-row:last-child{border-bottom:none;}
  .meal-row-name{font-size:14px;color:var(--text);flex:1;min-width:0;}
  .meal-row-name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meal-row-macros{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);}
  .meal-row-cal{font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);white-space:nowrap;}
  .meal-row-del{
    background:none;border:none;color:var(--text-faint);
    display:flex;align-items:center;justify-content:center;
    padding:6px;cursor:pointer;flex-shrink:0;
  }
  .meal-row-del svg{width:16px;height:16px;display:block;}
  .meal-row-del:active{color:var(--accent-2);}

  /* ---------- History day groups ---------- */
  .history-day-card .history-day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .history-day-head .date{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--text);}
  .history-day-head .total{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);}

  /* ---------- Insights bars ---------- */
  .insight-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .insight-bar-day{width:52px;font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .insight-bar-track{flex:1;height:16px;background:var(--panel-3);border-radius:var(--radius-xs);overflow:hidden;}
  .insight-bar-fill{height:100%;background:var(--accent);border-radius:var(--radius-xs);}
  .insight-bar-val{width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);flex-shrink:0;}

  /* ---------- Insights "Today" macro rings ---------- */
  .calorie-ring-row{display:flex;justify-content:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .calorie-ring-item{display:flex;flex-direction:column;align-items:center;}
  .calorie-ring-wrap{position:relative;width:116px;height:116px;}
  .calorie-ring-svg{width:116px;height:116px;transform:rotate(-90deg);}
  .calorie-ring-track{fill:none;stroke:var(--panel-3);stroke-width:10;}
  .calorie-ring-fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 500ms ease;}
  .calorie-ring-fill.over{stroke:var(--accent-2);}
  .calorie-ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; color:var(--text);
  }
  .calorie-ring-pct.over{color:var(--accent-2);}
  .calorie-ring-label{
    margin-top:10px; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim);
  }
  .calorie-ring-sub{margin-top:2px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);}

  .macro-ring-row{display:flex;justify-content:space-between;gap:8px;padding-top:2px;}
  .macro-ring-item{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
  .macro-ring-wrap{position:relative;width:76px;height:76px;}
  .macro-ring-svg{width:76px;height:76px;transform:rotate(-90deg);}
  .macro-ring-track{fill:none;stroke:var(--panel-3);stroke-width:7;}
  .macro-ring-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 500ms ease;}
  .macro-ring-fill.protein{stroke:var(--success);}
  .macro-ring-fill.carbs{stroke:#5fa8d6;}
  .macro-ring-fill.fat{stroke:var(--accent-2);}
  .macro-ring-fill.over{stroke:var(--accent-2);}
  .macro-ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:700; color:var(--text);
  }
  .macro-ring-pct.over{color:var(--accent-2);}
  .macro-ring-label{
    margin-top:9px; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim);
  }
  .macro-ring-sub{margin-top:2px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);}

  .remaining-row{display:flex;justify-content:space-between;gap:6px;padding-top:14px;margin-top:14px;border-top:1px solid var(--line);}
  .remaining-item{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
  .remaining-item .num{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;}
  .remaining-item .num.over{color:var(--accent-2);}
  .remaining-item .lbl{
    margin-top:3px; font-family:'Oswald',sans-serif; font-size:10px; font-weight:700;
    letter-spacing:0.03em; text-transform:uppercase; color:var(--text-faint); text-align:center;
  }

  .insight-caption{
    font-family:'Inter',sans-serif; font-size:12.5px; line-height:1.4;
    color:var(--text-dim); margin:16px 0 0; padding:10px 12px;
    background:var(--panel-3); border-radius:var(--radius-sm);
  }
  .insight-caption.balanced{color:var(--success);background:var(--success-dim);}
  .insight-caption .cap-protein{color:var(--success);font-weight:700;}
  .insight-caption .cap-carbs{color:#5fa8d6;font-weight:700;}
  .insight-caption .cap-fat{color:var(--accent-2);font-weight:700;}

  /* ---------- Settings ---------- */
  /* Plain spacing wrapper — used only where a raw <h3> label sits
     above its own already-boxed .card (Your profile, Daily goals),
     so it stays unboxed instead of nesting a second box around the
     .card's box (same background/border, so the inner border was
     barely visible against its own parent — a real visual bug, not
     a style choice). */
  .settings-section{margin-bottom:18px;}
  .settings-section h3{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);
    margin:0 0 10px;
  }
  .settings-goal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .settings-goal-row label{font-size:13px;color:var(--text-dim);}
  .settings-goal-row input{
    width:80px;text-align:right;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 8px;
  }
  .settings-goal-row input:focus{outline:none;border-color:var(--accent);}
  .settings-goal-row select{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 8px;
    max-width:150px;
  }
  .settings-goal-row select:focus{outline:none;border-color:var(--accent);}
  .plan-result-banner{
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--text-dim);
  }
  .plan-result-banner b{color:var(--accent);}
  .btn-danger{
    display:block;width:100%;background:none;border:1px solid var(--accent-2);
    color:var(--accent-2);border-radius:var(--radius-xl);font-family:'Oswald',sans-serif;
    font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:12px;cursor:pointer;
  }

  /* ---------- Selected-food banner (shown in the add-meal card
     once a search/scan result has been picked) ---------- */
  .selected-food-banner{
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--text-dim);
  }
  .selected-food-banner-row{display:flex;justify-content:space-between;align-items:center;}
  .selected-food-banner b{color:var(--text);}
  .selected-food-banner .grams-input{
    width:60px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius-xs);color:var(--text);font-family:'JetBrains Mono',monospace;
    font-size:12px;padding:5px 6px;text-align:center;
  }
  /* Only shown when the picked food has a known serving size (OFF
     products with contributor-entered serving data) — grams-only
     otherwise, since guessing a serving size would just be wrong. */
  .unit-toggle{display:flex;gap:2px;background:var(--panel-2);border-radius:var(--radius-sm);padding:3px;margin-top:8px;}
  .unit-toggle button{
    flex:1;background:none;border:none;color:var(--text-faint);
    padding:6px 8px;border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;
  }
  .unit-toggle button.active{background:var(--accent);color:#1c1500;}

  /* ---------- Barcode scanner overlay ---------- */
  .scan-overlay{
    position:fixed;inset:0;background:#000;z-index:999;
    display:flex;flex-direction:column;
  }
  .scan-overlay video{flex:1;width:100%;object-fit:cover;}
  .scan-overlay-status{
    position:absolute;top:calc(18px + var(--safe-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:13px;padding:0 20px;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  .scan-overlay-frame{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88%;max-width:360px;aspect-ratio:4/3;
    border:2px solid var(--accent);border-radius:var(--radius-md);
    box-shadow:0 0 0 2000px rgba(0,0,0,0.4);
  }
  .scan-overlay-controls{
    position:absolute;bottom:calc(30px + var(--safe-bottom));left:0;right:0;
    display:flex;align-items:center;justify-content:center;gap:18px;
  }
  .scan-overlay-cancel{
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius-pill);font-family:'Oswald',sans-serif;font-size:13px;
    font-weight:700;letter-spacing:0.03em;text-transform:uppercase;padding:12px 28px;cursor:pointer;
  }
  .scan-overlay-capture{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    background:var(--accent);color:#14161a;border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .scan-overlay-capture svg{width:22px;height:22px;}
  .scan-overlay-capture.loading{opacity:0.55;pointer-events:none;}
  .scan-overlay-capture:active{opacity:0.85;}

  /* ---------- Settings — same structural classes as SaviorFit Logger ---------- */
  .section-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:22px 0 8px;
  }
  .section-label:first-child{margin-top:0;}
  .settings-group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 14px;
    margin-bottom:16px;
    box-shadow:var(--card-shadow);
  }
  .settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 0;
    border-top:1px solid var(--line);
    gap:12px;
  }
  .settings-row:first-child{border-top:none;}
  .settings-row .sr-label{font-size:14px;color:var(--text);font-weight:600;}
  .settings-row .sr-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;line-height:1.4;}
  .settings-row .sr-action{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--accent);
    border-radius:var(--radius-sm);
    padding:8px 14px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    flex-shrink:0;
  }
  .settings-row .sr-action-danger{color:var(--accent-2);border-color:var(--accent-2-dim);}
  .settings-row .seg{display:flex;background:var(--panel-2);border-radius:var(--radius-sm);padding:3px;flex-shrink:0;}
  .settings-row .seg button{
    background:none;border:none;color:var(--text-faint);
    padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;cursor:pointer;
    font-family:'JetBrains Mono',monospace;
  }
  .settings-row .seg button.active{background:var(--accent);color:#1c1500;}
  .settings-version{text-align:center;color:var(--text-faint);font-size:11px;padding:16px 0 4px;letter-spacing:0.02em;}
  .danger-zone-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .danger-zone-toggle .dz-chevron{font-size:10px;color:var(--text-faint);transition:transform 0.15s ease;}
  .danger-zone-toggle.open .dz-chevron{transform:rotate(180deg);}

  /* ---------- Density + corner-style overrides (Appearance settings) ---------- */
  body[data-density="compact"] .meal-row{padding:6px 0;}
  body[data-density="compact"] .card{padding:10px 10px 8px;}
  body[data-corners="sharp"]{
    --radius-xs:2px; --radius-sm:2px; --radius:2px;
    --radius-md:2px; --radius-lg:2px; --radius-xl:2px; --radius-pill:2px;
  }

  /* ---------- Food search overlay — same structure/animation as
     SaviorFit Logger's exercise search overlay ---------- */
  .food-search-overlay{
    position:absolute;
    inset:0;
    z-index:92;
    background:rgba(14,16,19,0.82);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    animation:foodSearchBackdropIn 0.22s ease;
  }
  .food-search-overlay.hidden{display:none;}
  .food-search-overlay-panel{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:foodSearchPanelIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .food-search-overlay-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(18px + var(--safe-bottom)) 16px 12px;
    flex-shrink:0;
  }
  .food-search-back, .food-search-scan-btn{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:none;
    background:var(--panel-3);color:var(--text);cursor:pointer;padding:0;
  }
  .food-search-back svg, .food-search-scan-btn svg{display:block;width:18px;height:18px;}
  .food-search-back:active, .food-search-scan-btn:active{background:var(--panel-2);transform:scale(0.94);}
  .food-search-overlay-input{
    flex:1;min-width:0;
    background:var(--panel-2);
    border:1.5px solid var(--accent-dim);
    color:var(--text);
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .food-search-overlay-input:focus{outline:none;border-color:var(--accent);}
  .food-suggest-list{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 16px calc(20px + var(--safe-bottom));
    display:flex;flex-direction:column;gap:8px;
  }
  .food-suggest-item{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    text-align:left;background:var(--panel-3);border:1px solid var(--line);color:var(--text);
    font-size:13.5px;font-family:'Inter',sans-serif;font-weight:500;
    padding:13px 14px;border-radius:var(--radius);cursor:pointer;
  }
  .food-suggest-item:active{background:var(--panel);border-color:var(--accent-dim);}
  .food-suggest-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .food-suggest-name .brand{display:block;font-size:11px;color:var(--text-faint);}
  .food-suggest-tag{
    flex-shrink:0;background:var(--panel);color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius);
  }
  .food-suggest-status{font-size:12px;color:var(--text-faint);padding:8px 4px;}

  /* Trigger button that opens the overlay, replacing the old inline box */
  .food-search-trigger{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius-lg);color:var(--text-dim);font-size:14px;
    padding:12px 14px;cursor:pointer;margin:10px 0 0;
  }
  .food-search-trigger svg{width:18px;height:18px;flex-shrink:0;color:var(--text-faint);}

  /* Same dashed-border pattern for the "use what I typed" option
     pinned above search results when nothing's an exact match. */
  .food-suggest-custom{
    width:100%;text-align:left;background:transparent;
    border:1.5px dashed var(--accent-dim);color:var(--accent);
    font-size:13.5px;font-weight:600;padding:13px 14px;
    border-radius:var(--radius);cursor:pointer;margin-bottom:8px;
  }
  .food-suggest-custom:active{background:var(--accent-dim);}

  @keyframes foodSearchBackdropIn{ 0%{opacity:0;} 100%{opacity:1;} }
  @keyframes foodSearchPanelIn{ 0%{opacity:0;transform:translateY(28px);} 100%{opacity:1;transform:translateY(0);} }

  /* ---------- Add Meal overlay — centered modal, distinct from the
     full-screen search overlay so the two don't feel like the same
     pattern stacked twice ---------- */
  .add-meal-overlay{
    position:absolute; inset:0; z-index:95;
    display:flex; align-items:center; justify-content:center;
    padding:24px 20px;
  }
  .add-meal-overlay.hidden{display:none;}
  .add-meal-backdrop{
    position:absolute; inset:0;
    background:rgba(10,11,13,0.62);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    animation:foodSearchBackdropIn 0.2s ease;
  }
  .add-meal-sheet{
    position:relative;
    width:100%; max-width:380px; max-height:82vh;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    padding:18px 18px 20px;
    display:flex; flex-direction:column;
    animation:addMealSheetIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes addMealSheetIn{ 0%{opacity:0;transform:scale(0.94);} 100%{opacity:1;transform:scale(1);} }
  .add-meal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .add-meal-head h2{
    margin:0; font-family:'Oswald',sans-serif; font-size:16px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text);
  }
  .add-meal-close{
    width:30px;height:30px;flex-shrink:0;border-radius:50%;
    background:var(--panel-3);border:none;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .add-meal-close svg{width:15px;height:15px;}
  .add-meal-close:active{background:var(--panel-2);}
  .add-meal-body{overflow-y:auto;}

  /* ---------- Nutrient info popover — same overlay pattern as Add
     Meal, just a smaller fixed-content card instead of a form. ---------- */
  .nutrient-info-overlay{
    position:absolute; inset:0; z-index:96;
    display:flex; align-items:center; justify-content:center;
    padding:24px 20px;
  }
  .nutrient-info-overlay.hidden{display:none;}
  .nutrient-info-backdrop{
    position:absolute; inset:0;
    background:rgba(10,11,13,0.62);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .nutrient-info-card{
    position:relative;
    width:100%; max-width:340px;
    max-height:80vh; overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    box-shadow:var(--card-shadow);
    padding:18px 18px 20px;
  }
  .nutrient-info-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .nutrient-info-head h3{
    margin:0; font-family:'Oswald',sans-serif; font-size:16px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text);
  }
  .nutrient-info-head button{
    width:28px;height:28px;flex-shrink:0;border-radius:50%;
    background:var(--panel-3);border:none;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .nutrient-info-head button svg{width:14px;height:14px;}
  .nutrient-info-head button:active{background:var(--panel-2);}
  .nutrient-info-image{display:block;width:100%;height:auto;border-radius:var(--radius-md);}

  /* Info button on the Today card header, opens the macros/fiber
     guide image. */
  .nutrient-info-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px;
    background:none; border:none; color:var(--text-faint); cursor:pointer; padding:0;
  }
  .nutrient-info-btn svg{width:100%;height:100%;}
  .nutrient-info-btn:active{color:var(--text-dim);}
  .today-card-head{display:flex;align-items:center;justify-content:space-between;}
  .today-card-head .section-label{margin:0;}

  /* ---------- Insights "Daily Overview" — 3D model panel ----------
     The card is sized to fill the space between the top bar and the
     bottom nav so the page itself doesn't scroll while you drag the
     model around. The card has no border/background of its own and
     the canvas is transparent, so the model sits directly on the
     app background with no box around it. */
  #view .card.model-card{
    position:relative;
    padding:0;
    overflow:hidden;
    background:none;
    border:none;
    border-radius:0;
    box-shadow:none;
    height:clamp(320px, calc(100vh - 240px - var(--safe-bottom)), 640px);
    height:clamp(320px, calc(100dvh - 240px - var(--safe-bottom)), 640px);
  }
  /* Full-screen mode: while the 3D panel is showing, #view drops its
     padding/scroll and the card stretches edge to edge between the
     top bar and the bottom nav (JS sets card bottom = nav height). */
  body.has-insights-subtab main#view.model-fullscreen{padding:0; overflow:hidden; position:relative;}
  #view.model-fullscreen > .card.model-card{
    position:absolute; top:0; left:0; right:0; bottom:0;
    height:auto; margin:0;
  }
  .model-stage{position:absolute; inset:0;}
  .model-stage canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab; outline:none;}
  .model-status{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:24px; text-align:center; font-size:13px; line-height:1.5;
    color:var(--text-faint); pointer-events:none;
  }
  .model-bar{width:160px; height:3px; border-radius:2px; background:var(--line); overflow:hidden;}
  .model-bar i{display:block; height:100%; width:0; background:var(--accent); transition:width 150ms ease;}

  .hidden{display:none !important;}

  .boot-loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .boot-loading-mark{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .boot-loading-mark span{color:var(--accent);}
</style>
</head>
<body>

<div id="bootLoading" class="boot-loading"><div class="boot-loading-mark">SAVIOR<span>FUEL</span></div></div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1>SAVIOR<span>FUEL</span><small>Food Tracker</small></h1>
  </header>

  <main id="view"></main>

  <div class="bottom-nav" id="bottomNav">
  <nav class="insights-subtabbar hidden" id="insightsSubtabbar">
    <button data-action="set-insights-view" data-view="today">Daily Overview</button>
    <button data-action="set-insights-view" data-view="trends">Weekly Overview</button>
  </nav>
  <nav class="tabbar" id="tabbar">
    <button data-action="set-tab" data-tab="log" class="active">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="4" width="4" height="16" rx="1.3"/><rect x="19" y="4" width="4" height="16" rx="1.3"/><rect x="5" y="10.4" width="14" height="3.2" rx="1"/></svg></span>
      Log
    </button>
    <button data-action="set-tab" data-tab="history">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="16" width="12" height="3" rx="1"/></svg></span>
      History
    </button>
    <button data-action="set-tab" data-tab="insights">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></span>
      Insights
    </button>
    <button data-action="set-tab" data-tab="settings">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></span>
      Settings
    </button>
  </nav>
  </div>
</div>

<div class="food-search-overlay hidden" id="foodSearchOverlay">
  <div class="food-search-overlay-panel">
    <div class="food-search-overlay-head">
      <button class="food-search-back" data-action="close-food-search-overlay" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <input type="text" class="food-search-overlay-input" id="foodSearchInput" placeholder="Search a food..." autocomplete="off">
      <button class="food-search-scan-btn" data-action="open-scanner" aria-label="Scan barcode or food photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>
      </button>
    </div>
    <div class="food-suggest-list" id="foodSearchResults"></div>
  </div>
</div>

<div id="scanOverlay" class="scan-overlay hidden">
  <video id="scanVideo" playsinline autoplay muted></video>
  <div class="scan-overlay-status" id="scanStatus">Point at a barcode, or snap a photo of the food</div>
  <div class="scan-overlay-frame"></div>

<div class="nutrient-info-overlay hidden" id="nutrientInfoOverlay">

<script>
  // =========================================================
  // SAVIORFUEL — local-state working version
  // Visual shell copied from SaviorFit Logger. Data layer here
  // is 100% local (in-memory + localStorage) — no Firebase, no
  // auth, no sync across devices yet. That's intentional: this
  // is meant to prove out the actual product before wiring up a
  // backend. Data model (meal shape, settings shape) is written
  // to already look like what would eventually go in Firestore,
  // so swapping in real persistence later is mostly mechanical.
  //
  // Storage key: everything lives under one localStorage key,
  // 'saviorfuel_local_v1'. Bump the version suffix if the shape
  // of STORE ever changes in a way that would break old data.
  // =========================================================

  var STORAGE_KEY = 'saviorfuel_local_v1';

  // Fiber/sugar/sodium defaults follow the FDA's general Daily
  // Values (28g, 50g added sugar, 2300mg) — same starting-point
  // convention as the Mifflin-St Jeor calculator below: a sensible
  // default, always overridable in Settings.
  var DEFAULT_GOALS = { calories: 2000, protein: 150, carbs: 200, fat: 65, fiber: 28, sugar: 50, sodium: 2300 };

  var MEAL_CATEGORIES = [
    { id: 'breakfast', label: 'Breakfast' },
    { id: 'morning-snack', label: 'Morning Snacks' },
    { id: 'lunch', label: 'Lunch' },
    { id: 'evening-snack', label: 'Evening Snacks' },
    { id: 'dinner', label: 'Dinner' }
  ];
  var CATEGORY_LABELS = MEAL_CATEGORIES.reduce(function(acc, c){ acc[c.id] = c.label; return acc; }, {});

  // Sensible default for whichever category button is pre-selected
  // when the Add Meal overlay opens — always overridable by the user.
  function suggestCategoryForNow(){
    var h = new Date().getHours();
    if (h < 10) return 'breakfast';
    if (h < 12) return 'morning-snack';
    if (h < 15) return 'lunch';
    if (h < 18) return 'evening-snack';
    return 'dinner';
  }
  var DEFAULT_PROFILE = { sex: 'male', age: 25, heightCm: 170, weightKg: 70, activityLevel: 'moderate', goal: 'maintain' };
  var DEFAULT_APP_SETTINGS = { unit: 'metric', haptic: true, density: 'comfortable', corners: 'rounded', theme: 'dark', bgArt: true };
  var APP_VERSION = '0.1.0';

  function cmToIn(cm){ return cm / 2.54; }
  function inToCm(inches){ return inches * 2.54; }
  function kgToLb(kg){ return kg * 2.20462; }
  function lbToKg(lb){ return lb / 2.20462; }

  var ACTIVITY_LEVELS = [
    { id: 'sedentary', label: 'Sedentary (little/no exercise)', mult: 1.2 },
    { id: 'light', label: 'Light (1-3 days/week)', mult: 1.375 },
    { id: 'moderate', label: 'Moderate (3-5 days/week)', mult: 1.55 },
    { id: 'active', label: 'Very active (6-7 days/week)', mult: 1.725 },
    { id: 'extra', label: 'Extra active (physical job + training)', mult: 1.9 }
  ];
  var GOAL_OPTIONS = [
    { id: 'lose', label: 'Lose weight', calAdjust: -500 },
    { id: 'maintain', label: 'Maintain', calAdjust: 0 },
    { id: 'gain', label: 'Build muscle', calAdjust: 300 }
  ];

  var STORE = loadStore();
  var state = { tab: 'log' };
  var ui = {
    historyOpenDay: null,
    selectedFood: null,   // { name, brand, per100g: {cal,protein,carbs,fat} } once a search result is tapped
    grams: 100,            // serving size in grams, scales the selected food's macros
    prefillName: null, prefillCal: null, prefillProtein: null, prefillCarbs: null, prefillFat: null,
    prefillFiber: null, prefillSugar: null, prefillSodium: null,
    searchDebounce: null,
    dangerZoneOpen: false,
    justFilledFood: false,
    macroCardCollapsed: false,
    selectedCategory: 'breakfast', // set properly each time the Add Meal overlay opens
    insightsView: 'today', // 'today' | 'trends' — which Insights sub-tab panel is showing
    unitMode: 'grams' // 'grams' | 'servings' — only meaningful when the picked food has a known serving size (see selectedFood.servingGrams)
  };

  function loadStore(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [] };
      var parsed = JSON.parse(raw);
      // Merge (not replace) so existing saved goals keep whatever the
      // person already customized, while newly-added goal fields
      // (e.g. fiber/sugar/sodium) backfill from defaults instead of
      // coming back undefined.
      parsed.goals = Object.assign({}, DEFAULT_GOALS, parsed.goals || {});
      if (!parsed.meals) parsed.meals = [];
      if (!parsed.profile) parsed.profile = Object.assign({}, DEFAULT_PROFILE);
      // Same merge reasoning as goals above — existing density/corners/
      // unit choices are kept, newly-added settings (theme) backfill.
      parsed.appSettings = Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {});
      // Foods picked from a live search/scan, cached locally so the
      // same food can be found and re-logged without network next
      // time (see saveFoodToCache / searchSavedFoods).
      if (!parsed.savedFoods) parsed.savedFoods = [];
      return parsed;
    } catch (e){
      console.error('SaviorFuel: failed to load local store, starting fresh —', e);
      return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [] };
    }
  }

  function saveStore(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
    } catch (e){
      console.error('SaviorFuel: failed to save local store —', e);
    }
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function dateKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayKey(){ return dateKey(Date.now()); }

  function formatDateLabel(key){
    var today = todayKey();
    var yesterday = dateKey(Date.now() - 86400000);
    if (key === today) return 'Today';
    if (key === yesterday) return 'Yesterday';
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mealsForDay(key){
    return STORE.meals.filter(function(m){ return dateKey(m.loggedAt) === key; });
  }

  function totalsFor(meals){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, sodium: 0 };
    meals.forEach(function(m){
      t.calories += m.calories || 0;
      t.protein += m.protein || 0;
      t.carbs += m.carbs || 0;
      t.fat += m.fat || 0;
      t.fiber += m.fiber || 0;
      t.sugar += m.sugar || 0;
      t.sodium += m.sodium || 0;
    });
    return t;
  }

  function pct(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.min(100, Math.round((value / goal) * 100)));
  }

  // Same as pct() but never caps the upper end — for anywhere the
  // actual number is shown (ring center text, etc.), so 250g against
  // a 100g goal reads as "250%", not a misleading capped "100%".
  // Fill widths/ring offsets still need pct() (capped) since they're
  // physically bounded by the container — this one's for display only.
  function pctUncapped(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.round((value / goal) * 100));
  }

  function showNutrientInfo(){
    document.getElementById('nutrientInfoTitle').textContent = 'Macros & Fiber';
    // Reference image rather than generated text — kept as its own
    // file (images/macros-fiber-guide.webp) rather than inlined,
    // same as the background art, so it's cacheable and doesn't
    // bloat the HTML.
    document.getElementById('nutrientInfoBody').innerHTML =
      '<img class="nutrient-info-image" src="images/macros-fiber-guide.webp" alt="Guide to protein, carbs, fats, and fiber — what each does and where to find it">';
    document.getElementById('nutrientInfoOverlay').classList.remove('hidden');
  }

  function closeNutrientInfo(){
    document.getElementById('nutrientInfoOverlay').classList.add('hidden');
  }

  /* =========================================================
     RENDER — LOG TAB
     ========================================================= */
  function renderLog(){
    var todayMeals = mealsForDay(todayKey()).sort(function(a,b){ return b.loggedAt - a.loggedAt; });
    var totals = totalsFor(todayMeals);
    var g = STORE.goals;

    var collapsed = ui.macroCardCollapsed;
    var resetBtn = todayMeals.length > 0
      ? '<button class="reset-log-btn" data-action="reset-today-log" aria-label="Reset today\u2019s log">&#8635;</button>'
      : '';
    var chevron = '<button class="macro-collapse-toggle" data-action="toggle-macro-card" aria-label="' + (collapsed ? 'Expand' : 'Collapse') + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(' + (collapsed ? '180deg' : '0deg') + ')"><polyline points="18 15 12 9 6 15"></polyline></svg>' +
    '</button>';

    var html = '<div class="card macro-summary-card">' +
      '<div class="macro-cal-row"><div class="num">' + totals.calories + ' <span>/ ' + g.calories + ' kcal</span></div><div class="macro-cal-row-actions">' + resetBtn + chevron + '</div></div>' +
      (collapsed ? '' :
        macroBarHtml('Protein', totals.protein, g.protein, 'protein') +
        macroBarHtml('Carbs', totals.carbs, g.carbs, 'carbs') +
        macroBarHtml('Fat', totals.fat, g.fat, 'fat')
      ) +
      '<button class="food-search-trigger" data-action="open-food-search-overlay">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
        'Search or scan a food...' +
      '</button>' +
    '</div>';

    // Add Meal now lives in its own overlay (see openAddMealOverlay) —
    // nothing rendered inline here for it anymore.

    if (todayMeals.length === 0){
      html += '<div class="empty tab-empty-state"><div class="glyph">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
        '</svg></div><p>Nothing logged yet today.<br>Add your first meal above.</p></div>';
    } else {
      html += groupedMealsHtml(todayMeals);
    }

    document.getElementById('view').innerHTML = html;
  }

  // Groups a list of meals into category sections (Breakfast, Morning
  // Snacks, Lunch, Evening Snacks, Dinner — in that fixed order) each
  // with its own header, calorie subtotal, and card of rows. Meals
  // logged before this feature existed have no category field, so
  // they land in a trailing "Other" bucket rather than being hidden
  // or crashing the grouping.
  function groupedMealsHtml(meals){
    var buckets = {};
    MEAL_CATEGORIES.forEach(function(c){ buckets[c.id] = []; });
    var other = [];
    meals.forEach(function(m){
      if (m.category && buckets[m.category]) buckets[m.category].push(m);
      else other.push(m);
    });

    var html = '';
    MEAL_CATEGORIES.forEach(function(c){
      var group = buckets[c.id];
      if (group.length === 0) return;
      var subtotal = totalsFor(group).calories;
      html += '<div class="category-section-label">' + c.label +
        '<span class="category-section-total">' + subtotal + ' kcal</span></div>' +
        '<div class="card">' + group.map(mealRowHtml).join('') + '</div>';
    });
    if (other.length > 0){
      html += '<div class="category-section-label">Other' +
        '<span class="category-section-total">' + totalsFor(other).calories + ' kcal</span></div>' +
        '<div class="card">' + other.map(mealRowHtml).join('') + '</div>';
    }
    return html;
  }

  function macroBarHtml(label, value, goal, cls, unit){
    unit = unit || 'g';
    var over = goal > 0 && value > goal;
    return '<div class="macro-bar-row">' +
      '<div class="macro-bar-label"><span>' + label + '</span><b>' + Math.round(value) + unit + ' / ' + goal + unit + '</b></div>' +
      '<div class="macro-bar-track"><div class="macro-bar-fill ' + cls + (over ? ' over' : '') + '" style="width:' + pct(value, goal) + '%"></div></div>' +
    '</div>';
  }

  // One row of the Insights "Today" table — plain consumed/goal/%
  // numbers, no bar, since this panel is meant to read as a quick
  // reference table rather than a repeat of the Log tab's bars.
  // Ring circumference is fixed (r=32), so the stroke-dasharray is
  // constant and only stroke-dashoffset moves to reveal the arc.
  // Fill offset stays capped at 100% (a ring can't physically show
  // more than a full circle), but the center text uses the real,
  // uncapped percentage — and switches to the "over" red once past
  // 100% — so exceeding a goal never just looks identical to hitting
  // it exactly.
  var MACRO_RING_R = 32;
  var MACRO_RING_CIRCUMFERENCE = 2 * Math.PI * MACRO_RING_R;

  function macroRingHtml(label, value, goal, colorClass){
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = MACRO_RING_CIRCUMFERENCE * (1 - Math.min(percent, 100) / 100);
    return '<div class="macro-ring-item">' +
      '<div class="macro-ring-wrap">' +
        '<svg class="macro-ring-svg" viewBox="0 0 76 76">' +
          '<circle class="macro-ring-track" cx="38" cy="38" r="' + MACRO_RING_R + '"></circle>' +
          '<circle class="macro-ring-fill ' + colorClass + (over ? ' over' : '') + '" cx="38" cy="38" r="' + MACRO_RING_R + '" ' +
            'style="stroke-dasharray:' + MACRO_RING_CIRCUMFERENCE.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="macro-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div class="macro-ring-label">' + label + '</div>' +
      '<div class="macro-ring-sub">' + Math.round(value) + ' / ' + goal + 'g</div>' +
    '</div>';
  }

  // Bigger hero ring above the macro rings, same technique but its
  // own radius/stroke and the accent gold color rather than a macro
  // color, so calories reads as the headline stat.
  var CALORIE_RING_R = 48;
  var CALORIE_RING_CIRCUMFERENCE = 2 * Math.PI * CALORIE_RING_R;

  function calorieRingHtml(value, goal){
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = CALORIE_RING_CIRCUMFERENCE * (1 - Math.min(percent, 100) / 100);
    return '<div class="calorie-ring-row"><div class="calorie-ring-item">' +
      '<div class="calorie-ring-wrap">' +
        '<svg class="calorie-ring-svg" viewBox="0 0 116 116">' +
          '<circle class="calorie-ring-track" cx="58" cy="58" r="' + CALORIE_RING_R + '"></circle>' +
          '<circle class="calorie-ring-fill' + (over ? ' over' : '') + '" cx="58" cy="58" r="' + CALORIE_RING_R + '" ' +
            'style="stroke-dasharray:' + CALORIE_RING_CIRCUMFERENCE.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="calorie-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div class="calorie-ring-label">Calories</div>' +
      '<div class="calorie-ring-sub">' + Math.round(value) + ' / ' + goal + ' kcal</div>' +
    '</div></div>';
  }

  // Budget framing to sit alongside the percentage rings above — how
  // much of each goal is left to hit (or how far over), rather than
  // how much has been consumed so far.
  function remainingStatHtml(label, consumed, goal, unit){
    var diff = goal - consumed;
    var over = diff < 0;
    var amount = Math.round(Math.abs(diff));
    return '<div class="remaining-item">' +
      '<div class="num' + (over ? ' over' : '') + '">' + amount + unit + '</div>' +
      '<div class="lbl">' + label + (over ? ' over' : ' left') + '</div>' +
    '</div>';
  }

  // A one-line read on today's macros — calls out whichever macro is
  // furthest behind its own goal, or says so if all three are
  // tracking evenly. Recomputed fresh from today's actual totals on
  // every render, so it always reflects the current numbers rather
  // than being a static message.
  // A calorie-% floor before making any balance claim — at very low
  // intake (e.g. one small snack) every macro's % of goal is near
  // zero, so the spread looks tiny and reads as "balanced" even
  // though nothing meaningful has been logged yet. Below the floor,
  // say so instead of drawing a conclusion from too little data.
  var BALANCE_MIN_CALORIE_PCT = 15;
  var BALANCE_SPREAD_THRESHOLD = 15;

  function macroBalanceCaption(todayMeals, todayTotals, g){
    if (todayMeals.length === 0){
      return { text: 'Nothing logged yet today — log a meal to see how you\'re tracking.', tone: '' };
    }
    var caloriePct = pct(todayTotals.calories, g.calories);
    if (caloriePct < BALANCE_MIN_CALORIE_PCT){
      return { text: 'Still early today — log a bit more to get a balance read.', tone: '' };
    }
    var macros = [
      { name: 'Protein', pct: pct(todayTotals.protein, g.protein), cls: 'cap-protein' },
      { name: 'Carbs', pct: pct(todayTotals.carbs, g.carbs), cls: 'cap-carbs' },
      { name: 'Fat', pct: pct(todayTotals.fat, g.fat), cls: 'cap-fat' }
    ];
    var lowest = macros.reduce(function(a, b){ return b.pct < a.pct ? b : a; });
    var highest = macros.reduce(function(a, b){ return b.pct > a.pct ? b : a; });
    var spread = highest.pct - lowest.pct;

    if (spread <= BALANCE_SPREAD_THRESHOLD){
      return { text: 'Balanced today — protein, carbs, and fat are all tracking evenly.', tone: 'balanced' };
    }
    return {
      text: '<span class="' + lowest.cls + '">' + lowest.name + '</span> is lagging at ' + lowest.pct + '% of today\'s goal, furthest behind of the three.',
      tone: ''
    };
  }

  function mealRowHtml(m){
    return '<div class="meal-row" data-id="' + m.id + '">' +
      '<div class="meal-row-name">' +
        '<div class="meal-row-name-text" title="' + esc(m.name) + '">' + esc(m.name) + '</div>' +
        '<div class="meal-row-macros">P' + (m.protein||0) + ' · C' + (m.carbs||0) + ' · F' + (m.fat||0) + '</div>' +
      '</div>' +
      '<div class="meal-row-cal">' + m.calories + '</div>' +
      '<button class="meal-row-del" data-action="delete-meal" data-id="' + m.id + '" aria-label="Delete">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>' +
      '</button>' +
    '</div>';
  }

  function selectedFoodBannerHtml(){
    var f = ui.selectedFood;
    if (f.wholeServing){
      return '<div class="selected-food-banner">' +
        '<span>From Kalori: <b>' + esc(f.name) + '</b> — ' + esc(f.servingLabel || '1 serving') + '</span>' +
      '</div>';
    }
    var showServingToggle = f.servingGrams && f.servingGrams > 0;
    var inputHtml = (ui.unitMode === 'servings' && showServingToggle)
      ? '<input type="number" class="grams-input" id="foodGrams" step="0.5" value="' + (Math.round((ui.grams / f.servingGrams) * 100) / 100) + '" data-action-change="rescale-food"> serving' + (ui.grams === f.servingGrams ? '' : 's')
      : '<input type="number" class="grams-input" id="foodGrams" value="' + ui.grams + '" data-action-change="rescale-food"> g';
    return '<div class="selected-food-banner">' +
      '<div class="selected-food-banner-row">' +

  function searchFoodDebounced(query){
