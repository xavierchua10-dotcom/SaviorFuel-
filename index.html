  .insights-subtabbar.hidden{display:none;}
  body.has-insights-subtab main#view:not(.model-fullscreen) > *:first-child{margin-top:12px;}
  /* 3D panel: leave a gap under the pill so the corner tabs don't touch it */
  body.has-insights-subtab #view.model-fullscreen > .card.model-card{top:12px;}
  /* room for the floating tab bar on every tab */
  main#view{padding-bottom:calc(112px + var(--safe-bottom));}

  /* ---- Favorites / Recent in food search ---- */
  .food-home-label{font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin:14px 2px 6px;}
  .food-home-label:first-child{margin-top:4px;}
  .food-fav{
    width:34px; height:34px; flex-shrink:0; border:none; background:none; padding:0; cursor:pointer;
    color:var(--text-faint); display:flex; align-items:center; justify-content:center; border-radius:50%;
  }
  .food-fav svg{width:20px; height:20px; fill:none;}
  .food-fav.on{color:var(--c-carbs);}
  .food-fav.on svg{fill:currentColor;}
  .food-fav:active{background:var(--panel-2);}

  /* ---- Header: logo mark instead of the wordmark (same idea as SaviorFit Logger) ---- */
  .topbar{padding:calc(6px + env(safe-area-inset-top, 0px) * 0.65) 18px 4px;} /* same as SaviorFit Logger */
  .topbar-brand{display:flex; align-items:center; margin:0; line-height:0;}
  .topbar-logo{height:46px; width:auto; display:block;}

  .boot-loading-logo{width:150px; height:150px; display:block; animation:bootPulse 1.6s ease-in-out infinite;}
  @keyframes bootPulse{0%,100%{opacity:.75; transform:scale(.97);} 50%{opacity:1; transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .boot-loading-logo{animation:none;} }

  .toast.has-action{pointer-events:auto; display:flex; align-items:center; gap:12px; padding-right:8px;}
  .toast-action{
    background:rgba(var(--accent-rgb),.18); color:var(--accent); border:none; border-radius:var(--radius-pill);
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;
    padding:7px 14px; cursor:pointer;
  }
  .meal-row-copy{
    background:none;border:none;color:var(--text-faint);
    display:flex;align-items:center;justify-content:center;
    padding:6px;cursor:pointer;flex-shrink:0;margin-right:-4px;
  }
  .meal-row-copy svg{width:16px;height:16px;display:block;}
  .meal-row-copy:active{color:var(--accent);}

  /* ---- First-run welcome ---- */
  .welcome-overlay{position:fixed; inset:0; z-index:300; background:var(--bg); display:flex; justify-content:center; overflow-y:auto;}
  .welcome-card{width:100%; max-width:480px; min-height:100%; display:flex; flex-direction:column; padding:calc(28px + var(--safe-top, 0px)) 22px calc(22px + var(--safe-bottom));}
  .welcome-dots{display:flex; gap:8px; justify-content:center; margin-bottom:22px;}
  .welcome-dots i{width:26px; height:5px; border-radius:3px; background:var(--panel-3);}
  .welcome-dots i.done{background:rgba(var(--accent-rgb),.5);}
  .welcome-dots i.on{background:var(--accent);}
  .welcome-body{flex:1; display:flex; flex-direction:column; gap:14px;}
  .welcome-body h2{margin:0; font-family:'Oswald',sans-serif; font-size:28px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text);}
  .welcome-body p{margin:0; font-size:14px; line-height:1.55; color:var(--text-dim);}
  .welcome-logo{width:170px; height:170px; align-self:center; margin:18px 0 6px; display:block;}
  .welcome-field{display:flex; flex-direction:column; gap:6px; flex:none; min-width:0;}
  .welcome-row .welcome-field{flex:1;}
  .welcome-field label{font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);}
  .welcome-field input, .welcome-field select{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
    color:var(--text); font-size:16px; padding:13px 12px; font-family:inherit;
  }
  .welcome-row{display:flex; gap:10px;}
  .welcome-seg{display:flex; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-pill); padding:4px; gap:4px;}
  .welcome-seg button{flex:1; border:none; background:none; color:var(--text-dim); border-radius:var(--radius-pill); padding:10px 8px; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.05em; text-transform:uppercase; font-weight:600; cursor:pointer;}
  .welcome-seg button.active{background:var(--accent); color:#0f2410;}
  body[data-theme="light"] .welcome-seg button.active{color:#fff;}
  .welcome-goals{display:flex; flex-direction:column; gap:8px;}
  .welcome-goals button{text-align:left; background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius-xl); padding:14px 16px; color:var(--text); cursor:pointer; display:flex; flex-direction:column; gap:3px;}
  .welcome-goals button b{font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:0.04em; text-transform:uppercase;}
  .welcome-goals button span{font-size:12px; color:var(--text-faint);}
  .welcome-goals button.active{border-color:var(--accent); background:rgba(var(--accent-rgb),.12);}
  .welcome-plan-kcal{font-family:'Oswald',sans-serif; font-size:64px; font-weight:700; line-height:1; color:var(--accent); text-align:center; margin:10px 0 4px;}
  .welcome-plan-kcal span{display:block; font-size:12px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-top:6px;}
  .welcome-note{text-align:center;}
  .welcome-footer{display:flex; flex-direction:column; gap:8px; margin-top:22px;}
  .welcome-primary{border:none; border-radius:var(--radius-pill); padding:16px; background:var(--accent); color:#0f2410; font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; font-weight:700; cursor:pointer;}
  body[data-theme="light"] .welcome-primary{color:#fff;}
  .welcome-primary:active{transform:scale(.98);}
  .welcome-skip{border:none; background:none; color:var(--text-faint); font-size:13px; padding:10px; cursor:pointer;}

  /* ---- Install banner / iOS help ---- */
  .install-banner{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid rgba(var(--accent-rgb),.45); border-radius:var(--radius-xl); padding:10px 8px 10px 10px; margin-bottom:12px;}
  .install-banner-icon{width:42px; height:42px; border-radius:12px; flex-shrink:0;}
  .install-banner-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .install-banner-text b{font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text);}
  .install-banner-text span{font-size:12px; color:var(--text-faint);}
  .install-banner-btn{border:none; background:var(--accent); color:#0f2410; border-radius:var(--radius-pill); padding:9px 16px; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.07em; text-transform:uppercase; font-weight:700; cursor:pointer;}
  body[data-theme="light"] .install-banner-btn{color:#fff;}
  .install-banner-x{border:none; background:none; color:var(--text-faint); font-size:22px; line-height:1; width:32px; height:32px; cursor:pointer;}
  .install-help{position:fixed; inset:0; z-index:320; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center;}
  .install-help-card{width:100%; max-width:480px; background:var(--panel); border-radius:26px 26px 0 0; padding:22px 22px calc(22px + var(--safe-bottom)); display:flex; flex-direction:column; gap:12px; color:var(--text);}
  .install-help-logo{width:64px; height:64px; align-self:center;}
  .install-help-card h3{margin:0; text-align:center; font-family:'Oswald',sans-serif; font-size:20px; letter-spacing:0.05em; text-transform:uppercase;}
  .install-help-card ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:10px; font-size:14px; line-height:1.5; color:var(--text-dim);}
  .install-help-card ol b{color:var(--text);}
  .ih-share{display:inline-block; color:var(--accent); font-weight:700;}

  /* ===== Polish: History, Insights, Settings (SaviorFit Logger building blocks) ===== */
  .pf-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 4px;}
  .pf-stat{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; min-width:0;}
  .pf-stat-v{font:700 26px/1 'Oswald',sans-serif; color:var(--text); white-space:nowrap;}
  .pf-stat-v small{font:500 12px 'Inter',sans-serif; color:var(--text-faint);}
  .pf-stat-l{font:700 10px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.12em; color:var(--text-faint); margin-top:7px; text-transform:uppercase;}
  .pf-stat.accent .pf-stat-v{color:var(--accent);}
  .pf-stat.protein .pf-stat-v{color:var(--c-protein);}
  .pf-stat.carbs .pf-stat-v{color:var(--c-carbs);}
  .pf-stat.fat .pf-stat-v{color:var(--c-fat);}
  .hist-stats{margin-top:0;}
  .chev-rot,.hist-chev{display:inline-flex; width:16px; height:16px; color:var(--text-faint); transition:transform .18s ease; flex:0 0 auto;}
  .hist-chev svg{width:100%; height:100%;}
  .hist-week.open > .hist-week-head .hist-chev,.hist-item.open > .hist-item-head .hist-chev,.setc-wrap.open > .setc .hist-chev{transform:rotate(180deg);}
  .hist-chev.go{transform:rotate(-90deg);}
  /* history */
  .hist-week{background:var(--panel); border:1px solid var(--line); border-radius:16px; margin-bottom:10px;}
  .hist-week-head,.hist-item-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .hist-item-main{min-width:0; flex:1;}
  .hist-name{font:600 15px 'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--text);}
  .hist-name span{color:var(--text-faint); font-weight:500;}
  .hist-sub{font:500 10px 'JetBrains Mono',ui-monospace,monospace; letter-spacing:.1em; color:var(--text-faint); margin-top:3px; text-transform:uppercase;}
  .hist-dots{display:flex; gap:5px;}
  .hist-dot{width:7px; height:7px; border-radius:50%; background:var(--panel-3); display:block;}
  .hist-dot.on{background:var(--accent);} .hist-dot.over{background:var(--accent-2);}
  .hist-dot.low{background:rgba(var(--accent-rgb),.4);} .hist-dot.future{background:transparent; box-shadow:inset 0 0 0 1px var(--line);}
  .hist-week-body{padding:0 10px 4px;}
  .hist-item{background:var(--panel-2); border:1px solid var(--line); border-radius:14px; margin-bottom:8px;}
  .hist-item.is-today{border-color:rgba(var(--accent-rgb),.55);}
  .hist-item-head{padding:11px 12px;}
  .hist-item-side{display:flex; align-items:center; gap:9px;}
  .hist-kcal{font:700 17px 'Oswald',sans-serif; color:var(--text); text-align:right;}
  .hist-kcal small{font:500 9px 'JetBrains Mono',monospace; color:var(--text-faint); margin-left:3px; letter-spacing:.08em; text-transform:uppercase;}
  .hist-ring{--p:0; width:34px; height:34px; border-radius:50%; position:relative; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p) * 1%), var(--panel-3) 0);}
  .hist-ring::before{content:""; position:absolute; inset:4px; border-radius:50%; background:var(--panel-2);}
  .hist-ring span{position:relative; font:700 9px 'JetBrains Mono',monospace; color:var(--text);}
  .hist-ring.over{background:conic-gradient(var(--accent-2) 100%, var(--panel-3) 0);}
  .hist-ring.low{background:conic-gradient(rgba(var(--accent-rgb),.5) calc(var(--p) * 1%), var(--panel-3) 0);}
  .hist-item-body{border-top:1px solid var(--line); padding:2px 0 6px;}
  /* insights extras */
  .insights-extras{margin-top:14px; padding-bottom:30px;}
  .insights-extras .pf-stats{margin-top:0;}
  .ach-count{color:var(--accent); margin-left:6px;}
  .ach-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .ach{padding:12px 4px 10px; border-radius:16px; background:rgba(255,255,255,.03); border:1px solid var(--line); text-align:center; opacity:.55;}
  .ach.on{opacity:1;}
  .ach-coin{--c1:#30343a; --c2:#1d2024; --c3:#3d424a; --ic:#6b717b; width:52px; height:52px; border-radius:50%; margin:0 auto; display:grid; place-items:center; font:700 16px 'Oswald',sans-serif; color:var(--ic);
    background:radial-gradient(circle at 30% 24%, rgba(255,255,255,.3), transparent 46%), linear-gradient(145deg, var(--c1), var(--c2)); box-shadow:inset 0 0 0 3px var(--c3), 0 6px 14px rgba(0,0,0,.45);}
  .ach.t1 .ach-coin{--c1:#d98a4e; --c2:#8a4a1e; --c3:#f0b183; --ic:#2a1204;}
  .ach.t2 .ach-coin{--c1:#d4dae1; --c2:#7d8793; --c3:#f4f6f8; --ic:#1c2229;}
  .ach.t3 .ach-coin{--c1:#ffd266; --c2:#c98a10; --c3:#fff0b8; --ic:#3a2500;}
  .ach-name{font:700 9px 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; margin-top:8px; color:var(--text);}
  /* settings */
  .pf-hero{border-radius:22px; border:1px solid rgba(var(--accent-rgb),.55); background:linear-gradient(160deg, rgba(var(--accent-rgb),.16), var(--panel) 55%); padding:20px 18px 18px; box-shadow:0 14px 40px rgba(0,0,0,.3);}
  .pf-id{display:flex; align-items:center; gap:14px;}
  .pf-av{width:68px; height:68px; border-radius:50%; border:2.5px solid var(--accent); background:#000; flex:0 0 auto; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .pf-av img{width:60px; height:60px; object-fit:contain; display:block;}
  .pf-id-tx{min-width:0; flex:1;}
  .pf-name{font:700 26px/1.05 'Oswald',sans-serif; color:var(--text); text-transform:uppercase;}
  .pf-since{font:500 12px 'Inter',sans-serif; color:var(--text-faint); margin-top:4px;}
  .pf-since b{color:var(--accent); font-weight:700;}
  .pf-acts{display:flex; gap:10px; margin-top:16px;}
  .pf-share{flex:1; height:44px; border-radius:12px; border:none; background:var(--accent); color:#0b1a10; font:700 14px 'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;}
  .pf-share:active{transform:scale(.98);}
  .pf-edit{flex:0 0 44px; height:44px; border-radius:12px; border:1px solid rgba(var(--accent-rgb),.55); background:transparent; color:var(--accent); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer;}
  .pf-edit svg{width:18px; height:18px;}
  .setc-wrap{background:var(--panel); border:1px solid var(--line); border-radius:18px; margin-bottom:10px; scroll-margin-top:70px;}
  .setc-wrap.open{border-color:rgba(var(--accent-rgb),.45);}
  .setc-wrap.install{border-color:rgba(var(--accent-rgb),.45);}
  .setc{display:flex; align-items:center; gap:14px; padding:13px 14px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .setc-ic{width:38px; height:38px; border-radius:12px; background:rgba(var(--accent-rgb),.14); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .setc-ic.solid{background:var(--accent); color:#0b1a10;}
  .setc-ic svg{width:19px; height:19px;}
  .setc-tx{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .setc-t{font:600 15px 'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.03em; color:var(--text);}
  .setc-d{font-size:11px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .setc-body{padding:0 12px 12px; border-top:1px solid var(--line);}
  .setc-body .settings-section{margin:12px 0 0;}
  .setc-body .settings-section h3{display:none;}
  .setc-body .settings-group,.setc-body .card{margin-top:12px; margin-bottom:0;}
  .setc-body .settings-section .card{margin-top:0;}
  .setc-body .plan-result-banner{margin:12px 0 0;}
  .theme-pick{display:flex; gap:10px; padding:2px 0 10px;}
  .theme-opt{flex:1; border:2px solid var(--line); border-radius:16px; padding:8px; background:var(--bg); cursor:pointer; color:var(--text);}
  .theme-opt.active{border-color:var(--accent);}
  .theme-opt b{display:block; font:700 11px 'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase; text-align:center; margin-top:6px;}
  .theme-opt.active b{color:var(--accent);}
  .theme-prev{display:flex; flex-direction:column; gap:4px; height:46px; border-radius:9px; padding:7px; background:#282d36;}
  .theme-prev i{display:block; height:6px; border-radius:3px; background:#383f4b;}
  .theme-prev i:first-child{width:60%; background:#a6e36b;} .theme-prev i:last-child{width:85%;}
  .theme-opt.light{background:#f3f0e8;} .theme-opt.light .theme-prev{background:#fff;}
  .theme-opt.light .theme-prev i{background:#e9e4d9;} .theme-opt.light .theme-prev i:first-child{background:#3f7a12;}
  .theme-opt.light b{color:#5b616a;} .theme-opt.light.active b{color:#3f7a12;}

  .stats-sheet{position:fixed; inset:0; z-index:310; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center;}
  .stats-sheet-card{width:100%; max-width:480px; max-height:86vh; overflow-y:auto; background:var(--bg); border:1px solid var(--line); border-radius:26px 26px 0 0; padding:16px 16px calc(22px + var(--safe-bottom)); color:var(--text);}
  .stats-sheet-head{display:flex; align-items:center; justify-content:space-between;}
  .stats-sheet-head h3{margin:0; font:700 18px 'Oswald',sans-serif; letter-spacing:.05em; text-transform:uppercase;}
  .stats-sheet-x{border:none; background:none; color:var(--text-faint); font-size:26px; line-height:1; width:36px; height:36px; cursor:pointer;}
  .stats-sheet .insights-extras{margin-top:6px;}
  .hist-sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.04em; font-size:9.5px;}

  .hist-month-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .hist-month{font:700 20px 'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.03em;}
  .hist-month-nav{display:flex; gap:6px;}
  .hist-month-nav button{width:38px; height:32px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:18px; line-height:1; cursor:pointer;}
  .hist-month-nav button:disabled{opacity:.35; cursor:default;}
  .hist-cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 12px 6px;}
  .hc-h{text-align:center; font:700 9px 'JetBrains Mono',monospace; color:var(--text-faint); padding-bottom:2px;}
  .hc-blank{height:28px;}
  .hc-day{height:28px; border-radius:10px; border:none; background:var(--panel-2); color:var(--text-dim); font:600 11px 'JetBrains Mono',monospace; display:flex; align-items:center; justify-content:center; padding:0;}
  button.hc-day{cursor:pointer;}
  .hc-day.on{background:rgba(var(--accent-rgb),.3); color:var(--text);}
  .hc-day.low{background:rgba(var(--accent-rgb),.12); color:var(--text);}
  .hc-day.over{background:rgba(224,87,79,.32); color:var(--text);}
  .hc-day.future{background:none; color:var(--text-faint); opacity:.5;}
  .hc-day.now{box-shadow:inset 0 0 0 2px var(--accent);}
  .hc-day.picked{box-shadow:inset 0 0 0 2px var(--text);}
  .hist-legend{grid-column:1/-1; display:flex; gap:14px; padding:6px 2px 8px; font:500 9px 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);}
  .hist-legend span{display:flex; align-items:center; gap:5px;}
  .hist-legend i{width:9px; height:9px; border-radius:50%; display:block;}
  .hist-legend i.on,.hist-status.on{background:var(--accent);} .hist-legend i.low,.hist-status.low{background:rgba(var(--accent-rgb),.4);} .hist-legend i.over,.hist-status.over{background:var(--accent-2);}
  .hist-status{width:9px; height:9px; border-radius:50%; display:block; background:var(--panel-3);}
  .hist-search{width:100%; height:42px; border-radius:14px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:0 14px; font:400 14px 'Inter',sans-serif; margin:12px 0 0; outline:none;}
  .hist-search:focus{border-color:rgba(var(--accent-rgb),.6);}
  #histList .hist-item{background:var(--panel);}
  #histList .section-label{margin-top:18px;}
  .hist-day-tot{font:500 10px 'JetBrains Mono',monospace; letter-spacing:.1em; color:var(--text-faint); text-transform:uppercase; padding:10px 14px 2px;}
  .hist-copy{display:block; width:calc(100% - 28px); margin:8px 14px 12px; height:38px; border-radius:12px; border:1px solid rgba(var(--accent-rgb),.55); background:transparent; color:var(--accent); font:700 13px 'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;}
  .overview-plain .pf-stats{margin:4px 0 18px;}

  .food-home-actions{display:flex; gap:8px; margin:2px 0 4px;}
  .food-home-actions button{flex:1; height:40px; border-radius:12px; border:1px solid rgba(var(--accent-rgb),.5); background:transparent; color:var(--accent); font:700 13px 'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;}
  .food-fav.edit{color:var(--text-faint);}
  .food-fav.edit svg{fill:none;}
  .fs-hint{margin:6px 0 4px; font-size:13px; color:var(--text-dim);}
  .fs-field{display:flex; flex-direction:column; gap:5px; margin-top:12px; flex:1; min-width:0;}
  .fs-field label{font:500 10px 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);}
  .fs-field input{height:44px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:0 12px; font:400 15px 'Inter',sans-serif; outline:none; width:100%;}
  .fs-field input:focus{border-color:rgba(var(--accent-rgb),.6);}
  .fs-row{display:flex; gap:10px;}
  .fs-save{width:100%; height:46px; margin-top:18px; border-radius:12px; border:none; background:var(--accent); color:#0b1a10; font:700 15px 'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;}
  body[data-theme="light"] .fs-save{color:#fff;}
  .fs-delete{width:100%; height:40px; margin-top:8px; border:none; background:none; color:var(--accent-2); font:600 13px 'Inter',sans-serif; cursor:pointer;}
  .water-row{display:flex; align-items:center; gap:10px; margin:12px 0 0; padding:10px 12px; border-radius:16px; background:var(--panel); border:1px solid var(--line);}
  .water-ic{width:30px; height:30px; border-radius:10px; background:rgba(108,196,238,.16); color:var(--c-fat); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .water-ic svg{width:16px; height:16px;}
  .water-main{flex:1; min-width:0;}
  .water-top{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--text-faint);}
  .water-top b{font:600 13px 'Oswald',sans-serif; letter-spacing:.04em; text-transform:uppercase; color:var(--text);}
  .water-bar{height:5px; border-radius:3px; background:var(--panel-3); margin-top:6px; overflow:hidden;}
  .water-bar i{display:block; height:100%; border-radius:3px; background:var(--c-fat);}
  .water-btn{height:32px; min-width:38px; padding:0 10px; border-radius:10px; border:1px solid rgba(108,196,238,.5); background:transparent; color:var(--c-fat); font:700 12px 'Oswald',sans-serif; cursor:pointer;}
  .water-btn.minus{min-width:32px; padding:0; font-size:16px; border-color:var(--line); color:var(--text-faint);}
  .water-btn:disabled{opacity:.35;}
</style>
</head>
<body>

<div id="bootLoading" class="boot-loading"><img class="boot-loading-logo" src="images/logo-mark.png" alt="SaviorFuel"></div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1 class="topbar-brand"><img src="images/logo-mark.png" alt="SaviorFuel" class="topbar-logo"></h1>
  </header>

  <nav class="insights-subtabbar hidden" id="insightsSubtabbar">
    <span class="subtab-slider" aria-hidden="true"></span>
    <button data-action="set-insights-view" data-view="today">Daily Overview</button>
    <button data-action="set-insights-view" data-view="trends">Weekly Overview</button>
  </nav>

  <main id="view"></main>

  <div class="bottom-nav" id="bottomNav">
  <nav class="tabbar" id="tabbar">
    <span class="tab-slider" aria-hidden="true"></span>
    <button data-action="set-tab" data-tab="log" class="active">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v7.2c0 1 .7 1.8 1.6 2V22h2V11.2c.9-.2 1.6-1 1.6-2V2h-1.6v5.6h-1.1V2H8.7v5.6H7.6V2zM17.2 2c-2 1.3-3.2 3.8-3.2 6.6 0 2 .9 3.2 2.2 3.6V22h2V2z"/></svg></span>
      Log
    </button>
    <button data-action="set-tab" data-tab="history">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="16" width="12" height="3" rx="1"/></svg></span>
      History
    </button>
    <button data-action="set-tab" data-tab="scan" aria-label="Scan">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h6v2.4H5.4V9H3z"/><path d="M15 3h6v6h-2.4V5.4H15z"/><path d="M3 15h2.4v3.6H9V21H3z"/><path d="M18.6 15H21v6h-6v-2.4h3.6z"/><rect x="6.5" y="11" width="11" height="2" rx="1"/></svg></span>
      Scan
    </button>
    <button data-action="set-tab" data-tab="insights">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></span>
      Insights

<script>
/*! SaviorFuel — Copyright (c) 2026 Xavier Chua (Savior). All rights reserved. See LICENSE. */
  // =========================================================
  // SAVIORFUEL — local-state working version
  // Visual shell copied from SaviorFit Logger. Data layer here
  // is 100% local (in-memory + localStorage) — no Firebase, no
  // auth, no sync across devices yet. That's intentional: this
  // is meant to prove out the actual product before wiring up a
  // backend. Data model (meal shape, settings shape) is written
  // to already look like what would eventually go in Firestore,
  // so swapping in real persistence later is mostly mechanical.
  //
  // Storage key: everything lives under one localStorage key,
  // 'saviorfuel_local_v1'. Bump the version suffix if the shape
  // of STORE ever changes in a way that would break old data.
  // =========================================================

  var STORAGE_KEY = 'saviorfuel_local_v1';

  // Fiber/sugar/sodium defaults follow the FDA's general Daily
  // Values (28g, 50g added sugar, 2300mg) — same starting-point
  // convention as the Mifflin-St Jeor calculator below: a sensible
  // default, always overridable in Settings.
  var DEFAULT_GOALS = { calories: 2000, protein: 150, carbs: 200, fat: 65, fiber: 28, sugar: 50, sodium: 2300, water: 2500 };

  var MEAL_CATEGORIES = [
    { id: 'breakfast', label: 'Breakfast' },
    { id: 'morning-snack', label: 'Morning Snacks' },
    { id: 'lunch', label: 'Lunch' },
    { id: 'evening-snack', label: 'Evening Snacks' },
    { id: 'dinner', label: 'Dinner' }
  ];
  var CATEGORY_LABELS = MEAL_CATEGORIES.reduce(function(acc, c){ acc[c.id] = c.label; return acc; }, {});

  // Sensible default for whichever category button is pre-selected
  // when the Add Meal overlay opens — always overridable by the user.
  function suggestCategoryForNow(){
    var h = new Date().getHours();
    if (h < 10) return 'breakfast';
    if (h < 12) return 'morning-snack';
    if (h < 15) return 'lunch';
    if (h < 18) return 'evening-snack';
    return 'dinner';
  }
  var DEFAULT_PROFILE = { sex: 'male', age: 25, heightCm: 170, weightKg: 70, activityLevel: 'moderate', goal: 'maintain' };
  var DEFAULT_APP_SETTINGS = { unit: 'metric', haptic: true, density: 'comfortable', corners: 'rounded', theme: 'dark', bgArt: true, overviewMode: '3d', macroCardCollapsed: true, aiScanConsent: false };
  var APP_VERSION = '0.1.0';

  function cmToIn(cm){ return cm / 2.54; }
  function inToCm(inches){ return inches * 2.54; }
  function kgToLb(kg){ return kg * 2.20462; }
  function lbToKg(lb){ return lb / 2.20462; }

  var ACTIVITY_LEVELS = [
    { id: 'sedentary', label: 'Sedentary (little/no exercise)', mult: 1.2 },
    { id: 'light', label: 'Light (1-3 days/week)', mult: 1.375 },
    { id: 'moderate', label: 'Moderate (3-5 days/week)', mult: 1.55 },
    { id: 'active', label: 'Very active (6-7 days/week)', mult: 1.725 },
    { id: 'extra', label: 'Extra active (physical job + training)', mult: 1.9 }
  ];
  var GOAL_OPTIONS = [
    { id: 'lose', label: 'Lose weight', calAdjust: -500 },
    { id: 'maintain', label: 'Maintain', calAdjust: 0 },
    { id: 'gain', label: 'Build muscle', calAdjust: 300 }
  ];

  var STORE = loadStore();
  var state = { tab: 'log' };
  var ui = {
    historyOpenDay: null,
    histMonth: null,
    settingsOpen: null,
    logDay: null,         // day the Log tab shows (null = today); set by the week strip
    selectedFood: null,   // { name, brand, per100g: {cal,protein,carbs,fat} } once a search result is tapped
    grams: 100,            // serving size in grams, scales the selected food's macros
    prefillName: null, prefillCal: null, prefillProtein: null, prefillCarbs: null, prefillFat: null,
    prefillFiber: null, prefillSugar: null, prefillSodium: null,
    searchDebounce: null,
    dangerZoneOpen: false,
    justFilledFood: false,
    selectedCategory: 'breakfast', // set properly each time the Add Meal overlay opens
    insightsView: 'today', // 'today' | 'trends' — which Insights sub-tab panel is showing
    serving: null // { unitId, qty } — how the picked food is being measured (see the serving picker)
  };

  function loadStore(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [], myFoods: [], water: {} };
      var parsed = JSON.parse(raw);
      // Merge (not replace) so existing saved goals keep whatever the
      // person already customized, while newly-added goal fields
      // (e.g. fiber/sugar/sodium) backfill from defaults instead of
      // coming back undefined.
      parsed.goals = Object.assign({}, DEFAULT_GOALS, parsed.goals || {});
      parsed.meals = Array.isArray(parsed.meals) ? parsed.meals.map(sanitizeMeal).filter(Boolean) : [];
      if (!parsed.profile) parsed.profile = Object.assign({}, DEFAULT_PROFILE);
      // Same merge reasoning as goals above — existing density/corners/
      // unit choices are kept, newly-added settings (theme) backfill.
      parsed.appSettings = Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {});
      // Foods picked from a live search/scan, cached locally so the
      // same food can be found and re-logged without network next
      // time (see saveFoodToCache / searchSavedFoods).
      if (!parsed.savedFoods) parsed.savedFoods = [];
      if (!Array.isArray(parsed.myFoods)) parsed.myFoods = [];
      if (!parsed.water || typeof parsed.water !== 'object') parsed.water = {};
      return parsed;
    } catch (e){
      console.error('SaviorFuel: failed to load local store, starting fresh —', e);
      return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [], myFoods: [], water: {} };
    }
  }

  // If the browser refuses the write (storage full, private mode, blocked)
  // the meal only exists in memory and vanishes on reload — so say so once,
  // instead of failing silently.
  var saveFailureShown = false;
  function saveStore(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
      saveFailureShown = false;
    } catch (e){
      console.error('SaviorFuel: failed to save local store —', e);
      if (!saveFailureShown){
        saveFailureShown = true;
        alert('SaviorFuel couldn\u2019t save to this device (storage may be full or blocked by the browser), so what you just logged may be lost when you close the app. Export a backup from Settings, and free up some space or leave private browsing.');
      }
    }
  }

  // Ask the browser not to evict our saved data when it's short of space
  // (best effort — the browser decides).
  if (navigator.storage && navigator.storage.persist){
    try { navigator.storage.persist(); } catch (e){}
  }

  // Coerces one logged meal to safe types: numbers are numbers (a string
  // "100" would make totals concatenate text), never negative, and an
  // entry without a usable timestamp is dropped. Used for stored data and
  // for imported backups.
  function sanitizeMeal(m){
    if (!m || typeof m !== 'object') return null;
    var t = Number(m.loggedAt);
    if (!isFinite(t) || t <= 0) return null;
    var n = function(v){ v = Number(v); return (isFinite(v) && v > 0) ? v : 0; };
    var clean = {
      id: String(m.id || ('m_' + t + '_' + Math.random().toString(36).slice(2, 7))),
      name: String(m.name == null ? 'Food' : m.name).slice(0, 120),
      calories: n(m.calories), protein: n(m.protein), carbs: n(m.carbs), fat: n(m.fat),
      fiber: n(m.fiber), sugar: n(m.sugar), sodium: n(m.sodium),
      loggedAt: t
    };
    if (typeof m.category === 'string') clean.category = m.category;
    return clean;
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function dateKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayKey(){ return dateKey(Date.now()); }

  // Date key for N calendar days ago. Counted by calendar (via the noon
  // of today), NOT by subtracting N x 24 hours — on the day clocks go
  // forward (a 23-hour day) that subtraction lands a day too early and
  // "yesterday" / the weekly chart skip or repeat a date.
  function dateKeyDaysAgo(n){
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - n);
    return dateKey(d.getTime());
  }

  function formatDateLabel(key){
    var today = todayKey();
    var yesterday = dateKeyDaysAgo(1);
    if (key === today) return 'Today';
    if (key === yesterday) return 'Yesterday';
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mealsForDay(key){
    return STORE.meals.filter(function(m){ return dateKey(m.loggedAt) === key; });
  }

  function totalsFor(meals){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, sodium: 0 };
    meals.forEach(function(m){
      t.calories += m.calories || 0;
      t.protein += m.protein || 0;
      t.carbs += m.carbs || 0;
      t.fat += m.fat || 0;
      t.fiber += m.fiber || 0;
      t.sugar += m.sugar || 0;
      t.sodium += m.sodium || 0;
    });
    return t;
  }

  function pct(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.min(100, Math.round((value / goal) * 100)));
  }

  // Same as pct() but never caps the upper end — for anywhere the
  // actual number is shown (ring center text, etc.), so 250g against
  // a 100g goal reads as "250%", not a misleading capped "100%".
  // Fill widths/ring offsets still need pct() (capped) since they're
  // physically bounded by the container — this one's for display only.
  function pctUncapped(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.round((value / goal) * 100));
  }

  function showNutrientInfo(){
    document.getElementById('nutrientInfoTitle').textContent = 'Macros & Fiber';
    // Reference image rather than generated text — kept as its own
    // file (images/macros-fiber-guide.webp) rather than inlined,
    // same as the background art, so it's cacheable and doesn't
    // bloat the HTML.
    document.getElementById('nutrientInfoBody').innerHTML =
      '<img class="nutrient-info-image" src="images/macros-fiber-guide.webp" alt="Guide to protein, carbs, fats, and fiber — what each does and where to find it">';
    document.getElementById('nutrientInfoOverlay').classList.remove('hidden');
  }

  function closeNutrientInfo(){
    document.getElementById('nutrientInfoOverlay').classList.add('hidden');
  }

  /* =========================================================
     RENDER — LOG TAB
     ========================================================= */
  // ---- Log day / week strip helpers ----
  // ui.logDay is the day the Log tab is showing (null = today). The week
  // strip above the ring lets you flip to any earlier day and see/edit it.
  function addDaysKey(key, n){
    var d = new Date(key + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return dateKey(d.getTime());
  }
  function logDayKey(){
    var t = todayKey();
    return (ui.logDay && ui.logDay <= t) ? ui.logDay : t;
  }
  function weekStartKey(key){
    var d = new Date(key + 'T00:00:00');
    return addDaysKey(key, -((d.getDay() + 6) % 7)); // Monday
  }

  var HERO_RINGS = [
    { id: 'cal',     r: 119, w: 14 },
    { id: 'protein', r: 99,  w: 9 },
    { id: 'carbs',   r: 85,  w: 9 },
    { id: 'fat',     r: 71,  w: 9 }
  ];
  function heroRingSvg(totals, g){
    var vals = { cal: [totals.calories, g.calories], protein: [totals.protein, g.protein], carbs: [totals.carbs, g.carbs], fat: [totals.fat, g.fat] };
    var out = '<svg class="hero-ring-svg" viewBox="0 0 260 260" aria-hidden="true">';
    HERO_RINGS.forEach(function(rg){
      var c = 2 * Math.PI * rg.r;
      var v = vals[rg.id];
      var frac = v[1] > 0 ? Math.min(v[0] / v[1], 1) : 0;
      var over = v[1] > 0 && v[0] > v[1];
      out += '<circle class="hero-ring-track" cx="130" cy="130" r="' + rg.r + '" style="stroke-width:' + rg.w + '"></circle>';
      if (frac > 0){
        out += '<circle class="hero-ring-fill ring-' + rg.id + (over && rg.id === 'cal' ? ' over' : '') + '" cx="130" cy="130" r="' + rg.r + '" ' +
          'style="stroke-width:' + rg.w + ';stroke-dasharray:' + c.toFixed(2) + ';stroke-dashoffset:' + (c * (1 - frac)).toFixed(2) + '"></circle>';
      }
    });
    return out + '</svg>';
  }

  function macroTileHtml(label, value, goal, cls){
    var over = goal > 0 && value > goal;
    return '<div class="macro-tile">' +
      '<div class="macro-tile-label"><i class="dot ' + cls + '"></i>' + label + '</div>' +
      '<div class="macro-tile-val' + (over ? ' over' : '') + '">' + Math.round(value) + '<span>/' + goal + 'g</span></div>' +
    '</div>';
  }

  function weekStripHtml(viewKey){
    var today = todayKey();
    var start = weekStartKey(viewKey);
    var names = ['M','T','W','T','F','S','S'];
    var html = '<div class="week-strip" role="tablist" aria-label="Pick a day">';
    for (var i = 0; i < 7; i++){
      var k = addDaysKey(start, i);
      var future = k > today;
      var dayNum = Number(k.slice(8));
      html += '<button type="button" class="week-day' + (k === viewKey ? ' active' : '') + (k === today ? ' is-today' : '') + '"' +
        (future ? ' disabled' : '') + ' data-action="set-log-day" data-day="' + k + '" aria-label="' + esc(formatDateLabel(k)) + '">' +
        '<span class="wd-name">' + names[i] + '</span><span class="wd-num">' + dayNum + '</span></button>';
    }
    return html + '</div>';
  }

  function renderLog(){
    var viewKey = logDayKey();
    var isToday = viewKey === todayKey();
    var dayMeals = mealsForDay(viewKey).sort(function(a,b){ return b.loggedAt - a.loggedAt; });
    var totals = totalsFor(dayMeals);
    var g = STORE.goals;
    var left = g.calories - totals.calories;
    var overCal = g.calories > 0 && totals.calories > g.calories;

    var resetBtn = (isToday && dayMeals.length > 0)
      ? '<button class="reset-log-btn" data-action="reset-today-log" aria-label="Reset today’s log">&#8635;</button>'
      : '';
    var weekNext = addDaysKey(weekStartKey(viewKey), 7) <= todayKey();
    var chevL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
    var chevR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

    var html = installBannerHtml() + '<div class="log-head">' +
        '<div class="log-head-title"><b>' + formatDateLabel(viewKey) + '</b>' +
          (isToday ? '<span>' + new Date(viewKey + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + '</span>' : '') + '</div>' +
        '<div class="log-head-actions">' + resetBtn +
          '<button class="week-nav" data-action="log-week" data-dir="-1" aria-label="Previous week">' + chevL + '</button>' +
          '<button class="week-nav" data-action="log-week" data-dir="1" aria-label="Next week"' + (weekNext ? '' : ' disabled') + '>' + chevR + '</button>' +
        '</div>' +
      '</div>' +
      weekStripHtml(viewKey) +
      '<div class="hero-ring">' +
        heroRingSvg(totals, g) +
        '<div class="hero-ring-center">' +
          '<div class="hero-ring-num' + (overCal ? ' over' : '') + '">' + Math.round(totals.calories).toLocaleString() + '</div>' +
          '<div class="hero-ring-sub">' + (g.calories > 0 ? (overCal ? Math.round(-left).toLocaleString() + ' kcal over' : Math.round(left).toLocaleString() + ' kcal left') : 'kcal eaten') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="macro-tiles">' +
        macroTileHtml('Protein', totals.protein, g.protein, 'protein') +
        macroTileHtml('Carbs', totals.carbs, g.carbs, 'carbs') +
        macroTileHtml('Fat', totals.fat, g.fat, 'fat') +
      '</div>' +
      waterRowHtml(viewKey) +
      '<button class="food-search-trigger" data-action="open-food-search-overlay">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
        'Search or scan a food...' +
      '</button>';

    if (dayMeals.length === 0){
      html += '<div class="empty tab-empty-state"><div class="glyph">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
        '</svg></div><p>' + (isToday ? 'Nothing logged yet today.' : 'Nothing logged this day.') + '<br>Add a meal above.</p></div>';
    } else {
      html += groupedMealsHtml(dayMeals);
    }

    document.getElementById('view').innerHTML = html;
  }

  // Groups a list of meals into category sections (Breakfast, Morning
  // Snacks, Lunch, Evening Snacks, Dinner — in that fixed order) each
  // with its own header, calorie subtotal, and card of rows. Meals
  // logged before this feature existed have no category field, so
  // they land in a trailing "Other" bucket rather than being hidden
  // or crashing the grouping.
  function groupedMealsHtml(meals){
    var buckets = {};
    MEAL_CATEGORIES.forEach(function(c){ buckets[c.id] = []; });
    var other = [];
    meals.forEach(function(m){
      if (m.category && buckets[m.category]) buckets[m.category].push(m);
      else other.push(m);
    });

    var html = '';
    MEAL_CATEGORIES.forEach(function(c){
      if (buckets[c.id].length > 0) html += mealGroupHtml(c.id, c.label, buckets[c.id]);
    });
    if (other.length > 0) html += mealGroupHtml('other', 'Other', other);
    return html;
  }

  // One meal time on the Log tab: a header you can tap to fold the group
  // away (chevron, name, kcal — and a food count while it's folded), and
  // the rows underneath. Which groups are folded is remembered.
  function mealGroupHtml(id, label, group){
    var collapsed = !!(STORE.appSettings.collapsedMeals && STORE.appSettings.collapsedMeals[id]);
    var subtotal = totalsFor(group).calories;
    return '<button type="button" class="category-section-label cat-toggle" data-action="toggle-meal-group" data-category="' + id + '" aria-expanded="' + !collapsed + '">' +
        '<svg class="cat-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
        '<span class="cat-name">' + label + '</span>' +
        '<span class="cat-count">' + group.length + (group.length === 1 ? ' food' : ' foods') + '</span>' +
        '<span class="category-section-total">' + subtotal + ' kcal</span>' +
      '</button>' +
      '<div class="acc meal-group' + (collapsed ? '' : ' open') + '"><div><div class="card flat">' + group.map(mealRowHtml).join('') + '</div></div></div>';
  }

  // A newly logged food shouldn't disappear into a folded group.
  function expandMealGroup(categoryId){
    var cm = STORE.appSettings.collapsedMeals;
    if (cm && cm[categoryId || 'other']) delete cm[categoryId || 'other'];
  }

  function macroBarHtml(label, value, goal, cls, unit){
    unit = unit || 'g';
    var over = goal > 0 && value > goal;
    return '<div class="macro-bar-row">' +
      '<div class="macro-bar-label"><span>' + label + '</span><b>' + Math.round(value) + unit + ' / ' + goal + unit + '</b></div>' +
      '<div class="macro-bar-track"><div class="macro-bar-fill ' + cls + (over ? ' over' : '') + '" style="width:' + pct(value, goal) + '%"></div></div>' +
    '</div>';
  }

  // One row of the Insights "Today" table — plain consumed/goal/%
  // numbers, no bar, since this panel is meant to read as a quick
  // reference table rather than a repeat of the Log tab's bars.
  // Ring circumference is fixed (r=32), so the stroke-dasharray is
  // constant and only stroke-dashoffset moves to reveal the arc.
  // Fill offset stays capped at 100% (a ring can't physically show
  // more than a full circle), but the center text uses the real,
  // uncapped percentage — and switches to the "over" red once past
  // 100% — so exceeding a goal never just looks identical to hitting
  // it exactly.
  var MACRO_RING_R = 32;
  var MACRO_RING_CIRCUMFERENCE = 2 * Math.PI * MACRO_RING_R;

  function macroRingHtml(label, value, goal, colorClass){
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = MACRO_RING_CIRCUMFERENCE * (1 - Math.min(percent, 100) / 100);
    return '<div class="macro-ring-item">' +
      '<div class="macro-ring-wrap">' +
        '<svg class="macro-ring-svg" viewBox="0 0 76 76">' +
          '<circle class="macro-ring-track" cx="38" cy="38" r="' + MACRO_RING_R + '"></circle>' +
          '<circle class="macro-ring-fill ' + colorClass + (over ? ' over' : '') + '" cx="38" cy="38" r="' + MACRO_RING_R + '" ' +
            'style="stroke-dasharray:' + MACRO_RING_CIRCUMFERENCE.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="macro-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div class="macro-ring-label">' + label + '</div>' +
      '<div class="macro-ring-sub">' + Math.round(value) + ' / ' + goal + 'g</div>' +
    '</div>';
  }

  // Bigger hero ring above the macro rings, same technique but its
  // own radius/stroke and the accent gold color rather than a macro
  // color, so calories reads as the headline stat.
  var CALORIE_RING_R = 48;
  var CALORIE_RING_CIRCUMFERENCE = 2 * Math.PI * CALORIE_RING_R;

  function calorieRingHtml(value, goal){
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = CALORIE_RING_CIRCUMFERENCE * (1 - Math.min(percent, 100) / 100);
    return '<div class="calorie-ring-row"><div class="calorie-ring-item">' +
      '<div class="calorie-ring-wrap">' +
        '<svg class="calorie-ring-svg" viewBox="0 0 116 116">' +
          '<circle class="calorie-ring-track" cx="58" cy="58" r="' + CALORIE_RING_R + '"></circle>' +
          '<circle class="calorie-ring-fill' + (over ? ' over' : '') + '" cx="58" cy="58" r="' + CALORIE_RING_R + '" ' +
            'style="stroke-dasharray:' + CALORIE_RING_CIRCUMFERENCE.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="calorie-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div class="calorie-ring-label">Calories</div>' +
      '<div class="calorie-ring-sub">' + Math.round(value) + ' / ' + goal + ' kcal</div>' +
    '</div></div>';
  }

  // Budget framing to sit alongside the percentage rings above — how
  // much of each goal is left to hit (or how far over), rather than
  // how much has been consumed so far.
  function remainingStatHtml(label, consumed, goal, unit){
    var diff = goal - consumed;
    var over = diff < 0;
    var amount = Math.round(Math.abs(diff));
    return '<div class="remaining-item">' +
      '<div class="num' + (over ? ' over' : '') + '">' + amount + unit + '</div>' +
      '<div class="lbl">' + label + (over ? ' over' : ' left') + '</div>' +
    '</div>';
  }

  // A one-line read on today's macros — calls out whichever macro is
  // furthest behind its own goal, or says so if all three are
  // tracking evenly. Recomputed fresh from today's actual totals on
  // every render, so it always reflects the current numbers rather
  // than being a static message.
  // A calorie-% floor before making any balance claim — at very low
  // intake (e.g. one small snack) every macro's % of goal is near
  // zero, so the spread looks tiny and reads as "balanced" even
  // though nothing meaningful has been logged yet. Below the floor,
  // say so instead of drawing a conclusion from too little data.
  var BALANCE_MIN_CALORIE_PCT = 15;
  var BALANCE_SPREAD_THRESHOLD = 15;

  function macroBalanceCaption(todayMeals, todayTotals, g){
    if (todayMeals.length === 0){
      return { text: 'Nothing logged yet today — log a meal to see how you\'re tracking.', tone: '' };
    }
    var caloriePct = pct(todayTotals.calories, g.calories);
    if (caloriePct < BALANCE_MIN_CALORIE_PCT){
      return { text: 'Still early today — log a bit more to get a balance read.', tone: '' };
    }
    var macros = [
      { name: 'Protein', pct: pct(todayTotals.protein, g.protein), cls: 'cap-protein' },
      { name: 'Carbs', pct: pct(todayTotals.carbs, g.carbs), cls: 'cap-carbs' },
      { name: 'Fat', pct: pct(todayTotals.fat, g.fat), cls: 'cap-fat' }
    ];
    var lowest = macros.reduce(function(a, b){ return b.pct < a.pct ? b : a; });
    var highest = macros.reduce(function(a, b){ return b.pct > a.pct ? b : a; });
    var spread = highest.pct - lowest.pct;

    if (spread <= BALANCE_SPREAD_THRESHOLD){
      return { text: 'Balanced today — protein, carbs, and fat are all tracking evenly.', tone: 'balanced' };
    }
    return {
      text: '<span class="' + lowest.cls + '">' + lowest.name + '</span> is lagging at ' + lowest.pct + '% of today\'s goal, furthest behind of the three.',
      tone: ''
    };
  }

  function mealRowHtml(m){
    var badge = (CATEGORY_LABELS[m.category] || 'Other').charAt(0);
    return '<div class="meal-row" data-action="edit-meal" data-id="' + m.id + '">' +
      '<span class="meal-badge" aria-hidden="true">' + badge + '</span>' +
      '<div class="meal-row-name">' +
        '<div class="meal-row-name-text" title="' + esc(m.name) + '">' + esc(m.name) + '</div>' +
        '<div class="meal-row-macros">P' + (m.protein||0) + ' · C' + (m.carbs||0) + ' · F' + (m.fat||0) + '</div>' +
      '</div>' +
      '<div class="meal-row-cal">' + m.calories + '</div>' +
      (dateKey(m.loggedAt) !== todayKey()
        ? '<button class="meal-row-copy" data-action="copy-meal" data-id="' + m.id + '" aria-label="Copy ' + esc(m.name) + ' to today">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>' +
          '</button>'
        : '') +
      '<button class="meal-row-edit" data-action="edit-meal" data-id="' + m.id + '" aria-label="Edit ' + esc(m.name) + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>' +
      '</button>' +
      '<button class="meal-row-del" data-action="delete-meal" data-id="' + m.id + '" aria-label="Delete">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>' +
      '</button>' +
    '</div>';
  }

  /* ---- Serving picker ----
     Every picked food gets a choice of how to measure it: its own
     serving (when the data has one — Kalori's "1 plate (550g)", Open
     Food Facts' serving size), household measures where USDA gives them
     ("cup, chopped"), and always plain grams and ounces. You pick the
     unit and how many; the calories/macros below rescale. Switching
     units keeps the amount the same (1 serving of 380 g becomes 380 g,
     then 13.4 oz). A per-serving food with no known weight (some Kalori
     items) can only be measured in multiples of its serving. */
  var OZ_GRAMS = 28.3495;

  // Sanity-check a food's numbers before it is logged. Food databases
  // (Open Food Facts especially) have gaps and typos: a missing protein /
  // carbs / fat field counts as 0, which quietly understates your totals,
  // and calories that don't roughly match the macros (4/4/9 kcal per gram)
  // usually mean a mistyped label. Returns a short warning, or ''.
  function foodDataNote(nut){
    if (!nut) return '';
    var missing = [];
    if (nut['proteins_100g'] == null) missing.push('protein');
    if (nut['carbohydrates_100g'] == null) missing.push('carbs');
    if (nut['fat_100g'] == null) missing.push('fat');
    if (missing.length) return 'This food has no ' + missing.join(' / ') + ' data, so it counts as 0 — your totals may come out low.';
    var kcal = nut['energy-kcal_100g'] || 0;
    var fromMacros = 4 * nut['proteins_100g'] + 4 * nut['carbohydrates_100g'] + 9 * nut['fat_100g'];
    if (kcal >= 60 && fromMacros > 0 && Math.abs(kcal - fromMacros) / kcal > 0.35){
      return 'Its calories (' + Math.round(kcal) + ') and macros (about ' + Math.round(fromMacros) + ' kcal worth) don\u2019t agree — worth checking the label.';
    }
    return '';
  }

  // "1 plate (550g)" / "(38 g)" / "250 g" -> grams, or null
  function parseServingGrams(text){
    var m = /\(\s*(\d+(?:\.\d+)?)\s*g(?:ram|rams|m)?\b/i.exec(text || '') ||
            /^\s*(\d+(?:\.\d+)?)\s*g(?:ram|rams|m)?\s*$/i.exec(text || '');
    return m ? parseFloat(m[1]) : null;
  }

  function servingUnitsFor(f){
    var units = [];
    var label = f.servingLabel || f.servingSizeText || '';
    if (f.servingGrams > 0){
      units.push({ id: 'serving', label: 'Serving' + (label ? ' · ' + label : ''), grams: f.servingGrams, step: 0.5, defaultQty: 1 });
    } else if (f.whole){
      units.push({ id: 'serving', label: 'Serving' + (label ? ' · ' + label : ''), grams: null, step: 0.5, defaultQty: 1 });
    }
    (f.measures || []).slice(0, 4).forEach(function(m, i){
      units.push({ id: 'm' + i, label: m.label + ' · ' + Math.round(m.grams) + ' g', grams: m.grams, step: 0.5, defaultQty: 1 });
    });
    if (f.per100g){
      units.push({ id: 'g', label: 'g', grams: 1, step: 10, defaultQty: 100 });
      units.push({ id: 'oz', label: 'oz', grams: OZ_GRAMS, step: 0.5, defaultQty: 1 });
    }
    return units;
  }

  function currentServingUnit(){
    var f = ui.selectedFood;
    if (!f) return null;
    var units = servingUnitsFor(f);
    for (var i = 0; i < units.length; i++) if (units[i].id === (ui.serving && ui.serving.unitId)) return units[i];
    return units[0];
  }

  // Start on the food's own serving if it has one, otherwise 100 g.
  function initServing(){
    var units = servingUnitsFor(ui.selectedFood);
    var u = units[0];
    if (u.id !== 'serving'){
      for (var i = 0; i < units.length; i++) if (units[i].id === 'g') u = units[i];
    }
    ui.serving = { unitId: u.id, qty: u.defaultQty };
  }

  function roundQty(n, unit){
    return unit && unit.id === 'g' ? Math.round(n) : Math.round(n * 100) / 100;
  }

  function servingEqText(){
    var u = currentServingUnit();
    if (!u || u.grams == null) return '';
    var grams = (ui.serving.qty || 0) * u.grams;
    if (u.id === 'g') return '= ' + (Math.round(grams / OZ_GRAMS * 10) / 10) + ' oz';
    return '= ' + (Math.round(grams * 10) / 10) + ' g';
  }

  function selectedFoodBannerHtml(){
    var f = ui.selectedFood;
    var units = servingUnitsFor(f);
    var cur = currentServingUnit();
    var from = f.from === 'Kalori' ? 'From Kalori' : (f.from === 'mine' ? 'From My Foods' : (f.from === 'saved' ? 'From your saved foods' : 'From search'));
    var chips = units.length > 1
      ? '<div class="serving-label">Serving size</div><div class="serving-chips" role="group" aria-label="Serving size">' +
          units.map(function(u){
            return '<button type="button" class="serving-chip' + (u.id === cur.id ? ' active' : '') + '" data-action="set-serving-unit" data-unit="' + u.id + '">' + esc(u.label) + '</button>';
          }).join('') +
        '</div>'
      : '';
    return '<div class="selected-food-banner">' +
      '<div class="selected-food-banner-row">' +
        '<span class="banner-food">' + foodThumbHtml({ product_name: f.name, _image: f.image }, true) +
          '<span>' + from + ': <b>' + esc(f.name) + '</b>' + (f.brand ? ' (' + esc(f.brand) + ')' : '') + '</span></span>' +
      '</div>' +
      chips +
      (f.dataNote ? '<div class="food-note">\u26a0 ' + esc(f.dataNote) + '</div>' : '') +
      '<div class="serving-qty">' +
        '<span class="serving-label">Amount</span>' +
        '<button type="button" class="qty-btn" data-action="qty-step" data-dir="-1" aria-label="Less">&minus;</button>' +
        '<input type="number" id="servingQty" inputmode="decimal" step="any" min="0" value="' + roundQty(ui.serving.qty, cur) + '" aria-label="Amount">' +
        '<button type="button" class="qty-btn" data-action="qty-step" data-dir="1" aria-label="More">+</button>' +
        '<span class="serving-eq" id="servingEq">' + servingEqText() + '</span>' +
      '</div>' +

  // drag the little handle at the top of a sheet down to dismiss it
  function attachSheetDrag(grab, closeFn){
    var sheet = grab.parentNode;
    var startY = null;
    grab.addEventListener('pointerdown', function(e){
      startY = e.clientY;
      sheet.classList.add('dragging');
      if (grab.setPointerCapture){ try { grab.setPointerCapture(e.pointerId); } catch (err){} }
    });
    grab.addEventListener('pointermove', function(e){
      if (startY === null) return;
      sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
    });
    function endDrag(e){
      if (startY === null) return;
      var dy = Math.max(0, e.clientY - startY);
      startY = null;
      sheet.classList.remove('dragging');
      if (dy > 90) closeFn(); else sheet.style.transform = '';
    }
    grab.addEventListener('pointerup', endDrag);
    grab.addEventListener('pointercancel', endDrag);
  }

  // While the on-screen keyboard is up, tell the CSS how much of the
  // screen it covers (--kb) and how much is left (--vvh), so a sheet
  // with fields in it lifts above the keyboard instead of hiding behind it.
  if (window.visualViewport){
    (function(){
      var vv = window.visualViewport;
      function update(){
        var kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
        var root = document.documentElement.style;
        if (kb > 80){ root.setProperty('--kb', kb + 'px'); root.setProperty('--vvh', Math.round(vv.height) + 'px'); }
        else { root.removeProperty('--kb'); root.removeProperty('--vvh'); }
      }
      vv.addEventListener('resize', update);
      vv.addEventListener('scroll', update);
    })();
  }

  // The timestamp a meal should get for the picked day: that calendar day
  // at `timeOfDay`'s clock time (so entries keep a sensible order), never
  // in the future. Returns `keep` unchanged when the day didn't change.
  function stampForDay(dayKey, timeOfDay, keep){
    var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dayKey || '');
    if (!parts) return keep || Date.now();
    if (keep && dateKey(keep) === dayKey) return keep;
    var t = new Date(timeOfDay);
    var stamp = new Date(+parts[1], +parts[2] - 1, +parts[3], t.getHours(), t.getMinutes(), t.getSeconds(), 0).getTime();
    return Math.min(stamp, Date.now());
  }

  var searchRequestId = 0; // guards against a slow older request overwriting a newer one's results
  var USDA_API_KEY = 'DcPJpdzm8AjRDIpzmzfL3fJavbtVWsAY6bGtEQYi';

  var TECHAPI_KEY = 'tech_2f095b353334f3552fb2356065ca43bd9fe42e2e584fc76cda30555e984fb40c';

  // Kalori (via techapi.my) — Malaysian food database. Response envelope
  // is {success, data, meta}; exact nesting of the food list inside
  // `data` wasn't confirmed from docs, so this checks a few reasonable
  // shapes defensively rather than assuming one and silently returning
  // nothing if it's wrong.
  function fetchKalori(query, signal){
    var url = 'https://api.techapi.my/api/v2/kalori/foods/search?q=' + encodeURIComponent(query);
    return fetch(url, { headers: { 'X-API-Key': TECHAPI_KEY }, signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(json){
        if (!json || json.success === false) return [];
        var d = json.data;
        var list = Array.isArray(d) ? d
          : (d && (d.foods || d.results || d.items)) || [];
        return list
          .filter(function(f){ return f && f.name && f.calories != null; })
          .map(function(f){
            return {
              product_name: f.name,
              brands: f.category || '',
              nutriments: {
                'energy-kcal_100g': f.calories,
                'proteins_100g': f.protein || 0,
                'carbohydrates_100g': f.carbs || 0,
                'fat_100g': f.fat || 0
              },
              _source: 'techapi',
              // Not confirmed that Kalori returns pictures; take one if it does.
              _image: f.image_url || f.image || f.photo || f.thumbnail || '',
              _serving: f.serving || null
            };
          });

  // Normalizes a USDA FoodData Central food into the same shape as an
  // Open Food Facts product, so the rest of the search/pick pipeline
  // (pickFoodResult, applySelectedFoodToForm) doesn't need to know or
  // care which source a result came from.
  function usdaToProductShape(food){
    var n = {};
    var atwaterKcal = null; // Foundation Foods often report energy only via Atwater factors
    (food.foodNutrients || []).forEach(function(fn){
      if (fn.unitName === 'KCAL' && /^Energy \(Atwater/.test(fn.nutrientName || '')){ if (atwaterKcal == null) atwaterKcal = fn.value; }
      else if (fn.nutrientName === 'Energy' && fn.unitName === 'KCAL') n['energy-kcal_100g'] = fn.value;
      else if (fn.nutrientName === 'Protein') n['proteins_100g'] = fn.value;
      else if (fn.nutrientName === 'Carbohydrate, by difference') n['carbohydrates_100g'] = fn.value;
      else if (fn.nutrientName === 'Total lipid (fat)') n['fat_100g'] = fn.value;
      else if (fn.nutrientName === 'Fiber, total dietary') n['fiber_100g'] = fn.value;
      else if (fn.nutrientName === 'Sugars, total including NLEA' || fn.nutrientName === 'Total Sugars' || fn.nutrientName === 'Sugars, Total') n['sugars_100g'] = fn.value;
      // USDA reports sodium in mg (unitName 'MG') already, unlike OFF
      // which reports it in g like the other nutrients — kept under
      // its own key so the mg-vs-g unit mismatch can't get mixed up
      // downstream (see pickFoodResult / onBarcodeDetected).
      else if (fn.nutrientName === 'Sodium, Na') n['sodium_100g_mg'] = fn.value;
    });
    if (n['energy-kcal_100g'] == null && atwaterKcal != null) n['energy-kcal_100g'] = atwaterKcal;
    // USDA's bulk/commodity entries carry long bureaucratic annotations
    // like "(Includes foods for USDA's Food Distribution Program)" —
    // meaningless noise for a personal food log, so strip any
    // parenthetical that mentions USDA rather than log it verbatim.
    var name = (food.description || '').replace(/\s*\([^)]*USDA[^)]*\)/gi, '').trim();
    // Household measures ("1 cup, chopped" = 160 g) when USDA includes
    // them, so the serving picker can offer cups etc. (not confirmed for
    // every item — foods without them just get grams / ounces).
    var measures = [];
    (food.foodMeasures || []).forEach(function(m){
      var g = Number(m.gramWeight);
      var text = String(m.disseminationText || '').replace(/\s+/g, ' ').trim();
      if (!(g > 0) || !text || /quantity not specified/i.test(text)) return;
      var label = text.replace(/^1\s+/, ''); // "1 cup" -> "cup" (the amount field supplies the number)
      if (!measures.some(function(x){ return x.label === label; })) measures.push({ label: label, grams: g });
    });
    return { product_name: name, brands: food.brandOwner || '', nutriments: n, _source: 'usda', _measures: measures.slice(0, 4) };
  }

  // Foundation + SR Legacy are USDA's generic/whole-food datasets —
  // exactly the "plain chicken breast," "egg" category Open Food Facts
  // is weakest at, since OFF mostly covers branded/packaged items.
  function fetchUSDA(query, signal){
    var url = 'https://api.nal.usda.gov/fdc/v1/foods/search?api_key=' + USDA_API_KEY +
      '&query=' + encodeURIComponent(query) + '&pageSize=10&dataType=Foundation,SR%20Legacy';
    return fetch(url, { signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data){
        return (data.foods || [])
          .map(usdaToProductShape)
          .filter(function(p){ return p.product_name && p.nutriments['energy-kcal_100g'] != null; });
      });
  }

  // `fields` trims the response to what the app actually uses — Open Food
  // Facts products are huge (ingredients, images, dozens of tags), and
  // that payload is a big part of why this source is the slow one.
  function fetchOpenFoodFacts(query, signal){
    var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
      encodeURIComponent(query) + '&search_simple=1&action=process&json=1&page_size=10' +
      '&fields=product_name,brands,nutriments,serving_quantity,serving_size,image_front_thumb_url,image_thumb_url,image_small_url';
    return fetch(url, { signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data){
        return (data.products || [])
          .map(function(p){
            p._source = 'off';
            p._image = p.image_front_thumb_url || p.image_thumb_url || p.image_small_url || '';
            return p;
          })
          .filter(function(p){ return p.product_name && p.nutriments && p.nutriments['energy-kcal_100g'] != null; });
      });
  }

  /* ---- Food search: fast and progressive ----
     Kalori, USDA and Open Food Facts are asked in parallel and their
     results appear as each one answers, instead of waiting for the
     slowest (Open Food Facts can take many seconds). Saved foods show
     instantly; an old search is cancelled as soon as you keep typing;
     each source gets a timeout; and a repeated query is answered from
     a short-lived memory cache. Results already on screen never move —
     later sources only add to the bottom — so a tap always lands on
     the row you aimed at. */
  var FOOD_SOURCE_TIMEOUT_MS = 7000;
  var FOOD_CACHE_TTL_MS = 10 * 60 * 1000;
  var foodSearchCache = {};   // 'source|query' -> { t, list }
  var searchAbort = null;
  var foodSearch = { id: 0, query: '', products: [], pending: 0, stale: false };

  function pruneFoodCache(){
    var keys = Object.keys(foodSearchCache);
    if (keys.length <= 80) return;
    keys.sort(function(a, b){ return foodSearchCache[a].t - foodSearchCache[b].t; });
    keys.slice(0, keys.length - 80).forEach(function(k){ delete foodSearchCache[k]; });
  }

  // One source, with cache + timeout + cancel. Never rejects: a source
  // that fails just contributes nothing (and isn't cached, so it gets
  // another chance next time).
  function searchFoodSource(name, query, fetcher, signal){
    var key = name + '|' + query.toLowerCase();
    var hit = foodSearchCache[key];
    if (hit && Date.now() - hit.t < FOOD_CACHE_TTL_MS) return Promise.resolve(hit.list);
    var ctrl = new AbortController();
    var onAbort = function(){ ctrl.abort(); };
    signal.addEventListener('abort', onAbort);
    var timer = setTimeout(function(){ ctrl.abort(); }, FOOD_SOURCE_TIMEOUT_MS);
    var done = function(){ clearTimeout(timer); signal.removeEventListener('abort', onAbort); };
    return fetcher(query, ctrl.signal)
      .then(function(list){
        done();
        foodSearchCache[key] = { t: Date.now(), list: list };
        pruneFoodCache();
        return list;
      }, function(err){
        done();
        if (!(err && err.name === 'AbortError')) console.error('SaviorFuel: ' + name + ' search failed —', err);
        return [];
      });
  }

  // Only ever put a plain https address in an <img src>; anything else
  // (javascript:, data:, odd characters) is ignored and the emoji shows.
  function safeImageUrl(u){

    return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : '';
  }

  // address is turned into the 400px one for the viewer; if that size

  function openFoodPhoto(){
    var f = ui.selectedFood;

  function foodRowHtml(p, i){

  // Empty search box: show your pinned favorites, then the foods you

  function renderFoodHome(){
    var resultsEl = document.getElementById('foodSearchResults');

    var all = STORE.savedFoods || [];

    var favs = all.filter(function(f){ return f._fav; });
    var recents = all.filter(function(f){ return !f._fav; }).slice(0, 8);
    var products = mine.concat(favs, recents);
    foodSearch = { id: searchRequestId, query: '', products: products, pending: 0, stale: false };
    ui.lastSearchProducts = products;
    var html = '<div class="food-home-actions">' +
      '<button type="button" data-action="open-quick-add">+ Quick add</button>' +
      '<button type="button" data-action="open-my-food">+ New food</button></div>';
    if (products.length === 0){
      resultsEl.innerHTML = html + '<div class="food-suggest-status">Foods you log show up here for one-tap logging. Tap the star to pin your favorites, or create your own with New food.</div>';
      return;
    }
    if (mine.length) html += '<div class="food-home-label">My foods</div>' + mine.map(function(p, i){ return foodRowHtml(p, i); }).join('');
    if (favs.length) html += '<div class="food-home-label">Favorites</div>' + favs.map(function(p, i){ return foodRowHtml(p, mine.length + i); }).join('');
    if (recents.length) html += '<div class="food-home-label">Recent</div>' + recents.map(function(p, i){ return foodRowHtml(p, mine.length + favs.length + i); }).join('');

  function toggleFavorite(name){

    var entry = (STORE.savedFoods || []).filter(function(f){ return f.product_name.trim().toLowerCase() === key; })[0];
    if (!entry) return;
    if (entry._fav) delete entry._fav; else entry._fav = true;
