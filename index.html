  //
  // Storage key: everything lives under one localStorage key,
  // 'saviorfuel_local_v1'. Bump the version suffix if the shape
  // of STORE ever changes in a way that would break old data.
  // =========================================================

  var STORAGE_KEY = 'saviorfuel_local_v1';

  // Fiber/sugar/sodium defaults follow the FDA's general Daily
  // Values (28g, 50g added sugar, 2300mg) — same starting-point
  // convention as the Mifflin-St Jeor calculator below: a sensible
  // default, always overridable in Settings.
  var DEFAULT_GOALS = { calories: 2000, protein: 150, carbs: 200, fat: 65, fiber: 28, sugar: 50, sodium: 2300 };

  var MEAL_CATEGORIES = [
    { id: 'breakfast', label: 'Breakfast' },
    { id: 'morning-snack', label: 'Morning Snacks' },
    { id: 'lunch', label: 'Lunch' },
    { id: 'evening-snack', label: 'Evening Snacks' },
    { id: 'dinner', label: 'Dinner' }
  ];
  var CATEGORY_LABELS = MEAL_CATEGORIES.reduce(function(acc, c){ acc[c.id] = c.label; return acc; }, {});

  // Sensible default for whichever category button is pre-selected
  // when the Add Meal overlay opens — always overridable by the user.
  function suggestCategoryForNow(){
    var h = new Date().getHours();
    if (h < 10) return 'breakfast';
    if (h < 12) return 'morning-snack';
    if (h < 15) return 'lunch';
    if (h < 18) return 'evening-snack';
    return 'dinner';
  }
  var DEFAULT_PROFILE = { sex: 'male', age: 25, heightCm: 170, weightKg: 70, activityLevel: 'moderate', goal: 'maintain' };
  var DEFAULT_APP_SETTINGS = { unit: 'metric', haptic: true, density: 'comfortable', corners: 'rounded', theme: 'dark', bgArt: true, overviewMode: '3d', weeklyMode: '3d', macroCardCollapsed: true, aiScanConsent: false };
  var APP_VERSION = '0.1.0';

  function cmToIn(cm){ return cm / 2.54; }
  function inToCm(inches){ return inches * 2.54; }
  function kgToLb(kg){ return kg * 2.20462; }
  function lbToKg(lb){ return lb / 2.20462; }

  var ACTIVITY_LEVELS = [
    { id: 'sedentary', label: 'Sedentary (little/no exercise)', mult: 1.2 },
    { id: 'light', label: 'Light (1-3 days/week)', mult: 1.375 },
    { id: 'moderate', label: 'Moderate (3-5 days/week)', mult: 1.55 },
    { id: 'active', label: 'Very active (6-7 days/week)', mult: 1.725 },
    { id: 'extra', label: 'Extra active (physical job + training)', mult: 1.9 }
  ];
  var GOAL_OPTIONS = [
    { id: 'lose', label: 'Lose weight', calAdjust: -500 },
    { id: 'maintain', label: 'Maintain', calAdjust: 0 },
    { id: 'gain', label: 'Build muscle', calAdjust: 300 }
  ];

  var STORE = loadStore();
  var state = { tab: 'log' };
  var ui = {
    historyOpenDay: null,
    selectedFood: null,   // { name, brand, per100g: {cal,protein,carbs,fat} } once a search result is tapped
    grams: 100,            // serving size in grams, scales the selected food's macros
    prefillName: null, prefillCal: null, prefillProtein: null, prefillCarbs: null, prefillFat: null,
    prefillFiber: null, prefillSugar: null, prefillSodium: null,
    searchDebounce: null,
    dangerZoneOpen: false,
    justFilledFood: false,
    selectedCategory: 'breakfast', // set properly each time the Add Meal overlay opens
    insightsView: 'today', // 'today' | 'trends' — which Insights sub-tab panel is showing
    serving: null // { unitId, qty } — how the picked food is being measured (see the serving picker)
  };

  function loadStore(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [] };
      var parsed = JSON.parse(raw);
      // Merge (not replace) so existing saved goals keep whatever the
      // person already customized, while newly-added goal fields
      // (e.g. fiber/sugar/sodium) backfill from defaults instead of
      // coming back undefined.
      parsed.goals = Object.assign({}, DEFAULT_GOALS, parsed.goals || {});
      if (!parsed.meals) parsed.meals = [];
      if (!parsed.profile) parsed.profile = Object.assign({}, DEFAULT_PROFILE);
      // Same merge reasoning as goals above — existing density/corners/
      // unit choices are kept, newly-added settings (theme) backfill.
      parsed.appSettings = Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {});
      // Foods picked from a live search/scan, cached locally so the
      // same food can be found and re-logged without network next
      // time (see saveFoodToCache / searchSavedFoods).
      if (!parsed.savedFoods) parsed.savedFoods = [];
      return parsed;
    } catch (e){
      console.error('SaviorFuel: failed to load local store, starting fresh —', e);
      return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [] };
    }
  }

  function saveStore(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
    } catch (e){
      console.error('SaviorFuel: failed to save local store —', e);
    }
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function dateKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayKey(){ return dateKey(Date.now()); }

  function formatDateLabel(key){
    var today = todayKey();
    var yesterday = dateKey(Date.now() - 86400000);
    if (key === today) return 'Today';
    if (key === yesterday) return 'Yesterday';
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mealsForDay(key){
    return STORE.meals.filter(function(m){ return dateKey(m.loggedAt) === key; });
  }

  function totalsFor(meals){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, sodium: 0 };
    meals.forEach(function(m){
      t.calories += m.calories || 0;
      t.protein += m.protein || 0;
      t.carbs += m.carbs || 0;
      t.fat += m.fat || 0;
      t.fiber += m.fiber || 0;
      t.sugar += m.sugar || 0;
      t.sodium += m.sodium || 0;
    });
    return t;
  }

  function pct(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.min(100, Math.round((value / goal) * 100)));
  }

  // Same as pct() but never caps the upper end — for anywhere the
  // actual number is shown (ring center text, etc.), so 250g against
  // a 100g goal reads as "250%", not a misleading capped "100%".
  // Fill widths/ring offsets still need pct() (capped) since they're
  // physically bounded by the container — this one's for display only.
  function pctUncapped(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.round((value / goal) * 100));
  }

  function showNutrientInfo(){
    document.getElementById('nutrientInfoTitle').textContent = 'Macros & Fiber';
    // Reference image rather than generated text — kept as its own
    // file (images/macros-fiber-guide.webp) rather than inlined,
    // same as the background art, so it's cacheable and doesn't
    // bloat the HTML.
    document.getElementById('nutrientInfoBody').innerHTML =
      '<img class="nutrient-info-image" src="images/macros-fiber-guide.webp" alt="Guide to protein, carbs, fats, and fiber — what each does and where to find it">';
    document.getElementById('nutrientInfoOverlay').classList.remove('hidden');
  }

  function closeNutrientInfo(){
    document.getElementById('nutrientInfoOverlay').classList.add('hidden');
  }

  /* =========================================================
     RENDER — LOG TAB
     ========================================================= */
  function renderLog(){
    var todayMeals = mealsForDay(todayKey()).sort(function(a,b){ return b.loggedAt - a.loggedAt; });
    var totals = totalsFor(todayMeals);
    var g = STORE.goals;

    // Minimized by default (just the calorie count and a slim progress
    // line); the chevron expands the protein/carbs/fat bars, and the
    // choice is remembered between visits.
    var collapsed = STORE.appSettings.macroCardCollapsed !== false;
    var resetBtn = todayMeals.length > 0
      ? '<button class="reset-log-btn" data-action="reset-today-log" aria-label="Reset today\u2019s log">&#8635;</button>'
      : '';
    var chevron = '<button class="macro-collapse-toggle" data-action="toggle-macro-card" aria-label="' + (collapsed ? 'Show macros' : 'Hide macros') + '" aria-expanded="' + (!collapsed) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>' +
    '</button>';
    var calPct = pct(totals.calories, g.calories);

    var html = '<div class="card flat macro-summary-card' + (collapsed ? ' collapsed' : '') + '">' +
      '<div class="macro-cal-row"><div class="num">' + totals.calories + ' <span>/ ' + g.calories + ' kcal</span></div><div class="macro-cal-row-actions">' + resetBtn + chevron + '</div></div>' +
      // slim calorie progress line — only visible while the bars are tucked away
      '<div class="macro-mini-bar"><i class="' + (g.calories > 0 && totals.calories > g.calories ? 'over' : '') + '" style="width:' + calPct + '%"></i></div>' +
      // the bars always exist; collapsing just slides them shut
      '<div class="macro-bars"><div>' +
        macroBarHtml('Protein', totals.protein, g.protein, 'protein') +
        macroBarHtml('Carbs', totals.carbs, g.carbs, 'carbs') +
        macroBarHtml('Fat', totals.fat, g.fat, 'fat') +
      '</div></div>' +
      '<button class="food-search-trigger" data-action="open-food-search-overlay">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
        'Search or scan a food...' +
      '</button>' +
    '</div>';

    // Add Meal now lives in its own overlay (see openAddMealOverlay) —
    // nothing rendered inline here for it anymore.

    if (todayMeals.length === 0){
      html += '<div class="empty tab-empty-state"><div class="glyph">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
        '</svg></div><p>Nothing logged yet today.<br>Add your first meal above.</p></div>';
    } else {
      html += groupedMealsHtml(todayMeals);
    }

    document.getElementById('view').innerHTML = html;
  }

  // Groups a list of meals into category sections (Breakfast, Morning
  // Snacks, Lunch, Evening Snacks, Dinner — in that fixed order) each
  // with its own header, calorie subtotal, and card of rows. Meals
  // logged before this feature existed have no category field, so
  // they land in a trailing "Other" bucket rather than being hidden
  // or crashing the grouping.
  function groupedMealsHtml(meals){
    var buckets = {};
    MEAL_CATEGORIES.forEach(function(c){ buckets[c.id] = []; });
    var other = [];
    meals.forEach(function(m){
      if (m.category && buckets[m.category]) buckets[m.category].push(m);
      else other.push(m);
    });

    var html = '';
    MEAL_CATEGORIES.forEach(function(c){
      if (buckets[c.id].length > 0) html += mealGroupHtml(c.id, c.label, buckets[c.id]);
    });
    if (other.length > 0) html += mealGroupHtml('other', 'Other', other);
    return html;
  }

  // One meal time on the Log tab: a header you can tap to fold the group
  // away (chevron, name, kcal — and a food count while it's folded), and
  // the rows underneath. Which groups are folded is remembered.
  function mealGroupHtml(id, label, group){
    var collapsed = !!(STORE.appSettings.collapsedMeals && STORE.appSettings.collapsedMeals[id]);
    var subtotal = totalsFor(group).calories;
    return '<button type="button" class="category-section-label cat-toggle" data-action="toggle-meal-group" data-category="' + id + '" aria-expanded="' + !collapsed + '">' +
        '<svg class="cat-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
        '<span class="cat-name">' + label + '</span>' +
        '<span class="cat-count">' + group.length + (group.length === 1 ? ' food' : ' foods') + '</span>' +
        '<span class="category-section-total">' + subtotal + ' kcal</span>' +
      '</button>' +
      '<div class="acc meal-group' + (collapsed ? '' : ' open') + '"><div><div class="card flat">' + group.map(mealRowHtml).join('') + '</div></div></div>';
  }

  // A newly logged food shouldn't disappear into a folded group.
  function expandMealGroup(categoryId){
    var cm = STORE.appSettings.collapsedMeals;
    if (cm && cm[categoryId || 'other']) delete cm[categoryId || 'other'];
  }

  function macroBarHtml(label, value, goal, cls, unit){
    unit = unit || 'g';
    var over = goal > 0 && value > goal;
    return '<div class="macro-bar-row">' +
      '<div class="macro-bar-label"><span>' + label + '</span><b>' + Math.round(value) + unit + ' / ' + goal + unit + '</b></div>' +
      '<div class="macro-bar-track"><div class="macro-bar-fill ' + cls + (over ? ' over' : '') + '" style="width:' + pct(value, goal) + '%"></div></div>' +
    '</div>';
  }

  // One row of the Insights "Today" table — plain consumed/goal/%
  // numbers, no bar, since this panel is meant to read as a quick
  // reference table rather than a repeat of the Log tab's bars.
  // Ring circumference is fixed (r=32), so the stroke-dasharray is
  // constant and only stroke-dashoffset moves to reveal the arc.
  // Fill offset stays capped at 100% (a ring can't physically show
  // more than a full circle), but the center text uses the real,
  // uncapped percentage — and switches to the "over" red once past
  // 100% — so exceeding a goal never just looks identical to hitting
  // it exactly.
  var MACRO_RING_R = 32;
  var MACRO_RING_CIRCUMFERENCE = 2 * Math.PI * MACRO_RING_R;

  function macroRingHtml(label, value, goal, colorClass){
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = MACRO_RING_CIRCUMFERENCE * (1 - Math.min(percent, 100) / 100);
    return '<div class="macro-ring-item">' +
      '<div class="macro-ring-wrap">' +
        '<svg class="macro-ring-svg" viewBox="0 0 76 76">' +
          '<circle class="macro-ring-track" cx="38" cy="38" r="' + MACRO_RING_R + '"></circle>' +
          '<circle class="macro-ring-fill ' + colorClass + (over ? ' over' : '') + '" cx="38" cy="38" r="' + MACRO_RING_R + '" ' +
            'style="stroke-dasharray:' + MACRO_RING_CIRCUMFERENCE.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="macro-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div class="macro-ring-label">' + label + '</div>' +
      '<div class="macro-ring-sub">' + Math.round(value) + ' / ' + goal + 'g</div>' +
    '</div>';
  }

  // Bigger hero ring above the macro rings, same technique but its
  // own radius/stroke and the accent gold color rather than a macro
  // color, so calories reads as the headline stat.
  var CALORIE_RING_R = 48;
  var CALORIE_RING_CIRCUMFERENCE = 2 * Math.PI * CALORIE_RING_R;

  function calorieRingHtml(value, goal){
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = CALORIE_RING_CIRCUMFERENCE * (1 - Math.min(percent, 100) / 100);
    return '<div class="calorie-ring-row"><div class="calorie-ring-item">' +
      '<div class="calorie-ring-wrap">' +
        '<svg class="calorie-ring-svg" viewBox="0 0 116 116">' +
          '<circle class="calorie-ring-track" cx="58" cy="58" r="' + CALORIE_RING_R + '"></circle>' +
          '<circle class="calorie-ring-fill' + (over ? ' over' : '') + '" cx="58" cy="58" r="' + CALORIE_RING_R + '" ' +
            'style="stroke-dasharray:' + CALORIE_RING_CIRCUMFERENCE.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="calorie-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div class="calorie-ring-label">Calories</div>' +
      '<div class="calorie-ring-sub">' + Math.round(value) + ' / ' + goal + ' kcal</div>' +
    '</div></div>';
  }

  // Budget framing to sit alongside the percentage rings above — how
  // much of each goal is left to hit (or how far over), rather than
  // how much has been consumed so far.
  function remainingStatHtml(label, consumed, goal, unit){
    var diff = goal - consumed;
    var over = diff < 0;
    var amount = Math.round(Math.abs(diff));
    return '<div class="remaining-item">' +
      '<div class="num' + (over ? ' over' : '') + '">' + amount + unit + '</div>' +
      '<div class="lbl">' + label + (over ? ' over' : ' left') + '</div>' +
    '</div>';
  }

  // A one-line read on today's macros — calls out whichever macro is
  // furthest behind its own goal, or says so if all three are
  // tracking evenly. Recomputed fresh from today's actual totals on
  // every render, so it always reflects the current numbers rather
  // than being a static message.
  // A calorie-% floor before making any balance claim — at very low
  // intake (e.g. one small snack) every macro's % of goal is near
  // zero, so the spread looks tiny and reads as "balanced" even
  // though nothing meaningful has been logged yet. Below the floor,
  // say so instead of drawing a conclusion from too little data.
  var BALANCE_MIN_CALORIE_PCT = 15;
  var BALANCE_SPREAD_THRESHOLD = 15;

  function macroBalanceCaption(todayMeals, todayTotals, g){
    if (todayMeals.length === 0){
      return { text: 'Nothing logged yet today — log a meal to see how you\'re tracking.', tone: '' };
    }
    var caloriePct = pct(todayTotals.calories, g.calories);
    if (caloriePct < BALANCE_MIN_CALORIE_PCT){
      return { text: 'Still early today — log a bit more to get a balance read.', tone: '' };
    }
    var macros = [
      { name: 'Protein', pct: pct(todayTotals.protein, g.protein), cls: 'cap-protein' },
      { name: 'Carbs', pct: pct(todayTotals.carbs, g.carbs), cls: 'cap-carbs' },
      { name: 'Fat', pct: pct(todayTotals.fat, g.fat), cls: 'cap-fat' }
    ];
    var lowest = macros.reduce(function(a, b){ return b.pct < a.pct ? b : a; });
    var highest = macros.reduce(function(a, b){ return b.pct > a.pct ? b : a; });
    var spread = highest.pct - lowest.pct;

    if (spread <= BALANCE_SPREAD_THRESHOLD){
      return { text: 'Balanced today — protein, carbs, and fat are all tracking evenly.', tone: 'balanced' };
    }
    return {
      text: '<span class="' + lowest.cls + '">' + lowest.name + '</span> is lagging at ' + lowest.pct + '% of today\'s goal, furthest behind of the three.',
      tone: ''
    };
  }

  function mealRowHtml(m){
    return '<div class="meal-row" data-id="' + m.id + '">' +
      '<div class="meal-row-name">' +
        '<div class="meal-row-name-text" title="' + esc(m.name) + '">' + esc(m.name) + '</div>' +
        '<div class="meal-row-macros">P' + (m.protein||0) + ' · C' + (m.carbs||0) + ' · F' + (m.fat||0) + '</div>' +
      '</div>' +
      '<div class="meal-row-cal">' + m.calories + '</div>' +
      '<button class="meal-row-del" data-action="delete-meal" data-id="' + m.id + '" aria-label="Delete">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>' +
      '</button>' +
    '</div>';
  }

  /* ---- Serving picker ----
     Every picked food gets a choice of how to measure it: its own
     serving (when the data has one — Kalori's "1 plate (550g)", Open
     Food Facts' serving size), household measures where USDA gives them
     ("cup, chopped"), and always plain grams and ounces. You pick the
     unit and how many; the calories/macros below rescale. Switching
     units keeps the amount the same (1 serving of 380 g becomes 380 g,
     then 13.4 oz). A per-serving food with no known weight (some Kalori
     items) can only be measured in multiples of its serving. */
  var OZ_GRAMS = 28.3495;

  // "1 plate (550g)" / "(38 g)" / "250 g" -> grams, or null
  function parseServingGrams(text){
    var m = /\(\s*(\d+(?:\.\d+)?)\s*g(?:ram|rams|m)?\b/i.exec(text || '') ||
            /^\s*(\d+(?:\.\d+)?)\s*g(?:ram|rams|m)?\s*$/i.exec(text || '');
    return m ? parseFloat(m[1]) : null;
  }

  function servingUnitsFor(f){
    var units = [];
    var label = f.servingLabel || f.servingSizeText || '';
    if (f.servingGrams > 0){
      units.push({ id: 'serving', label: 'Serving' + (label ? ' · ' + label : ''), grams: f.servingGrams, step: 0.5, defaultQty: 1 });
    } else if (f.whole){
      units.push({ id: 'serving', label: 'Serving' + (label ? ' · ' + label : ''), grams: null, step: 0.5, defaultQty: 1 });
    }
    (f.measures || []).slice(0, 4).forEach(function(m, i){
      units.push({ id: 'm' + i, label: m.label + ' · ' + Math.round(m.grams) + ' g', grams: m.grams, step: 0.5, defaultQty: 1 });
    });
    if (f.per100g){
      units.push({ id: 'g', label: 'g', grams: 1, step: 10, defaultQty: 100 });
      units.push({ id: 'oz', label: 'oz', grams: OZ_GRAMS, step: 0.5, defaultQty: 1 });
    }
    return units;
  }

  function currentServingUnit(){
    var f = ui.selectedFood;
    if (!f) return null;
    var units = servingUnitsFor(f);
    for (var i = 0; i < units.length; i++) if (units[i].id === (ui.serving && ui.serving.unitId)) return units[i];
    return units[0];
  }

  // Start on the food's own serving if it has one, otherwise 100 g.
  function initServing(){
    var units = servingUnitsFor(ui.selectedFood);
    var u = units[0];
    if (u.id !== 'serving'){
      for (var i = 0; i < units.length; i++) if (units[i].id === 'g') u = units[i];
    }
    ui.serving = { unitId: u.id, qty: u.defaultQty };
  }

  function roundQty(n, unit){
    return unit && unit.id === 'g' ? Math.round(n) : Math.round(n * 100) / 100;
  }

  function servingEqText(){
    var u = currentServingUnit();
    if (!u || u.grams == null) return '';
    var grams = (ui.serving.qty || 0) * u.grams;
    if (u.id === 'g') return '= ' + (Math.round(grams / OZ_GRAMS * 10) / 10) + ' oz';
    return '= ' + (Math.round(grams * 10) / 10) + ' g';
  }

  function selectedFoodBannerHtml(){
    var f = ui.selectedFood;
    var units = servingUnitsFor(f);
    var cur = currentServingUnit();
    var from = f.from === 'Kalori' ? 'From Kalori' : (f.from === 'saved' ? 'From your saved foods' : 'From search');
    var chips = units.length > 1
      ? '<div class="serving-label">Serving size</div><div class="serving-chips" role="group" aria-label="Serving size">' +
          units.map(function(u){
            return '<button type="button" class="serving-chip' + (u.id === cur.id ? ' active' : '') + '" data-action="set-serving-unit" data-unit="' + u.id + '">' + esc(u.label) + '</button>';
          }).join('') +
        '</div>'
      : '';
    return '<div class="selected-food-banner">' +
      '<div class="selected-food-banner-row">' +
        '<span class="banner-food">' + foodThumbHtml({ product_name: f.name, _image: f.image }, true) +
          '<span>' + from + ': <b>' + esc(f.name) + '</b>' + (f.brand ? ' (' + esc(f.brand) + ')' : '') + '</span></span>' +
      '</div>' +
      chips +
      '<div class="serving-qty">' +
        '<span class="serving-label">Amount</span>' +
        '<button type="button" class="qty-btn" data-action="qty-step" data-dir="-1" aria-label="Less">&minus;</button>' +
        '<input type="number" id="servingQty" inputmode="decimal" step="any" min="0" value="' + roundQty(ui.serving.qty, cur) + '" aria-label="Amount">' +
        '<button type="button" class="qty-btn" data-action="qty-step" data-dir="1" aria-label="More">+</button>' +
        '<span class="serving-eq" id="servingEq">' + servingEqText() + '</span>' +
      '</div>' +
    '</div>';

  /* =========================================================

  // drag the little handle at the top of a sheet down to dismiss it
  function attachSheetDrag(grab, closeFn){
    var sheet = grab.parentNode;
    var startY = null;
    grab.addEventListener('pointerdown', function(e){
      startY = e.clientY;
      sheet.classList.add('dragging');
      if (grab.setPointerCapture){ try { grab.setPointerCapture(e.pointerId); } catch (err){} }
    });
    grab.addEventListener('pointermove', function(e){
      if (startY === null) return;
      sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
    });
    function endDrag(e){
      if (startY === null) return;
      var dy = Math.max(0, e.clientY - startY);
      startY = null;
      sheet.classList.remove('dragging');
      if (dy > 90) closeFn(); else sheet.style.transform = '';
    }
    grab.addEventListener('pointerup', endDrag);
    grab.addEventListener('pointercancel', endDrag);
  }

  // While the on-screen keyboard is up, tell the CSS how much of the
  // screen it covers (--kb) and how much is left (--vvh), so a sheet
  // with fields in it lifts above the keyboard instead of hiding behind it.
  if (window.visualViewport){
    (function(){
      var vv = window.visualViewport;
      function update(){
        var kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
        var root = document.documentElement.style;
        if (kb > 80){ root.setProperty('--kb', kb + 'px'); root.setProperty('--vvh', Math.round(vv.height) + 'px'); }
        else { root.removeProperty('--kb'); root.removeProperty('--vvh'); }
      }
      vv.addEventListener('resize', update);
      vv.addEventListener('scroll', update);
    })();
  }

  // Kalori (via techapi.my) — Malaysian food database. Response envelope
  // is {success, data, meta}; exact nesting of the food list inside
  // `data` wasn't confirmed from docs, so this checks a few reasonable
  // shapes defensively rather than assuming one and silently returning
  // nothing if it's wrong.
  function fetchKalori(query, signal){
    var url = 'https://api.techapi.my/api/v2/kalori/foods/search?q=' + encodeURIComponent(query);
    return fetch(url, { headers: { 'X-API-Key': TECHAPI_KEY }, signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(json){
        if (!json || json.success === false) return [];
        var d = json.data;
        var list = Array.isArray(d) ? d
          : (d && (d.foods || d.results || d.items)) || [];
        return list
          .filter(function(f){ return f && f.name && f.calories != null; })
          .map(function(f){
            return {
              product_name: f.name,
              brands: f.category || '',
              nutriments: {
                'energy-kcal_100g': f.calories,
                'proteins_100g': f.protein || 0,
                'carbohydrates_100g': f.carbs || 0,
                'fat_100g': f.fat || 0
              },
              _source: 'techapi',
              // Not confirmed that Kalori returns pictures; take one if it does.
              _image: f.image_url || f.image || f.photo || f.thumbnail || '',

  // Normalizes a USDA FoodData Central food into the same shape as an
  // Open Food Facts product, so the rest of the search/pick pipeline
  // (pickFoodResult, applySelectedFoodToForm) doesn't need to know or
  // care which source a result came from.
  function usdaToProductShape(food){
    var n = {};
    (food.foodNutrients || []).forEach(function(fn){
      if (fn.nutrientName === 'Energy' && fn.unitName === 'KCAL') n['energy-kcal_100g'] = fn.value;
      else if (fn.nutrientName === 'Protein') n['proteins_100g'] = fn.value;
      else if (fn.nutrientName === 'Carbohydrate, by difference') n['carbohydrates_100g'] = fn.value;
      else if (fn.nutrientName === 'Total lipid (fat)') n['fat_100g'] = fn.value;
      else if (fn.nutrientName === 'Fiber, total dietary') n['fiber_100g'] = fn.value;
      else if (fn.nutrientName === 'Sugars, total including NLEA' || fn.nutrientName === 'Total Sugars') n['sugars_100g'] = fn.value;
      // USDA reports sodium in mg (unitName 'MG') already, unlike OFF
      // which reports it in g like the other nutrients — kept under
      // its own key so the mg-vs-g unit mismatch can't get mixed up
      // downstream (see pickFoodResult / onBarcodeDetected).
      else if (fn.nutrientName === 'Sodium, Na') n['sodium_100g_mg'] = fn.value;
    });
    // USDA's bulk/commodity entries carry long bureaucratic annotations
    // like "(Includes foods for USDA's Food Distribution Program)" —
    // meaningless noise for a personal food log, so strip any
    // parenthetical that mentions USDA rather than log it verbatim.
    var name = (food.description || '').replace(/\s*\([^)]*USDA[^)]*\)/gi, '').trim();
    // Household measures ("1 cup, chopped" = 160 g) when USDA includes
    // them, so the serving picker can offer cups etc. (not confirmed for
    // every item — foods without them just get grams / ounces).
    var measures = [];
    (food.foodMeasures || []).forEach(function(m){
      var g = Number(m.gramWeight);
      var text = String(m.disseminationText || '').replace(/\s+/g, ' ').trim();
      if (!(g > 0) || !text || /quantity not specified/i.test(text)) return;
      var label = text.replace(/^1\s+/, ''); // "1 cup" -> "cup" (the amount field supplies the number)
      if (!measures.some(function(x){ return x.label === label; })) measures.push({ label: label, grams: g });
    });
    return { product_name: name, brands: food.brandOwner || '', nutriments: n, _source: 'usda', _measures: measures.slice(0, 4) };
  }

  // Foundation + SR Legacy are USDA's generic/whole-food datasets —
  // exactly the "plain chicken breast," "egg" category Open Food Facts
  // is weakest at, since OFF mostly covers branded/packaged items.
  function fetchUSDA(query, signal){
    var url = 'https://api.nal.usda.gov/fdc/v1/foods/search?api_key=' + USDA_API_KEY +
      '&query=' + encodeURIComponent(query) + '&pageSize=10&dataType=Foundation,SR%20Legacy';
    return fetch(url, { signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data){
        return (data.foods || [])
          .map(usdaToProductShape)
          .filter(function(p){ return p.product_name && p.nutriments['energy-kcal_100g'] != null; });
      });
  }

  // `fields` trims the response to what the app actually uses — Open Food
  // Facts products are huge (ingredients, images, dozens of tags), and
  // that payload is a big part of why this source is the slow one.
  function fetchOpenFoodFacts(query, signal){
    var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
      encodeURIComponent(query) + '&search_simple=1&action=process&json=1&page_size=10' +
      '&fields=product_name,brands,nutriments,serving_quantity,serving_size,image_front_thumb_url,image_thumb_url,image_small_url';
    return fetch(url, { signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data){
        return (data.products || [])
          .map(function(p){
            p._source = 'off';
            p._image = p.image_front_thumb_url || p.image_thumb_url || p.image_small_url || '';
            return p;
          })
          .filter(function(p){ return p.product_name && p.nutriments && p.nutriments['energy-kcal_100g'] != null; });
      });
  }

  /* ---- Food search: fast and progressive ----
     Kalori, USDA and Open Food Facts are asked in parallel and their
     results appear as each one answers, instead of waiting for the
     slowest (Open Food Facts can take many seconds). Saved foods show
     instantly; an old search is cancelled as soon as you keep typing;
     each source gets a timeout; and a repeated query is answered from
     a short-lived memory cache. Results already on screen never move —
     later sources only add to the bottom — so a tap always lands on
     the row you aimed at. */
  var FOOD_SOURCE_TIMEOUT_MS = 7000;
  var FOOD_CACHE_TTL_MS = 10 * 60 * 1000;
  var foodSearchCache = {};   // 'source|query' -> { t, list }
  var searchAbort = null;
  var foodSearch = { id: 0, query: '', products: [], pending: 0, stale: false };

  function pruneFoodCache(){
    var keys = Object.keys(foodSearchCache);
    if (keys.length <= 80) return;
    keys.sort(function(a, b){ return foodSearchCache[a].t - foodSearchCache[b].t; });
    keys.slice(0, keys.length - 80).forEach(function(k){ delete foodSearchCache[k]; });
  }

  // One source, with cache + timeout + cancel. Never rejects: a source
  // that fails just contributes nothing (and isn't cached, so it gets
  // another chance next time).
  function searchFoodSource(name, query, fetcher, signal){
    var key = name + '|' + query.toLowerCase();
    var hit = foodSearchCache[key];
    if (hit && Date.now() - hit.t < FOOD_CACHE_TTL_MS) return Promise.resolve(hit.list);
    var ctrl = new AbortController();
    var onAbort = function(){ ctrl.abort(); };
    signal.addEventListener('abort', onAbort);
    var timer = setTimeout(function(){ ctrl.abort(); }, FOOD_SOURCE_TIMEOUT_MS);
    var done = function(){ clearTimeout(timer); signal.removeEventListener('abort', onAbort); };
    return fetcher(query, ctrl.signal)
      .then(function(list){
        done();
        foodSearchCache[key] = { t: Date.now(), list: list };
        pruneFoodCache();
        return list;
      }, function(err){
        done();
        if (!(err && err.name === 'AbortError')) console.error('SaviorFuel: ' + name + ' search failed —', err);
        return [];
      });
  }
