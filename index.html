<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>SaviorFuel — Food Tracker</title>
<meta name="description" content="Log your meals and macros. A free food tracker by Savior, built to pair with SaviorFit Logger.">
<link rel="icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaviorFuel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN SYSTEM — copied 1:1 from SaviorFit Logger (IronLedger
     repo) so SaviorFuel matches it visually out of the box. Keep
     these tokens in sync by hand if the Logger's palette ever
     changes; there's no shared stylesheet between the two repos.
     ========================================================= */
  :root{
    --bg:#14161a;
    --panel:#1c1f24;
    --panel-2:#242830;
    --panel-3:#2a2f38;
    --line:#2e333b;
    --text:#e9e6df;
    --text-dim:#8b9098;
    --text-faint:#82878f;
    --accent:#f2b134;
    --accent-dim:#7a6224;
    --accent-rgb:242,177,52;
    --accent-2:#c1443c;
    --accent-2-dim:#4a2321;
    --success:#5fb86a;
    --success-dim:#233821;
    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --radius-xl:20px;
    --radius-pill:999px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;}
  button:active, [data-action]:active{
    filter:brightness(1.2);
    transition:filter 70ms ease-out;
  }
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }

  /* ---------- Topbar (same structure/classes as SaviorFit Logger) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(16,18,21,0.72);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .topbar h1 span{color:var(--accent);}

  /* ---------- Main content area ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(90px + var(--safe-bottom));
  }

  /* Fade+shift tab transition — same treatment as SaviorFit Logger's
     switchTabWithFade, so switching tabs feels identical across both
     apps. See switchTab() below. */
  #view.subtab-fade-out{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 140ms ease, transform 140ms ease;
  }
  #view.subtab-fade-in{
    opacity:1;
    transform:translateY(0);
    transition:opacity 160ms ease, transform 160ms ease;
  }

  /* ---------- Bottom tab bar (same classes as SaviorFit Logger) ---------- */
  .tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
  }
  .tabbar button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:10px 4px 8px;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--accent);}
  .tab-glyph svg{width:22px;height:22px;}

  /* ---------- Empty state (same pattern as SaviorFit Logger) ---------- */
  .empty.tab-empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--text-dim);
    padding:60px 24px;
    gap:14px;
  }
  .empty .glyph{
    width:48px;height:48px;
    color:var(--text-faint);
  }
  .empty p{margin:0;font-size:14px;line-height:1.5;}

  /* ---------- Cards (same pattern as SaviorFit Logger) ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px 14px 12px;
    margin-bottom:14px;
  }

  /* ---------- Buttons (same pattern as SaviorFit Logger) ---------- */
  .btn-primary{
    display:block;
    width:100%;
    background:var(--accent);
    color:#1c1500;
    border:none;
    border-radius:var(--radius-xl);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px;
    cursor:pointer;
  }

  .hidden{display:none !important;}

  .boot-loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .boot-loading-mark{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .boot-loading-mark span{color:var(--accent);}
</style>
</head>
<body>

<div id="bootLoading" class="boot-loading"><div class="boot-loading-mark">SAVIOR<span>FUEL</span></div></div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1>SAVIOR<span>FUEL</span></h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-action="set-tab" data-tab="log" class="active">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="4" width="4" height="16" rx="1.3"/><rect x="19" y="4" width="4" height="16" rx="1.3"/><rect x="5" y="10.4" width="14" height="3.2" rx="1"/></svg></span>
      Log
    </button>
    <button data-action="set-tab" data-tab="history">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="16" width="12" height="3" rx="1"/></svg></span>
      History
    </button>
    <button data-action="set-tab" data-tab="insights">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></span>
      Insights
    </button>
    <button data-action="set-tab" data-tab="settings">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></span>
      Settings
    </button>
  </nav>
</div>

<script>
  // =========================================================
  // SAVIORFUEL — starter scaffold
  // Visual shell (colors, fonts, tab bar, cards, buttons, fade
  // transition) copied to match SaviorFit Logger. Everything
  // below is placeholder: no Firebase, no auth, no real food-
  // logging logic yet. Next real decisions before this is a
  // working app:
  //   1. New Firebase project, or reuse the existing iron-ledge one?
  //   2. What does a logged meal actually store (name, calories,
  //      macros, photo, serving size)?
  //   3. Auth: same email/password + Google pattern as SaviorFit
  //      Logger, or something simpler to start?
  // =========================================================

  var state = { tab: 'log' };

  var TAB_EMPTY_STATES = {
    log: 'Nothing logged yet.<br>Add your first meal to get started.',
    history: 'No meal history yet.<br>Logged meals will show up here.',
    insights: 'Nothing to chart yet.<br>Log a few meals and your macro trends will appear here.',
    settings: 'Settings — coming soon.'
  };

  function renderApp(){
    document.querySelectorAll('.tabbar button').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    var html =
      '<div class="empty tab-empty-state"><div class="glyph">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
        '</svg>' +
      '</div><p>' + TAB_EMPTY_STATES[state.tab] + '</p></div>';
    document.getElementById('view').innerHTML = html;
  }

  // Same fade+shift treatment as SaviorFit Logger's switchTabWithFade.
  function switchTab(newTab){
    if (newTab === state.tab) return;
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');

    setTimeout(function(){
      state.tab = newTab;
      renderApp();
      viewEl.classList.remove('subtab-fade-out');
      viewEl.classList.add('subtab-fade-in');
      setTimeout(function(){
        viewEl.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'set-tab'){
      switchTab(el.dataset.tab);
    }
  });

  document.getElementById('bootLoading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderApp();
</script>

</body>
</html>
