  // Swipe the day panel down to dismiss. Only takes over once the list is
  // scrolled to the top and the finger is clearly moving down, so normal
  // scrolling is untouched.
  function attachDaySwipe(el){
    var sx = 0, sy = 0, st = 0, dy = 0, mode = 0; // mode: 0 idle, 1 undecided, 2 dragging, 3 ignore
    el.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1){ mode = 3; return; }
      var sc = el.querySelector('.dy-scroll');
      mode = (sc && sc.scrollTop > 0) ? 3 : 1;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); dy = 0;
    }, { passive: true });
    el.addEventListener('touchmove', function(e){
      if (mode === 0 || mode === 3) return;
      var t = e.touches[0], mx = t.clientX - sx;
      dy = t.clientY - sy;
      if (mode === 1){
        if (Math.abs(dy) < 8 && Math.abs(mx) < 8) return;
        if (dy > 0 && Math.abs(dy) > Math.abs(mx)){ mode = 2; el.style.transition = 'none'; el.style.animation = 'none'; }
        else { mode = 3; return; }
      }
      e.preventDefault();
      var d = Math.max(0, dy);
      el.style.transform = 'translateY(' + d + 'px)';
      el.style.opacity = String(Math.max(0.4, 1 - d / 600));
    }, { passive: false });
    function end(){
      if (mode !== 2){ mode = 0; return; }
      mode = 0;
      var fast = dy / Math.max(1, Date.now() - st) > 0.6;
      if (dy > 110 || (fast && dy > 40)){
        el.style.transition = 'transform .2s ease-out, opacity .2s';
        el.style.transform = 'translateY(100%)'; el.style.opacity = '0';
        setTimeout(function(){ if (document.getElementById('dayOverlay') === el) closeDayOverlay(); }, prefersReducedMotion() ? 0 : 200);
      } else {
        el.style.transition = 'transform .2s ease-out, opacity .2s';
        el.style.transform = ''; el.style.opacity = '';
        setTimeout(function(){ el.style.transition = ''; el.style.animation = ''; }, 220);
      }
    }
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
  }
  function closeDayOverlay(){
    ui.dayOpen = null;
    var el = document.getElementById('dayOverlay');
    if (el) el.remove();

  function refreshDayOverlay(){

  // The days, newest first, under a green month label. Shows a page at a

  function historyKeysSorted(map){ return Object.keys(map).sort().reverse(); }
  function historyListHtml(map, goal){

    }

  // Monday-to-Sunday strip for the current week, each day a small progress ring.
  function historyStripHtml(map, goal){
    var today = todayKey();
    var dow = (new Date().getDay() + 6) % 7; // Monday = 0
    var letters = ['M','T','W','T','F','S','S'];
    var cells = '', sum = 0, n = 0, under = 0;
    for (var i = 0; i < 7; i++){
      var key = dateKeyDaysAgo(dow - i);
      var info = map[key];
      var cls = 'hs-day';
      if (key === today) cls += ' now';
      if (key > today) cls += ' future';
      var ring = '';
      if (info){
        var st = dayStatus(info.calories, goal);
        ring = '<i class="hs-ring ' + st + '" style="--p:' + Math.min(100, pctUncapped(info.calories, goal)) + '"></i>';
        sum += info.calories; n++;
      } else if (key > today){
        ring = '<i class="hs-ring none"></i>';
      } else {
        ring = '<i class="hs-ring empty"></i>';
      }
      if (info && key <= today && dayStatus(info.calories, goal) !== 'over' && info.calories > 0 && goal > 0) under++;
      var inner = '<span class="hs-w">' + letters[i] + '</span><span class="hs-n">' + parseInt(key.slice(8, 10), 10) + '</span>' + ring;
      cells += info
        ? '<button type="button" class="' + cls + '" data-action="history-pick-day" data-day="' + key + '">' + inner + '</button>'
        : '<div class="' + cls + '">' + inner + '</div>';
    }
    var avg = n ? Math.round(sum / n).toLocaleString() + ' kcal/day' : 'nothing logged yet';
    var line = n ? n + (n === 1 ? ' day' : ' days') + ' logged' + (goal > 0 ? ' \u00B7 ' + under + ' within goal' : '') : 'Log a meal to start your week.';
    return '<div class="hist-sec"><span>This week</span><em>' + avg + '</em></div><div class="hist-strip">' + cells + '</div>' +
      '<div class="hist-week-note">' + line + '</div>';
  }

  // Copies every meal of a past day onto today.

    var now = Date.now();

  // ---- Insights extras (Weekly view): four stat cards.
  function insightsExtraParts(){
    var g = STORE.goals;
    var map = dayStatsMap();
    var streak = streakInfo(map);
    // last 7 days: average per logged day, days on goal, best day
    var logged = 0, sum = 0, onGoal = 0, best = null;
    for (var i = 0; i < 7; i++){
      var k = dateKeyDaysAgo(i), d = map[k];
      if (!d) continue;
      logged++; sum += d.calories;
      if (dayStatus(d.calories, g.calories) === 'on') onGoal++;
      var diff = Math.abs(d.calories - g.calories);
      if (g.calories && (!best || diff < best.diff)) best = { key: k, diff: diff };
    }
    var avg = logged ? Math.round(sum / logged) : 0;
    var bestLabel = best ? new Date(best.key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' }) : '—';
    var statsHtml = '<div class="pf-stats three">' +
        statCardHtml(avg.toLocaleString(), '', 'kcal daily avg', 'accent') +
        statCardHtml(onGoal + ' / ' + logged, '', 'days on goal', '') +
        statCardHtml(String(streak.current), '', 'day streak', '') +
      '</div>';
    return { stats: statsHtml };
  }

  /* =========================================================
     3D VIEWERS — Insights > Daily Overview (food pyramid) and
     Insights > Weekly Overview (plain bars)
     Three.js (r128) is loaded from CDN the first time a 3D panel
     is actually opened — same lazy pattern as the food-photo model —
     so it costs nothing on app start. createModelViewer() builds one
     viewer per model; each keeps ONE renderer/scene for the whole
     session: the panel's DOM is rebuilt on every render, so mount()
     just moves the existing canvas into the fresh container, and
     unmount() stops the render loop whenever the panel isn't on
     screen. The .glb files in /models are decimated copies of the
     source models (~60k triangles, 2048px colour map) so they load in
     seconds on a phone; the service worker caches them after the
     first load.
     ========================================================= */
  var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  var GLTF_LOADER_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
  var ORBIT_CONTROLS_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';

  function prefersReducedMotion(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // cfg: url, bytes (size estimate for the progress bar), aria, az/el/lift
  // (starting camera angle and vertical nudge), widthFactor/heightFactor
  // (how much of the panel the model fills), autoRotateSpeed, tagMode
  // ('facing' = a tag fades with its side of the model turning away;
  // 'billboard' = always shown, a little fainter when far), and optional
  // hooks: onModel(ctx), onMount(ctx, state), onFrame(ctx, now) -> true
  // while animating, onTap(ctx, pickedObjectOrNull), onUnmount(ctx).
  function createModelViewer(cfg){
    var readyPromise = null;  // libs + scene + model; cleared on failure so reopening the tab retries
    var stage = null;         // container currently on screen, null when the panel isn't showing
    var scene, camera, renderer, controls, model = null;
    var ctx = {};             // shared with the hooks above
    var fit = { center: null, hx: 0.5, hy: 0.4, hz: 0.47, rxz: 0.69, az: cfg.az, el: cfg.el, lift: cfg.lift };
    var placed = false, userMoved = false, dirty = true;
    var rafId = 0, resumeTimer = 0, resizeObserver = null;
    var tagDefs = [], tagList = [], tagV = null, tagToCam = null; // labels pinned to points on the model (see updateTags)
    var mountState = null, pointerDown = null;

    function setStatus(text, progress){
      var box = document.getElementById('modelStatus');
      if (!box) return;
      box.classList.remove('hidden');
      var label = document.getElementById('modelStatusText');
      if (label) label.textContent = text;
      var barWrap = document.getElementById('modelBarWrap');
      if (barWrap) barWrap.classList.toggle('hidden', progress === null);
      var bar = document.getElementById('modelBar');
      if (bar && progress !== null) bar.style.width = Math.round(progress * 100) + '%';
    }
    function hideStatus(){
      var box = document.getElementById('modelStatus');
      if (box) box.classList.add('hidden');
    }

    function ensureLibs(){
      return Promise.resolve()
        .then(function(){ if (typeof THREE === 'undefined') return loadScriptOnce(THREE_URL); })
        .then(function(){
          var jobs = [];
          if (!THREE.GLTFLoader) jobs.push(loadScriptOnce(GLTF_LOADER_URL));
          if (!THREE.OrbitControls) jobs.push(loadScriptOnce(ORBIT_CONTROLS_URL));
          return Promise.all(jobs);
        });
    }

    function buildScene(){
      if (renderer) return;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      } catch (e){
        renderer = null;
        e.noWebGL = true; // lets mount() show a "device can't do 3D" message instead of "check your connection"
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // 3x+ phones: lots of overdraw, little visible gain
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.setClearColor(0x000000, 0);
      renderer.domElement.setAttribute('role', 'img');
      renderer.domElement.setAttribute('aria-label', cfg.aria);
      // Phones drop the GL context when the browser is backgrounded;
      // three.js rebuilds its state on restore, we just need to redraw.
      renderer.domElement.addEventListener('webglcontextlost', function(e){ e.preventDefault(); });
      renderer.domElement.addEventListener('webglcontextrestored', function(){ dirty = true; });

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(36, 1, 0.05, 50);

      // Lighting: no environment map here, so a hemisphere fill plus
      // key / fill / warm rim lights (the rim uses the app's accent).
      scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f4a, 0.95));
      var key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(2, 3, 2.5);
      var fill = new THREE.DirectionalLight(0xbfd0ff, 0.4);
      fill.position.set(-3, 1.5, 1);
      var rim = new THREE.DirectionalLight(0xa6e36b, 0.3);
      rim.position.set(0, 2, -3);
      scene.add(key, fill, rim);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.8;
      // Horizontal spin only: min = max pins the camera at one
      // elevation, so vertical drags do nothing.
      controls.minPolarAngle = controls.maxPolarAngle = Math.PI / 2 - fit.el;
      controls.autoRotateSpeed = cfg.autoRotateSpeed || 1.2;
      if (cfg.inline){
        // In a card on a scrolling page: a vertical swipe must still scroll the page,
        // and a pinch while scrolling shouldn't zoom the model.
        controls.enableZoom = false;
        renderer.domElement.style.touchAction = 'pan-y';
      }
      controls.addEventListener('start', function(){
        userMoved = true;
        controls.autoRotate = false;
        clearTimeout(resumeTimer);
      });
      controls.addEventListener('end', function(){
        if (prefersReducedMotion()) return;
        resumeTimer = setTimeout(function(){ controls.autoRotate = true; }, 3500);
      });
      controls.addEventListener('change', function(){ dirty = true; });

      // A short press with barely any movement is a tap (a drag is the
      // camera's): find which model part is under the finger.
      if (cfg.onTap){
        var el = renderer.domElement;
        el.addEventListener('pointerdown', function(e){ pointerDown = { x: e.clientX, y: e.clientY, t: Date.now() }; });
        el.addEventListener('pointerup', function(e){
          var d = pointerDown; pointerDown = null;
          if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8 || Date.now() - d.t > 450) return;
          var rect = el.getBoundingClientRect();
          var ndc = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
          var rc = new THREE.Raycaster();
          rc.setFromCamera(ndc, camera);
          scene.updateMatrixWorld();
          var hits = rc.intersectObjects(ctx.pickables || [], false);
          cfg.onTap(ctx, hits.length ? hits[0].object : null);
          dirty = true;
        });
      }
    }

    function loadModel(){
      if (model) return Promise.resolve();
      return new Promise(function(resolve, reject){
        new THREE.GLTFLoader().load(cfg.url, function(gltf){
          model = gltf.scene;
          var maxAniso = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
          model.traverse(function(node){
            if (!node.isMesh) return;
            (Array.isArray(node.material) ? node.material : [node.material]).forEach(function(m){
              // Nothing here is really metal, and with no environment
              // map any metalness would render near-black — so ignore
              // the metal channel and keep the roughness one.
              m.metalness = 0;
              m.metalnessMap = null;
              if (m.map) m.map.anisotropy = maxAniso;
              m.needsUpdate = true;
            });
          });
          scene.add(model);
          var box = new THREE.Box3().setFromObject(model);
          var size = box.getSize(new THREE.Vector3());
          fit.center = box.getCenter(new THREE.Vector3());
          fit.hx = size.x / 2;
          fit.hy = size.y / 2;
          fit.hz = size.z / 2;
          fit.rxz = Math.sqrt(size.x * size.x + size.z * size.z) / 2; // spins around Y, so use the footprint's radius
          ctx.model = model; ctx.scene = scene; ctx.camera = camera; ctx.controls = controls; ctx.renderer = renderer; ctx.fit = fit;
          if (cfg.onModel) cfg.onModel(ctx);
          resolve();
        }, function(evt){
          var total = (evt.lengthComputable && evt.total) ? evt.total : cfg.bytes;
          setStatus('Loading 3D model…', Math.min(evt.loaded / total, 0.95));
        }, function(err){
          reject(err || new Error('Could not load ' + cfg.url));
        });
      });
    }

    // Default camera distance: how much of the panel the model fills is
    // set by cfg.widthFactor (>1 = the model runs past the screen edges,
    // like the pyramid; <1 = fully in view with margin). On a very
    // wide/short screen the height limit wins so it never overflows.
    function fitDistance(){
      var tanV = Math.tan(camera.fov * Math.PI / 360);
      var tanH = tanV * camera.aspect;
      var byWidth = fit.hx / (cfg.widthFactor * tanH) + fit.hz;
      var byHeight = fit.hy / (cfg.heightFactor * tanV) + fit.hz * 0.6;
      return Math.max(byWidth, byHeight);
    }

    // Stretch the card down to the top of the bottom nav (whose height
    // varies with the device's safe area).
    function layout(){
      if (!stage || cfg.inline) return;
      var card = stage.parentNode;
      var nav = document.querySelector('.bottom-nav');
      if (card && nav) card.style.bottom = nav.offsetHeight + 'px';
    }

    function resize(){
      if (!stage || !renderer || !fit.center) return;
      var w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false); // CSS sizes the canvas (100% x 100%)
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      var d = fitDistance();
      controls.target.set(fit.center.x, fit.center.y + fit.lift, fit.center.z);
      if (!placed){
        var t = controls.target;
        camera.position.set(
          t.x + d * Math.sin(fit.az) * Math.cos(fit.el),
          t.y + d * Math.sin(fit.el),
          t.z + d * Math.cos(fit.az) * Math.cos(fit.el)
        );
        placed = true;
      } else if (!userMoved){
        var dir = camera.position.clone().sub(controls.target).normalize();
        camera.position.copy(controls.target).addScaledVector(dir, d);
      }
      controls.minDistance = d * 0.6;
      controls.maxDistance = d * 1.6;
      controls.update();
      dirty = true;
    }

    // Pins HTML labels to points on the model: each frame the 3D point
    // is projected to screen coordinates, so the label rides along as
    // the model turns. 'facing' tags fade in as their side turns toward
    // the camera (fully visible within ~30 degrees, gone past ~60) and
    // shrink a little as it turns away; 'billboard' tags stay visible
    // and just get a little fainter and smaller on the far side.
    function updateTags(){
      if (!tagList.length || !stage) return;
      var cw = stage.clientWidth, ch = stage.clientHeight;
      var camDist = camera.position.distanceTo(controls.target);
      for (var i = 0; i < tagList.length; i++){
        var t = tagList[i];
        if (t.follow) t.follow(ctx, t.pos); // pinned to something that moves (e.g. a rising wedge)
        tagV.copy(t.pos).project(camera);
        var o, sc;
        if (cfg.tagMode === 'billboard'){
          var far = Math.max(0, Math.min(1, (camera.position.distanceTo(t.pos) - (camDist - fit.rxz)) / (2 * fit.rxz)));
          o = 1 - 0.5 * far;
          sc = 1 - 0.16 * far;
        } else {
          tagToCam.subVectors(camera.position, t.pos).normalize();
          o = Math.max(0, Math.min(1, (tagToCam.dot(t.n) - 0.55) / 0.3));
          sc = 0.82 + 0.18 * o;
          // Draw the ring as its tag starts to fade in; reset it only once the
          // tag has all but vanished, so nobody sees an emptied ring.
          if (!t.on && o > 0.35){ t.on = true; t.el.classList.add('in'); }
          else if (t.on && o < 0.05){ t.on = false; t.el.classList.remove('in'); }
        }
        var sx = (tagV.x * 0.5 + 0.5) * cw;
        var sy = (-tagV.y * 0.5 + 0.5) * ch;
        t.el.style.opacity = o.toFixed(3);
        t.el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + sc.toFixed(3) + ')';
      }
    }

    function tick(){
      rafId = requestAnimationFrame(tick);
      var animating = cfg.onFrame ? cfg.onFrame(ctx, performance.now()) : false;
      var moved = controls.update();
      if (moved || dirty || controls.autoRotate || animating){
        renderer.render(scene, camera);
        updateTags();
        dirty = false;
      }
    }
    function startLoop(){ if (!rafId) rafId = requestAnimationFrame(tick); }
    function stopLoop(){
      if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
    }

    // tags: [{ el, pos: [x, y, z], normal: [nx, nz] }] — labels to pin
    // to points on the model (positions are in the model's own
    // coordinates; normal = the direction that side faces), or
    // [{ el, follow: function(ctx, outVector3) }] for labels that follow
    // a moving part. state: whatever the model's hooks need (the wheel
    // gets the week's numbers).
    function mount(container, tags, state){
      stage = container;
      tagDefs = tags || [];
      mountState = state || null;
      layout();
      if (!readyPromise){
        readyPromise = ensureLibs()
          .then(function(){ buildScene(); return loadModel(); })
          .catch(function(err){ readyPromise = null; throw err; });
      }
      readyPromise.then(function(){
        if (stage !== container) return; // panel was closed or re-rendered while loading
        container.appendChild(renderer.domElement);
        tagV = tagV || new THREE.Vector3();
        tagToCam = tagToCam || new THREE.Vector3();
        tagList = tagDefs.map(function(d){
          return {
            el: d.el,
            pos: d.pos ? new THREE.Vector3(d.pos[0], d.pos[1], d.pos[2]) : new THREE.Vector3(),
            n: d.normal ? new THREE.Vector3(d.normal[0], 0, d.normal[1]) : null,
            follow: d.follow || null,
            on: false
          };
        });
        if (cfg.onMount) cfg.onMount(ctx, mountState);
        controls.autoRotate = !prefersReducedMotion();
        layout();
        resize();
        hideStatus();
        if (resizeObserver) resizeObserver.disconnect();
        if (typeof ResizeObserver !== 'undefined'){
          resizeObserver = new ResizeObserver(resize);
          resizeObserver.observe(container);
        }
        startLoop();
      }, function(err){
        console.error('SaviorFuel: 3D model failed —', err);
        if (stage !== container) return;
        setStatus(err && err.noWebGL
          ? 'This device or browser can\'t show the 3D view.'
          : 'Couldn\'t load the 3D model. Check your connection, then reopen this tab.', null);
      });
    }

    function unmount(){
      if (!stage) return;
      stage = null;
      tagDefs = [];
      tagList = [];
      mountState = null;
      if (cfg.onUnmount) cfg.onUnmount(ctx);
      stopLoop();
      clearTimeout(resumeTimer);
      if (resizeObserver){ resizeObserver.disconnect(); resizeObserver = null; }
    }

    window.addEventListener('resize', function(){ layout(); });

    return {
      mount: mount,
      unmount: unmount,
      ctx: ctx,                                 // for the panel's own controls (e.g. closing the day card)
      redraw: function(){ dirty = true; }
    };
  }

  // Daily Overview: the food pyramid (four sides = four nutrients).
  var Model3D = createModelViewer({
    url: 'models/food-pyramid-v2.glb',
    bytes: 1660548, // for the progress bar when the server sends no length
    aria: 'Interactive 3D food pyramid. Drag to rotate, pinch to zoom.',
    az: 0.32, el: 0.2, lift: -0.07,
    widthFactor: 0.82, heightFactor: 1.12,
    inline: true, // sits in a card inside a scrolling page (not full-bleed)
    autoRotateSpeed: 1.2,
    tagMode: 'facing'
  });

  /* =========================================================
     RENDER — INSIGHTS TAB
     ========================================================= */
  // Dispatches to whichever Insights sub-tab panel is active — same
  // pattern as SaviorFit Logger's renderProgress() dispatching between
  // its Volume overview / Exercise progression views. The empty state
  // is shared: with nothing logged yet, neither panel has anything
  // meaningful to show.
  function renderInsights(){
    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>Nothing to chart yet.<br>Log a few meals and your trends will appear here.</p></div>';
      return;
    }

    // One scrolling page: today's pyramid card, then the last 7 days.
    var todayMeals = mealsForDay(todayKey());
    var totals = totalsFor(todayMeals);
    var goals = STORE.goals;
    var left = goals.calories - totals.calories;
    var tagsHtml = PYRAMID_FACES.map(function(f, k){ return faceTagHtml(k, totals, goals); }).join('');
    function chip(label, key, cls){
      return '<div class="balance-chip">' + macroIconHtml(cls) + label + '<b>' + pctUncapped(totals[key], goals[key]) + '%<small> of goal</small></b></div>';
    }
    document.getElementById('view').innerHTML =
      '<div class="overview-plain">' +
        '<div class="bal-head"><h3 class="section-label">Today\'s balance</h3><span>Drag to spin</span></div>' +
        '<div class="balance-card">' +
          '<div class="balance-stage">' +
            '<div class="model-stage" id="modelStage"></div>' + tagsHtml +
            '<div class="model-status" id="modelStatus">' +
              '<span id="modelStatusText">Loading 3D model…</span>' +
              '<div class="model-bar" id="modelBarWrap"><i id="modelBar"></i></div>' +
            '</div>' +
          '</div>' +
          '<div class="balance-foot"><span>' + Math.round(totals.calories).toLocaleString() + ' / ' + goals.calories.toLocaleString() + ' kcal</span>' +
            '<b' + (left < 0 ? ' class="over"' : '') + '>' + Math.abs(Math.round(left)).toLocaleString() + (left < 0 ? ' over' : ' left') + '</b></div>' +
          '<div class="balance-chips">' + chip('Protein', 'protein', 'protein') + chip('Carbs', 'carbs', 'carbs') + chip('Fat', 'fat', 'fat') + '</div>' +
        '</div>' +
        insightsExtraParts().stats +
        weeklyBodyHtml() +
      '</div>';
    try {
      Model3D.mount(document.getElementById('modelStage'), PYRAMID_FACES.map(function(f, k){
        var a = f.side * Math.PI / 2;
        var nx = Math.round(Math.sin(a)), nz = Math.round(Math.cos(a)); // side k faces +z, +x, -z, -x
        return { el: document.getElementById('faceTag' + k), pos: [f.r * nx, f.y, f.r * nz], normal: [nx, nz] };
      }));
    } catch (err){
      console.error('SaviorFuel: 3D panel failed to start —', err);
    }
  }







  // Each side of the 3D pyramid stands for one nutrient. A small tag
  // (ring + amount) is pinned to that side of the model and travels
  // with it as it turns. Order = the side facing the camera at
  // 0 / 90 / 180 / 270 degrees (+z, +x, -z, -x in the model's own
  // coordinates; one side has no tag now that fibre is gone). y = height of the tag on the pyramid, r = how far
  // out the food surface is at that height (measured from the model).
  var PYRAMID_FACES = [
    { key: 'protein', label: 'Protein', y: 0.44, r: 0.245, side: 0 },
    { key: 'carbs',   label: 'Carbs',   y: 0.08, r: 0.47,  side: 1 },
    { key: 'water',   label: 'Water',   y: 0.26, r: 0.345, side: 2, unit: 'ml' },
    { key: 'fat',     label: 'Fat',     y: 0.60, r: 0.145, side: 3 }
  ];
  var FACE_RING_R = 15;
  var FACE_RING_C = 2 * Math.PI * FACE_RING_R;

  function faceTagHtml(faceIndex, totals, goals){
    var f = PYRAMID_FACES[faceIndex];
    var value = f.key === 'water' ? waterFor(todayKey()) : (totals[f.key] || 0);
    var goal = goals[f.key] || 0;
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = FACE_RING_C * (1 - Math.min(percent, 100) / 100);
    return '<div class="face-tag" id="faceTag' + faceIndex + '">' +
      '<div class="face-ring">' +
        '<svg viewBox="0 0 38 38">' +
          '<circle class="face-ring-track" cx="19" cy="19" r="' + FACE_RING_R + '"></circle>' +
          '<circle class="face-ring-fill ' + f.key + (over ? ' over' : '') + '" cx="19" cy="19" r="' + FACE_RING_R + '" ' +
            'style="stroke-dasharray:' + FACE_RING_C.toFixed(2) + ';--full:' + FACE_RING_C.toFixed(2) + ';--off:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="face-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div>' +
        '<div class="face-name">' + f.label + '</div>' +
        '<div class="face-amount' + (over ? ' over' : '') + '">' + Math.round(value) + ' / ' + goal + (f.unit || 'g') + '</div>' +
      '</div>' +
    '</div>';
  }


  // Calories per meal time (Breakfast, Lunch ...) for a list of meals, in
  // the fixed meal order; meals with no category (logged before meal
  // times existed) fall into "Other". Only meal times that have
  // something logged are returned.
  function mealBreakdown(meals){
    var blank = function(id, label){ return { id: id, label: label, kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, count: 0 }; };
    var rows = MEAL_CATEGORIES.map(function(c){ return blank(c.id, c.label); });
    var other = blank('other', 'Other');
    meals.forEach(function(m){
      var row = rows.filter(function(r){ return r.id === m.category; })[0] || other;
      row.kcal += m.calories || 0;
      row.protein += m.protein || 0;
      row.carbs += m.carbs || 0;
      row.fat += m.fat || 0;
      row.fiber += m.fiber || 0;
      row.count += 1;
    });
    if (other.count > 0) rows.push(other);
    return rows.filter(function(r){ return r.count > 0; }).map(function(r){
      return { id: r.id, label: r.label, kcal: Math.round(r.kcal), protein: r.protein, carbs: r.carbs, fat: r.fat, fiber: r.fiber, count: r.count };
    });
  }








  // The last 7 calendar days (today plus the 6 before it) worked out
  // from the meals: per-day totals, plus the numbers both Weekly views
  // share. days[0] is six days ago, days[6] is today.
  function weekData(){
    var g = STORE.goals;
    var days = [];
    var weekMeals = [];
    for (var d = 6; d >= 0; d--){
      var key = dateKeyDaysAgo(d);
      var dayMeals = mealsForDay(key);
      var t = totalsFor(dayMeals);
      weekMeals = weekMeals.concat(dayMeals);
      days.push({
        label: d === 0 ? 'Today' : new Date(key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
        isToday: d === 0,
        logged: dayMeals.length > 0,
        total: Math.round(t.calories),
        t: t,
        byMeal: mealBreakdown(dayMeals)
      });
    }
    var loggedDays = days.filter(function(x){ return x.logged; });
    var sum = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
    loggedDays.forEach(function(x){
      Object.keys(sum).forEach(function(k){ sum[k] += x.t[k] || 0; });
    });
    return {
      days: days, goal: g.calories, goals: g, loggedDays: loggedDays, sum: sum,
      byMeal: mealBreakdown(weekMeals), weekMeals: weekMeals,
      avg: function(k){ return loggedDays.length ? sum[k] / loggedDays.length : 0; },
      highest: loggedDays.length ? Math.max.apply(null, loggedDays.map(function(x){ return x.total; })) : 0
    };
  }


  // ---- Weekly Overview, plain: the bars, week numbers, average macros,
  // calorie split and consistency line.
  // Top foods card (moved here from Profile).
  function topFoodsCardHtml(){
    var ps = profileStatsFuel();
    var h = '<div class="card pf-top"><div class="pf-top-h">TOP FOODS</div>';
    if (ps.top.length){
      ps.top.forEach(function(f){
        h += '<div class="pf-food"><div class="pf-food-n">' + esc(f.name) + '</div><div class="pf-food-v">' + f.n + '<small> \u00D7</small></div></div>';
      });

      h += '<div class="pf-empty">Log a few meals and the foods you eat most show up here.</div>';

  // ---- By meal: the day's (or week's) calories split across Breakfast,
  // Morning Snacks, Lunch, Evening Snacks and Dinner, with each meal's
  // own protein / carbs / fat. A switch flips Today <-> last 7 days.
  var MEAL_COLORS = { 'breakfast': '#f2a33a', 'morning-snack': '#8bc34a', 'lunch': '#26a69a', 'evening-snack': '#7e8ce0', 'dinner': '#c0568f', 'other': '#9aa3ad' };
  function mealSplitData(range){
    var keys = {};
    for (var d = 0; d < (range === 'week' ? 7 : 1); d++) keys[dateKeyDaysAgo(d)] = 1;
    var rows = MEAL_CATEGORIES.map(function(c){ return { id: c.id, label: c.label, n: 0, cal: 0, p: 0, c: 0, f: 0 }; });
    var other = { id: 'other', label: 'Other', n: 0, cal: 0, p: 0, c: 0, f: 0 };
    STORE.meals.forEach(function(m){
      if (!keys[dateKey(m.loggedAt)]) return;
      var r = rows.filter(function(x){ return x.id === m.category; })[0] || other;
      r.n++; r.cal += m.calories || 0; r.p += m.protein || 0; r.c += m.carbs || 0; r.f += m.fat || 0;
    });
    if (other.n) rows.push(other);
    return rows;
  }
  // Each meal's share of the daily goals (percent). Editable in My plan.
  var DEFAULT_MEAL_SPLIT = { 'breakfast': 25, 'morning-snack': 10, 'lunch': 30, 'evening-snack': 10, 'dinner': 25 };
  function mealSplitPcts(){
    var u = STORE.appSettings.mealSplit || {}, out = {};
    MEAL_CATEGORIES.forEach(function(c){
      out[c.id] = (typeof u[c.id] === 'number' && u[c.id] >= 0 && u[c.id] <= 100) ? u[c.id] : DEFAULT_MEAL_SPLIT[c.id];
    });
    return out;
  }
  function mealTarget(id, mult){
    var g = STORE.goals, pc = (mealSplitPcts()[id] || 0) / 100, m = mult || 1;
    return { cal: Math.round(g.calories * pc * m), p: Math.round(g.protein * pc * m), c: Math.round(g.carbs * pc * m), f: Math.round(g.fat * pc * m) };
  }

  function mealSplitCardHtml(){
    var range = ui.mealSplit === 'week' ? 'week' : 'today';
    var mult = range === 'week' ? 7 : 1;
    var rows = mealSplitData(range);
    var total = rows.reduce(function(a, r){ return a + r.cal; }, 0);
    var goalCal = STORE.goals.calories * mult;
    var bar = rows.filter(function(r){ return r.cal > 0; }).map(function(r){
      return '<i style="width:' + (r.cal / total * 100).toFixed(1) + '%;background:' + MEAL_COLORS[r.id] + '"></i>';
    }).join('');
    function mc(cls, l, v, t){
      var over = t != null && t > 0 && Math.round(v) > t;
      return '<span class="' + (over ? 'ov' : cls) + '">' + l + ' ' + Math.round(v) + (t != null ? '/' + t : '') + 'g</span>';
    }
    var list = rows.map(function(r){
      var t = r.id === 'other' ? null : mealTarget(r.id, mult);
      var dot = '<i class="dot" style="background:' + MEAL_COLORS[r.id] + '"></i>';
      if (r.n === 0){
        return '<div class="bm-row2 none"><div class="bm-top">' + dot + '<div class="nm">' + r.label + '<small>nothing logged</small></div>' +
          '<div class="kc">0<small> / ' + t.cal.toLocaleString() + ' kcal</small></div></div>' +
          '<div class="bm-prog"><i style="width:0"></i></div>' +
          '<div class="bm-mx2">' + mc('p', 'P', 0, t.p) + mc('c', 'C', 0, t.c) + mc('f', 'F', 0, t.f) + '</div></div>';
      }

      return '<div class="bm-row2">' +
        '<div class="bm-top">' + dot + '<div class="nm">' + r.label + '<small>' + r.n + (r.n === 1 ? ' food' : ' foods') + '</small></div>' +
          '<div class="kc' + (over ? ' over' : '') + '">' + Math.round(r.cal).toLocaleString() + '<small>' + (t ? ' / ' + t.cal.toLocaleString() + ' kcal' : ' kcal') + '</small></div></div>' +
        (t ? '<div class="bm-prog"><i style="width:' + Math.min(100, t.cal > 0 ? r.cal / t.cal * 100 : 0).toFixed(0) + '%;background:' + (over ? 'var(--accent-2)' : MEAL_COLORS[r.id]) + '"></i></div>' : '<div class="bm-gap2"></div>') +
        '<div class="bm-mx2">' + mc('p', 'P', r.p, t && t.p) + mc('c', 'C', r.c, t && t.c) + mc('f', 'F', r.f, t && t.f) + '</div></div>';
    }).join('');
    return '<div class="card bm-card" id="mealSplitCard"><div class="bm-h"><span>By meal</span>' +
        '<div class="bm-seg"><button type="button" data-action="meal-split-range" data-range="today" class="' + (range === 'today' ? 'on' : '') + '">TODAY</button>' +
        '<button type="button" data-action="meal-split-range" data-range="week" class="' + (range === 'week' ? 'on' : '') + '">7 DAYS</button></div></div>' +
      '<div class="bm-tot"><b>' + Math.round(total).toLocaleString() + ' kcal</b><small>' + (goalCal > 0 ? 'of ' + goalCal.toLocaleString() + (range === 'week' ? ' weekly goal' : ' daily goal') : '') + '</small></div>' +
      '<div class="bm-stack">' + bar + '</div><div class="bm-gap"></div>' + list + '</div>';
  }

  function weeklyBodyHtml(){
    var wd = weekData();
    var g = wd.goals, days = wd.days, loggedDays = wd.loggedDays, avg = wd.avg, sum = wd.sum;
    var DAYS_TO_SHOW = 7;
    var dayMax = Math.max(g.calories, Math.max.apply(null, days.map(function(x){ return x.total; })), 1);
    var goalPos = pct(g.calories, dayMax); // where the goal line sits along each bar

    var html = (loggedDays.length ? mealSplitCardHtml() : '') + '<div class="card wk-card"><div class="wk-h"><span>This week</span>' + (g.calories > 0 ? '<em>Goal ' + g.calories.toLocaleString() + '</em>' : '') + '</div>';

      return '<div class="insight-bar-row">' +

          (g.calories > 0 ? '<i class="insight-goal-mark" style="left:' + goalPos + '%"></i>' : '') +
        '</div>' +
        '<div class="insight-bar-val">' + x.total + '</div>' +

    }).join('');
    if (loggedDays.length === 0){
      return html + '<div class="insight-caption">Log a meal to see your weekly averages and macro split.</div></div>' + topFoodsCardHtml();
    }

    // ---- where the week's calories came from (4 kcal/g protein & carbs, 9 kcal/g fat)
    var pKcal = sum.protein * 4, cKcal = sum.carbs * 4, fKcal = sum.fat * 9;
    var macroKcal = pKcal + cKcal + fKcal;
    if (macroKcal > 0){
      var pP = Math.round(pKcal / macroKcal * 100);
      var pC = Math.round(cKcal / macroKcal * 100);
      var pF = Math.max(0, 100 - pP - pC); // so the three always add to 100
      html += '<div class="wk-div"></div><div class="wk-h"><span>Where it came from</span></div>' +
        '<div class="split-bar"><i class="p" style="width:' + pP + '%"></i><i class="c" style="width:' + pC + '%"></i><i class="f" style="width:' + pF + '%"></i></div>' +
        '<div class="split-legend">' +
          '<span><i class="p"></i>Protein <b>' + pP + '%</b></span>' +
          '<span><i class="c"></i>Carbs <b>' + pC + '%</b></span>' +
          '<span><i class="f"></i>Fat <b>' + pF + '%</b></span>' +
        '</div>';
    }

    html += '</div>' + topFoodsCardHtml();
    html += '<button type="button" class="week-share-btn" data-action="share-week">Share my week</button>';
    return html;
  }

  // Mifflin-St Jeor plan from a profile (weightKg / heightCm / age / sex /
  // activityLevel / goal). Used by Settings > "Calculate my plan" and the
  // first-run welcome.
  function computePlan(profile){
    var bmr = profile.sex === 'male'
      ? (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) + 5
      : (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) - 161;
    var activityMult = (ACTIVITY_LEVELS.find(function(a){ return a.id === profile.activityLevel; }) || ACTIVITY_LEVELS[2]).mult;
    var tdee = bmr * activityMult;
    var goal = goalById(profile.goal);
    // Safety floor so a small person on "Lose weight" never lands on a crash diet.
    var floor = profile.sex === 'male' ? 1500 : 1200;
    var calories = Math.max(floor, Math.round(tdee * (1 + goal.pct)));
    // Protein by bodyweight (depends on the goal), fat at 25% of calories, carbs fill the rest.
    var protein = Math.round(profile.weightKg * goal.protein);
    var fatCal = calories * 0.25;
    var fat = Math.round(fatCal / 9);
    var carbs = Math.round(Math.max(0, calories - protein * 4 - fatCal) / 4);
    return { tdee: tdee, calories: calories, protein: protein, carbs: carbs, fat: fat };
  }

  // Reads the body-details form. Returns { profile, err } — err is a plain
  // sentence when something is blank or out of range, so nothing silly
  // (a -5 kg weight, a 300-year-old) ever reaches the plan.
  function readProfileForm(){
    var imperial = STORE.appSettings.unit === 'imperial';
    var v = function(id){ return document.getElementById(id).value; };
    var age = parseInt(v('profAge'), 10), h = parseFloat(v('profHeight')), w = parseFloat(v('profWeight'));
    var hCm = imperial ? inToCm(h) : h, wKg = imperial ? lbToKg(w) : w;
    var L = PLAN_LIMITS, err = null;
    if (!(age >= L.age[0] && age <= L.age[1])) err = 'Age should be between ' + L.age[0] + ' and ' + L.age[1] + '.';
    else if (!(hCm >= L.heightCm[0] && hCm <= L.heightCm[1])) err = 'Height should be between ' + (imperial ? Math.ceil(cmToIn(L.heightCm[0])) + ' and ' + Math.floor(cmToIn(L.heightCm[1])) + ' in' : L.heightCm[0] + ' and ' + L.heightCm[1] + ' cm') + '.';
    else if (!(wKg >= L.weightKg[0] && wKg <= L.weightKg[1])) err = 'Bodyweight should be between ' + (imperial ? Math.ceil(kgToLb(L.weightKg[0])) + ' and ' + Math.floor(kgToLb(L.weightKg[1])) + ' lb' : L.weightKg[0] + ' and ' + L.weightKg[1] + ' kg') + '.';
    return {
      err: err,
      profile: err ? null : { sex: v('profSex'), age: age, heightCm: Math.round(hCm), weightKg: Math.round(wKg * 10) / 10, activityLevel: v('profActivity'), goal: v('profGoal') }
    };
  }

  // Body details save as soon as you change them (no need to press Calculate
  // just to keep them); Calculate is only for turning them into daily goals.
  function saveProfileFromForm(){
    if (!document.getElementById('profWeight')) return;
    var r = readProfileForm();
    if (r.err){ showToast(r.err); return; }
    STORE.profile = r.profile;
    saveStore();
  }

  function calculatePlanFromForm(){
    var r = readProfileForm();
    if (r.err){ showToast(r.err); return; }
    var prevGoals = Object.assign({}, STORE.goals), prevTdee = STORE.lastPlanTdee;
    STORE.profile = r.profile;
    var plan = computePlan(r.profile);
    // Merge rather than replace — the calculator only derives calories and
    // protein/carbs/fat, so sugar/sodium/water goals carry over.
    STORE.goals = Object.assign({}, STORE.goals, { calories: plan.calories, protein: plan.protein, carbs: plan.carbs, fat: plan.fat });
    STORE.lastPlanTdee = Math.round(plan.tdee);
    saveStore();
    renderApp();
    showToast('Daily goals set: ' + plan.calories + ' kcal', 'Undo', function(){
      STORE.goals = prevGoals; STORE.lastPlanTdee = prevTdee; saveStore(); renderApp();
    });
  }

  // ---- Profile tab: numbers for the hero ----
  function profileStatsFuel(){
    var map = dayStatsMap();
    var keys = Object.keys(map).sort();
    var avgSum = 0, avgN = 0;
    for (var d = 0; d < 7; d++){
      var day = map[dateKeyDaysAgo(d)];
      if (day){ avgSum += day.calories; avgN++; }
    }
    var counts = {};
    STORE.meals.forEach(function(m){
      var nm = String(m.name || '').trim();
      if (!nm) return;
      var k = nm.toLowerCase();
      if (!counts[k]) counts[k] = { name: nm, n: 0 };
      counts[k].n++;
    });
    var top = Object.keys(counts).map(function(k){ return counts[k]; })
      .sort(function(a, b){ return b.n - a.n; }).slice(0, 3);
    var since = '';
    if (keys.length){
      var p = keys[0].split('-');
      since = new Date(+p[0], +p[1] - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    }
    var si = streakInfo(map);
    return { streak: si.current, best: si.best, days: keys.length, meals: STORE.meals.length,
             avg: avgN ? Math.round(avgSum / avgN) : 0, top: top, since: since };
  }

  // Share profile: draws the stats on a canvas and opens the share sheet
  // (or downloads the picture where sharing files isn't supported).
  function shareProfile(){
    var ps = profileStatsFuel();
    var nm = (STORE.appSettings.name && String(STORE.appSettings.name).trim()) || 'SaviorFuel';
    var W = 1080, H = 1350;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#1b2314'); g.addColorStop(0.55, '#14161a'); g.addColorStop(1, '#14161a');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.strokeStyle = 'rgba(166,227,107,.55)'; x.lineWidth = 4;
    x.beginPath(); x.roundRect(40, 40, W - 80, H - 80, 48); x.stroke();
    function txt(t, px, py, font, color, align, ls){
      x.font = font; x.fillStyle = color; x.textAlign = align || 'left';
      if ('letterSpacing' in x) x.letterSpacing = ls || '0px';
      x.fillText(t, px, py);
    }

  function applyAppearanceSettings(){

  function handleImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.meals)) throw new Error('Not a valid SaviorFuel backup file');
        if (!window.confirm('Replace everything currently on this device with this backup?')) return;
        makeSafetyCopy('before import');
        STORE = {
          meals: parsed.meals.map(sanitizeMeal).filter(Boolean),
          goals: Object.assign({}, DEFAULT_GOALS, parsed.goals || {}),
          profile: parsed.profile || Object.assign({}, DEFAULT_PROFILE),
          appSettings: Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {}),
          savedFoods: Array.isArray(parsed.savedFoods) ? parsed.savedFoods : [],
          myFoods: Array.isArray(parsed.myFoods) ? parsed.myFoods : [],
          water: (parsed.water && typeof parsed.water === 'object') ? parsed.water : {},
          photos: {}
        };
        STORE.photos = cleanPhotos(parsed.photos, STORE.meals);
        saveStore();
        applyAppearanceSettings();
        renderApp();
      } catch (err){
        console.error('SaviorFuel: import failed —', err);
        alert('That file doesn\'t look like a valid SaviorFuel backup.');
      }
    };
    reader.readAsText(file);
  }

  /* ---- Safety copies: a few snapshots (no photos) kept on this phone.
     One is made automatically once a day, and another right before an
     import or an erase. Restoring only adds back what's missing — it
     never deletes anything you have now. ---- */
  var BACKUP_KEY = 'saviorfuel_backups_v1', BACKUP_MAX = 5;
  function readBackups(){
    try { var a = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]'); return Array.isArray(a) ? a : []; }
    catch (e){ return []; }
  }
  function writeBackups(list){
    list = list.slice(0, BACKUP_MAX);
    while (list.length){
      try { localStorage.setItem(BACKUP_KEY, JSON.stringify(list)); return true; }
      catch (e){ list.pop(); }          // storage full: drop the oldest and try again
    }
    try { localStorage.removeItem(BACKUP_KEY); } catch (e2){}
    return false;
  }
  function makeSafetyCopy(reason){
    try {
      if (!STORE.meals.length && !(STORE.savedFoods || []).length && !(STORE.myFoods || []).length) return;

  /* =========================================================
     A meal lands on the Log ring: whenever today's calories go up
     while the Log tab is showing today, the number counts up, the
     rings grow from where they were, a +kcal floats up and the ring
     pops. Crossing the daily goal for the first time adds a pulse and
     a burst of dots. Works from any way of logging (it just watches
     the totals), and is skipped for reduced motion.
     ========================================================= */
  var heroSeen = null, heroAnimToken = 0;
  function heroLanded(){
    if (state.tab !== 'log') return;
    var tk = todayKey();
    if (logDayKey() !== tk) return;
    var g = STORE.goals;
    var t = totalsFor(mealsForDay(tk));
    var now = { key: tk, cal: t.calories, protein: t.protein, carbs: t.carbs, fat: t.fat };
    var prev = heroSeen; heroSeen = now;
    if (!prev || prev.key !== tk || now.cal <= prev.cal + 0.5 || prefersReducedMotion()) return;
    var ring = document.querySelector('.hero-ring');
    if (!ring || !ring.animate) return;
    var token = ++heroAnimToken;
    var hostEl = ring.closest('.log-hero, .log-hero-card') || ring;
    var numEl = hostEl.querySelector('.hero-ring-num'), subEl = hostEl.querySelector('.hero-ring-sub');
    var goalsBy = { cal: g.calories, protein: g.protein, carbs: g.carbs, fat: g.fat };
    var valsPrev = { cal: prev.cal, protein: prev.protein, carbs: prev.carbs, fat: prev.fat };
    var valsNow = { cal: now.cal, protein: now.protein, carbs: now.carbs, fat: now.fat };
    function frac(id, v){ return goalsBy[id] > 0 ? Math.min(v / goalsBy[id], 1) : 0; }
    function paintNum(v){
      if (!numEl || !numEl.isConnected) return;
      var left = g.calories - v, over = g.calories > 0 && v > g.calories;
      numEl.textContent = (g.calories > 0 ? Math.abs(Math.round(left)) : Math.round(v)).toLocaleString();
      numEl.classList.toggle('over', over);
      if (subEl) subEl.textContent = g.calories > 0 ? (over ? 'kcal over' : 'kcal left \u00B7 ' + Math.round(v).toLocaleString() + ' eaten') : 'kcal eaten';
    }
    // 1) draw the "before" picture right away
    paintNum(prev.cal);
    var circles = {};
    HERO_RINGS.forEach(function(rg){
      var el = ring.querySelector('.ring-' + rg.id);
      if (!el) return;
      var c = 2 * Math.PI * rg.r;
      circles[rg.id] = { el: el, c: c };
      el.style.transition = 'none';
      el.style.strokeDashoffset = (c * (1 - frac(rg.id, valsPrev[rg.id]))).toFixed(2);
    });
    var finalData = null;
    var has3d = ring3d.state === 'ready' && ring3dData && ring.classList.contains('is3d');
    function set3d(k){   // k = 0..1 progress from "before" to "after"
      var d = {};
      HERO_RINGS.forEach(function(rg){
        var a = frac(rg.id, valsPrev[rg.id]), b = frac(rg.id, valsNow[rg.id]);
        var f = a + (b - a) * k;
        d[rg.id] = { frac: f, over: k >= 1 && finalData[rg.id].over };
      });
      ring3dData = d;
      ring3dBuild();
    }
    if (has3d){
      finalData = {}; Object.keys(ring3dData).forEach(function(id){ finalData[id] = ring3dData[id]; });
      set3d(0);
    }
    // 2) after the sheet has finished closing, grow everything
    setTimeout(function(){
      if (token !== heroAnimToken || !ring.isConnected) return;
      void ring.offsetWidth;
      HERO_RINGS.forEach(function(rg){
        var cc = circles[rg.id];
        if (!cc) return;
        cc.el.style.transition = 'stroke-dashoffset 800ms cubic-bezier(.2,.8,.2,1)';
        cc.el.style.strokeDashoffset = (cc.c * (1 - frac(rg.id, valsNow[rg.id]))).toFixed(2);
      });
      var plus = document.createElement('div');
      plus.className = 'hero-plus';
      plus.textContent = '+' + Math.round(now.cal - prev.cal).toLocaleString();
      ring.appendChild(plus);
      plus.animate([
        { opacity: 0, transform: 'translateY(8px)' },
        { opacity: 1, transform: 'translateY(-4px)', offset: .25 },
        { opacity: 1, transform: 'translateY(-26px)', offset: .7 },
        { opacity: 0, transform: 'translateY(-44px)' }
      ], { duration: 1200, easing: 'ease-out' }).onfinish = function(){ plus.remove(); };
      var DUR = 800, t0 = performance.now(), lastBuild = 0;
      function ease(x){ return 1 - Math.pow(1 - x, 3); }
      (function step(ts){
        if (token !== heroAnimToken || !ring.isConnected) return;
        var x = Math.min(1, (ts - t0) / DUR), k = ease(x);
        paintNum(valsPrev.cal + (valsNow.cal - valsPrev.cal) * k);
        if (has3d && ts - lastBuild > 70 && x < 1){ lastBuild = ts; set3d(k); }
        if (x < 1){ requestAnimationFrame(step); return; }
        paintNum(valsNow.cal);
        if (has3d) set3d(1);
        finishPop();
      })(t0);
    }, 380);
    function finishPop(){
      if (!ring.isConnected) return;
      var crossed = g.calories > 0 && prev.cal < g.calories && now.cal >= g.calories;
      ring.animate([{ scale: '1' }, { scale: crossed ? '1.1' : '1.05', offset: .4 }, { scale: '.98', offset: .7 }, { scale: '1' }], { duration: 480, easing: 'ease-out' });
      if (!crossed) return;
      var pulse = document.createElement('div');
      pulse.className = 'hero-pulse';
      ring.appendChild(pulse);
      pulse.animate([{ opacity: .8, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.3)' }], { duration: 700, easing: 'ease-out' }).onfinish = function(){ pulse.remove(); };
      var cols = ['#a6e36b', '#f5c451', '#ff8a65', '#a6e36b', '#f5c451', '#ff8a65', '#a6e36b', '#f5c451'];
      var rad = (ring.clientWidth || 250) * 0.62;
      cols.forEach(function(col, i){
        var d = document.createElement('span');
        d.className = 'hero-dot'; d.style.background = col;
        ring.appendChild(d);
        var a = i / cols.length * 2 * Math.PI;
        d.animate([
          { opacity: 1, transform: 'translate(0,0) scale(1)' },
          { opacity: 0, transform: 'translate(' + (Math.cos(a) * rad).toFixed(1) + 'px,' + (Math.sin(a) * rad).toFixed(1) + 'px) scale(.4)' }
        ], { duration: 750, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = function(){ d.remove(); };
      });
    }
  }

  // Tab switch = both pages slide sideways together, like SaviorFit Logger's
  // switchTabWithFade: the page being left is lifted into a "ghost" pane laid
  // over #view and slides out; the new page is drawn into #view and slides in
  // from the other side. #app clips the overflow. The direction follows the
  // tab order (new tab to the right = slide left).
  var TAB_SLIDE_MS = 300, TAB_SLIDE_EASE = 'cubic-bezier(.32,.72,0,1)';
  var tabSlide = null; // { ghost, anims, timer } while a slide is running
  function endTabSlide(){
    if (!tabSlide) return;
    var t = tabSlide; tabSlide = null;
    clearTimeout(t.timer);
    try { t.anims.forEach(function(a){ a.cancel(); }); } catch (e) {}
    if (t.ghost.parentNode) t.ghost.parentNode.removeChild(t.ghost);
  }

  function switchTab(newTab){
    if (newTab === state.tab) return;
    var oldIndex = tabIndexOf(state.tab), newIndex = tabIndexOf(newTab);
    closeScanner(); // safety: release the camera if it was somehow left open
    closeDayOverlay();
    closeFoodSearchOverlay();
    closeAddMealOverlay();
    endTabSlide(); // a tap mid-slide finishes the running one first
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    if (typeof viewEl.animate !== 'function'){
      state.tab = newTab;
      renderApp();
      return;
    }
    var dir = newIndex > oldIndex ? 1 : -1;
    // The 3D pyramid's canvas can't be lifted into a ghost pane, so leaving it
    // is a two-step slide (as in SaviorFit Logger's Insight tab): the live page
    // slides fully out, the new one is drawn while it's out of sight, then
    // slides in from the other side.
    var leaving3D = state.tab === 'insights' && STORE.meals.length > 0;
    if (leaving3D){
      var w = viewEl.getBoundingClientRect().width;
      var outAnim = viewEl.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (-dir * w) + 'px)' }],
        { duration: 150, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
      tabSlide = { ghost: document.createElement('i'), anims: [outAnim], timer: 0 };
      outAnim.onfinish = function(){
        outAnim.onfinish = null;
        state.tab = newTab;
        renderApp();
        viewEl.scrollTop = 0;
        outAnim.cancel();
        var inAnim = viewEl.animate([{ transform: 'translateX(' + (dir * w) + 'px)' }, { transform: 'translateX(0)' }],
          { duration: 220, easing: TAB_SLIDE_EASE, fill: 'both' });
        tabSlide = { ghost: document.createElement('i'), anims: [inAnim], timer: 0 };
        tabSlide.timer = setTimeout(endTabSlide, 250);
      };
      return;
    }
    var appEl = document.getElementById('app');
    var ar = appEl.getBoundingClientRect(), vr = viewEl.getBoundingClientRect();
    var ghost = document.createElement('main');

    ghost.className = viewEl.className + ' view-ghost';
    ghost.setAttribute('aria-hidden', 'true'); ghost.setAttribute('inert', '');
    var oldScroll = viewEl.scrollTop;
    while (viewEl.firstChild) ghost.appendChild(viewEl.firstChild);
    ghost.style.top = (vr.top - ar.top) + 'px'; ghost.style.left = (vr.left - ar.left) + 'px';
    ghost.style.width = vr.width + 'px'; ghost.style.height = vr.height + 'px';
    appEl.appendChild(ghost);
    ghost.scrollTop = oldScroll;

    viewEl.scrollTop = 0;
    state.tab = newTab;
    renderApp(); // draws the new page into the real #view (first #view in the document)
    viewEl.scrollTop = 0;

    var opts = { duration: TAB_SLIDE_MS, easing: TAB_SLIDE_EASE, fill: 'both' };
    var a1 = ghost.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (-dir * vr.width) + 'px)' }], opts);
    var a2 = viewEl.animate([{ transform: 'translateX(' + (dir * vr.width) + 'px)' }, { transform: 'translateX(0)' }], opts);
    tabSlide = { ghost: ghost, anims: [a1, a2], timer: 0 };
    tabSlide.timer = setTimeout(endTabSlide, TAB_SLIDE_MS + 30);
  }


  // Swipe a food row left to delete it (asks first, like the trash used to).
  (function(){
    var row = null, sx = 0, sy = 0, dx = 0, lock = 0;
    document.addEventListener('touchstart', function(e){
      var r = e.target.closest && e.target.closest('.mr-w .meal-row');
      if (!r || e.touches.length !== 1){ row = null; return; }
      row = r; sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; lock = 0; r.style.transition = 'none';
    }, { passive: true });
    document.addEventListener('touchmove', function(e){
      if (!row) return;
      var x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
      if (!lock && (Math.abs(x) > 8 || Math.abs(y) > 8)) lock = Math.abs(x) > Math.abs(y) ? 1 : 2;
      if (lock !== 1) return;
      dx = Math.min(0, x);
      if (row.previousElementSibling) row.previousElementSibling.style.opacity = '1';
      row.style.transform = 'translateX(' + Math.max(dx, -120) + 'px)';
    }, { passive: true });
    function end(){
      if (!row) return;
      var r = row; row = null;
      r.style.transition = 'transform .2s ease'; r.style.transform = '';
      var dl = r.previousElementSibling; if (dl) setTimeout(function(){ dl.style.opacity = ''; }, 220);
      if (lock === 1){
        ui.swipeAt = Date.now();
        if (dx < -90) requestDeleteMeal(r.getAttribute('data-id'));
      }
    }
    document.addEventListener('touchend', end);
    document.addEventListener('touchcancel', end);
  })();

     ========================================================= */
  var deferredInstall = null;
  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

    return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

    return !isStandalone() && (!!deferredInstall || isIOSDevice());

  window.addEventListener('beforeinstallprompt', function(e){

  window.addEventListener('appinstalled', function(){
    deferredInstall = null;
    STORE.appSettings.installDismissed = true;

  function installApp(){
    if (deferredInstall){
      var promptEvent = deferredInstall;
      promptEvent.prompt();
      promptEvent.userChoice.then(function(choice){
        deferredInstall = null;
        if (choice && choice.outcome !== 'accepted'){ STORE.appSettings.installDismissed = true; saveStore(); }
        renderApp();

        '<li>Scroll down and tap <b>Add to Home Screen</b></li>' +

    if (user){
      sync.meta.wasSignedIn = true; syncSaveMeta();
      syncStart(user);
    } else {
      syncStop();
      sync.meta.wasSignedIn = false; syncSaveMeta();
      syncSetStatus('off');
    }
  }

  function syncStop(){
    sync.unsubs.forEach(function(u){ try { u(); } catch (e){} });
    sync.unsubs = [];
    clearTimeout(sync.pushTimer);
  }

  function syncApplyRemoteSettings(rs, keepLocalWater){
    STORE.goals = Object.assign({}, DEFAULT_GOALS, rs.goals || {});
    STORE.profile = Object.assign({}, DEFAULT_PROFILE, rs.profile || {});
    var consent = STORE.appSettings && STORE.appSettings.aiScanConsent;
    STORE.appSettings = Object.assign({}, DEFAULT_APP_SETTINGS, rs.appSettings || {});
    STORE.appSettings.aiScanConsent = !!consent;
    STORE.myFoods = Array.isArray(rs.myFoods) ? rs.myFoods : [];
    var water = Object.assign({}, rs.water || {});
    if (keepLocalWater && STORE.water) Object.keys(STORE.water).forEach(function(k){ water[k] = Math.max(water[k] || 0, STORE.water[k] || 0); });
    STORE.water = water;
    if (rs.lastPlanTdee) STORE.lastPlanTdee = rs.lastPlanTdee;
  }

  // The first sync after sign-in: three-way merge of this phone's log and
  // the cloud's, using what was last confirmed (sync.meta.map) as the base.
  function syncMerge(uid, remoteDoc, remote){
    var foreign = !!(sync.meta.owner && sync.meta.owner !== uid); // this phone's data belongs to another account
    var base = foreign ? {} : sync.meta.map;
    var local = {}; if (!foreign) STORE.meals.forEach(function(m){ local[m.id] = m; });
    var ids = {}; Object.keys(local).forEach(function(i){ ids[i] = 1; }); Object.keys(remote).forEach(function(i){ ids[i] = 1; });
    var out = [], newMap = {};
    Object.keys(ids).forEach(function(id){
      var L = local[id], R = remote[id], b = base[id];
      var hl = L ? syncMealHash(L) : null, hr = R ? syncMealHash(R) : null;
      if (L && R){
        if (hl === hr){ out.push(L); newMap[id] = hr; }
        else if (hl === b){ var r2 = Object.assign({}, R); if (L.photoId) r2.photoId = L.photoId; out.push(r2); newMap[id] = hr; } // only the cloud changed
        else { out.push(L); newMap[id] = hr; }                                                                  // this phone changed: it pushes
      } else if (L){
        if (b !== undefined && hl === b){ /* deleted elsewhere, unchanged here: drop */ }
        else { out.push(L); }                                                                                  // new here (or edited after a delete): pushes
      } else if (R){
        if (b !== undefined && hr === b){ newMap[id] = hr; }                                                   // deleted here: the diff deletes it in the cloud
        else { out.push(R); newMap[id] = hr; }
      }
    });
    out.sort(function(x, y){ return x.loggedAt - y.loggedAt; });
    STORE.meals = out;

    var localHash = syncSettingsHash();
    if (!remoteDoc){
      if (foreign){ STORE.goals = Object.assign({}, DEFAULT_GOALS); STORE.profile = Object.assign({}, DEFAULT_PROFILE); STORE.myFoods = []; STORE.water = {}; }
      sync.meta.settingsHash = ''; sync.meta.settingsAt = 0;                                                    // nothing in the cloud yet: push ours
    } else if (foreign || !sync.meta.owner){
      syncApplyRemoteSettings(remoteDoc, !foreign);                                                             // the account is the source of truth
      sync.meta.settingsHash = syncSettingsHash(); sync.meta.settingsAt = remoteDoc.updatedAt || 0;
    } else if (localHash !== sync.meta.settingsHash){
      /* edited on this phone since last sync: it pushes */
    } else if ((remoteDoc.updatedAt || 0) > (sync.meta.settingsAt || 0)){
      syncApplyRemoteSettings(remoteDoc, false);
      sync.meta.settingsHash = syncSettingsHash(); sync.meta.settingsAt = remoteDoc.updatedAt || 0;
    }
    sync.meta.owner = uid;
    sync.meta.map = newMap;
    syncSaveMeta();
    syncSaveApplied();
  }

  function syncSaveApplied(){
    sync.applying = true;
    try { saveStore(); } finally { sync.applying = false; }
    applyAppearanceSettings();
    if (STORE.appSettings.welcomed) closeWelcome();
    renderApp();
  }

  function syncStart(user){
    syncStop();
    sync.status = 'syncing'; syncUiRefresh();
    var F = sync.fb.F, db = sync.db, uid = user.uid;
    var userRef = F.doc(db, 'users', uid), mealsCol = F.collection(db, 'users', uid, 'meals');
    return Promise.all([F.getDoc(userRef), F.getDocs(mealsCol)]).then(function(res){
      if (!sync.user || sync.user.uid !== uid) return;
      var remote = {};
      res[1].forEach(function(d){ var m = sanitizeMeal(Object.assign({}, d.data(), { id: d.id })); if (m) remote[m.id] = m; });
      syncMerge(uid, res[0].exists() ? res[0].data() : null, remote);
      return syncFlush(true).then(function(){ syncListen(uid, userRef, mealsCol); });
    }).catch(function(e){
      console.error('SaviorFuel sync start failed', e);
      sync.status = (navigator.onLine === false || (e && e.code === 'unavailable')) ? 'offline' : 'error';
      syncUiRefresh();
    });
  }

  function syncListen(uid, userRef, mealsCol){
    var F = sync.fb.F;
    sync.unsubs.push(F.onSnapshot(mealsCol, function(snap){
      var changed = false;
      snap.docChanges().forEach(function(ch){
        if (ch.doc.metadata.hasPendingWrites) return; // our own write coming back
        var id = ch.doc.id, i = -1;
        for (var k = 0; k < STORE.meals.length; k++) if (STORE.meals[k].id === id){ i = k; break; }
        if (ch.type === 'removed'){
          if (i > -1){ STORE.meals.splice(i, 1); changed = true; }
          delete sync.meta.map[id];
        } else {
          var m = sanitizeMeal(Object.assign({}, ch.doc.data(), { id: id }));
          if (!m) return;
          var h = syncMealHash(m);
          if (i > -1){
            if (syncMealHash(STORE.meals[i]) !== h){
              if (sync.meta.map[id] === undefined || syncMealHash(STORE.meals[i]) === sync.meta.map[id]){
                if (STORE.meals[i].photoId) m.photoId = STORE.meals[i].photoId;
                STORE.meals[i] = m; changed = true; sync.meta.map[id] = h;
              }
            } else sync.meta.map[id] = h;
          } else {
            STORE.meals.push(m); changed = true; sync.meta.map[id] = h;
          }
        }
      });
      if (changed){ syncSaveMeta(); syncRemoteApplied(); }
    }, function(e){ console.error('SaviorFuel meals listener', e); }));
    sync.unsubs.push(F.onSnapshot(userRef, function(d){
      if (d.metadata.hasPendingWrites || !d.exists()) return;
      var rs = d.data();
      if ((rs.updatedAt || 0) <= (sync.meta.settingsAt || 0)) return;
      if (syncSettingsHash() !== sync.meta.settingsHash) return; // unsent local edits win
      syncApplyRemoteSettings(rs, true);
      sync.meta.settingsHash = syncSettingsHash(); sync.meta.settingsAt = rs.updatedAt || 0;
      syncSaveMeta(); syncRemoteApplied();
    }, function(e){ console.error('SaviorFuel settings listener', e); }));
  }

  function syncRemoteApplied(){
    sync.applying = true;
    try { saveStore(); } finally { sync.applying = false; }
    applyAppearanceSettings();
    clearTimeout(sync.renderTimer);
    sync.renderTimer = setTimeout(function(){ renderApp(); }, 250);
  }

  function syncSchedule(){
    if (!sync.user || sync.applying) return;
    clearTimeout(sync.pushTimer);
    sync.pushTimer = setTimeout(function(){ syncFlush(false); }, 1500);
  }

  // Push whatever differs from what the cloud last confirmed.
  function syncFlush(){
    if (!sync.user || !sync.db || !sync.fb || sync.applying) return Promise.resolve();
    if (sync.pushing){ sync.again = true; return Promise.resolve(); }
    var F = sync.fb.F, db = sync.db, uid = sync.user.uid;
    var map = sync.meta.map, cur = {};
    STORE.meals.forEach(function(m){ cur[m.id] = syncMealHash(m); });
    var upserts = STORE.meals.filter(function(m){ return map[m.id] !== cur[m.id]; });
    var removed = Object.keys(map).filter(function(id){ return !(id in cur); });
    var sOut = syncSettingsOut(), sHash = syncH(syncStable(sOut));
    var sChanged = sHash !== sync.meta.settingsHash;
    if (!upserts.length && !removed.length && !sChanged){
      sync.status = 'synced'; syncUiRefresh();
      return Promise.resolve();
    }
    var now = Date.now(), ops = [];
    if (sChanged) ops.push(function(b){ b.set(F.doc(db, 'users', uid), Object.assign({}, sOut, { updatedAt: now })); });
    upserts.forEach(function(m){ ops.push(function(b){ b.set(F.doc(db, 'users', uid, 'meals', m.id), syncMealOut(m)); }); });
    removed.forEach(function(id){ ops.push(function(b){ b.delete(F.doc(db, 'users', uid, 'meals', id)); }); });
    sync.pushing = true;
    sync.status = (navigator.onLine === false) ? 'offline' : 'syncing'; syncUiRefresh();
    var p = Promise.resolve();
    for (var i = 0; i < ops.length; i += 400){
      (function(chunk){
        p = p.then(function(){ var b = F.writeBatch(db); chunk.forEach(function(op){ op(b); }); return b.commit(); });
      })(ops.slice(i, i + 400));
    }
    return p.then(function(){
      upserts.forEach(function(m){ sync.meta.map[m.id] = cur[m.id]; });
      removed.forEach(function(id){ delete sync.meta.map[id]; });
      if (sChanged){ sync.meta.settingsHash = sHash; sync.meta.settingsAt = now; }
      sync.meta.lastAt = Date.now();
      syncSaveMeta();
      sync.status = 'synced';
    }).catch(function(e){
      console.error('SaviorFuel sync push failed', e);
      sync.status = (navigator.onLine === false || (e && e.code === 'unavailable')) ? 'offline' : 'error';
    }).then(function(){
      sync.pushing = false;
      syncUiRefresh();
      if (sync.again){ sync.again = false; syncSchedule(); }
    });
  }

  window.addEventListener('online', function(){ if (sync.user) syncFlush(); });
  window.addEventListener('offline', function(){ if (sync.user) syncSetStatus('offline'); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && sync.user) syncFlush(); });

  function syncAuthMessage(err){
    var code = err && err.code;
    switch (code){
      case 'sync/not-configured': return 'Sign-in isn’t switched on yet.';
      case 'auth/email-already-in-use': return 'That email already has an account. Try signing in.';
      case 'auth/invalid-email': return 'Enter a valid email address.';
      case 'auth/missing-password': return 'Enter your password.';
      case 'auth/weak-password': return 'Password must be at least 6 characters.';
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return 'Incorrect email or password.';
      case 'auth/too-many-requests': return 'Too many tries. Wait a bit and try again.';
      case 'auth/network-request-failed': return 'No connection. Check your internet and try again.';
      case 'auth/operation-not-allowed': return 'This sign-in method isn’t switched on in Firebase yet.';
      case 'auth/popup-blocked': return 'Your browser blocked the Google window. Allow popups and try again.';
      case 'auth/unauthorized-domain': return 'This website isn’t approved in Firebase yet.';
      case 'auth/popup-closed-by-user':
      case 'auth/cancelled-popup-request': return '';
      default: return 'Something went wrong (' + (code || 'unknown') + '). Try again.';
    }
  }

  function syncGoogle(){
    return syncLoad().then(function(){
      return sync.fb.Au.signInWithPopup(sync.auth, new sync.fb.Au.GoogleAuthProvider());
    });
  }
  function syncEmail(mode, email, pw){
    return syncLoad().then(function(){
      return mode === 'up' ? sync.fb.Au.createUserWithEmailAndPassword(sync.auth, email, pw)
                           : sync.fb.Au.signInWithEmailAndPassword(sync.auth, email, pw);
    });
  }
  function syncReset(email){
    return syncLoad().then(function(){ return sync.fb.Au.sendPasswordResetEmail(sync.auth, email); });
  }
  function syncSignOut(){
    return (sync.fb ? sync.fb.Au.signOut(sync.auth) : Promise.resolve()).then(function(){
      sync.user = null; syncStop(); sync.status = 'off';
    });
  }

  // Deletes the cloud copy (every meal, the settings doc) and the account
  // itself. The log on this phone stays.
  function syncDeleteAccount(){
    var user = sync.user, F = sync.fb.F, Au = sync.fb.Au, db = sync.db, uid = user.uid;
    var google = (user.providerData || []).some(function(p){ return p.providerId === 'google.com'; });
    var reauth;
    if (google) reauth = Au.reauthenticateWithPopup(user, new Au.GoogleAuthProvider());
    else {
      var pw = window.prompt('Enter your password to delete your account:');
      if (pw === null) return Promise.reject({ code: 'auth/cancelled-popup-request' });
      reauth = Au.reauthenticateWithCredential(user, Au.EmailAuthProvider.credential(user.email, pw));
    }
    return reauth.then(function(){
      syncStop();
      return F.getDocs(F.collection(db, 'users', uid, 'meals'));
    }).then(function(snap){
      var docs = []; snap.forEach(function(d){ docs.push(d.ref); });
      var p = Promise.resolve();
      for (var i = 0; i < docs.length; i += 400){
        (function(chunk){ p = p.then(function(){ var b = F.writeBatch(db); chunk.forEach(function(r){ b.delete(r); }); return b.commit(); }); })(docs.slice(i, i + 400));
      }
      return p;
    }).then(function(){
      return F.deleteDoc(F.doc(db, 'users', uid));
    }).then(function(){
      return Au.deleteUser(user);
    }).then(function(){
      sync.user = null; sync.meta = syncFreshMeta(); syncSaveMeta(); sync.status = 'off';
    });
  }

  function renderSignIn(view, first){
    var card = document.querySelector('#signInOverlay .signin-card');

  function openSignIn(first){
    if (document.getElementById('signInOverlay')) return;

    document.querySelectorAll('#signInOverlay .signin-btn').forEach(function(b){ b.disabled = !!on; });

  function signInSubmit(){
    var email = (document.getElementById('siEmail').value || '').trim();
    var pw = document.getElementById('siPass').value || '';

    if (!pw){ signInMsg('Enter your password.', true); return; }
    signInBusy(true); signInMsg('One moment…');

      signInBusy(false); signInMsg(syncAuthMessage(err), true);

  document.addEventListener('click', function(e){
    var b = e.target.closest('#signInOverlay [data-si], #signInOverlay [data-action="close-sign-in"]');

    if (b.getAttribute('data-action') === 'close-sign-in'){ closeSignIn(); return; }
    var what = b.getAttribute('data-si');
    var first = !!(document.querySelector('#signInOverlay .signin-card') || {}).dataset && document.querySelector('#signInOverlay .signin-card').dataset.first === '1';

      if (!syncEnabled()){ signInMsg('Sign-in isn’t switched on yet. Your log is saved on this phone for now.'); return; }
      signInBusy(true); signInMsg('Opening Google…');
      syncGoogle().then(signInDone).catch(function(err){ signInBusy(false); signInMsg(syncAuthMessage(err), true); });
    } else if (what === 'email'){
      if (!syncEnabled()){ signInMsg('Sign-in isn’t switched on yet. Your log is saved on this phone for now.'); return; }

        .catch(function(err){ signInBusy(false); signInMsg(syncAuthMessage(err), true); });
    }
  });
