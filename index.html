<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>SaviorFuel — Food Tracker</title>
<meta name="description" content="Log your meals and macros. A free food tracker by Savior, built to pair with SaviorFit Logger.">
<link rel="icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaviorFuel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN SYSTEM — copied 1:1 from SaviorFit Logger (IronLedger
     repo) so SaviorFuel matches it visually out of the box. Keep
     these tokens in sync by hand if the Logger's palette ever
     changes; there's no shared stylesheet between the two repos.
     ========================================================= */
  :root{
    --bg:#14161a;
    --panel:#1c1f24;
    --panel-2:#242830;
    --panel-3:#2a2f38;
    --line:#2e333b;
    --text:#e9e6df;
    --text-dim:#8b9098;
    --text-faint:#82878f;
    --accent:#f2b134;
    --accent-dim:#7a6224;
    --accent-rgb:242,177,52;
    --accent-2:#c1443c;
    --accent-2-dim:#4a2321;
    --success:#5fb86a;
    --success-dim:#233821;
    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --radius-xl:20px;
    --radius-pill:999px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;}
  button:active, [data-action]:active{
    filter:brightness(1.2);
    transition:filter 70ms ease-out;
  }
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }

  /* ---------- Topbar (same structure/classes as SaviorFit Logger) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(16,18,21,0.72);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .topbar h1 span{color:var(--accent);}

  /* ---------- Main content area ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 16px calc(90px + var(--safe-bottom));
  }

  /* Every tab except Log needs the top inset #view no longer provides
     itself (removed so the Log tab's sticky header can sit flush at
     the very top with no margin math). Excludes the sticky card,
     which should stay flush. */
  #view > *:first-child:not(.macro-summary-card){
    margin-top:16px;
  }

  /* Fade+shift tab transition — same treatment as SaviorFit Logger's
     switchTabWithFade, so switching tabs feels identical across both
     apps. See switchTab() below. */
  #view.subtab-fade-out{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 140ms ease, transform 140ms ease;
  }
  #view.subtab-fade-in{
    opacity:1;
    transform:translateY(0);
    transition:opacity 160ms ease, transform 160ms ease;
  }

  /* ---------- Bottom tab bar (same classes as SaviorFit Logger) ---------- */
  .tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
  }
  .tabbar button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:10px 4px 8px;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--accent);}
  .tab-glyph svg{width:22px;height:22px;}

  /* ---------- Empty state (same pattern as SaviorFit Logger) ---------- */
  .empty.tab-empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--text-dim);
    padding:60px 24px;
    gap:14px;
  }
  .empty .glyph{
    width:48px;height:48px;
    color:var(--text-faint);
  }
  .empty p{margin:0;font-size:14px;line-height:1.5;}

  /* ---------- Cards (same pattern as SaviorFit Logger) ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px 14px 12px;
    margin-bottom:14px;
  }

  /* ---------- Buttons (same pattern as SaviorFit Logger) ---------- */
  .btn-primary{
    display:block;
    width:100%;
    background:var(--accent);
    color:#1c1500;
    border:none;
    border-radius:var(--radius-xl);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px;
    cursor:pointer;
  }

  /* ---------- Macro summary + bars ---------- */
  .macro-summary-card{
    margin:0 -16px 20px;
    padding:10px 16px 8px;
    border-radius:0;
    border-left:none;
    border-right:none;
    border-top:none;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .macro-cal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .macro-cal-row .num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
  .macro-cal-row .num span{font-size:14px;font-weight:500;color:var(--text-faint);}
  .macro-bar-row{margin-bottom:7px;}
  .macro-bar-row:last-child{margin-bottom:0;}
  .macro-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .macro-bar-label b{color:var(--text);}
  .macro-bar-track{height:6px;border-radius:var(--radius-pill);background:var(--panel-3);overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);}
  .macro-bar-fill.protein{background:var(--success);}
  .macro-bar-fill.carbs{background:#5fa8d6;}
  .macro-bar-fill.fat{background:var(--accent-2);}

  /* ---------- Quick-add meal form ---------- */
  .add-meal-card .field-row{display:flex;gap:8px;margin-bottom:8px;}

  /* Brief glow on the add-meal card right after a food gets picked
     from search/scan — confirms the fill worked without needing a
     toast or alert. Class is only present for the one render right
     after picking (see ui.justFilledFood), so it plays once. */
  @keyframes addMealGlow{
    0%{ box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.55), 0 0 18px 2px rgba(var(--accent-rgb),0.35); border-color:var(--accent); }
    100%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),0); border-color:var(--line); }
  }
  .add-meal-card.glow-once{
    animation:addMealGlow 900ms ease-out;
  }
  .add-meal-card input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
  }
  .add-meal-card input:focus{outline:none;border-color:var(--accent);}
  .add-meal-card input::placeholder{color:var(--text-faint);}

  /* ---------- Meal list rows ---------- */
  .meal-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .meal-row:last-child{border-bottom:none;}
  .meal-row-name{font-size:14px;color:var(--text);flex:1;min-width:0;}
  .meal-row-macros{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .meal-row-cal{font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);white-space:nowrap;}
  .meal-row-del{
    background:none;border:none;color:var(--text-faint);
    font-size:18px;line-height:1;padding:4px 6px;cursor:pointer;
  }

  /* ---------- History day groups ---------- */
  .history-day-card .history-day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .history-day-head .date{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--text);}
  .history-day-head .total{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);}

  /* ---------- Insights bars ---------- */
  .insight-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .insight-bar-day{width:34px;font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .insight-bar-track{flex:1;height:16px;background:var(--panel-3);border-radius:var(--radius-xs);overflow:hidden;}
  .insight-bar-fill{height:100%;background:var(--accent);border-radius:var(--radius-xs);}
  .insight-bar-val{width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);flex-shrink:0;}

  /* ---------- Settings ---------- */
  .settings-group{margin-bottom:18px;}
  .settings-group h3{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);
    margin:0 0 10px;
  }
  .settings-goal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .settings-goal-row label{font-size:13px;color:var(--text-dim);}
  .settings-goal-row input{
    width:80px;text-align:right;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 8px;
  }
  .settings-goal-row input:focus{outline:none;border-color:var(--accent);}
  .settings-goal-row select{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 8px;
    max-width:150px;
  }
  .settings-goal-row select:focus{outline:none;border-color:var(--accent);}
  .plan-result-banner{
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--text-dim);
  }
  .plan-result-banner b{color:var(--accent);}
  .btn-danger{
    display:block;width:100%;background:none;border:1px solid var(--accent-2);
    color:var(--accent-2);border-radius:var(--radius-xl);font-family:'Oswald',sans-serif;
    font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:12px;cursor:pointer;
  }

  /* ---------- Selected-food banner (shown in the add-meal card
     once a search/scan result has been picked) ---------- */
  .selected-food-banner{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--text-dim);
  }
  .selected-food-banner b{color:var(--text);}
  .selected-food-banner .grams-input{
    width:60px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius-xs);color:var(--text);font-family:'JetBrains Mono',monospace;
    font-size:12px;padding:5px 6px;text-align:center;
  }

  /* ---------- Barcode scanner overlay ---------- */
  .scan-overlay{
    position:fixed;inset:0;background:#000;z-index:999;
    display:flex;flex-direction:column;
  }
  .scan-overlay video{flex:1;width:100%;object-fit:cover;}
  .scan-overlay-status{
    position:absolute;top:calc(18px + var(--safe-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:13px;padding:0 20px;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  .scan-overlay-frame{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:80%;max-width:320px;aspect-ratio:2/1;
    border:2px solid var(--accent);border-radius:var(--radius-md);
    box-shadow:0 0 0 2000px rgba(0,0,0,0.4);
  }
  .scan-overlay-cancel{
    position:absolute;bottom:calc(30px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius-pill);font-family:'Oswald',sans-serif;font-size:13px;
    font-weight:700;letter-spacing:0.03em;text-transform:uppercase;padding:12px 28px;cursor:pointer;
  }

  /* ---------- Settings — same structural classes as SaviorFit Logger ---------- */
  .section-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:22px 0 8px;
  }
  .section-label:first-child{margin-top:0;}
  .settings-group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 14px;
    margin-bottom:16px;
  }
  .settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 0;
    border-top:1px solid var(--line);
    gap:12px;
  }
  .settings-row:first-child{border-top:none;}
  .settings-row .sr-label{font-size:14px;color:var(--text);font-weight:600;}
  .settings-row .sr-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;line-height:1.4;}
  .settings-row .sr-action{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--accent);
    border-radius:var(--radius-sm);
    padding:8px 14px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    flex-shrink:0;
  }
  .settings-row .sr-action-danger{color:var(--accent-2);border-color:var(--accent-2-dim);}
  .settings-row .seg{display:flex;background:var(--panel-2);border-radius:var(--radius-sm);padding:3px;flex-shrink:0;}
  .settings-row .seg button{
    background:none;border:none;color:var(--text-faint);
    padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;cursor:pointer;
    font-family:'JetBrains Mono',monospace;
  }
  .settings-row .seg button.active{background:var(--accent);color:#1c1500;}
  .settings-version{text-align:center;color:var(--text-faint);font-size:11px;padding:16px 0 4px;letter-spacing:0.02em;}
  .danger-zone-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .danger-zone-toggle .dz-chevron{font-size:10px;color:var(--text-faint);transition:transform 0.15s ease;}
  .danger-zone-toggle.open .dz-chevron{transform:rotate(180deg);}

  /* ---------- Density + corner-style overrides (Appearance settings) ---------- */
  body[data-density="compact"] .meal-row{padding:6px 0;}
  body[data-density="compact"] .card{padding:10px 10px 8px;}
  body[data-corners="sharp"]{
    --radius-xs:2px; --radius-sm:2px; --radius:2px;
    --radius-md:2px; --radius-lg:2px; --radius-xl:2px; --radius-pill:2px;
  }

  /* ---------- Food search overlay — same structure/animation as
     SaviorFit Logger's exercise search overlay ---------- */
  .food-search-overlay{
    position:absolute;
    inset:0;
    z-index:92;
    background:rgba(14,16,19,0.82);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    animation:foodSearchBackdropIn 0.22s ease;
  }
  .food-search-overlay.hidden{display:none;}
  .food-search-overlay-panel{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:foodSearchPanelIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .food-search-overlay-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(18px + var(--safe-bottom)) 16px 12px;
    flex-shrink:0;
  }
  .food-search-back, .food-search-scan-btn{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:none;
    background:var(--panel-3);color:var(--text);cursor:pointer;padding:0;
  }
  .food-search-back svg, .food-search-scan-btn svg{display:block;width:18px;height:18px;}
  .food-search-back:active, .food-search-scan-btn:active{background:var(--panel-2);transform:scale(0.94);}
  .food-search-overlay-input{
    flex:1;min-width:0;
    background:var(--panel-2);
    border:1.5px solid var(--accent-dim);
    color:var(--text);
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .food-search-overlay-input:focus{outline:none;border-color:var(--accent);}
  .food-suggest-list{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 16px calc(20px + var(--safe-bottom));
    display:flex;flex-direction:column;gap:8px;
  }
  .food-suggest-item{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    text-align:left;background:var(--panel-3);border:1px solid var(--line);color:var(--text);
    font-size:13.5px;font-family:'Inter',sans-serif;font-weight:500;
    padding:13px 14px;border-radius:var(--radius);cursor:pointer;
  }
  .food-suggest-item:active{background:var(--panel);border-color:var(--accent-dim);}
  .food-suggest-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .food-suggest-name .brand{display:block;font-size:11px;color:var(--text-faint);}
  .food-suggest-tag{
    flex-shrink:0;background:var(--panel);color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius);
  }
  .food-suggest-status{font-size:12px;color:var(--text-faint);padding:8px 4px;}

  /* Trigger button that opens the overlay, replacing the old inline box */
  .food-search-trigger{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius-lg);color:var(--text-dim);font-size:14px;
    padding:12px 14px;cursor:pointer;margin:10px 0 0;
  }
  .food-search-trigger svg{width:18px;height:18px;flex-shrink:0;color:var(--text-faint);}

  @keyframes foodSearchBackdropIn{ 0%{opacity:0;} 100%{opacity:1;} }
  @keyframes foodSearchPanelIn{ 0%{opacity:0;transform:translateY(28px);} 100%{opacity:1;transform:translateY(0);} }

  .hidden{display:none !important;}

  .boot-loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .boot-loading-mark{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .boot-loading-mark span{color:var(--accent);}
</style>
</head>
<body>

<div id="bootLoading" class="boot-loading"><div class="boot-loading-mark">SAVIOR<span>FUEL</span></div></div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1>SAVIOR<span>FUEL</span></h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-action="set-tab" data-tab="log" class="active">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="4" width="4" height="16" rx="1.3"/><rect x="19" y="4" width="4" height="16" rx="1.3"/><rect x="5" y="10.4" width="14" height="3.2" rx="1"/></svg></span>
      Log
    </button>
    <button data-action="set-tab" data-tab="history">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="16" width="12" height="3" rx="1"/></svg></span>
      History
    </button>
    <button data-action="set-tab" data-tab="insights">

<script>
  // =========================================================
  // SAVIORFUEL — local-state working version
  // Visual shell copied from SaviorFit Logger. Data layer here
  // is 100% local (in-memory + localStorage) — no Firebase, no
  // auth, no sync across devices yet. That's intentional: this
  // is meant to prove out the actual product before wiring up a
  // backend. Data model (meal shape, settings shape) is written
  // to already look like what would eventually go in Firestore,
  // so swapping in real persistence later is mostly mechanical.
  //
  // Storage key: everything lives under one localStorage key,
  // 'saviorfuel_local_v1'. Bump the version suffix if the shape
  // of STORE ever changes in a way that would break old data.
  // =========================================================

  var STORAGE_KEY = 'saviorfuel_local_v1';

  var DEFAULT_GOALS = { calories: 2000, protein: 150, carbs: 200, fat: 65 };
  var DEFAULT_PROFILE = { sex: 'male', age: 25, heightCm: 170, weightKg: 70, activityLevel: 'moderate', goal: 'maintain' };
  var DEFAULT_APP_SETTINGS = { unit: 'metric', haptic: true, density: 'comfortable', corners: 'rounded' };
  var APP_VERSION = '0.1.0';

  function cmToIn(cm){ return cm / 2.54; }
  function inToCm(inches){ return inches * 2.54; }
  function kgToLb(kg){ return kg * 2.20462; }
  function lbToKg(lb){ return lb / 2.20462; }

  var ACTIVITY_LEVELS = [
    { id: 'sedentary', label: 'Sedentary (little/no exercise)', mult: 1.2 },
    { id: 'light', label: 'Light (1-3 days/week)', mult: 1.375 },
    { id: 'moderate', label: 'Moderate (3-5 days/week)', mult: 1.55 },
    { id: 'active', label: 'Very active (6-7 days/week)', mult: 1.725 },
    { id: 'extra', label: 'Extra active (physical job + training)', mult: 1.9 }
  ];
  var GOAL_OPTIONS = [
    { id: 'lose', label: 'Lose weight', calAdjust: -500 },
    { id: 'maintain', label: 'Maintain', calAdjust: 0 },
    { id: 'gain', label: 'Build muscle', calAdjust: 300 }
  ];

  var STORE = loadStore();
  var state = { tab: 'log' };
  var ui = {
    historyOpenDay: null,
    selectedFood: null,   // { name, brand, per100g: {cal,protein,carbs,fat} } once a search result is tapped
    grams: 100,            // serving size in grams, scales the selected food's macros
    prefillName: null, prefillCal: null, prefillProtein: null, prefillCarbs: null, prefillFat: null,
    searchDebounce: null,
    dangerZoneOpen: false,
    justFilledFood: false
  };

  function loadStore(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS) };
      var parsed = JSON.parse(raw);
      if (!parsed.goals) parsed.goals = Object.assign({}, DEFAULT_GOALS);
      if (!parsed.meals) parsed.meals = [];
      if (!parsed.profile) parsed.profile = Object.assign({}, DEFAULT_PROFILE);
      if (!parsed.appSettings) parsed.appSettings = Object.assign({}, DEFAULT_APP_SETTINGS);
      return parsed;
    } catch (e){
      console.error('SaviorFuel: failed to load local store, starting fresh —', e);
      return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS) };
    }
  }

  function saveStore(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
    } catch (e){
      console.error('SaviorFuel: failed to save local store —', e);
    }
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function dateKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayKey(){ return dateKey(Date.now()); }

  function formatDateLabel(key){
    var today = todayKey();
    var yesterday = dateKey(Date.now() - 86400000);
    if (key === today) return 'Today';
    if (key === yesterday) return 'Yesterday';
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mealsForDay(key){
    return STORE.meals.filter(function(m){ return dateKey(m.loggedAt) === key; });
  }

  function totalsFor(meals){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    meals.forEach(function(m){
      t.calories += m.calories || 0;
      t.protein += m.protein || 0;
      t.carbs += m.carbs || 0;
      t.fat += m.fat || 0;
    });
    return t;
  }

  function pct(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.min(100, Math.round((value / goal) * 100)));
  }

  /* =========================================================
     RENDER — LOG TAB
     ========================================================= */
  function renderLog(){
    var todayMeals = mealsForDay(todayKey()).sort(function(a,b){ return b.loggedAt - a.loggedAt; });
    var totals = totalsFor(todayMeals);
    var g = STORE.goals;

    var html = '<div class="card macro-summary-card">' +
      '<div class="macro-cal-row"><div class="num">' + totals.calories + ' <span>/ ' + g.calories + ' kcal</span></div></div>' +
      macroBarHtml('Protein', totals.protein, g.protein, 'protein') +
      macroBarHtml('Carbs', totals.carbs, g.carbs, 'carbs') +
      macroBarHtml('Fat', totals.fat, g.fat, 'fat') +
      '<button class="food-search-trigger" data-action="open-food-search-overlay">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>' +
        'Search or scan a food...' +
      '</button>' +
    '</div>';

    var glowClass = ui.justFilledFood ? ' glow-once' : '';
    ui.justFilledFood = false; // one-shot: only the render right after a pick gets the animation

    html += '<div class="card add-meal-card' + glowClass + '">' +
      (ui.selectedFood ? selectedFoodBannerHtml() : '') +
      '<div class="field-row"><input type="text" id="mealName" placeholder="Meal name" value="' + esc(ui.prefillName || '') + '"></div>' +
      '<div class="field-row">' +
        '<input type="number" inputmode="numeric" id="mealCal" placeholder="kcal" value="' + (ui.prefillCal != null ? ui.prefillCal : '') + '">' +
        '<input type="number" inputmode="numeric" id="mealProtein" placeholder="protein g" value="' + (ui.prefillProtein != null ? ui.prefillProtein : '') + '">' +
      '</div>' +
      '<div class="field-row">' +
        '<input type="number" inputmode="numeric" id="mealCarbs" placeholder="carbs g" value="' + (ui.prefillCarbs != null ? ui.prefillCarbs : '') + '">' +
        '<input type="number" inputmode="numeric" id="mealFat" placeholder="fat g" value="' + (ui.prefillFat != null ? ui.prefillFat : '') + '">' +
      '</div>' +
      '<button class="btn-primary" data-action="add-meal">+ Add Meal</button>' +
    '</div>';

    if (todayMeals.length === 0){
      html += '<div class="empty tab-empty-state"><div class="glyph">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
        '</svg></div><p>Nothing logged yet today.<br>Add your first meal above.</p></div>';
    } else {
      html += '<div class="card">' + todayMeals.map(mealRowHtml).join('') + '</div>';
    }

    document.getElementById('view').innerHTML = html;
  }

  function macroBarHtml(label, value, goal, cls){
    return '<div class="macro-bar-row">' +
      '<div class="macro-bar-label"><span>' + label + '</span><b>' + Math.round(value) + 'g / ' + goal + 'g</b></div>' +
      '<div class="macro-bar-track"><div class="macro-bar-fill ' + cls + '" style="width:' + pct(value, goal) + '%"></div></div>' +
    '</div>';
  }

  function mealRowHtml(m){
    return '<div class="meal-row">' +
      '<div class="meal-row-name">' + esc(m.name) +
        '<div class="meal-row-macros">P' + (m.protein||0) + ' · C' + (m.carbs||0) + ' · F' + (m.fat||0) + '</div>' +
      '</div>' +
      '<div class="meal-row-cal">' + m.calories + '</div>' +
      '<button class="meal-row-del" data-action="delete-meal" data-id="' + m.id + '" aria-label="Delete">&times;</button>' +
    '</div>';
  }

  function selectedFoodBannerHtml(){
    var f = ui.selectedFood;
    if (f.wholeServing){
      return '<div class="selected-food-banner">' +
        '<span>From Kalori: <b>' + esc(f.name) + '</b> — ' + esc(f.servingLabel || '1 serving') + '</span>' +
      '</div>';
    }
    return '<div class="selected-food-banner">' +
      '<span>From search: <b>' + esc(f.name) + '</b>' + (f.brand ? ' (' + esc(f.brand) + ')' : '') + '</span>' +
      '<span>' +
        '<input type="number" class="grams-input" id="foodGrams" value="' + ui.grams + '" data-action-change="rescale-food"> g' +
      '</span>' +
    '</div>';
  }

  /* =========================================================
     FOOD SEARCH — Open Food Facts (free, no API key required)
     https://world.openfoodfacts.org
     ========================================================= */
  function openFoodSearchOverlay(){
    var overlay = document.getElementById('foodSearchOverlay');
    var input = document.getElementById('foodSearchInput');
    document.getElementById('foodSearchResults').innerHTML = '';
    input.value = '';
    overlay.classList.remove('hidden');
    input.focus();
  }

  function closeFoodSearchOverlay(){
    document.getElementById('foodSearchOverlay').classList.add('hidden');
  }

  function searchFoodDebounced(query){
    clearTimeout(ui.searchDebounce);
    if (!query || query.trim().length < 2){
      var resultsEl = document.getElementById('foodSearchResults');
      if (resultsEl) resultsEl.innerHTML = '';
      return;
    }
    // Shorter debounce than you might expect for a network call — paired
    // with not blanking the list below, this is the closest a remote
    // search can feel to SaviorFit Logger's instant local exercise search.
    ui.searchDebounce = setTimeout(function(){ runFoodSearch(query.trim()); }, 250);
  }

  var searchRequestId = 0; // guards against a slow older request overwriting a newer one's results
  var USDA_API_KEY = 'DcPJpdzm8AjRDIpzmzfL3fJavbtVWsAY6bGtEQYi';

  var TECHAPI_KEY = 'tech_2f095b353334f3552fb2356065ca43bd9fe42e2e584fc76cda30555e984fb40c';

  // Kalori (via techapi.my) — Malaysian food database. Response envelope
  // is {success, data, meta}; exact nesting of the food list inside
  // `data` wasn't confirmed from docs, so this checks a few reasonable
  // shapes defensively rather than assuming one and silently returning
  // nothing if it's wrong.
  function fetchKalori(query){
    var url = 'https://api.techapi.my/api/v2/kalori/foods/search?q=' + encodeURIComponent(query);
    return fetch(url, { headers: { 'X-API-Key': TECHAPI_KEY } })
      .then(function(res){ return res.json(); })
      .then(function(json){
        if (!json || json.success === false) return [];
        var d = json.data;
        var list = Array.isArray(d) ? d
          : (d && (d.foods || d.results || d.items)) || [];
        return list
          .filter(function(f){ return f && f.name && f.calories != null; })
          .map(function(f){
            return {
              product_name: f.name,
              brands: f.category || '',
              nutriments: {
                'energy-kcal_100g': f.calories,
                'proteins_100g': f.protein || 0,
                'carbohydrates_100g': f.carbs || 0,
                'fat_100g': f.fat || 0
              },
              _source: 'techapi',
              _serving: f.serving || null
            };
          });
      })
      .catch(function(err){
        console.error('SaviorFuel: Kalori (techapi.my) search failed —', err);
        return [];
      });
  }

  // Normalizes a USDA FoodData Central food into the same shape as an
  // Open Food Facts product, so the rest of the search/pick pipeline
  // (pickFoodResult, applySelectedFoodToForm) doesn't need to know or
  // care which source a result came from.
  function usdaToProductShape(food){
    var n = {};
    (food.foodNutrients || []).forEach(function(fn){
      if (fn.nutrientName === 'Energy' && fn.unitName === 'KCAL') n['energy-kcal_100g'] = fn.value;
      else if (fn.nutrientName === 'Protein') n['proteins_100g'] = fn.value;
      else if (fn.nutrientName === 'Carbohydrate, by difference') n['carbohydrates_100g'] = fn.value;
      else if (fn.nutrientName === 'Total lipid (fat)') n['fat_100g'] = fn.value;
    });
    return { product_name: food.description, brands: food.brandOwner || '', nutriments: n, _source: 'usda' };
  }

  // Foundation + SR Legacy are USDA's generic/whole-food datasets —
  // exactly the "plain chicken breast," "egg" category Open Food Facts
  // is weakest at, since OFF mostly covers branded/packaged items.
  function fetchUSDA(query){
    var url = 'https://api.nal.usda.gov/fdc/v1/foods/search?api_key=' + USDA_API_KEY +
      '&query=' + encodeURIComponent(query) + '&pageSize=10&dataType=Foundation,SR%20Legacy';
    return fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        return (data.foods || [])
          .map(usdaToProductShape)
          .filter(function(p){ return p.product_name && p.nutriments['energy-kcal_100g'] != null; });
      })
      .catch(function(err){
        console.error('SaviorFuel: USDA search failed —', err);
        return [];
      });
  }

  function fetchOpenFoodFacts(query){
    var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
      encodeURIComponent(query) + '&search_simple=1&action=process&json=1&page_size=15';
    return fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        return (data.products || [])
          .map(function(p){ p._source = 'off'; return p; })
          .filter(function(p){ return p.product_name && p.nutriments && p.nutriments['energy-kcal_100g'] != null; });
      })
      .catch(function(err){
        console.error('SaviorFuel: Open Food Facts search failed —', err);
        return [];
      });
  }

  function runFoodSearch(query){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;
    var thisRequest = ++searchRequestId;

    // Don't blank existing results while the new query is in flight —
    // keep whatever's already showing and just add a small "updating"
    // line above it, so typing doesn't cause a flash-to-empty each
    // keystroke the way replacing the whole list would.
    if (!resultsEl.querySelector('.food-suggest-item')){
      resultsEl.innerHTML = '<div class="food-suggest-status">Searching...</div>';
    } else if (!resultsEl.querySelector('.food-suggest-status')){
      resultsEl.insertAdjacentHTML('afterbegin', '<div class="food-suggest-status">Updating...</div>');
    }

    // Kalori (Malaysian dishes) listed first since it's the most locally
    // relevant, then USDA (generic foods), then Open Food Facts
    // (branded/packaged) — each source can fail independently without
    // taking the others down with it.
    Promise.all([fetchKalori(query), fetchUSDA(query), fetchOpenFoodFacts(query)])
      .then(function(results){
        if (thisRequest !== searchRequestId) return; // a newer search has since superseded this one
        var products = results[0].concat(results[1]).concat(results[2]);
        if (products.length === 0){
          resultsEl.innerHTML = '<div class="food-suggest-status">No results — try a different search, or just type it in manually below.</div>';
          return;
        }
        resultsEl.innerHTML = products.map(function(p, i){
          var cal = Math.round(p.nutriments['energy-kcal_100g'] || 0);
          var tag = (p._source === 'techapi')
            ? cal + ' kcal' + (p._serving ? ' / ' + esc(p._serving) : '')
            : cal + ' kcal/100g';
          return '<div class="food-suggest-item" data-action="pick-food" data-index="' + i + '">' +
            '<div class="food-suggest-name">' + esc(p.product_name) +
              (p.brands ? '<span class="brand">' + esc(p.brands.split(',')[0]) + '</span>' : '') +
            '</div>' +
            '<div class="food-suggest-tag">' + tag + '</div>' +
          '</div>';
        }).join('');
        ui.lastSearchProducts = products; // stashed so pick-food can look up by index without re-fetching
      })
      .catch(function(err){
        if (thisRequest !== searchRequestId) return;
        console.error('SaviorFuel food search failed —', err);
        resultsEl.innerHTML = '<div class="food-suggest-status">Search failed — check your connection, or type the meal in manually below.</div>';
      });
  }

  function pickFoodResult(index){
    var p = ui.lastSearchProducts && ui.lastSearchProducts[index];
    if (!p) return;

    if (p._source === 'techapi'){
      // Kalori's numbers are per-serving already (see the 'serving'
      // field), not per-100g like OFF/USDA — log as-is, no scaling.
      ui.selectedFood = {
        name: p.product_name,
        wholeServing: true,
        servingLabel: p._serving || '1 serving',
        whole: {
          cal: p.nutriments['energy-kcal_100g'] || 0,
          protein: p.nutriments['proteins_100g'] || 0,
          carbs: p.nutriments['carbohydrates_100g'] || 0,
          fat: p.nutriments['fat_100g'] || 0
        }
      };
    } else {
      var n = p.nutriments;
      ui.selectedFood = {
        name: p.product_name,
        brand: p.brands ? p.brands.split(',')[0] : '',
        per100g: {
          cal: n['energy-kcal_100g'] || 0,
          protein: n['proteins_100g'] || 0,
          carbs: n['carbohydrates_100g'] || 0,
          fat: n['fat_100g'] || 0
        }
      };
    }
    ui.grams = 100;
    applySelectedFoodToForm();
    ui.justFilledFood = true;
    closeFoodSearchOverlay();
    renderApp();
  }

  // Recomputes the prefill macro values from the selected food.
  // Per-100g sources (OFF/USDA) scale by the current gram amount;
  // whole-serving sources (Kalori) use the given numbers directly.
  function applySelectedFoodToForm(){
    var f = ui.selectedFood;
    ui.prefillName = f.name;
    if (f.wholeServing){
      ui.prefillCal = Math.round(f.whole.cal);
      ui.prefillProtein = Math.round(f.whole.protein);
      ui.prefillCarbs = Math.round(f.whole.carbs);
      ui.prefillFat = Math.round(f.whole.fat);
      return;
    }
    var factor = (ui.grams || 0) / 100;
    ui.prefillCal = Math.round(f.per100g.cal * factor);
    ui.prefillProtein = Math.round(f.per100g.protein * factor);
    ui.prefillCarbs = Math.round(f.per100g.carbs * factor);
    ui.prefillFat = Math.round(f.per100g.fat * factor);
  }

  function clearFoodSelection(){
    ui.selectedFood = null;
    ui.prefillName = ui.prefillCal = ui.prefillProtein = ui.prefillCarbs = ui.prefillFat = null;
  }

  /* =========================================================
     BARCODE SCANNER — native BarcodeDetector API (best support
     is Chrome/Chrome-based browsers on Android, which is exactly
     what the installed Play Store app runs on). No external
     library — if the API isn't available, we just tell the
     person to search by name instead rather than failing silently.
     ========================================================= */
  var scanState = { stream: null, loopId: null, detector: null };

  function openScanner(){
    if (typeof BarcodeDetector === 'undefined'){
      alert('Barcode scanning isn\'t supported in this browser. Try the installed app, or search by name instead.');
      return;
    }
    var overlay = document.getElementById('scanOverlay');
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(stream){
        scanState.stream = stream;
        video.srcObject = stream;
        overlay.classList.remove('hidden');
        scanState.detector = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128']
        });
        statusEl.textContent = 'Point camera at a barcode';
        scanLoop();
      })
      .catch(function(err){
        console.error('SaviorFuel: camera access failed —', err);
        alert('Couldn\'t access the camera. Check camera permission for this app in your phone settings, or search by name instead.');
      });
  }

  function scanLoop(){
    var video = document.getElementById('scanVideo');
    if (!scanState.stream) return; // scanner was closed mid-loop
    scanState.detector.detect(video)
      .then(function(codes){
        if (codes.length > 0){
          onBarcodeDetected(codes[0].rawValue);
        } else {
          scanState.loopId = requestAnimationFrame(scanLoop);
        }
      })
      .catch(function(){
        // detect() can throw transiently (e.g. video not ready yet) — just keep trying
        scanState.loopId = requestAnimationFrame(scanLoop);
      });
  }

  function closeScanner(){
    if (scanState.stream){
      scanState.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.stream = null;
    scanState.loopId = null;
    document.getElementById('scanOverlay').classList.add('hidden');
  }

  function onBarcodeDetected(code){
    var statusEl = document.getElementById('scanStatus');
    statusEl.textContent = 'Found ' + code + ' — looking it up...';
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;

    fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        closeScanner();
        closeFoodSearchOverlay();
        if (data.status !== 1 || !data.product || !data.product.nutriments){
          alert('That barcode isn\'t in the food database. Try searching by name instead.');
          return;
        }
        var p = data.product;
        var n = p.nutriments;
        ui.selectedFood = {
          name: p.product_name || 'Scanned item',
          brand: p.brands ? p.brands.split(',')[0] : '',
          per100g: {
            cal: n['energy-kcal_100g'] || 0,
            protein: n['proteins_100g'] || 0,
            carbs: n['carbohydrates_100g'] || 0,
            fat: n['fat_100g'] || 0
          }
        };
        ui.grams = 100;
        applySelectedFoodToForm();
        ui.justFilledFood = true;
        renderApp();
      })
      .catch(function(err){
        console.error('SaviorFuel: barcode lookup failed —', err);
        closeScanner();
        alert('Lookup failed — check your connection and try again, or search by name instead.');
      });
  }

  function addMealFromForm(){
    var name = document.getElementById('mealName').value.trim();
    var cal = parseInt(document.getElementById('mealCal').value, 10) || 0;
    var protein = parseInt(document.getElementById('mealProtein').value, 10) || 0;
    var carbs = parseInt(document.getElementById('mealCarbs').value, 10) || 0;
    var fat = parseInt(document.getElementById('mealFat').value, 10) || 0;

    if (!name || cal <= 0) return; // require at least a name + calories

    STORE.meals.push({
      id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      name: name,
      calories: cal,
      protein: protein,
      carbs: carbs,
      fat: fat,
      loggedAt: Date.now()
    });
    saveStore();
    clearFoodSelection();
    maybeVibrate();
    renderApp();
  }

  function deleteMeal(id){
    STORE.meals = STORE.meals.filter(function(m){ return m.id !== id; });
    saveStore();
    renderApp();
  }

  /* =========================================================
     RENDER — HISTORY TAB
     ========================================================= */
  function renderHistory(){
    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>No meal history yet.<br>Logged meals will show up here.</p></div>';
      return;
    }

    var byDay = {};
    STORE.meals.forEach(function(m){
      var key = dateKey(m.loggedAt);
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(m);
    });
    var days = Object.keys(byDay).sort().reverse();

    var html = days.map(function(key){
      var meals = byDay[key].sort(function(a,b){ return b.loggedAt - a.loggedAt; });
      var totals = totalsFor(meals);
      var isOpen = ui.historyOpenDay === key;
      var inner = isOpen ? meals.map(mealRowHtml).join('') : '';
      return '<div class="card history-day-card">' +
        '<div class="history-day-head" data-action="toggle-history-day" data-day="' + key + '" style="cursor:pointer;">' +
          '<span class="date">' + formatDateLabel(key) + '</span>' +
          '<span class="total">' + totals.calories + ' kcal</span>' +
        '</div>' +
        inner +
      '</div>';
    }).join('');

    document.getElementById('view').innerHTML = html;
  }

  /* =========================================================
     RENDER — INSIGHTS TAB
     ========================================================= */
  function renderInsights(){
    var days = [];
    for (var i = 6; i >= 0; i--){
      days.push(dateKey(Date.now() - i * 86400000));
    }
    var dayTotals = days.map(function(key){
      return { key: key, total: totalsFor(mealsForDay(key)).calories };
    });
    var maxVal = Math.max(STORE.goals.calories, Math.max.apply(null, dayTotals.map(function(d){ return d.total; })), 1);

    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>Nothing to chart yet.<br>Log a few meals and your trends will appear here.</p></div>';
      return;
    }

    var html = '<div class="card"><h3 class="section-label" style="margin:0 0 14px;color:var(--text-faint);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;">Last 7 days — calories</h3>';
    html += dayTotals.map(function(d){
      var label = new Date(d.key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' });
      return '<div class="insight-bar-row">' +
        '<div class="insight-bar-day">' + label + '</div>' +
        '<div class="insight-bar-track"><div class="insight-bar-fill" style="width:' + pct(d.total, maxVal) + '%"></div></div>' +
        '<div class="insight-bar-val">' + d.total + '</div>' +
      '</div>';
    }).join('');
    html += '</div>';

    document.getElementById('view').innerHTML = html;
  }

  /* =========================================================
     RENDER — SETTINGS TAB
     ========================================================= */

  function settingsGoalRow(label, id, value){
    return '<div class="settings-goal-row"><label>' + label + '</label>' +
      '<input type="number" inputmode="numeric" id="' + id + '" value="' + value + '" data-action-change="save-goal">' +
    '</div>';
  }

  function saveGoalsFromInputs(){
    STORE.goals = {
      calories: parseInt(document.getElementById('goalCalories').value, 10) || DEFAULT_GOALS.calories,
      protein: parseInt(document.getElementById('goalProtein').value, 10) || DEFAULT_GOALS.protein,
      carbs: parseInt(document.getElementById('goalCarbs').value, 10) || DEFAULT_GOALS.carbs,
      fat: parseInt(document.getElementById('goalFat').value, 10) || DEFAULT_GOALS.fat
    };
    saveStore();
  }

  /* =========================================================
     PLAN CALCULATOR — Mifflin-St Jeor BMR -> TDEE -> goal-adjusted
     calories -> macro split. Standard formula used by most
     fitness/nutrition apps; not medical advice, just a starting
     estimate the person can always override manually below.
     ========================================================= */
  function selectOptionsHtml(options, selectedId){
    return options.map(function(o){
      return '<option value="' + o.id + '"' + (o.id === selectedId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('');
  }

  function profileFormHtml(){
    var p = STORE.profile;
    var imperial = STORE.appSettings.unit === 'imperial';
    var heightVal = imperial ? Math.round(cmToIn(p.heightCm)) : p.heightCm;
    var weightVal = imperial ? Math.round(kgToLb(p.weightKg)) : p.weightKg;
    return '<div class="settings-group"><h3>Your profile</h3><div class="card">' +
      '<div class="settings-goal-row"><label>Sex</label>' +
        '<select id="profSex">' +
          '<option value="male"' + (p.sex === 'male' ? ' selected' : '') + '>Male</option>' +
          '<option value="female"' + (p.sex === 'female' ? ' selected' : '') + '>Female</option>' +
        '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Age</label>' +
        '<input type="number" inputmode="numeric" id="profAge" value="' + p.age + '"></div>' +
      '<div class="settings-goal-row"><label>Height (' + (imperial ? 'in' : 'cm') + ')</label>' +
        '<input type="number" inputmode="numeric" id="profHeight" value="' + heightVal + '"></div>' +
      '<div class="settings-goal-row"><label>Bodyweight (' + (imperial ? 'lb' : 'kg') + ')</label>' +
        '<input type="number" inputmode="numeric" id="profWeight" value="' + weightVal + '"></div>' +
      '<div class="settings-goal-row"><label>Activity level</label>' +
        '<select id="profActivity">' + selectOptionsHtml(ACTIVITY_LEVELS, p.activityLevel) + '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Goal</label>' +
        '<select id="profGoal">' + selectOptionsHtml(GOAL_OPTIONS, p.goal) + '</select>' +
      '</div>' +
      '<button class="btn-primary" data-action="calculate-plan" style="margin-top:10px;">Calculate My Plan</button>' +
    '</div></div>';
  }

  function calculatePlanFromForm(){
    var imperial = STORE.appSettings.unit === 'imperial';
    var rawHeight = parseFloat(document.getElementById('profHeight').value) || (imperial ? cmToIn(DEFAULT_PROFILE.heightCm) : DEFAULT_PROFILE.heightCm);
    var rawWeight = parseFloat(document.getElementById('profWeight').value) || (imperial ? kgToLb(DEFAULT_PROFILE.weightKg) : DEFAULT_PROFILE.weightKg);
    var profile = {
      sex: document.getElementById('profSex').value,
      age: parseInt(document.getElementById('profAge').value, 10) || DEFAULT_PROFILE.age,
      heightCm: Math.round(imperial ? inToCm(rawHeight) : rawHeight),
      weightKg: Math.round(imperial ? lbToKg(rawWeight) : rawWeight),
      activityLevel: document.getElementById('profActivity').value,
      goal: document.getElementById('profGoal').value
    };
    STORE.profile = profile;

    // Mifflin-St Jeor BMR
    var bmr = profile.sex === 'male'
      ? (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) + 5
      : (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) - 161;

    var activityMult = (ACTIVITY_LEVELS.find(function(a){ return a.id === profile.activityLevel; }) || ACTIVITY_LEVELS[2]).mult;
    var tdee = bmr * activityMult;

    var goalAdjust = (GOAL_OPTIONS.find(function(g){ return g.id === profile.goal; }) || GOAL_OPTIONS[1]).calAdjust;
    var targetCalories = Math.max(1200, Math.round(tdee + goalAdjust)); // 1200 floor as a basic safety rail

    // Macro split: protein by bodyweight (1.8g/kg), fat at 25% of
    // total calories, carbs fill the remainder.
    var proteinG = Math.round(profile.weightKg * 1.8);
    var proteinCal = proteinG * 4;
    var fatCal = targetCalories * 0.25;
    var fatG = Math.round(fatCal / 9);
    var carbCal = Math.max(0, targetCalories - proteinCal - fatCal);
    var carbG = Math.round(carbCal / 4);

    STORE.goals = { calories: targetCalories, protein: proteinG, carbs: carbG, fat: fatG };
    STORE.lastPlanTdee = Math.round(tdee);
    saveStore();
    renderApp();
  }

  function renderSettings(){
    var g = STORE.goals;
    var s = STORE.appSettings;
    var html = profileFormHtml();

    if (STORE.lastPlanTdee){
      html += '<div class="plan-result-banner">Estimated maintenance (TDEE): <b>' + STORE.lastPlanTdee + ' kcal/day</b> — your goals below were calculated from this.</div>';
    }

    html += '<div class="settings-group"><h3>Daily goals</h3><div class="card">' +
      settingsGoalRow('Calories', 'goalCalories', g.calories) +
      settingsGoalRow('Protein (g)', 'goalProtein', g.protein) +
      settingsGoalRow('Carbs (g)', 'goalCarbs', g.carbs) +
      settingsGoalRow('Fat (g)', 'goalFat', g.fat) +
    '</div></div>';

    html += '<div class="section-label">Preferences</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div><div class="sr-label">Units</div><div class="sr-sub">Applies to height and bodyweight above</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-unit" data-unit="metric" class="' + (s.unit === 'metric' ? 'active' : '') + '">METRIC</button>' +
                '<button data-action="set-unit" data-unit="imperial" class="' + (s.unit === 'imperial' ? 'active' : '') + '">IMPERIAL</button>' +
              '</div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Haptic feedback</div><div class="sr-sub">Short vibration when you log a meal</div></div>' +
              '<div class="seg">' +
                '<button data-action="toggle-haptic" data-val="on" class="' + (s.haptic !== false ? 'active' : '') + '">ON</button>' +
                '<button data-action="toggle-haptic" data-val="off" class="' + (s.haptic === false ? 'active' : '') + '">OFF</button>' +
              '</div></div>';
    html += '</div>';

    html += '<div class="section-label">Appearance</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div><div class="sr-label">Density</div><div class="sr-sub">Fit more on screen in Log &amp; History</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-density" data-density="comfortable" class="' + (s.density === 'comfortable' ? 'active' : '') + '">Comfortable</button>' +
                '<button data-action="set-density" data-density="compact" class="' + (s.density === 'compact' ? 'active' : '') + '">Compact</button>' +
              '</div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Corners</div><div class="sr-sub">Rounded or sharp edges throughout the app</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-corner-style" data-style="rounded" class="' + (s.corners === 'rounded' ? 'active' : '') + '">Rounded</button>' +
                '<button data-action="set-corner-style" data-style="sharp" class="' + (s.corners === 'sharp' ? 'active' : '') + '">Sharp</button>' +
              '</div></div>';
    html += '</div>';

    html += '<div class="section-label">Your data</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div><div class="sr-label">' + STORE.meals.length + ' meal' + (STORE.meals.length === 1 ? '' : 's') + ' logged</div>' +
              '<div class="sr-sub">Stored only on this device — no account or sync yet</div></div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Export backup</div><div class="sr-sub">Download a JSON file of your log</div></div>' +
              '<button class="sr-action" data-action="export-data">Export</button></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Import backup</div><div class="sr-sub">Restore from a JSON file</div></div>' +
              '<button class="sr-action" data-action="import-data">Import</button></div>';
    html += '</div>';

    html += '<div class="section-label">Support</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div><div class="sr-label">Instagram</div><div class="sr-sub">@im.savior_</div></div>' +
              '<a class="sr-action" href="https://instagram.com/im.savior_" target="_blank" rel="noopener">Open</a></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Email</div><div class="sr-sub">xavierchua10@gmail.com</div></div>' +
              '<a class="sr-action" href="mailto:xavierchua10@gmail.com">Email</a></div>';
    html += '</div>';
    html += '<div class="settings-version">SaviorFuel v' + APP_VERSION + '</div>';

    var dzOpen = !!ui.dangerZoneOpen;
    html += '<div class="section-label danger-zone-toggle' + (dzOpen ? ' open' : '') + '" data-action="toggle-danger-zone">' +
              '<span>Danger zone</span><span class="dz-chevron">&#9660;</span>' +
            '</div>';
    if (dzOpen){
      html += '<button class="btn-danger" data-action="clear-data">Erase all data</button>';
    }

    html += '<input type="file" id="importFile" accept="application/json" style="display:none;">';

    document.getElementById('view').innerHTML = html;
    var importInput = document.getElementById('importFile');
    if (importInput) importInput.addEventListener('change', handleImportFile);
  }

  /* =========================================================
     RENDER DISPATCH
     ========================================================= */
  /* =========================================================
     APP SETTINGS — density/corners (Appearance) applied as body
     data-attributes so the CSS overrides near the top of the file
     pick them up; haptic feedback fires directly where relevant
     (see addMealFromForm). Export/import is a straight JSON
     dump/restore of the whole STORE object.
     ========================================================= */
  function applyAppearanceSettings(){
    document.body.dataset.density = STORE.appSettings.density || 'comfortable';
    document.body.dataset.corners = STORE.appSettings.corners || 'rounded';
  }

  function maybeVibrate(){
    if (STORE.appSettings.haptic === false) return;
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function exportData(){
    var blob = new Blob([JSON.stringify(STORE, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'saviorfuel-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.meals)) throw new Error('Not a valid SaviorFuel backup file');
        if (!window.confirm('Replace everything currently on this device with this backup?')) return;
        STORE = {
          meals: parsed.meals,
          goals: parsed.goals || Object.assign({}, DEFAULT_GOALS),
          profile: parsed.profile || Object.assign({}, DEFAULT_PROFILE),
          appSettings: parsed.appSettings || Object.assign({}, DEFAULT_APP_SETTINGS)
        };
        saveStore();
        applyAppearanceSettings();
        renderApp();
      } catch (err){
        console.error('SaviorFuel: import failed —', err);
        alert('That file doesn\'t look like a valid SaviorFuel backup.');
      }
    };
    reader.readAsText(file);
  }

  function renderApp(){
    document.querySelectorAll('.tabbar button').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    if (state.tab === 'log') renderLog();
    else if (state.tab === 'history') renderHistory();
    else if (state.tab === 'insights') renderInsights();
    else if (state.tab === 'settings') renderSettings();
  }

  // Same fade+shift treatment as SaviorFit Logger's switchTabWithFade.
  function switchTab(newTab){
    if (newTab === state.tab) return;
    closeScanner(); // safety: release the camera if it was somehow left open
    closeFoodSearchOverlay();
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');

    setTimeout(function(){
      state.tab = newTab;
      renderApp();
      viewEl.classList.remove('subtab-fade-out');
      viewEl.classList.add('subtab-fade-in');
      setTimeout(function(){
        viewEl.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'set-tab'){
      switchTab(el.dataset.tab);
    } else if (action === 'add-meal'){
      addMealFromForm();
    } else if (action === 'delete-meal'){
      deleteMeal(el.dataset.id);
    } else if (action === 'toggle-history-day'){
      var day = el.dataset.day;
      ui.historyOpenDay = (ui.historyOpenDay === day) ? null : day;
      renderApp();
    } else if (action === 'clear-data'){
      if (window.confirm('Erase all logged meals and reset goals? This can\'t be undone.')){
        STORE = { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS) };
        saveStore();
        applyAppearanceSettings();
        renderApp();
      }
    } else if (action === 'pick-food'){
      pickFoodResult(parseInt(el.dataset.index, 10));
    } else if (action === 'open-food-search-overlay'){
      openFoodSearchOverlay();
    } else if (action === 'close-food-search-overlay'){
      closeFoodSearchOverlay();
    } else if (action === 'calculate-plan'){
      calculatePlanFromForm();
    } else if (action === 'open-scanner'){
      openScanner();
    } else if (action === 'close-scanner'){
      closeScanner();
    } else if (action === 'set-unit'){
      STORE.appSettings.unit = el.dataset.unit;
      saveStore();
      renderApp();
    } else if (action === 'toggle-haptic'){
      STORE.appSettings.haptic = (el.dataset.val === 'on');
      saveStore();
      renderApp();
    } else if (action === 'set-density'){
      STORE.appSettings.density = el.dataset.density;
      saveStore();
      applyAppearanceSettings();
      renderApp();
    } else if (action === 'set-corner-style'){
      STORE.appSettings.corners = el.dataset.style;
      saveStore();
      applyAppearanceSettings();
      renderApp();
    } else if (action === 'toggle-danger-zone'){
      ui.dangerZoneOpen = !ui.dangerZoneOpen;
      renderApp();
    } else if (action === 'export-data'){
      exportData();
    } else if (action === 'import-data'){
      document.getElementById('importFile').click();
    }
  });

  // Live food search as you type (debounced inside searchFoodDebounced).
  document.addEventListener('input', function(e){
    if (e.target.id === 'foodSearchInput'){
      searchFoodDebounced(e.target.value);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && e.target.id === 'foodSearchInput'){
      e.preventDefault();
      closeFoodSearchOverlay();
    }
  });

  // Goal inputs save on change (blur/enter), not on every keystroke —
  // avoids writing to localStorage on every digit typed. Same event
  // also handles the "grams" field on a selected search result, which
  // just recomputes the prefill macros rather than saving anything.
  document.addEventListener('change', function(e){
    if (e.target.dataset && e.target.dataset.actionChange === 'save-goal'){
      saveGoalsFromInputs();
    } else if (e.target.id === 'foodGrams'){
      ui.grams = parseInt(e.target.value, 10) || 0;
      applySelectedFoodToForm();
      renderApp();
    }
  });

  applyAppearanceSettings();
  document.getElementById('bootLoading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderApp();
</script>
