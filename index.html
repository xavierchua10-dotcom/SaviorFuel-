  // The last 7 calendar days (today plus the 6 before it) worked out
  // from the meals: per-day totals, plus the numbers both Weekly views
  // share. days[0] is six days ago, days[6] is today.
  function weekData(){
    var g = STORE.goals;
    var days = [];
    var weekMeals = [];
    for (var d = 6; d >= 0; d--){
      var key = dateKey(Date.now() - d * 86400000);
      var dayMeals = mealsForDay(key);
      var t = totalsFor(dayMeals);
      weekMeals = weekMeals.concat(dayMeals);
      days.push({
        label: d === 0 ? 'Today' : new Date(key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
        isToday: d === 0,
        logged: dayMeals.length > 0,
        total: Math.round(t.calories),
        t: t,
        byMeal: mealBreakdown(dayMeals)
      });
    }
    var loggedDays = days.filter(function(x){ return x.logged; });
    var sum = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
    loggedDays.forEach(function(x){
      Object.keys(sum).forEach(function(k){ sum[k] += x.t[k] || 0; });
    });
    return {
      days: days, goal: g.calories, goals: g, loggedDays: loggedDays, sum: sum,
      byMeal: mealBreakdown(weekMeals),
      avg: function(k){ return loggedDays.length ? sum[k] / loggedDays.length : 0; },
      highest: loggedDays.length ? Math.max.apply(null, loggedDays.map(function(x){ return x.total; })) : 0
    };
  }

  function renderInsightsTrends(){
    if (weeklyMode() === 'plain') renderTrendsPlain();
    else renderTrends3D();
  }

  // ---- Weekly Overview, 3D: a wooden wheel of seven wedges, one per day
  function dayTagHtml(d, k){
    var cls = 'day-tag' + (d.isToday ? ' today' : '') + (!d.logged ? ' skipped' : '');
    return '<div class="' + cls + '" id="dayTag' + k + '">' +
      '<span class="day-tag-name">' + esc(d.label) + '</span>' +
      '<span class="day-tag-val" data-over="' + (d.logged ? '1' : '0') + '">' + (d.logged ? d.total : '—') + '</span>' +
    '</div>';
  }

  function dayCardHtml(d, goal){
    var head = '<div class="day-card-head"><b>' + esc(d.label) + '</b>';
    if (!d.logged){
      return head + '<span>Nothing logged</span><button type="button" class="day-card-close" data-action="close-day-card" aria-label="Close">&times;</button></div>';
    }
    var pctGoal = goal > 0 ? Math.round(d.total / goal * 100) : 0;
    return head + '<span>' + d.total + ' kcal' + (goal > 0 ? ' · ' + pctGoal + '% of goal' : '') + '</span>' +
      '<button type="button" class="day-card-close" data-action="close-day-card" aria-label="Close">&times;</button></div>' +
      '<div class="day-card-macros">' +
        '<span class="p">Protein <b>' + Math.round(d.t.protein) + 'g</b></span>' +
        '<span class="c">Carbs <b>' + Math.round(d.t.carbs) + 'g</b></span>' +
        '<span class="f">Fat <b>' + Math.round(d.t.fat) + 'g</b></span>' +
      '</div>' +
      '<div class="day-card-meals">' + d.byMeal.map(function(r){
        return '<div class="dcm-row"><span class="dcm-name">' + esc(r.label) + '</span> <b>' + r.kcal + '</b> ' +
          '<span class="dcm-macros">' + mealMacrosHtml(r, 1) + '</span></div>';
      }).join('') + '</div>';
  }

  function renderTrends3D(){
    var wd = weekData();
    var tagsHtml = wd.days.map(dayTagHtml).join('');
    var chip = wd.loggedDays.length
      ? '<div class="week-chip"><b>' + Math.round(wd.avg('calories')) + '</b> kcal/day avg · <b>' + wd.loggedDays.length + '/7</b> days logged</div>'
      : '<div class="week-chip">Nothing logged in the last 7 days</div>';
    document.getElementById('view').innerHTML =
      '<div class="card model-card">' +
        '<div class="model-stage" id="modelStage"></div>' +
        tagsHtml + chip +
        '<div class="day-card hidden" id="dayCard"></div>' +
        '<div class="model-status" id="modelStatus">' +
          '<span id="modelStatusText">Loading 3D model…</span>' +
          '<div class="model-bar" id="modelBarWrap"><i id="modelBar"></i></div>' +
        '</div>' +
        weeklyModeToggleHtml('floating') +
      '</div>';
    // tags float just above their wedge, and ride up with it as it rises
    var tags = wd.days.map(function(d, k){
      return { el: document.getElementById('dayTag' + k), follow: function(ctx, out){
        var w = ctx.wedges[k];
        if (w) out.set(w.cx * 1.02, w.topY + w.mesh.position.y + 0.08, w.cz * 1.02);
      } };
    });
    try {
      WeekWheel3D.mount(document.getElementById('modelStage'), tags, {
        days: wd.days, goal: wd.goal,
        onSelect: function(k){
          var card = document.getElementById('dayCard');
          if (!card) return;
          if (k == null){ card.classList.add('hidden'); return; }
          card.innerHTML = dayCardHtml(wd.days[k], wd.goal);
          card.classList.remove('hidden');
        }
      });
      // colour a day's number red when it went over the goal
      wd.days.forEach(function(d, k){
        var el = document.querySelector('#dayTag' + k + ' .day-tag-val');
        if (el && d.logged && wd.goal > 0 && d.total > wd.goal) el.classList.add('over');
      });
    } catch (err){
      console.error('SaviorFuel: 3D week wheel failed to start —', err);
    }
  }

  // ---- Weekly Overview, plain: the bars, week numbers, average macros,
  // calorie split and consistency line.
  function renderTrendsPlain(){
    var wd = weekData();
    var g = wd.goals, days = wd.days, loggedDays = wd.loggedDays, avg = wd.avg, sum = wd.sum;
    var DAYS_TO_SHOW = 7;
    var dayMax = Math.max(g.calories, Math.max.apply(null, days.map(function(x){ return x.total; })), 1);
    var goalPos = pct(g.calories, dayMax); // where the goal line sits along each bar

    var html = '<div class="overview-plain"><div class="today-card-head"><h3 class="section-label">Last 7 days — daily calories</h3>' +
      weeklyModeToggleHtml('') + '</div>';
    html += days.map(function(x){
      return '<div class="insight-bar-row">' +
        '<div class="insight-bar-day">' + x.label + '</div>' +
        '<div class="insight-bar-track">' +
          '<div class="insight-bar-fill' + (x.isToday ? ' today' : '') + (g.calories > 0 && x.total > g.calories ? ' over' : '') + '" style="width:' + pct(x.total, dayMax) + '%"></div>' +
          (g.calories > 0 ? '<i class="insight-goal-mark" style="left:' + goalPos + '%"></i>' : '') +
        '</div>' +
        '<div class="insight-bar-val">' + x.total + '</div>' +
      '</div>';
    }).join('');
    if (g.calories > 0) html += '<div class="week-legend-note"><i></i>Goal ' + g.calories + ' kcal</div>';

    if (loggedDays.length === 0){
      html += '<div class="insight-caption">Log a meal to see your weekly averages and macro split.</div></div>';
      document.getElementById('view').innerHTML = html;
      return;
    }

    // ---- headline numbers
    html += '<div class="week-divider"></div><div class="week-stats">' +
      '<div class="week-stat"><b>' + Math.round(avg('calories')) + '</b><span>Avg kcal / day</span></div>' +
      '<div class="week-stat"><b>' + loggedDays.length + '/' + DAYS_TO_SHOW + '</b><span>Days logged</span></div>' +
      '<div class="week-stat"><b>' + wd.highest + '</b><span>Highest day</span></div>' +
    '</div><div class="week-note">Averages count only the days you logged.</div>';

    // ---- average macros against goals
    html += '<div class="week-divider"></div><h3 class="section-label">Daily average vs goal</h3>' +
      macroBarHtml('Protein', avg('protein'), g.protein, 'protein') +
      macroBarHtml('Carbs', avg('carbs'), g.carbs, 'carbs') +
      macroBarHtml('Fat', avg('fat'), g.fat, 'fat') +
      macroBarHtml('Fiber', avg('fiber'), g.fiber, 'fiber');

    // ---- where the week's calories came from (4 kcal/g protein & carbs, 9 kcal/g fat)
    var pKcal = sum.protein * 4, cKcal = sum.carbs * 4, fKcal = sum.fat * 9;
    var macroKcal = pKcal + cKcal + fKcal;
    if (macroKcal > 0){
      var pP = Math.round(pKcal / macroKcal * 100);
      var pC = Math.round(cKcal / macroKcal * 100);
      var pF = Math.max(0, 100 - pP - pC); // so the three always add to 100
      html += '<div class="week-divider"></div><h3 class="section-label">Where your calories come from</h3>' +
        '<div class="split-bar"><i class="p" style="width:' + pP + '%"></i><i class="c" style="width:' + pC + '%"></i><i class="f" style="width:' + pF + '%"></i></div>' +
        '<div class="split-legend">' +
          '<span><i class="p"></i>Protein <b>' + pP + '%</b></span>' +
          '<span><i class="c"></i>Carbs <b>' + pC + '%</b></span>' +
          '<span><i class="f"></i>Fat <b>' + pF + '%</b></span>' +
        '</div>';
    }

    // ---- calories by meal time (average per logged day)
    var weekByMeal = wd.byMeal;
    if (weekByMeal.length > 0){
      var weekKcal = weekByMeal.reduce(function(acc, r){ return acc + r.kcal; }, 0);
      var biggest = weekByMeal.slice().sort(function(a, b){ return b.kcal - a.kcal; })[0];
      html += '<div class="week-divider"></div><h3 class="section-label">Calories by meal</h3>' +
        mealSplitHtml(weekByMeal, weekKcal, loggedDays.length) +
        '<div class="week-note">Average per logged day · biggest share: <b>' + esc(biggest.label) + '</b> (' + (weekKcal > 0 ? Math.round(biggest.kcal / weekKcal * 100) : 0) + '%)</div>';
    }

    // ---- consistency: days close to the calorie goal (85%–110%)
    if (g.calories > 0){
      var onTarget = loggedDays.filter(function(x){ return x.total >= 0.85 * g.calories && x.total <= 1.10 * g.calories; }).length;
      html += '<div class="insight-caption' + (onTarget * 2 >= loggedDays.length ? ' balanced' : '') + '">' +
        'Close to your calorie goal (85–110%) on <b>' + onTarget + ' of ' + loggedDays.length + '</b> logged day' + (loggedDays.length === 1 ? '' : 's') + '.</div>';
    }
    html += '</div>';

    document.getElementById('view').innerHTML = html;
  }

  /* =========================================================
     PLAN CALCULATOR — Mifflin-St Jeor BMR -> TDEE -> goal-adjusted
     calories -> macro split. Standard formula used by most
     fitness/nutrition apps; not medical advice, just a starting
     estimate the person can always override manually below.
     ========================================================= */
  function selectOptionsHtml(options, selectedId){
    return options.map(function(o){
      return '<option value="' + o.id + '"' + (o.id === selectedId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('');
  }

  function profileFormHtml(){
    var p = STORE.profile;
    var imperial = STORE.appSettings.unit === 'imperial';
    var heightVal = imperial ? Math.round(cmToIn(p.heightCm)) : p.heightCm;
    var weightVal = imperial ? Math.round(kgToLb(p.weightKg)) : p.weightKg;
    return '<div class="settings-section"><h3>Your profile</h3><div class="card">' +
      '<div class="settings-goal-row"><label>Sex</label>' +
        '<select id="profSex">' +
          '<option value="male"' + (p.sex === 'male' ? ' selected' : '') + '>Male</option>' +
          '<option value="female"' + (p.sex === 'female' ? ' selected' : '') + '>Female</option>' +
        '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Age</label>' +
        '<input type="number" inputmode="numeric" id="profAge" value="' + p.age + '"></div>' +
      '<div class="settings-goal-row"><label>Height (' + (imperial ? 'in' : 'cm') + ')</label>' +
        '<input type="number" inputmode="numeric" id="profHeight" value="' + heightVal + '"></div>' +
      '<div class="settings-goal-row"><label>Bodyweight (' + (imperial ? 'lb' : 'kg') + ')</label>' +
        '<input type="number" inputmode="numeric" id="profWeight" value="' + weightVal + '"></div>' +
      '<div class="settings-goal-row"><label>Activity level</label>' +
        '<select id="profActivity">' + selectOptionsHtml(ACTIVITY_LEVELS, p.activityLevel) + '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Goal</label>' +
        '<select id="profGoal">' + selectOptionsHtml(GOAL_OPTIONS, p.goal) + '</select>' +
      '</div>' +
      '<button class="btn-primary" data-action="calculate-plan" style="margin-top:10px;">Calculate My Plan</button>' +
    '</div></div>';
  }

  function calculatePlanFromForm(){
    var imperial = STORE.appSettings.unit === 'imperial';
    var rawHeight = parseFloat(document.getElementById('profHeight').value) || (imperial ? cmToIn(DEFAULT_PROFILE.heightCm) : DEFAULT_PROFILE.heightCm);
    var rawWeight = parseFloat(document.getElementById('profWeight').value) || (imperial ? kgToLb(DEFAULT_PROFILE.weightKg) : DEFAULT_PROFILE.weightKg);
    var profile = {
      sex: document.getElementById('profSex').value,
      age: parseInt(document.getElementById('profAge').value, 10) || DEFAULT_PROFILE.age,
      heightCm: Math.round(imperial ? inToCm(rawHeight) : rawHeight),
      weightKg: Math.round(imperial ? lbToKg(rawWeight) : rawWeight),
      activityLevel: document.getElementById('profActivity').value,
      goal: document.getElementById('profGoal').value
    };
    STORE.profile = profile;

    // Mifflin-St Jeor BMR
    var bmr = profile.sex === 'male'
      ? (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) + 5
      : (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) - 161;

    var activityMult = (ACTIVITY_LEVELS.find(function(a){ return a.id === profile.activityLevel; }) || ACTIVITY_LEVELS[2]).mult;
    var tdee = bmr * activityMult;

    var goalAdjust = (GOAL_OPTIONS.find(function(g){ return g.id === profile.goal; }) || GOAL_OPTIONS[1]).calAdjust;
    var targetCalories = Math.max(1200, Math.round(tdee + goalAdjust)); // 1200 floor as a basic safety rail

    // Macro split: protein by bodyweight (1.8g/kg), fat at 25% of
    // total calories, carbs fill the remainder.
    var proteinG = Math.round(profile.weightKg * 1.8);
    var proteinCal = proteinG * 4;
    var fatCal = targetCalories * 0.25;
    var fatG = Math.round(fatCal / 9);
    var carbCal = Math.max(0, targetCalories - proteinCal - fatCal);
    var carbG = Math.round(carbCal / 4);

    // Merge rather than replace — the calculator only derives
    // calories/protein/carbs/fat, so fiber/sugar/sodium goals
    // (whatever the person set, or the defaults) carry over instead
    // of getting wiped to undefined.
    STORE.goals = Object.assign({}, STORE.goals, { calories: targetCalories, protein: proteinG, carbs: carbG, fat: fatG });
    STORE.lastPlanTdee = Math.round(tdee);
    saveStore();
    renderApp();
  }

  function renderSettings(){
    var g = STORE.goals;
    var s = STORE.appSettings;
    var html = profileFormHtml();

    if (STORE.lastPlanTdee){
      html += '<div class="plan-result-banner">Estimated maintenance (TDEE): <b>' + STORE.lastPlanTdee + ' kcal/day</b> — your goals below were calculated from this.</div>';

      settingsGoalRow('Calories', 'goalCalories', g.calories) +

      settingsGoalRow('Fiber (g)', 'goalFiber', g.fiber) +
      settingsGoalRow('Sugar (g)', 'goalSugar', g.sugar) +
      settingsGoalRow('Sodium (mg)', 'goalSodium', g.sodium) +
    '</div></div>';

    html += '<div class="section-label">Preferences</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div><div class="sr-label">Units</div><div class="sr-sub">Applies to height and bodyweight above</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-unit" data-unit="metric" class="' + (s.unit === 'metric' ? 'active' : '') + '">METRIC</button>' +
                '<button data-action="set-unit" data-unit="imperial" class="' + (s.unit === 'imperial' ? 'active' : '') + '">IMPERIAL</button>' +
              '</div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Haptic feedback</div><div class="sr-sub">Short vibration when you log a meal</div></div>' +
              '<div class="seg">' +
                '<button data-action="toggle-haptic" data-val="on" class="' + (s.haptic !== false ? 'active' : '') + '">ON</button>' +
                '<button data-action="toggle-haptic" data-val="off" class="' + (s.haptic === false ? 'active' : '') + '">OFF</button>' +
              '</div></div>';
    html += '</div>';

  /* =========================================================
     RENDER DISPATCH
     ========================================================= */
  /* =========================================================
     APP SETTINGS — density/corners (Appearance) applied as body
     data-attributes so the CSS overrides near the top of the file
     pick them up; haptic feedback fires directly where relevant
     (see addMealFromForm). Export/import is a straight JSON
     dump/restore of the whole STORE object.
     ========================================================= */
  function applyAppearanceSettings(){
    document.body.dataset.density = STORE.appSettings.density || 'comfortable';
    document.body.dataset.corners = STORE.appSettings.corners || 'rounded';
    document.body.dataset.theme = STORE.appSettings.theme || 'dark';
    document.body.dataset.bgArt = STORE.appSettings.bgArt === false ? 'off' : 'on';
  }

  function maybeVibrate(){
    if (STORE.appSettings.haptic === false) return;
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function exportData(){
    var blob = new Blob([JSON.stringify(STORE, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'saviorfuel-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.meals)) throw new Error('Not a valid SaviorFuel backup file');
        if (!window.confirm('Replace everything currently on this device with this backup?')) return;
        STORE = {
          meals: parsed.meals,
          goals: Object.assign({}, DEFAULT_GOALS, parsed.goals || {}),
          profile: parsed.profile || Object.assign({}, DEFAULT_PROFILE),
          appSettings: Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {}),
          savedFoods: Array.isArray(parsed.savedFoods) ? parsed.savedFoods : []
        };
        saveStore();
        applyAppearanceSettings();
        renderApp();
      } catch (err){
        console.error('SaviorFuel: import failed —', err);
        alert('That file doesn\'t look like a valid SaviorFuel backup.');
      }
    };
    reader.readAsText(file);
  }

    var svgOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
    var icons = {
      barcode: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h6v2.4H5.4V9H3z"/><path d="M15 3h6v6h-2.4V5.4H15z"/><path d="M3 15h2.4v3.6H9V21H3z"/><path d="M18.6 15H21v6h-6v-2.4h3.6z"/><rect x="6.5" y="11" width="11" height="2" rx="1"/></svg>',
      camera: svgOpen + '<path d="M4 8V6a2 2 0 0 1 2-2h1l1.5-2h7L17 4h1a2 2 0 0 1 2 2v2"></path><path d="M2 8h20v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"></path><circle cx="12" cy="14" r="4"></circle></svg>',
      search: svgOpen + '<circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'
    };
    var chevron = '<svg class="scan-option-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
    function option(action, mode, icon, title, sub, disabled){
      return '<button type="button" class="scan-option" data-action="' + action + '"' + (mode ? ' data-mode="' + mode + '"' : '') + (disabled ? ' disabled' : '') + '>' +

  // Moves the sliding highlight of a tab bar to tab number `index`.
  // Without `animate` it jumps there instantly (first paint, or when the
  // bar wasn't on screen), so nothing glides in from the first tab.
  function setSlider(barEl, index, animate){
    if (!barEl) return;
    if (!animate) barEl.classList.add('no-slide');
    barEl.style.setProperty('--i', String(index));
    if (!animate){
      void barEl.offsetWidth;
      barEl.classList.remove('no-slide');
    }
  }
  var slidersReady = false; // false until the first render has placed them

  function tabIndexOf(tab){
    var btns = document.querySelectorAll('.tabbar button');
    for (var i = 0; i < btns.length; i++) if (btns[i].dataset.tab === tab) return i;
    return 0;
  }

  function renderApp(){
    // The 3D panel only exists on Insights > Daily Overview; stop its
    // render loop everywhere else so it isn't drawing off-screen.
    var onInsights = state.tab === 'insights' && STORE.meals.length > 0;
    var weekly = ui.insightsView === 'trends';
    var showPyramid = onInsights && !weekly && overviewMode() === '3d';
    var showWheel = onInsights && weekly && weeklyMode() === '3d';
    if (!showPyramid) Model3D.unmount();
    if (!showWheel) WeekWheel3D.unmount();
    document.getElementById('view').classList.toggle('model-fullscreen', showPyramid || showWheel);
    document.getElementById('view').classList.toggle('plain-fullscreen',
      onInsights && (weekly ? weeklyMode() === 'plain' : overviewMode() === 'plain'));
    document.querySelectorAll('.tabbar button').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    setSlider(document.getElementById('tabbar'), tabIndexOf(state.tab), slidersReady);
    if (state.tab === 'log') renderLog();
    else if (state.tab === 'history') renderHistory();
    else if (state.tab === 'scan') renderScan();
    else if (state.tab === 'insights') renderInsights();
    else if (state.tab === 'settings') renderSettings();

    // Sticky Today / Trends switch — only exists on the Insights tab
    // once there's something to show, same pattern as SaviorFit
    // Logger's Volume overview / Exercise progression bar.
    var showInsightsSubtabbar = state.tab === 'insights' && STORE.meals.length > 0;
    document.body.classList.toggle('has-insights-subtab', showInsightsSubtabbar);
    var insightsSubtabbarEl = document.getElementById('insightsSubtabbar');
    insightsSubtabbarEl.classList.toggle('hidden', !showInsightsSubtabbar);
    if (showInsightsSubtabbar){
      insightsSubtabbarEl.querySelectorAll('button').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.view === ui.insightsView);
      });
      setSlider(insightsSubtabbarEl, ui.insightsView === 'trends' ? 1 : 0, slidersReady);
    }
    slidersReady = true;
  }

  // Fades the current Insights sub-tab panel out, swaps to the new
  // one, then fades it in — same treatment as SaviorFit Logger's
  // switchProgressViewWithFade() for its Volume overview / Exercise
  // progression switch.
  function switchInsightsViewWithFade(newView){
    if (newView === ui.insightsView) return;
    setSlider(document.getElementById('insightsSubtabbar'), newView === 'trends' ? 1 : 0, true);
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion){
      ui.insightsView = newView;
      renderApp();
      return;
    }
    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');
    setTimeout(function(){
      ui.insightsView = newView;
      renderApp();
      var v = document.getElementById('view');
      v.classList.remove('subtab-fade-out');
      v.classList.add('subtab-fade-in');
      setTimeout(function(){
        v.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  // 3D <-> Plain switch (Daily and Weekly Overview): the whole panel flips
  // like a card (see the flip-* CSS). With reduced motion on, it just swaps.
  function flipToMode(setting, newMode, currentMode){
    if (newMode === currentMode) return;
    function apply(){
      STORE.appSettings[setting] = newMode;
      saveStore();
      renderApp();
    }
    var viewEl = document.getElementById('view');
    if (prefersReducedMotion()){ apply(); return; }
    var dir = newMode === 'plain' ? 'l' : 'r';
    viewEl.classList.remove('subtab-fade-in', 'subtab-fade-out');
    viewEl.classList.add('flip-out-' + dir);
    setTimeout(function(){
      apply();
      var v = document.getElementById('view');
      v.classList.remove('flip-out-' + dir);
      v.classList.add('flip-in-' + dir);
      setTimeout(function(){ v.classList.remove('flip-in-' + dir); }, 250);
    }, 190);
  }
  function switchOverviewModeWithFade(newMode){ flipToMode('overviewMode', newMode, overviewMode()); }
  function switchWeeklyModeWithFlip(newMode){ flipToMode('weeklyMode', newMode, weeklyMode()); }

  // Same fade+shift treatment as SaviorFit Logger's switchTabWithFade.
  function switchTab(newTab){
    if (newTab === state.tab) return;
    setSlider(document.getElementById('tabbar'), tabIndexOf(newTab), true); // the highlight starts gliding on the tap itself
    closeScanner(); // safety: release the camera if it was somehow left open
    closeFoodSearchOverlay();
    closeAddMealOverlay();
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');

    setTimeout(function(){
      state.tab = newTab;
      renderApp();
      viewEl.classList.remove('subtab-fade-out');
      viewEl.classList.add('subtab-fade-in');
      setTimeout(function(){
        viewEl.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

      toggleAccordion('mealTimeRow', 'categoryAcc');

  // Goal inputs save on change (blur/enter), not on every keystroke —

  // also handles the "grams" field on a selected search result, which

  document.addEventListener('change', function(e){

  // what lets the app open at all with no connection, and caches
  // static assets (fonts, background image, the food-photo model
  // once used) opportunistically. Deliberately doesn't cache USDA/
