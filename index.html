<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="author" content="Xavier Chua (Savior)">
<meta name="copyright" content="Copyright (c) 2026 Xavier Chua (Savior). All rights reserved.">
<title>SaviorFuel — Food Tracker</title>
<meta name="description" content="Log your meals and macros. A free food tracker by Savior, built to pair with SaviorFit Logger.">
<link rel="icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaviorFuel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN SYSTEM — copied 1:1 from SaviorFit Logger (IronLedger
     repo) so SaviorFuel matches it visually out of the box. Keep
     these tokens in sync by hand if the Logger's palette ever
     changes; there's no shared stylesheet between the two repos.
     ========================================================= */
  :root{
    --bg:#14161a;
    --panel:#1c1f24;
    --panel-2:#242830;
    --panel-3:#2a2f38;
    --line:#2e333b;
    --text:#e9e6df;
    --text-dim:#8b9098;
    --text-faint:#82878f;
    --accent:#f2b134;
    --accent-dim:#7a6224;
    --accent-rgb:242,177,52;
    --accent-2:#c1443c;
    --accent-2-dim:#4a2321;
    --success:#5fb86a;
    --success-dim:#233821;
    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --radius-xl:20px;
    --radius-pill:999px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    /* Subtle depth for cards — one soft, low-opacity shadow, not a
       dramatic drop shadow. Same value in both themes; a plain dark
       shadow reads fine against a light card too. */
    --card-shadow:0 1px 2px rgba(0,0,0,0.14), 0 4px 10px rgba(0,0,0,0.10);
    /* Fixed, theme-independent — the header stays exactly as it was
       in both themes, per request, so it does not reference any of
       the swappable tokens above. */
    --header-bg:rgba(16,18,21,0.72);
    --header-text:#e9e6df;
    --header-text-faint:#82878f;
    --header-accent:#f2b134;
    --header-line:#2e333b;
  }

  /* ---------- Light theme — swaps the neutral/surface tokens only.
     --accent/--success/--accent-2 are deliberately darker here than
     their dark-mode values (not just reused) since the originals
     don't have enough contrast against a light background for text
     use (tab labels, ring percentages, captions), not just fills. */
  body[data-theme="light"]{
    --bg:#f6f4f0;
    --panel:#ffffff;
    --panel-2:#f0eee7;
    --panel-3:#e4e1d8;
    --line:#ddd9cf;
    --text:#22201c;
    --text-dim:#6b6860;
    --text-faint:#706c61;
    --accent:#966000;
    --accent-dim:#f0dfb8;
    --accent-rgb:150,96,0;
    --accent-2:#a5372f;
    --accent-2-dim:#f6dcda;
    --success:#31703e;
    --success-dim:#e2f2e4;
  }
  /* Verified against actual WCAG contrast math, not eyeballed —
     text-faint/accent/success above are the minimum darkening each
     needed to clear 4.5:1 against every background they're actually
     used on (cards, the tab bar, caption backgrounds). Accent going
     darker breaks fixed dark (#1c1500) text sitting on an accent-
     colored background (.category-pill.active, .unit-toggle button
     .active) — was already borderline in the old lighter accent,
     definitively fails now. Dark-mode's much brighter accent still
     works fine with dark text, so these are light-theme-only
     overrides rather than changing the shared rules.  */
  body[data-theme="light"] .category-pill.active{color:#fff;}
  body[data-theme="light"] .unit-toggle button.active{color:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  /* No browser highlights: tapping shows the app's own pressed state
     (the brightness rule below) instead of Chrome's grey flash box;
     text in the app's screens can't be selected by accident with a
     long-press or double-tap; buttons don't keep a focus ring after a
     tap (keyboard users still get one via :focus-visible). Fields stay
     selectable so you can edit and copy what you type. */
  *{-webkit-tap-highlight-color:transparent;}
  body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  input, textarea, select, [contenteditable]{-webkit-user-select:text; user-select:text;}
  button:focus:not(:focus-visible), [data-action]:focus:not(:focus-visible), canvas:focus{outline:none;}

  button{font-family:inherit;}
  button:active, [data-action]:active{
    filter:brightness(1.2);
    transition:filter 70ms ease-out;
  }
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background-color:var(--bg);
    background-image:linear-gradient(rgba(20,22,26,0.88), rgba(20,22,26,0.88)), url('images/bg-nutrition.webp');
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    overflow:hidden;
  }
  /* Toggled off via Settings > Appearance — plain background color
     only, no illustration. */
  body[data-bg-art="off"] #app{background-image:none;}

  /* ---------- Topbar (same structure/classes as SaviorFit Logger) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--header-line);
    background:var(--header-bg);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--header-text);
  }
  .topbar h1 span{color:var(--header-accent);}
  .topbar h1 small{
    display:inline-block;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:0.02em;
    text-transform:none;
    color:var(--header-text-faint);
    margin-left:8px;
  }
  .topbar h1 small::before{content:'-\00A0';}

  /* ---------- Main content area ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 16px calc(90px + var(--safe-bottom));
  }

  /* Every tab's first card needs the top inset #view no longer
     provides itself. */
  #view > *:first-child{
    margin-top:16px;
  }

  /* Fade+shift tab transition — same treatment as SaviorFit Logger's
     switchTabWithFade, so switching tabs feels identical across both
     apps. See switchTab() below. */
  /* 3D card flip for the Daily Overview 3D <-> Plain switch: the panel
     turns edge-on (90deg), the content is swapped while it's invisible
     from the side, then it turns the rest of the way in. Direction
     follows the switch (l = towards Plain, r = back to 3D). */
  @keyframes flipOutL{ from{transform:perspective(1100px) rotateY(0deg);opacity:1;} to{transform:perspective(1100px) rotateY(-90deg);opacity:0.35;} }
  @keyframes flipInL{  from{transform:perspective(1100px) rotateY(90deg);opacity:0.35;} to{transform:perspective(1100px) rotateY(0deg);opacity:1;} }
  @keyframes flipOutR{ from{transform:perspective(1100px) rotateY(0deg);opacity:1;} to{transform:perspective(1100px) rotateY(90deg);opacity:0.35;} }
  @keyframes flipInR{  from{transform:perspective(1100px) rotateY(-90deg);opacity:0.35;} to{transform:perspective(1100px) rotateY(0deg);opacity:1;} }
  #view.flip-out-l{animation:flipOutL 190ms cubic-bezier(0.45,0,0.85,0.6) forwards;}
  #view.flip-in-l{animation:flipInL 230ms cubic-bezier(0.15,0.4,0.3,1);}
  #view.flip-out-r{animation:flipOutR 190ms cubic-bezier(0.45,0,0.85,0.6) forwards;}
  #view.flip-in-r{animation:flipInR 230ms cubic-bezier(0.15,0.4,0.3,1);}
  #view.flip-out-l, #view.flip-in-l, #view.flip-out-r, #view.flip-in-r{pointer-events:none; will-change:transform, opacity;}

  #view.subtab-fade-out{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 140ms ease, transform 140ms ease;
  }
  #view.subtab-fade-in{
    opacity:1;
    transform:translateY(0);
    transition:opacity 160ms ease, transform 160ms ease;
  }

  /* Extra bottom room on Insights so the last row/card isn't hidden
     behind the sticky Today / Trends bar (mirrors SaviorFit Logger's
     body.has-progress-subtab rule). */
  body.has-insights-subtab main#view{
    padding-bottom:calc(136px + var(--safe-bottom));
  }

  /* ---------- Bottom nav stack (tab bar + optional Insights sub-tab bar) ---------- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    z-index:20;
  }

  /* ---------- Insights sub-tab bar (Today / Trends) — same pattern as
     SaviorFit Logger's Volume overview / Exercise progression bar ---------- */
  .insights-subtabbar{
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
  }
  .insights-subtabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-weight:700;
    padding:12px 6px;
    cursor:pointer;
  }
  .insights-subtabbar button + button{border-left:1px solid var(--line);}
  .insights-subtabbar button.active{color:var(--accent);}
  .insights-subtabbar button:active{opacity:0.85;}

  /* ---------- Bottom tab bar (same classes as SaviorFit Logger) ---------- */
  .tabbar{
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
  }
  .tabbar button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:10px 4px 8px;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--accent);}
  .tab-glyph{display:inline-block; transition:transform 120ms ease;}
  .tabbar button:active .tab-glyph{transform:scale(0.86);}

  /* Sliding highlight: one pill sits behind the active tab and glides to
     the tapped one (the bar's --i = index of the active tab, --n = how
     many tabs). Tabs are equal width, so the slider is 1/n wide and
     moves by whole multiples of its own width. The buttons sit above it. */
  .tabbar, .insights-subtabbar{position:relative; isolation:isolate; --i:0;}
  .tabbar{--n:5;}
  .insights-subtabbar{--n:2;}
  .tab-slider, .subtab-slider{
    position:absolute; left:0; top:0; bottom:0; z-index:-1; pointer-events:none;
    width:calc(100% / var(--n));
    transform:translateX(calc(var(--i) * 100%));
    transition:transform 360ms cubic-bezier(0.32,0.72,0,1);
  }
  .tab-slider{top:6px; bottom:calc(6px + var(--safe-bottom)); padding:0 7px; box-sizing:border-box;}
  .tab-slider::before{content:''; display:block; height:100%; border-radius:14px; background:rgba(var(--accent-rgb),0.16);}
  .subtab-slider{background:var(--panel-3);}
  .no-slide .tab-slider, .no-slide .subtab-slider{transition:none;}
  @media (prefers-reduced-motion: reduce){ .tab-slider, .subtab-slider, .tab-glyph{transition:none;} }
  .tab-glyph svg{width:22px;height:22px;}

  /* ---------- Scan tab ---------- */
  .scan-page{display:flex; flex-direction:column; gap:12px; padding-top:6px;}
  .scan-page-title{
    margin:0; font-family:'Oswald',sans-serif; font-size:20px; font-weight:700;
    letter-spacing:0.05em; text-transform:uppercase; color:var(--text);
  }
  .scan-page-sub{margin:-6px 0 4px; font-size:14px; line-height:1.5; color:var(--text-dim);}
  .scan-option{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--card-shadow); color:var(--text); padding:14px; cursor:pointer;
  }
  .scan-option:active{background:var(--panel-2);}
  .scan-option[disabled]{opacity:0.5; cursor:default;}
  .scan-option-icon{
    width:46px; height:46px; flex-shrink:0; border-radius:var(--radius-md);
    background:var(--panel-3); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .scan-option-icon svg{width:24px; height:24px;}
  .scan-option-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .scan-option-title{font-family:'Oswald',sans-serif; font-size:15px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;}
  .scan-option-sub{font-size:12px; line-height:1.4; color:var(--text-faint);}
  .scan-option-chevron{width:16px; height:16px; flex-shrink:0; color:var(--text-faint);}

  /* ---------- Empty state (same pattern as SaviorFit Logger) ---------- */
  .empty.tab-empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--text-dim);
    padding:60px 24px;
    gap:14px;
  }
  .empty .glyph{
    width:48px;height:48px;
    color:var(--text-faint);
  }
  .empty p{margin:0;font-size:14px;line-height:1.5;}

  /* ---------- Cards (same pattern as SaviorFit Logger) ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px 14px 12px;
    margin-bottom:14px;
    box-shadow:var(--card-shadow);
  }

  /* Flat (panel-less) card: no box, border, shadow or background — the
     content just sits on the app background. Used on the Log tab. The
     #view prefix beats the compact-density card padding rule. */
  #view .card.flat{
    background:none; border:none; border-radius:0; box-shadow:none;
    padding:0 2px;
  }

  /* History: without the box, each day is separated from the next by a
     thin line under it (none under the last one). */
  #view .card.flat.history-day-card{
    padding:0 2px 10px; margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  #view .card.flat.history-day-card:last-child{border-bottom:none;}

  /* ---------- Buttons (same pattern as SaviorFit Logger) ---------- */
  .btn-primary{
    display:block;
    width:100%;
    background:var(--accent);
    color:#1c1500;
    border:none;
    border-radius:var(--radius-xl);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px;
    cursor:pointer;
  }

  /* ---------- Macro summary + bars ---------- */
  /* No longer sticky/pinned — scrolls away with the rest of the
     content like a normal card, now that it's styled like one
     (rounded corners, border, shadow). Pinning it while everything
     else scrolled underneath looked like it was floating oddly. */
  .macro-cal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .macro-collapse-toggle{
    background:var(--panel-3);border:none;border-radius:50%;
    width:28px;height:28px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:pointer;padding:0;
  }
  .macro-collapse-toggle svg{width:16px;height:16px;transition:transform 0.2s ease;}
  .macro-summary-card.collapsed .macro-collapse-toggle svg{transform:rotate(180deg);}

  /* Minimize: the protein/carbs/fat bars slide shut (height animates
     0fr <-> 1fr), leaving the calorie number and a slim progress line. */
  .macro-bars{display:grid; grid-template-rows:1fr; opacity:1; transition:grid-template-rows 260ms ease, opacity 200ms ease;}
  .macro-bars > div{overflow:hidden; min-height:0;}
  .macro-summary-card.collapsed .macro-bars{
    grid-template-rows:0fr; opacity:0; visibility:hidden;
    transition:grid-template-rows 260ms ease, opacity 160ms ease, visibility 0s linear 260ms;
  }
  .macro-mini-bar{height:4px; border-radius:2px; background:var(--panel-3); overflow:hidden; margin:2px 0 12px;}
  .macro-mini-bar i{display:block; height:100%; border-radius:2px; background:var(--accent);}
  .macro-mini-bar i.over{background:var(--accent-2);}
  .macro-summary-card:not(.collapsed) .macro-mini-bar{display:none;}
  @media (prefers-reduced-motion: reduce){
    .macro-bars, .macro-summary-card.collapsed .macro-bars, .macro-collapse-toggle svg{transition:none;}
  }
  .macro-collapse-toggle:active{background:var(--panel-2);}
  .macro-cal-row-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .reset-log-btn{
    background:none; border:1px solid var(--accent-2-dim); color:var(--accent-2);
    font-size:15px; line-height:1; padding:0;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .reset-log-btn:active{background:var(--accent-2-dim);}
  .macro-cal-row .num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
  .macro-cal-row .num span{font-size:14px;font-weight:500;color:var(--text-faint);}
  .macro-bar-row{margin-bottom:5px;}
  .macro-bar-row:last-child{margin-bottom:0;}

  .macro-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:3px;}
  .macro-bar-label b{color:var(--text);}
  .macro-bar-track{height:5px;border-radius:var(--radius-pill);background:var(--panel-3);overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);}
  .macro-bar-fill.protein{background:var(--success);}
  .macro-bar-fill.carbs{background:#5fa8d6;}
  .macro-bar-fill.fat{background:var(--accent-2);}
  .macro-bar-fill.fiber{background:#a97c50;}
  .macro-bar-fill.sugar{background:#d67ab1;}
  .macro-bar-fill.sodium{background:#4fc3c9;}
  .macro-bar-fill.over{background:var(--accent-2);}

  /* ---------- Quick-add meal form (inside the Add Meal sheet) ---------- */
  #addMealBody .field-row{display:flex;gap:8px;margin-bottom:8px;}
  /* Persistent label above each numeric field — the old placeholder
     text ("kcal", "protein g") explained what a field was only while
     it was empty; once a value got typed or prefilled from a search
     pick, it vanished, leaving bare unlabeled numbers. */
  .field-labeled{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .field-labeled label{font-size:11px;font-weight:600;color:var(--text-faint);padding:0 2px;}

  /* ---------- Meal category picker (inside Add Meal overlay) ---------- */
  .category-picker{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-bottom:12px;
  }
  .category-pill{
    background:var(--panel-2); border:1px solid var(--line);
    color:var(--text-dim); font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:var(--radius-pill); cursor:pointer;
  }
  .category-pill.active{background:var(--accent); border-color:var(--accent); color:#1c1500;}
  .category-pill:active{filter:brightness(1.1);}

  /* Small category tag shown on each meal row and as section headers
     in the grouped Log/History lists. */
  .category-section-label{
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);
    margin:16px 0 6px; padding:0 2px;
  }
  .category-section-label:first-child{margin-top:0;}
  .category-section-total{float:right; color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-weight:400; letter-spacing:0;}

  /* Log meal groups fold away: the header is a button (chevron + name,
     count while folded, kcal at the right) and the rows slide shut. */
  .cat-toggle{
    display:flex; align-items:center; gap:6px; width:100%; margin:16px 0 6px;
    background:none; border:none; text-align:left; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);
  }
  .cat-toggle .category-section-total{margin-left:auto; float:none;}
  .cat-chev{width:13px; height:13px; flex-shrink:0; transition:transform 0.2s ease;}
  .cat-toggle[aria-expanded="false"] .cat-chev{transform:rotate(-90deg);}
  .cat-count{display:none; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--text-faint);}
  .cat-toggle[aria-expanded="false"] .cat-count{display:inline;}
  .meal-group .card.flat{margin-bottom:6px;}
  @media (prefers-reduced-motion: reduce){ .cat-chev{transition:none;} }

  /* Subtler in-card category label for History's single-list view —
     just a small text row between groups of meal rows, no card/border
     of its own, unlike Log's standalone .category-section-label. */
  .inline-category-label{
    font-family:'Oswald',sans-serif; font-size:10.5px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);
    padding:10px 0 4px;
  }
  .inline-category-label:first-child{padding-top:0;}

  /* Brief glow on the sheet right after a food gets picked from
     search/scan — confirms the fill worked without needing a toast
     or alert. Class is added once by openAddMealOverlay() and
     removed via setTimeout, so it plays once per open. */
  @keyframes addMealGlow{
    0%{ box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.55), 0 0 18px 2px rgba(var(--accent-rgb),0.35); border-color:var(--accent); }
    100%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),0); border-color:var(--line); }
  }
  .add-meal-sheet.glow-once{
    animation:addMealGlow 900ms ease-out;
  }
  /* Same glow, no sheet slide-in — for the meal row itself once it
     lands in the Log list, confirming it was actually added. */
  .meal-row.glow-once{
    animation:addMealGlow 900ms ease-out;
    border-radius:var(--radius-sm);
  }
  #addMealBody input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
  }
  #addMealBody input:focus{outline:none;border-color:var(--accent);}
  #addMealBody input::placeholder{color:var(--text-faint);}

  /* ---------- Meal list rows ---------- */
  .meal-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .meal-row:last-child{border-bottom:none;}
  .meal-row-name{font-size:14px;color:var(--text);flex:1;min-width:0;}
  .meal-row-name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meal-row-macros{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);}
  .meal-row-cal{font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);white-space:nowrap;}
  .meal-row-del{
    background:none;border:none;color:var(--text-faint);
    display:flex;align-items:center;justify-content:center;
    padding:6px;cursor:pointer;flex-shrink:0;
  }
  .meal-row-del svg{width:16px;height:16px;display:block;}
  .meal-row-del:active{color:var(--accent-2);}

  /* ---------- History day groups ---------- */
  .history-day-card .history-day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .history-day-head .date{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--text);}
  .history-day-head .total{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);}

  /* ---------- Insights bars ---------- */
  .insight-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .insight-bar-day{width:52px;font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .insight-bar-track{flex:1;height:16px;background:var(--panel-3);border-radius:var(--radius-xs);overflow:hidden;position:relative;}
  .insight-bar-fill{height:100%;background:var(--accent);border-radius:var(--radius-xs);}
  .insight-bar-fill.today{background:#28c4d4;}   /* today's bar is cyan so it stands out from the gold days */
  .insight-bar-fill.over{background:var(--accent-2);}   /* going over the goal is still red, cyan or not (listed after .today so it wins) */
  /* dashed line across the bars at your calorie goal */
  .insight-goal-mark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(255,255,255,0.55);}
  .insight-bar-val{width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);flex-shrink:0;}

  /* Weekly Overview extras (inside the same card, below the bars) */
  /* Calories by meal time: label, bar (share of the total), number + % */
  .meal-split-item{margin-bottom:11px;}
  .meal-split-row{display:flex; align-items:center; gap:10px; margin-bottom:3px;}
  .meal-split-macros{display:flex; gap:11px; margin-left:116px; font-size:11px; color:var(--text-faint);}
  .meal-split-macros b, .dcm-macros b{font-family:'JetBrains Mono',monospace; font-weight:500;}
  .meal-split-macros .p, .dcm-macros .p{color:var(--success);}
  .meal-split-macros .c, .dcm-macros .c{color:#5fa8d6;}
  .meal-split-macros .f, .dcm-macros .f{color:var(--accent-2);}
  .meal-split-macros .fi, .dcm-macros .fi{color:#a97c50;}
  .meal-split-label{width:106px; flex-shrink:0; font-size:13px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .meal-split-track{flex:1; min-width:0; height:14px; background:var(--panel-3); border-radius:var(--radius-xs); overflow:hidden;}
  .meal-split-fill{height:100%; background:var(--accent); border-radius:var(--radius-xs);}
  .meal-split-val{width:74px; flex-shrink:0; text-align:right; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text);}
  .meal-split-val span{margin-left:6px; color:var(--text-faint);}
  .day-card-meals{margin-top:8px; padding-top:6px; border-top:1px solid var(--line); font-size:11.5px; color:var(--text-faint);}
  .dcm-row{display:flex; align-items:baseline; gap:8px; padding:3px 0;}
  .dcm-name{flex:0 0 86px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dcm-row > b{flex:0 0 34px; text-align:right; color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:500;}
  .dcm-macros{flex:1; display:flex; gap:9px; justify-content:flex-end;}
  .week-legend-note{display:flex;align-items:center;gap:8px;margin:-2px 0 0 62px;font-size:11px;color:var(--text-faint);}
  .week-legend-note i{display:inline-block;width:0;height:12px;border-left:2px dashed rgba(255,255,255,0.55);}
  .week-divider{height:1px;background:var(--line);margin:18px 0 16px;}
  .week-divider + .section-label{margin-top:0;}
  .week-stats{display:flex;justify-content:space-between;gap:8px;}
  .week-stat{flex:1;text-align:center;}
  .week-stat b{display:block;font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;line-height:1.1;color:var(--text);}
  .week-stat span{display:block;margin-top:3px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);}
  .week-note{margin-top:12px;text-align:center;font-size:11px;color:var(--text-faint);}
  .split-bar{display:flex;gap:2px;height:16px;border-radius:var(--radius-xs);overflow:hidden;background:var(--panel-3);}
  .split-bar i{display:block;height:100%;}
  .split-bar .p{background:var(--success);}
  .split-bar .c{background:#5fa8d6;}
  .split-bar .f{background:var(--accent-2);}
  .split-legend{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--text-dim);}
  .split-legend b{color:var(--text);}
  .split-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
  .split-legend .p{background:var(--success);}
  .split-legend .c{background:#5fa8d6;}
  .split-legend .f{background:var(--accent-2);}

  /* ---------- Insights "Today" macro rings ---------- */
  .calorie-ring-row{display:flex;justify-content:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .calorie-ring-item{display:flex;flex-direction:column;align-items:center;}
  .calorie-ring-wrap{position:relative;width:116px;height:116px;}
  .calorie-ring-svg{width:116px;height:116px;transform:rotate(-90deg);}
  .calorie-ring-track{fill:none;stroke:var(--panel-3);stroke-width:10;}
  .calorie-ring-fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 500ms ease;}
  .calorie-ring-fill.over{stroke:var(--accent-2);}
  .calorie-ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; color:var(--text);
  }
  .calorie-ring-pct.over{color:var(--accent-2);}
  .calorie-ring-label{
    margin-top:10px; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim);
  }
  .calorie-ring-sub{margin-top:2px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);}

  .macro-ring-row{display:flex;justify-content:space-between;gap:8px;padding-top:2px;}
  .macro-ring-item{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
  .macro-ring-wrap{position:relative;width:76px;height:76px;}
  .macro-ring-svg{width:76px;height:76px;transform:rotate(-90deg);}
  .macro-ring-track{fill:none;stroke:var(--panel-3);stroke-width:7;}
  .macro-ring-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 500ms ease;}
  .macro-ring-fill.protein{stroke:var(--success);}
  .macro-ring-fill.carbs{stroke:#5fa8d6;}
  .macro-ring-fill.fat{stroke:var(--accent-2);}
  .macro-ring-fill.over{stroke:var(--accent-2);}
  .macro-ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:700; color:var(--text);
  }
  .macro-ring-pct.over{color:var(--accent-2);}
  .macro-ring-label{
    margin-top:9px; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dim);
  }
  .macro-ring-sub{margin-top:2px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-faint);}

  .remaining-row{display:flex;justify-content:space-between;gap:6px;padding-top:14px;margin-top:14px;border-top:1px solid var(--line);}
  .remaining-item{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;}
  .remaining-item .num{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;}
  .remaining-item .num.over{color:var(--accent-2);}
  .remaining-item .lbl{
    margin-top:3px; font-family:'Oswald',sans-serif; font-size:10px; font-weight:700;
    letter-spacing:0.03em; text-transform:uppercase; color:var(--text-faint); text-align:center;
  }

  .insight-caption{
    font-family:'Inter',sans-serif; font-size:12.5px; line-height:1.4;
    color:var(--text-dim); margin:16px 0 0; padding:10px 12px;
    background:var(--panel-3); border-radius:var(--radius-sm);
  }
  .insight-caption.balanced{color:var(--success);background:var(--success-dim);}
  .insight-caption .cap-protein{color:var(--success);font-weight:700;}
  .insight-caption .cap-carbs{color:#5fa8d6;font-weight:700;}
  .insight-caption .cap-fat{color:var(--accent-2);font-weight:700;}

  /* ---------- Settings ---------- */
  /* Plain spacing wrapper — used only where a raw <h3> label sits
     above its own already-boxed .card (Your profile, Daily goals),
     so it stays unboxed instead of nesting a second box around the
     .card's box (same background/border, so the inner border was
     barely visible against its own parent — a real visual bug, not
     a style choice). */
  .settings-section{margin-bottom:18px;}
  .settings-section h3{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);
    margin:0 0 10px;
  }
  .settings-goal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .settings-goal-row label{font-size:13px;color:var(--text-dim);}
  .settings-goal-row input{
    width:80px;text-align:right;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 8px;
  }
  .settings-goal-row input:focus{outline:none;border-color:var(--accent);}
  .settings-goal-row select{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 8px;
    max-width:150px;
  }
  .settings-goal-row select:focus{outline:none;border-color:var(--accent);}
  .plan-result-banner{
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--text-dim);
  }
  .plan-result-banner b{color:var(--accent);}
  .btn-danger{
    display:block;width:100%;background:none;border:1px solid var(--accent-2);
    color:var(--accent-2);border-radius:var(--radius-xl);font-family:'Oswald',sans-serif;
    font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:12px;cursor:pointer;
  }

  /* ---------- Selected-food banner (shown in the add-meal card
     once a search/scan result has been picked) ---------- */
  .selected-food-banner{
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--text-dim);
  }
  .selected-food-banner-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  /* Small picture of the food you picked (same photo/emoji as in the search). */
  .selected-food-banner .food-thumb{width:32px;height:32px;font-size:18px;border-radius:var(--radius-xs);}
  .banner-food{display:flex;align-items:center;gap:10px;min-width:0;}
  .selected-food-banner b{color:var(--text);}
  /* Serving picker: unit chips (scroll sideways) + amount stepper */
  .serving-label{
    font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--text-faint); margin:10px 0 5px;
  }
  .serving-chips{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .serving-chips::-webkit-scrollbar{display:none;}
  .serving-chip{
    flex-shrink:0; white-space:nowrap; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:var(--radius-pill); padding:7px 13px; font-size:12px; font-weight:600;
  }
  .serving-chip.active{background:var(--accent); border-color:var(--accent); color:#1c1500;}
  body[data-theme="light"] .serving-chip.active{color:#fff;}
  .serving-qty{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .serving-qty .serving-label{margin:0; flex:0 0 auto;}
  .qty-btn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%; padding:0; cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  #addMealBody .serving-qty input{
    flex:0 0 74px; width:74px; text-align:center;
    font-family:'JetBrains Mono',monospace; font-size:15px; padding:7px 6px;
  }
  .serving-eq{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-faint); white-space:nowrap;}
  .selected-food-banner .grams-input{
    width:60px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius-xs);color:var(--text);font-family:'JetBrains Mono',monospace;
    font-size:12px;padding:5px 6px;text-align:center;
  }
  /* Only shown when the picked food has a known serving size (OFF
     products with contributor-entered serving data) — grams-only
     otherwise, since guessing a serving size would just be wrong. */
  .unit-toggle{display:flex;gap:2px;background:var(--panel-2);border-radius:var(--radius-sm);padding:3px;margin-top:8px;}
  .unit-toggle button{
    flex:1;background:none;border:none;color:var(--text-faint);
    padding:6px 8px;border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;
  }
  .unit-toggle button.active{background:var(--accent);color:#1c1500;}

  /* ---------- Barcode scanner overlay ---------- */
  .scan-overlay{
    position:fixed;inset:0;background:#000;z-index:999;
    display:flex;flex-direction:column;
  }
  .scan-overlay video{flex:1;width:100%;object-fit:cover;}
  .scan-overlay-status{
    position:absolute;top:calc(18px + var(--safe-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:13px;padding:0 20px;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  .scan-overlay-frame{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:88%;max-width:360px;aspect-ratio:4/3;
    border:2px solid var(--accent);border-radius:var(--radius-md);
    box-shadow:0 0 0 2000px rgba(0,0,0,0.4);
  }
  .scan-overlay-controls{
    position:absolute;bottom:calc(30px + var(--safe-bottom));left:0;right:0;
    display:flex;align-items:center;justify-content:center;gap:18px;
  }
  .scan-overlay-cancel{
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius-pill);font-family:'Oswald',sans-serif;font-size:13px;
    font-weight:700;letter-spacing:0.03em;text-transform:uppercase;padding:12px 28px;cursor:pointer;
  }
  .scan-overlay-capture{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    background:var(--accent);color:#14161a;border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .scan-overlay-capture svg{width:22px;height:22px;}
  .scan-overlay-capture.loading{opacity:0.55;pointer-events:none;}
  .scan-overlay-capture:active{opacity:0.85;}

  /* ---------- Settings — same structural classes as SaviorFit Logger ---------- */
  .section-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:22px 0 8px;
  }
  .section-label:first-child{margin-top:0;}
  .settings-group{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 14px;
    margin-bottom:16px;
    box-shadow:var(--card-shadow);
  }
  .settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 0;
    border-top:1px solid var(--line);
    gap:12px;
  }
  .settings-row:first-child{border-top:none;}
  .settings-row .sr-label{font-size:14px;color:var(--text);font-weight:600;}
  .settings-row .sr-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;line-height:1.4;}
  .settings-row .sr-action{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--accent);
    border-radius:var(--radius-sm);
    padding:8px 14px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    flex-shrink:0;
  }
  .settings-row .sr-action-danger{color:var(--accent-2);border-color:var(--accent-2-dim);}
  .settings-row .seg{display:flex;background:var(--panel-2);border-radius:var(--radius-sm);padding:3px;flex-shrink:0;}
  .settings-row .seg button{
    background:none;border:none;color:var(--text-faint);
    padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;cursor:pointer;
    font-family:'JetBrains Mono',monospace;
  }
  .settings-row .seg button.active{background:var(--accent);color:#1c1500;}
  .settings-version{text-align:center;color:var(--text-faint);font-size:11px;padding:16px 0 4px;letter-spacing:0.02em;}
  .danger-zone-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .danger-zone-toggle .dz-chevron{font-size:10px;color:var(--text-faint);transition:transform 0.15s ease;}
  .danger-zone-toggle.open .dz-chevron{transform:rotate(180deg);}

  /* ---------- Density + corner-style overrides (Appearance settings) ---------- */
  body[data-density="compact"] .meal-row{padding:6px 0;}
  body[data-density="compact"] .card{padding:10px 10px 8px;}
  body[data-corners="sharp"]{
    --radius-xs:2px; --radius-sm:2px; --radius:2px;
    --radius-md:2px; --radius-lg:2px; --radius-xl:2px; --radius-pill:2px;
  }

  /* ---------- Food search overlay — same structure/animation as
     SaviorFit Logger's exercise search overlay ---------- */
  .food-search-overlay{
    position:absolute;
    inset:0;
    z-index:92;
    background:rgba(14,16,19,0.82);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    animation:foodSearchBackdropIn 0.22s ease;
  }
  .food-search-overlay.hidden{display:none;}
  .food-search-overlay-panel{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    animation:foodSearchPanelIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .food-search-overlay-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:calc(18px + var(--safe-bottom)) 16px 12px;
    flex-shrink:0;
  }
  .food-search-back, .food-search-scan-btn{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:none;
    background:var(--panel-3);color:var(--text);cursor:pointer;padding:0;
  }
  .food-search-back svg, .food-search-scan-btn svg{display:block;width:18px;height:18px;}
  .food-search-back:active, .food-search-scan-btn:active{background:var(--panel-2);transform:scale(0.94);}
  .food-search-overlay-input{
    flex:1;min-width:0;
    background:var(--panel-2);
    border:1.5px solid var(--accent-dim);
    color:var(--text);
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  .food-search-overlay-input:focus{outline:none;border-color:var(--accent);}
  .food-suggest-list{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 16px calc(20px + var(--safe-bottom));
    display:flex;flex-direction:column;gap:8px;
  }
  .food-suggest-item{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    text-align:left;background:var(--panel-3);border:1px solid var(--line);color:var(--text);
    font-size:13.5px;font-family:'Inter',sans-serif;font-weight:500;
    padding:9px 12px;border-radius:var(--radius);cursor:pointer;
  }
  /* Picture tile at the left of each search result: the product photo
     when there is one, otherwise an emoji picked from the food's name. */
  .food-thumb{
    width:38px;height:38px;flex-shrink:0;border-radius:var(--radius-sm);
    background:var(--panel);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:21px;line-height:1;
  }
  .food-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  /* The Add Meal banner's thumbnail is tappable (opens the big photo). */
  .food-thumb-btn{border:none;padding:0;cursor:pointer;}
  .food-thumb-btn:active{filter:brightness(1.15);}

  /* Confirmation sheet — slides up from the bottom (used for deleting a
     logged food). The backdrop fades in, the sheet rides up, and the
     grab handle can be dragged down to dismiss it. */
  .confirm-overlay{
    position:absolute; inset:0; z-index:99; display:flex; align-items:flex-end; justify-content:center;
    overflow:hidden;              /* the closed sheet sits below the screen — don't let it add scroll room */
    overscroll-behavior:contain;
  }
  .confirm-overlay.hidden{display:none;}
  .confirm-backdrop{
    position:absolute; inset:0; background:rgba(8,9,11,0.58);
    opacity:0; transition:opacity 260ms ease;
  }
  .confirm-backdrop:active{filter:none;}   /* no brightness flash on the big dim layer */
  .confirm-overlay.open .confirm-backdrop{opacity:1;}
  .confirm-sheet{
    position:relative; width:100%; max-width:480px;
    background:var(--panel); border:1px solid var(--line); border-bottom:none;
    border-radius:var(--radius-xl) var(--radius-xl) 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.45);
    padding:4px 20px calc(20px + var(--safe-bottom));
    transform:translate3d(0,100%,0);
    transition:transform 360ms cubic-bezier(0.32,0.72,0,1);
    will-change:transform;
  }
  .confirm-overlay.open .confirm-sheet{transform:translate3d(0,0,0);}
  .confirm-sheet.dragging{transition:none;}
  .confirm-grab{height:28px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab;}
  .confirm-grab i{display:block; width:40px; height:4px; border-radius:2px; background:var(--text-faint); opacity:0.5;}
  .confirm-icon{
    width:46px; height:46px; margin:0 auto 10px; border-radius:50%;
    background:rgba(214,72,60,0.14); color:var(--accent-2);
    display:flex; align-items:center; justify-content:center;
  }
  .confirm-icon svg{width:22px; height:22px;}
  .confirm-title{
    margin:0; text-align:center; font-family:'Oswald',sans-serif; font-size:19px;
    font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text);
  }
  .confirm-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:14px 0 10px; padding:12px 14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-lg);
  }
  .confirm-item-text{min-width:0;}
  .confirm-item-name{font-size:15px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .confirm-item-detail{margin-top:2px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint);}
  .confirm-item-kcal{flex-shrink:0; font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--accent);}
  .confirm-note{margin:0 0 16px; text-align:center; font-size:12.5px; line-height:1.45; color:var(--text-faint);}
  .confirm-yes, .confirm-cancel{
    display:block; width:100%; border-radius:var(--radius-xl);
    font-family:'Oswald',sans-serif; font-size:14px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; cursor:pointer;
  }
  .confirm-yes{background:var(--accent-2); color:#fff; border:none; padding:14px; margin-bottom:10px;}
  .confirm-cancel{background:none; color:var(--text-dim); border:1px solid var(--line); padding:13px;}
  @media (prefers-reduced-motion: reduce){
    .confirm-sheet, .confirm-backdrop{transition:none;}
  }

  /* Big photo viewer — opened from the Add Meal banner thumbnail. */
  .photo-overlay{
    position:absolute; inset:0; z-index:98;
    display:flex; align-items:center; justify-content:center;
    padding:24px 20px;
  }
  .photo-overlay.hidden{display:none;}
  .photo-overlay-backdrop{
    position:absolute; inset:0;
    background:rgba(8,9,11,0.82);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .photo-overlay-card{
    position:relative; width:100%; max-width:380px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-xl); box-shadow:var(--card-shadow);
    padding:12px 12px 14px;
  }
  .photo-overlay-close{position:absolute; top:-12px; right:-6px; z-index:1; box-shadow:var(--card-shadow);}
  .photo-overlay-frame{
    background:var(--panel-2); border-radius:var(--radius-lg); overflow:hidden;
    display:flex; align-items:center; justify-content:center; min-height:160px;
  }
  .photo-overlay-frame img{display:block; width:100%; max-height:62vh; object-fit:contain;}
  .photo-overlay-name{
    margin-top:12px; padding:0 4px; text-align:center;
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:700;
    letter-spacing:0.03em; color:var(--text); overflow-wrap:anywhere;
  }
  .photo-overlay-credit{margin-top:4px; text-align:center; font-size:10.5px; color:var(--text-faint);}
  .food-suggest-item:active{background:var(--panel);border-color:var(--accent-dim);}
  /* The name wraps onto up to two lines (instead of being chopped with
     "..."), with the small grey line under it carrying the category /
     serving / "Saved" details that used to crowd the right-hand tag. */
  .food-suggest-name{flex:1;min-width:0;}
  .food-suggest-title{
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden; line-height:1.3; overflow-wrap:anywhere;
  }
  .food-suggest-name .brand{
    display:block; margin-top:2px; font-size:11px; color:var(--text-faint);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .food-suggest-tag{
    flex-shrink:0;background:var(--panel);color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;
    letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius);
  }
  .food-suggest-status{font-size:12px;color:var(--text-faint);padding:8px 4px;}

  /* Trigger button that opens the overlay, replacing the old inline box */
  .food-search-trigger{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius-lg);color:var(--text-dim);font-size:14px;
    padding:12px 14px;cursor:pointer;margin:10px 0 0;
  }
  .food-search-trigger svg{width:18px;height:18px;flex-shrink:0;color:var(--text-faint);}

  /* Same dashed-border pattern for the "use what I typed" option
     pinned above search results when nothing's an exact match. */
  .food-suggest-custom{
    width:100%;text-align:left;background:transparent;
    border:1.5px dashed var(--accent-dim);color:var(--accent);
    font-size:13.5px;font-weight:600;padding:13px 14px;
    border-radius:var(--radius);cursor:pointer;margin-bottom:8px;
  }
  .food-suggest-custom:active{background:var(--accent-dim);}

  @keyframes foodSearchBackdropIn{ 0%{opacity:0;} 100%{opacity:1;} }
  @keyframes foodSearchPanelIn{ 0%{opacity:0;transform:translateY(28px);} 100%{opacity:1;transform:translateY(0);} }

  /* ---------- Add Meal overlay — centered modal, distinct from the
     full-screen search overlay so the two don't feel like the same
     pattern stacked twice ---------- */
  /* Add Meal and the AI "Scanned meal" sheet are bottom sheets: the dim
     backdrop fades in and the sheet rides up from the bottom edge (same
     feel as the delete confirmation). JS adds .open a frame after
     un-hiding so the slide can play, and waits for the slide-down before
     hiding again. --kb / --vvh are set from the visual viewport while
     the on-screen keyboard is up, so the sheet sits above the keyboard. */
  .add-meal-overlay{
    position:absolute; inset:0; z-index:95;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:var(--kb, 0px);
    overflow:hidden;                 /* the closed sheet sits below the screen — don't let it add scroll room */
    overscroll-behavior:contain;
  }
  .add-meal-overlay.hidden{display:none;}
  .add-meal-backdrop{
    position:absolute; inset:0;
    background:rgba(8,9,11,0.58);
    opacity:0; transition:opacity 260ms ease;
  }
  .add-meal-backdrop:active{filter:none;}
  .add-meal-overlay.open .add-meal-backdrop{opacity:1;}
  .add-meal-sheet{
    position:relative;
    width:100%; max-width:480px;
    max-height:88vh; max-height:min(88dvh, calc(var(--vvh, 100dvh) - 12px));
    background:var(--panel);
    border:1px solid var(--line); border-bottom:none;
    border-radius:var(--radius-xl) var(--radius-xl) 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.45);
    padding:4px 18px calc(20px + var(--safe-bottom));
    display:flex; flex-direction:column;
    transform:translate3d(0,100%,0);
    transition:transform 360ms cubic-bezier(0.32,0.72,0,1);
    will-change:transform;
  }
  .add-meal-overlay.open .add-meal-sheet{transform:translate3d(0,0,0);}
  .add-meal-sheet.dragging{transition:none;}
  .sheet-grab{height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab;}
  .sheet-grab i{display:block; width:40px; height:4px; border-radius:2px; background:var(--text-faint); opacity:0.5;}
  @media (prefers-reduced-motion: reduce){
    .add-meal-sheet, .add-meal-backdrop{transition:none;}
  }
  .add-meal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .add-meal-head h2{
    margin:0; font-family:'Oswald',sans-serif; font-size:16px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text);
  }
  .add-meal-close{
    width:30px;height:30px;flex-shrink:0;border-radius:50%;
    background:var(--panel-3);border:none;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .add-meal-close svg{width:15px;height:15px;}
  .add-meal-close:active{background:var(--panel-2);}
  .add-meal-body{overflow-y:auto; flex:1 1 auto; min-height:0;}
  /* the Add Meal button sits outside the scrolling part, so it never gets pushed off screen */
  .add-meal-footer{flex-shrink:0; padding-top:10px;}

  /* One-line summaries (Meal time, Nutrition) that open into the full
     controls; the panel slides open with the same 0fr -> 1fr trick as
     the Log's macro card. */
  .sum-row{
    display:flex; align-items:center; gap:10px; width:100%; margin:0 0 8px; text-align:left;
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--text); padding:11px 12px; cursor:pointer;
  }
  .sum-row:active{background:var(--panel-3);}
  .sum-row-label{
    flex-shrink:0; font-family:'Oswald',sans-serif; font-size:10.5px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--text-faint); min-width:62px;
  }
  .sum-row-value{flex:1; min-width:0; font-size:13.5px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sum-row-edit{flex-shrink:0; font-size:11.5px; font-weight:600; color:var(--accent);}
  .sum-row-chev{flex-shrink:0; width:16px; height:16px; color:var(--text-faint); transition:transform 0.2s ease;}
  .sum-row[aria-expanded="true"] .sum-row-chev{transform:rotate(180deg);}
  .acc{
    display:grid; grid-template-rows:0fr; visibility:hidden;
    transition:grid-template-rows 240ms ease, visibility 0s linear 240ms;
  }
  .acc.open{grid-template-rows:1fr; visibility:visible; transition:grid-template-rows 240ms ease, visibility 0s;}
  .acc > div{overflow:hidden; min-height:0;}
  .acc .category-picker{margin-bottom:8px;}
  .acc-fields{padding:2px 1px 0;}
  @media (prefers-reduced-motion: reduce){ .acc, .acc.open, .sum-row-chev{transition:none;} }

  /* AI food scan result sheet (rows of name + grams, live macros) */
  .ai-scan-note{font-size:12px; line-height:1.45; color:var(--text-faint); margin-bottom:12px;}
  .ai-item{padding:10px 0; border-top:1px solid var(--line);}
  .ai-item:first-child{border-top:none; padding-top:0;}
  .ai-item-top{display:flex; align-items:center; gap:8px;}
  .ai-item-name, .ai-item-grams{
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-sm);
    color:var(--text); font-size:14px; padding:8px 10px;
  }
  .ai-item-name{flex:1; min-width:0;}
  .ai-item-name:focus, .ai-item-grams:focus{outline:none; border-color:var(--accent);}
  .ai-item-del{
    width:28px; height:28px; flex-shrink:0; border-radius:50%; padding:0;
    background:var(--panel-3); border:none; color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:18px; line-height:1;
  }
  .ai-item-del:active{background:var(--panel-2); color:var(--accent-2);}
  .ai-item-bottom{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .ai-item-grams{width:76px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:13px;}
  .ai-item-unit{font-size:12px; color:var(--text-faint);}
  .ai-item-macros{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); text-align:right;}
  .ai-scan-total{
    display:flex; justify-content:space-between; gap:10px; align-items:baseline;
    padding:12px 0 14px; border-top:1px solid var(--line);
    font-family:'Oswald',sans-serif; font-size:13px; font-weight:700; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--text);
  }
  .ai-scan-total span:last-child{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--accent);}

  /* ---------- Nutrient info popover — same overlay pattern as Add
     Meal, just a smaller fixed-content card instead of a form. ---------- */
  .nutrient-info-overlay{
    position:absolute; inset:0; z-index:96;
    display:flex; align-items:center; justify-content:center;
    padding:24px 20px;
  }
  .nutrient-info-overlay.hidden{display:none;}
  .nutrient-info-backdrop{
    position:absolute; inset:0;
    background:rgba(10,11,13,0.62);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .nutrient-info-card{
    position:relative;
    width:100%; max-width:340px;
    max-height:80vh; overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-xl);
    box-shadow:var(--card-shadow);
    padding:18px 18px 20px;
  }
  .nutrient-info-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .nutrient-info-head h3{
    margin:0; font-family:'Oswald',sans-serif; font-size:16px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--text);
  }
  .nutrient-info-head button{
    width:28px;height:28px;flex-shrink:0;border-radius:50%;
    background:var(--panel-3);border:none;color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .nutrient-info-head button svg{width:14px;height:14px;}
  .nutrient-info-head button:active{background:var(--panel-2);}
  .nutrient-info-image{display:block;width:100%;height:auto;border-radius:var(--radius-md);}

  /* Info button on the Today card header, opens the macros/fiber
     guide image. */
  .nutrient-info-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px;
    background:none; border:none; color:var(--text-faint); cursor:pointer; padding:0;
  }
  .nutrient-info-btn svg{width:100%;height:100%;}
  .nutrient-info-btn:active{color:var(--text-dim);}
  .today-card-head{display:flex;align-items:center;justify-content:space-between;}
  .today-card-head .section-label{margin:0;}

  /* 3D / Plain switch for Daily Overview — two icons, the active one
     highlighted, stuck flush into the top-right corner of the panel
     (no gap): it only keeps its left and bottom borders, the panel's
     own edge is the other two. */
  .mode-toggle{
    display:inline-flex; overflow:hidden;
    background:var(--panel-2);
    border:1px solid var(--line); border-top:none; border-right:none;
    border-radius:0 0 0 var(--radius-md);
  }
  .mode-toggle button{
    display:flex; align-items:center; justify-content:center;
    width:40px; height:34px; padding:0;
    background:none; border:none; color:var(--text-faint); cursor:pointer;
  }
  .mode-toggle button + button{border-left:1px solid var(--line);}
  .mode-toggle button.active{color:var(--accent); background:var(--panel-3);}
  .mode-toggle svg{width:18px; height:18px;}
  /* Plain view, full screen: no card box around it — the rings and
     bars run edge to edge on the app background (#view drops its side
     padding while this is showing), and the switch is pinned flush to
     the top-right corner of the screen, like in the 3D view. */
  body.has-insights-subtab main#view.plain-fullscreen{padding-left:0; padding-right:0;}
  #view > .overview-plain:first-child{position:relative; margin-top:0; padding:0 20px;}
  body[data-density="compact"] #view > .overview-plain:first-child{padding:0 14px;}
  .overview-plain .today-card-head{min-height:34px; margin-bottom:8px;}
  .overview-plain .mode-toggle{position:absolute; top:0; right:0; border-top-right-radius:0;}
  /* Week wheel: day tags pinned above each wedge, a summary chip, and
     the card that opens when you tap a wedge. */
  .day-tag{
    position:absolute; left:0; top:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:0;
    padding:3px 9px 4px; min-width:44px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
    opacity:0; transform:translate3d(-300px,-300px,0); will-change:transform, opacity;
  }
  .day-tag-name{font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); line-height:1.3;}
  .day-tag-val{font-family:'Oswald',sans-serif; font-size:15px; font-weight:700; color:var(--text); line-height:1.1;}
  .day-tag-val.over{color:var(--accent-2);}
  .day-tag.today{border-color:var(--accent);}
  .day-tag.today .day-tag-name{color:var(--accent);}
  .day-tag.skipped .day-tag-val{color:var(--text-faint); font-weight:400;}
  .week-chip{
    position:absolute; top:10px; left:12px; z-index:2; pointer-events:none;
    padding:6px 12px; border-radius:var(--radius-pill);
    background:var(--panel); border:1px solid var(--line);
    font-size:11.5px; color:var(--text-dim);
  }
  .week-chip b{color:var(--text);}
  .day-card{
    position:absolute; left:12px; right:12px; bottom:14px; z-index:3;
    padding:12px 14px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:var(--card-shadow);
  }
  .day-card.hidden{display:none;}
  .day-card-head{display:flex; align-items:baseline; gap:10px;}
  .day-card-head b{font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text);}
  .day-card-head span{flex:1; font-size:13px; color:var(--text-dim);}
  .day-card-close{background:none; border:none; color:var(--text-faint); font-size:22px; line-height:1; padding:0 2px; cursor:pointer; align-self:center;}
  .day-card-macros{display:flex; justify-content:space-between; gap:8px; margin-top:8px; font-size:12px; color:var(--text-dim);}
  .day-card-macros b{color:var(--text);}
  .day-card-macros .p{color:var(--success);}
  .day-card-macros .c{color:#5fa8d6;}
  .day-card-macros .f{color:var(--accent-2);}

  /* "Meals today" drawer on the pyramid view: a small tab tucked into the
     top-left corner (mirroring the 3D/Plain switch on the right) that
     slides a panel out from the left edge; × or the tab closes it again. */
  .meal-drawer{
    position:absolute; top:0; left:0; z-index:3; display:flex; align-items:flex-start;
    transform:translateX(calc(-100% + 42px));   /* closed: only the tab shows */
    transition:transform 320ms cubic-bezier(0.32,0.72,0,1);
    will-change:transform;
  }
  .meal-drawer.open{transform:translateX(0);}
  .meal-drawer-panel{
    width:min(292px, calc(100vw - 60px)); padding:12px 14px 13px;
    background:var(--panel); border:1px solid var(--line); border-left:none; border-top:none;
    border-radius:0 0 var(--radius-lg) 0; box-shadow:var(--card-shadow);
    visibility:hidden; transition:visibility 0s linear 320ms;
  }
  .meal-drawer.open .meal-drawer-panel{visibility:visible; transition:visibility 0s;}
  .meal-drawer-handle{
    flex-shrink:0; width:42px; padding:9px 0 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:var(--panel-2); border:1px solid var(--line); border-left:none; border-top:none;
    border-radius:0 var(--radius-md) var(--radius-md) 0; color:var(--accent);
  }
  .meal-drawer-handle svg{width:18px; height:18px;}
  .meal-drawer-handle span{font-family:'Oswald',sans-serif; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint);}
  .meal-drawer.open .meal-drawer-handle{color:var(--text-faint);}
  .meal-drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .meal-drawer-head b{font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text);}
  .meal-drawer-item{margin-bottom:9px;}
  .meal-drawer-line{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--text-dim);}
  .meal-drawer-line b{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; color:var(--text);}
  .meal-drawer-bar{height:4px; margin:4px 0 5px; border-radius:2px; background:var(--panel-3); overflow:hidden;}
  .meal-drawer-bar i{display:block; height:100%; border-radius:2px; background:var(--accent);}
  .meal-drawer .meal-split-macros{margin-left:0; gap:12px;}
  .meal-drawer-total{display:flex; justify-content:space-between; align-items:baseline; margin-top:2px; padding-top:8px; border-top:1px solid var(--line); font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);}
  .meal-drawer-total b{font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--accent);}
  .meal-drawer-total + .meal-split-macros{margin-top:3px;}
  .meal-drawer-empty{font-size:12.5px; color:var(--text-faint); padding:2px 0 4px;}
  @media (prefers-reduced-motion: reduce){ .meal-drawer, .meal-drawer-panel{transition:none;} }

  /* 3D view: pinned to the top-right corner of the full-bleed panel. */
  .mode-toggle.floating{position:absolute; top:0; right:0; z-index:2; border-top-right-radius:0;}

  /* ---------- Insights "Daily Overview" — 3D model panel ----------
     The card is sized to fill the space between the top bar and the
     bottom nav so the page itself doesn't scroll while you drag the
     model around. The card has no border/background of its own and
     the canvas is transparent, so the model sits directly on the
     app background with no box around it. */
  #view .card.model-card{
    position:relative;
    padding:0;
    overflow:hidden;
    background:none;
    border:none;
    border-radius:0;
    box-shadow:none;
    height:clamp(320px, calc(100vh - 240px - var(--safe-bottom)), 640px);
    height:clamp(320px, calc(100dvh - 240px - var(--safe-bottom)), 640px);
  }
  /* Full-screen mode: while the 3D panel is showing, #view drops its
     padding/scroll and the card stretches edge to edge between the
     top bar and the bottom nav (JS sets card bottom = nav height). */
  body.has-insights-subtab main#view.model-fullscreen{padding:0; overflow:hidden; position:relative;}
  #view.model-fullscreen > .card.model-card{
    position:absolute; top:0; left:0; right:0; bottom:0;
    height:auto; margin:0;
  }
  .model-stage{position:absolute; inset:0;}

  /* Tags that sit ON the pyramid, one per side (protein / carbs /
     fibre / fat): a small ring plus today's amount. JS pins each one
     to a spot on its side and moves it as the pyramid turns, fading
     it out as its side turns away. Touches pass through to the model. */
  .face-tag{
    position:absolute; left:0; top:0; z-index:2; pointer-events:none;
    display:flex; align-items:center; gap:8px;
    padding:6px 12px 6px 6px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:0 4px 14px rgba(0,0,0,0.35);
    opacity:0; transform:translate3d(-300px,-300px,0);
    will-change:transform, opacity;
  }
  .face-ring{position:relative; width:38px; height:38px; flex:none;}
  .face-ring svg{width:38px; height:38px; transform:rotate(-90deg);}
  .face-ring-track{fill:none; stroke:var(--panel-3); stroke-width:4.5;}
  /* The ring starts empty and draws itself in each time its side turns
     toward you (JS adds .in to the tag), then clears again when the side
     turns away, so it replays on every spin. */
  .face-ring-fill{fill:none; stroke-width:4.5; stroke-linecap:round; stroke-dashoffset:var(--full, 0);}
  .face-tag.in .face-ring-fill{stroke-dashoffset:var(--off, 0); transition:stroke-dashoffset 850ms cubic-bezier(0.22,1,0.36,1);}
  @media (prefers-reduced-motion: reduce){ .face-tag.in .face-ring-fill{transition:none;} }
  .face-ring-fill.protein{stroke:var(--success);}
  .face-ring-fill.carbs{stroke:#5fa8d6;}
  .face-ring-fill.fat{stroke:var(--accent-2);}
  .face-ring-fill.fiber{stroke:#a97c50;}
  .face-ring-fill.over{stroke:var(--accent-2);}
  .face-ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; color:var(--text);
  }
  .face-ring-pct.over{color:var(--accent-2);}
  .face-name{font-family:'Oswald',sans-serif; font-size:13px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text);}
  .face-amount{margin-top:1px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap;}
  .face-amount.over{color:var(--accent-2);}
  .model-stage canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab; outline:none;}
  .model-status{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:24px; text-align:center; font-size:13px; line-height:1.5;
    color:var(--text-faint); pointer-events:none;
  }
  .model-bar{width:160px; height:3px; border-radius:2px; background:var(--line); overflow:hidden;}
  .model-bar i{display:block; height:100%; width:0; background:var(--accent); transition:width 150ms ease;}

  .hidden{display:none !important;}

  .boot-loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .boot-loading-mark{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .boot-loading-mark span{color:var(--accent);}
</style>
</head>

<script>
/*! SaviorFuel — Copyright (c) 2026 Xavier Chua (Savior). All rights reserved. See LICENSE. */
  // =========================================================
  // SAVIORFUEL — local-state working version
  // Visual shell copied from SaviorFit Logger. Data layer here
  // is 100% local (in-memory + localStorage) — no Firebase, no
  // auth, no sync across devices yet. That's intentional: this
  // is meant to prove out the actual product before wiring up a
  // backend. Data model (meal shape, settings shape) is written
  // to already look like what would eventually go in Firestore,
