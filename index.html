  var searchRequestId = 0; // guards against a slow older request overwriting a newer one's results
  var USDA_API_KEY = 'DcPJpdzm8AjRDIpzmzfL3fJavbtVWsAY6bGtEQYi';

  var TECHAPI_KEY = 'tech_2f095b353334f3552fb2356065ca43bd9fe42e2e584fc76cda30555e984fb40c';

  // Kalori (via techapi.my) — Malaysian food database. Response envelope
  // is {success, data, meta}; exact nesting of the food list inside
  // `data` wasn't confirmed from docs, so this checks a few reasonable
  // shapes defensively rather than assuming one and silently returning
  // nothing if it's wrong.
  function fetchKalori(query){
    var url = 'https://api.techapi.my/api/v2/kalori/foods/search?q=' + encodeURIComponent(query);
    return fetch(url, { headers: { 'X-API-Key': TECHAPI_KEY } })
      .then(function(res){ return res.json(); })
      .then(function(json){
        if (!json || json.success === false) return [];
        var d = json.data;
        var list = Array.isArray(d) ? d
          : (d && (d.foods || d.results || d.items)) || [];
        return list
          .filter(function(f){ return f && f.name && f.calories != null; })
          .map(function(f){
            return {
              product_name: f.name,
              brands: f.category || '',
              nutriments: {
                'energy-kcal_100g': f.calories,
                'proteins_100g': f.protein || 0,
                'carbohydrates_100g': f.carbs || 0,
                'fat_100g': f.fat || 0
              },
              _source: 'techapi',
              _serving: f.serving || null
            };
          });
      })
      .catch(function(err){
        console.error('SaviorFuel: Kalori (techapi.my) search failed —', err);
        return [];
      });
  }

  // Normalizes a USDA FoodData Central food into the same shape as an
  // Open Food Facts product, so the rest of the search/pick pipeline
  // (pickFoodResult, applySelectedFoodToForm) doesn't need to know or
  // care which source a result came from.
  function usdaToProductShape(food){
    var n = {};
    (food.foodNutrients || []).forEach(function(fn){
      if (fn.nutrientName === 'Energy' && fn.unitName === 'KCAL') n['energy-kcal_100g'] = fn.value;
      else if (fn.nutrientName === 'Protein') n['proteins_100g'] = fn.value;
      else if (fn.nutrientName === 'Carbohydrate, by difference') n['carbohydrates_100g'] = fn.value;
      else if (fn.nutrientName === 'Total lipid (fat)') n['fat_100g'] = fn.value;
      else if (fn.nutrientName === 'Fiber, total dietary') n['fiber_100g'] = fn.value;
      else if (fn.nutrientName === 'Sugars, total including NLEA' || fn.nutrientName === 'Total Sugars') n['sugars_100g'] = fn.value;
      // USDA reports sodium in mg (unitName 'MG') already, unlike OFF
      // which reports it in g like the other nutrients — kept under
      // its own key so the mg-vs-g unit mismatch can't get mixed up
      // downstream (see pickFoodResult / onBarcodeDetected).
      else if (fn.nutrientName === 'Sodium, Na') n['sodium_100g_mg'] = fn.value;
    });
    // USDA's bulk/commodity entries carry long bureaucratic annotations
    // like "(Includes foods for USDA's Food Distribution Program)" —
    // meaningless noise for a personal food log, so strip any
    // parenthetical that mentions USDA rather than log it verbatim.
    var name = (food.description || '').replace(/\s*\([^)]*USDA[^)]*\)/gi, '').trim();
    return { product_name: name, brands: food.brandOwner || '', nutriments: n, _source: 'usda' };
  }

  // Foundation + SR Legacy are USDA's generic/whole-food datasets —
  // exactly the "plain chicken breast," "egg" category Open Food Facts
  // is weakest at, since OFF mostly covers branded/packaged items.
  function fetchUSDA(query){
    var url = 'https://api.nal.usda.gov/fdc/v1/foods/search?api_key=' + USDA_API_KEY +
      '&query=' + encodeURIComponent(query) + '&pageSize=10&dataType=Foundation,SR%20Legacy';
    return fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        return (data.foods || [])
          .map(usdaToProductShape)
          .filter(function(p){ return p.product_name && p.nutriments['energy-kcal_100g'] != null; });
      })
      .catch(function(err){
        console.error('SaviorFuel: USDA search failed —', err);
        return [];
      });
  }

  function fetchOpenFoodFacts(query){
    var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
      encodeURIComponent(query) + '&search_simple=1&action=process&json=1&page_size=15';
    return fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        return (data.products || [])
          .map(function(p){ p._source = 'off'; return p; })
          .filter(function(p){ return p.product_name && p.nutriments && p.nutriments['energy-kcal_100g'] != null; });
      })
      .catch(function(err){
        console.error('SaviorFuel: Open Food Facts search failed —', err);
        return [];
      });
  }

  function runFoodSearch(query){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;
    var thisRequest = ++searchRequestId;

    // Don't blank existing results while the new query is in flight —
    // keep whatever's already showing and just add a small "updating"
    // line above it, so typing doesn't cause a flash-to-empty each
    // keystroke the way replacing the whole list would.
    if (!resultsEl.querySelector('.food-suggest-item')){
      resultsEl.innerHTML = '<div class="food-suggest-status">Searching...</div>';
    } else if (!resultsEl.querySelector('.food-suggest-status')){
      resultsEl.insertAdjacentHTML('afterbegin', '<div class="food-suggest-status">Updating...</div>');
    }

    // Saved (your own cache, works offline) listed first, then Kalori
    // (Malaysian dishes, most locally relevant), then USDA (generic
    // foods), then Open Food Facts (branded/packaged) — each source
    // can fail independently without taking the others down with it.
    Promise.all([Promise.resolve(searchSavedFoods(query)), fetchKalori(query), fetchUSDA(query), fetchOpenFoodFacts(query)])
      .then(function(results){
        if (thisRequest !== searchRequestId) return; // a newer search has since superseded this one
        var products = results[0].concat(results[1]).concat(results[2]).concat(results[3]);
        var trimmed = query.trim();
        var exactMatch = products.some(function(p){ return p.product_name.toLowerCase() === trimmed.toLowerCase(); });
        // Pinned above the list whenever what's typed isn't already an
        // exact match below — same "use what I typed" pattern as
        // SaviorFit Logger's custom-exercise option — so a genuinely
        // uncommon or local dish can still be added in one tap even
        // when none of the three sources have it.
        var customBtn = exactMatch ? '' :
          '<button type="button" class="food-suggest-custom" data-action="use-custom-food-name" data-name="' + esc(trimmed) + '">Use \u201c' + esc(trimmed) + '\u201d</button>';

        if (products.length === 0){
          resultsEl.innerHTML = customBtn + '<div class="food-suggest-status">No matches — add it as a custom food above, or type it in manually.</div>';
          return;
        }
        resultsEl.innerHTML = customBtn + products.map(function(p, i){
          var cal = Math.round(p.nutriments['energy-kcal_100g'] || 0);
          var tag = (p._source === 'saved')
            ? cal + ' kcal · Saved'
            : (p._source === 'techapi')
              ? cal + ' kcal' + (p._serving ? ' / ' + esc(p._serving) : '')
              : cal + ' kcal/100g';
          return '<div class="food-suggest-item" data-action="pick-food" data-index="' + i + '">' +
            '<div class="food-suggest-name">' + esc(p.product_name) +
              (p.brands ? '<span class="brand">' + esc(p.brands.split(',')[0]) + '</span>' : '') +
            '</div>' +
            '<div class="food-suggest-tag">' + tag + '</div>' +
          '</div>';
        }).join('');
        ui.lastSearchProducts = products; // stashed so pick-food can look up by index without re-fetching
      })
      .catch(function(err){
        if (thisRequest !== searchRequestId) return;
        console.error('SaviorFuel food search failed —', err);
        resultsEl.innerHTML = '<div class="food-suggest-status">Search failed — check your connection, or type the meal in manually below.</div>';
      });
  }

  // ---- Offline food cache: every food actually picked from a live
  // search/scan gets saved here (name + macros, not the logged
  // instance), so searching that same food again — even fully
  // offline — finds it instantly instead of needing network. Merged
  // into runFoodSearch() as a 4th source alongside Kalori/USDA/OFF.
  function saveFoodToCache(food){
    var key = (food.name || '').trim().toLowerCase();
    if (!key) return;
    var src = food.wholeServing ? food.whole : food.per100g;
    var entry = {
      product_name: food.name,
      brands: food.brand || '',
      _source: 'saved',
      _servingLabel: food.wholeServing ? (food.servingLabel || '1 serving') : '100g',
      nutriments: {
        'energy-kcal_100g': src.cal || 0,
        'proteins_100g': src.protein || 0,
        'carbohydrates_100g': src.carbs || 0,
        'fat_100g': src.fat || 0,
        'fiber_100g': src.fiber || 0,
        'sugars_100g': src.sugar || 0,
        'sodium_100g_mg': src.sodium || 0 // already normalized to mg by this point regardless of original source
      }
    };
    // De-dupe by name so re-picking the same food refreshes its
    // numbers and bumps it back to most-recently-used, rather than
    // piling up duplicate entries.
    STORE.savedFoods = (STORE.savedFoods || []).filter(function(f){
      return f.product_name.trim().toLowerCase() !== key;
    });
    STORE.savedFoods.unshift(entry);
    if (STORE.savedFoods.length > 200) STORE.savedFoods.length = 200; // cap so it doesn't grow forever
    saveStore();
  }

  function searchSavedFoods(query){
    var q = query.trim().toLowerCase();
    if (!q) return [];
    return (STORE.savedFoods || [])
      .filter(function(f){ return f.product_name.toLowerCase().indexOf(q) !== -1; })
      .slice(0, 8);
  }

  function pickFoodResult(index){
    var p = ui.lastSearchProducts && ui.lastSearchProducts[index];
    if (!p) return;

    if (p._source === 'techapi' || p._source === 'saved'){
      // Kalori's numbers are per-serving already (see the 'serving'
      // field), not per-100g like OFF/USDA — log as-is, no scaling.
      // Cached ("saved") entries are stored the same way regardless
      // of their original source — see saveFoodToCache().
      ui.selectedFood = {
        name: p.product_name,
        wholeServing: true,
        servingLabel: p._serving || p._servingLabel || '1 serving',
        whole: {
          cal: p.nutriments['energy-kcal_100g'] || 0,
          protein: p.nutriments['proteins_100g'] || 0,
          carbs: p.nutriments['carbohydrates_100g'] || 0,
          fat: p.nutriments['fat_100g'] || 0,
          // Kalori (techapi.my) doesn't report these yet — fine to
          // default to 0, the form fields just come up blank. Saved
          // entries always carry real numbers here since they came
          // from a completed pick earlier.
          fiber: p.nutriments['fiber_100g'] || 0,
          sugar: p.nutriments['sugars_100g'] || 0,
          sodium: p.nutriments['sodium_100g_mg'] || 0
        }
      };
    } else {
      var n = p.nutriments;
      ui.selectedFood = {
        name: p.product_name,
        brand: p.brands ? p.brands.split(',')[0] : '',
        // Only OFF products reliably carry this (contributor-entered,
        // e.g. "38 g" / "1 slice (38g)") — USDA's raw-ingredient
        // entries don't really have a "serving" concept the same way,
        // and Kalori/saved items are handled in the branch above.
        servingGrams: (p._source === 'off' && p.serving_quantity > 0) ? p.serving_quantity : null,
        servingSizeText: (p._source === 'off' && p.serving_size) ? p.serving_size : null,
        per100g: {
          cal: n['energy-kcal_100g'] || 0,
          protein: n['proteins_100g'] || 0,
          carbs: n['carbohydrates_100g'] || 0,
          fat: n['fat_100g'] || 0,
          fiber: n['fiber_100g'] || 0,
          sugar: n['sugars_100g'] || 0,
          // USDA already gives mg (sodium_100g_mg); OFF gives g like
          // its other per-100g fields, so it needs the *1000 here.
          sodium: p._source === 'usda' ? (n['sodium_100g_mg'] || 0) : (n['sodium_100g'] || 0) * 1000
        }
      };
    }
    // Remember this food locally (name + macros) so searching for it
    // again works even offline — skip re-caching an item that was
    // itself picked from the cache, nothing new to learn from that.
    if (p._source !== 'saved') saveFoodToCache(ui.selectedFood);
    ui.grams = 100;
    ui.unitMode = 'grams'; // reset — a previous pick's servings mode shouldn't carry over to a food that may not have serving data
    applySelectedFoodToForm();
    ui.justFilledFood = true;
    closeFoodSearchOverlay();
    openAddMealOverlay();
  }

  // Recomputes the prefill macro values from the selected food.
  // Per-100g sources (OFF/USDA) scale by the current gram amount;
  // whole-serving sources (Kalori) use the given numbers directly.
  function applySelectedFoodToForm(){
    var f = ui.selectedFood;
    ui.prefillName = f.name;
    if (f.wholeServing){
      ui.prefillCal = Math.round(f.whole.cal);
      ui.prefillProtein = Math.round(f.whole.protein);
      ui.prefillCarbs = Math.round(f.whole.carbs);
      ui.prefillFat = Math.round(f.whole.fat);
      ui.prefillFiber = Math.round(f.whole.fiber || 0);
      ui.prefillSugar = Math.round(f.whole.sugar || 0);
      ui.prefillSodium = Math.round(f.whole.sodium || 0);
      return;
    }
    var factor = (ui.grams || 0) / 100;
    ui.prefillCal = Math.round(f.per100g.cal * factor);
    ui.prefillProtein = Math.round(f.per100g.protein * factor);
    ui.prefillCarbs = Math.round(f.per100g.carbs * factor);
    ui.prefillFat = Math.round(f.per100g.fat * factor);
    ui.prefillFiber = Math.round((f.per100g.fiber || 0) * factor);
    ui.prefillSugar = Math.round((f.per100g.sugar || 0) * factor);
    ui.prefillSodium = Math.round((f.per100g.sodium || 0) * factor);
  }

  function clearFoodSelection(){
    ui.selectedFood = null;
    ui.prefillName = ui.prefillCal = ui.prefillProtein = ui.prefillCarbs = ui.prefillFat =
      ui.prefillFiber = ui.prefillSugar = ui.prefillSodium = null;
  }

  /* =========================================================
     BARCODE SCANNER — native BarcodeDetector API (best support
     is Chrome/Chrome-based browsers on Android, which is exactly
     what the installed Play Store app runs on). No external
     library — if the API isn't available, we just tell the
     person to search by name instead rather than failing silently.
     ========================================================= */
  var scanState = { stream: null, loopId: null, detector: null };

  function openScanner(){
    if (typeof BarcodeDetector === 'undefined'){
      alert('Barcode scanning isn\'t supported in this browser. Try the installed app, or search by name instead.');
      return;
    }
    var overlay = document.getElementById('scanOverlay');
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(stream){
        scanState.stream = stream;
        video.srcObject = stream;
        overlay.classList.remove('hidden');
        scanState.detector = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128']
        });
        statusEl.textContent = 'Point at a barcode, or snap a photo of the food';
        scanLoop();
      })
      .catch(function(err){
        console.error('SaviorFuel: camera access failed —', err);
        alert('Couldn\'t access the camera. Check camera permission for this app in your phone settings, or search by name instead.');
      });
  }

  function scanLoop(){
    var video = document.getElementById('scanVideo');
    if (!scanState.stream) return; // scanner was closed mid-loop
    scanState.detector.detect(video)
      .then(function(codes){
        if (codes.length > 0){
          onBarcodeDetected(codes[0].rawValue);
        } else {
          scanState.loopId = requestAnimationFrame(scanLoop);
        }
      })
      .catch(function(){
        // detect() can throw transiently (e.g. video not ready yet) — just keep trying
        scanState.loopId = requestAnimationFrame(scanLoop);
      });
  }

  function closeScanner(){
    if (scanState.stream){
      scanState.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.stream = null;
    scanState.loopId = null;
    document.getElementById('scanOverlay').classList.add('hidden');
    document.getElementById('scanCaptureBtn').classList.remove('loading'); // reset for next open
  }

  function onBarcodeDetected(code){
    var statusEl = document.getElementById('scanStatus');
    statusEl.textContent = 'Found ' + code + ' — looking it up...';
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;

    fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        closeScanner();
        closeFoodSearchOverlay();
        if (data.status !== 1 || !data.product || !data.product.nutriments){
          alert('That barcode isn\'t in the food database. Try searching by name instead.');
          return;
        }
        var p = data.product;
        var n = p.nutriments;
        ui.selectedFood = {
          name: p.product_name || 'Scanned item',
          brand: p.brands ? p.brands.split(',')[0] : '',
          servingGrams: (p.serving_quantity > 0) ? p.serving_quantity : null,
          servingSizeText: p.serving_size || null,
          per100g: {
            cal: n['energy-kcal_100g'] || 0,
            protein: n['proteins_100g'] || 0,
            carbs: n['carbohydrates_100g'] || 0,
            fat: n['fat_100g'] || 0,
            fiber: n['fiber_100g'] || 0,
            sugar: n['sugars_100g'] || 0,
            sodium: (n['sodium_100g'] || 0) * 1000 // OFF reports sodium in g like everything else
          }
        };
        saveFoodToCache(ui.selectedFood); // works offline next time, even for a barcode
        ui.grams = 100;
        ui.unitMode = 'grams';
        applySelectedFoodToForm();
        ui.justFilledFood = true;
        openAddMealOverlay();
      })
      .catch(function(err){
        console.error('SaviorFuel: barcode lookup failed —', err);
        closeScanner();
        alert('Lookup failed — check your connection and try again, or search by name instead.');
      });
  }

  /* =========================================================
     ON-DEVICE FOOD PHOTO RECOGNITION — same camera view as the
     barcode scanner above (one lens, one permission prompt): the
     barcode loop keeps running in the background, and this button
     lets you snap a frame instead when there's no barcode to find.
     TFJS + MobileNet (Google's official, maintained pretrained
     model — not a food-specific one, there isn't a reliably-hosted
     one) load lazily from CDN the first time this is actually used,
     not on every app load, and stay cached in memory for the rest
     of the session once loaded. MobileNet only knows ImageNet's
     1000 general categories, so its guess is fed into the existing
     search rather than auto-logged — treat it as a head start on
     typing, not a real identification, especially for Malaysian
     dishes it has no concept of.
     ========================================================= */
  var foodClassifierState = { model: null, loading: null };

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  function loadFoodClassifier(){
    if (foodClassifierState.model) return Promise.resolve(foodClassifierState.model);
    if (foodClassifierState.loading) return foodClassifierState.loading;

    foodClassifierState.loading = Promise.resolve()
      .then(function(){
        if (typeof tf === 'undefined') return loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs');
      })
      .then(function(){
        if (typeof mobilenet === 'undefined') return loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet');
      })
      .then(function(){ return mobilenet.load(); })
      .then(function(model){
        foodClassifierState.model = model;
        foodClassifierState.loading = null;
        return model;
      })
      .catch(function(err){
        foodClassifierState.loading = null;
        throw err;
      });

    return foodClassifierState.loading;
  }

  function captureFoodPhoto(){
    if (!scanState.stream) return; // scanner already closed
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');
    var captureBtn = document.getElementById('scanCaptureBtn');

    // Stop only the barcode-detection loop, not the camera stream —
    // the video keeps showing behind the status text while the model
    // loads/runs, same as the "Found ... looking it up" moment in
    // onBarcodeDetected(). The frame itself is grabbed right now
    // regardless, so nothing changes about what gets classified.
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;
    captureBtn.classList.add('loading');
    statusEl.textContent = 'Loading food recognition...';

    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    loadFoodClassifier()
      .then(function(model){
        statusEl.textContent = 'Identifying...';
        return model.classify(canvas);
      })
      .then(function(predictions){
        closeScanner();
        // MobileNet's ImageNet labels are comma-separated synonyms
        // (e.g. "cheeseburger, hamburger") — just use the first.
        var guess = predictions[0] ? predictions[0].className.split(',')[0].trim() : '';
        openFoodSearchOverlay();
        if (guess){
          document.getElementById('foodSearchInput').value = guess;
          runFoodSearch(guess);
        }
      })
      .catch(function(err){
        console.error('SaviorFuel: food photo recognition failed —', err);
        closeScanner();
        alert('Couldn\'t load food recognition — check your connection, or search by name instead.');
      });
  }

  function renderHistory(){
    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>No meal history yet.<br>Logged meals will show up here.</p></div>';
      return;
    }

    var byDay = {};
    STORE.meals.forEach(function(m){
      var key = dateKey(m.loggedAt);
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(m);
    });
    var days = Object.keys(byDay).sort().reverse();

    var html = days.map(function(key){
      var meals = byDay[key].sort(function(a,b){ return b.loggedAt - a.loggedAt; });
      var totals = totalsFor(meals);
      var isOpen = ui.historyOpenDay === key;
      var inner = isOpen ? categorizedMealRowsHtml(meals) : '';
      return '<div class="card history-day-card">' +
        '<div class="history-day-head" data-action="toggle-history-day" data-day="' + key + '" style="cursor:pointer;">' +
          '<span class="date">' + formatDateLabel(key) + '</span>' +
          '<span class="total">' + totals.calories + ' kcal</span>' +
        '</div>' +
        inner +
      '</div>';
    }).join('');

    document.getElementById('view').innerHTML = html;
  }

  // Groups meals by category (Breakfast -> ... -> Dinner -> Other) and
  // returns rows with a small inline label before each group — all as
  // one continuous string meant to sit inside a single .card, unlike
  // groupedMealsHtml()'s separate card-per-category treatment (that
  // looked too broken-up for History specifically, per feedback).
  function categorizedMealRowsHtml(meals){
    var buckets = {};
    MEAL_CATEGORIES.forEach(function(c){ buckets[c.id] = []; });
    var other = [];
    meals.forEach(function(m){
      if (m.category && buckets[m.category]) buckets[m.category].push(m);
      else other.push(m);
    });

    var html = '';
    MEAL_CATEGORIES.forEach(function(c){
      var group = buckets[c.id];
      if (group.length === 0) return;
      html += '<div class="inline-category-label">' + c.label + '</div>' + group.map(mealRowHtml).join('');
    });
    if (other.length > 0){
      html += '<div class="inline-category-label">Other</div>' + other.map(mealRowHtml).join('');
    }
    return html;
  }

  /* =========================================================
     3D MODEL — Insights > Daily Overview panel
     Three.js (r128, same build as the Demo3d viewer) is loaded from
     CDN the first time the panel is actually opened — same lazy
     pattern as the food-photo model — so it costs nothing on app
     start. One renderer/scene lives for the whole session: the
     panel's DOM is rebuilt on every render, so mount() just moves
     the existing canvas into the fresh container, and unmount()
     stops the render loop whenever the panel isn't on screen.
     models/food-pyramid-v2.glb is a decimated copy of the source
     model (~58k triangles, 2048px colour map) so it loads in
     seconds on a phone; the service worker caches it after the
     first load.
     ========================================================= */
  var Model3D = (function(){
    var MODEL_URL = 'models/food-pyramid-v2.glb';
    var MODEL_BYTES_ESTIMATE = 2748140; // for the progress bar when the server sends no length
    var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    var GLTF_LOADER_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    var ORBIT_CONTROLS_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';

    var readyPromise = null;  // libs + scene + model; cleared on failure so reopening the tab retries
    var stage = null;         // container currently on screen, null when the panel isn't showing
    var scene, camera, renderer, controls, model = null;
    var fit = { center: null, hx: 0.5, hy: 0.4, hz: 0.47, rxz: 0.69, az: 0.32, el: 0.2, lift: -0.04 };
    var placed = false, userMoved = false, dirty = true;
    var rafId = 0, resumeTimer = 0, resizeObserver = null;

    function reduceMotion(){
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    function setStatus(text, progress){
      var box = document.getElementById('modelStatus');
      if (!box) return;
      box.classList.remove('hidden');
      var label = document.getElementById('modelStatusText');
      if (label) label.textContent = text;
      var barWrap = document.getElementById('modelBarWrap');
      if (barWrap) barWrap.classList.toggle('hidden', progress === null);
      var bar = document.getElementById('modelBar');
      if (bar && progress !== null) bar.style.width = Math.round(progress * 100) + '%';
    }
    function hideStatus(){
      var box = document.getElementById('modelStatus');
      if (box) box.classList.add('hidden');
    }

    function ensureLibs(){
      return Promise.resolve()
        .then(function(){ if (typeof THREE === 'undefined') return loadScriptOnce(THREE_URL); })
        .then(function(){
          var jobs = [];
          if (!THREE.GLTFLoader) jobs.push(loadScriptOnce(GLTF_LOADER_URL));
          if (!THREE.OrbitControls) jobs.push(loadScriptOnce(ORBIT_CONTROLS_URL));
          return Promise.all(jobs);
        });
    }

    function buildScene(){
      if (renderer) return;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      } catch (e){
        renderer = null;
        e.noWebGL = true; // lets mount() show a "device can't do 3D" message instead of "check your connection"
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // 3x+ phones: lots of overdraw, little visible gain
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.setClearColor(0x000000, 0);
      renderer.domElement.setAttribute('role', 'img');
      renderer.domElement.setAttribute('aria-label', 'Interactive 3D food pyramid. Drag to rotate, pinch to zoom.');
      // Phones drop the GL context when the browser is backgrounded;
      // three.js rebuilds its state on restore, we just need to redraw.
      renderer.domElement.addEventListener('webglcontextlost', function(e){ e.preventDefault(); });
      renderer.domElement.addEventListener('webglcontextrestored', function(){ dirty = true; });

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(36, 1, 0.05, 50);

      // Lighting: no environment map here, so a hemisphere fill plus
      // key / fill / warm rim lights (the rim uses the app's accent).
      scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f4a, 0.95));
      var key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(2, 3, 2.5);
      var fill = new THREE.DirectionalLight(0xbfd0ff, 0.4);
      fill.position.set(-3, 1.5, 1);
      var rim = new THREE.DirectionalLight(0xf2b134, 0.4);
      rim.position.set(0, 2, -3);
      scene.add(key, fill, rim);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.8;
      // Horizontal spin only: min = max pins the camera at one
      // elevation, so vertical drags do nothing.
      controls.minPolarAngle = controls.maxPolarAngle = Math.PI / 2 - fit.el;
      controls.autoRotateSpeed = 1.2;
      controls.addEventListener('start', function(){
        userMoved = true;
        controls.autoRotate = false;
        clearTimeout(resumeTimer);
      });
      controls.addEventListener('end', function(){
        if (reduceMotion()) return;
        resumeTimer = setTimeout(function(){ controls.autoRotate = true; }, 3500);
      });
      controls.addEventListener('change', function(){ dirty = true; });
    }

    function loadModel(){
      if (model) return Promise.resolve();
      return new Promise(function(resolve, reject){
        new THREE.GLTFLoader().load(MODEL_URL, function(gltf){
          model = gltf.scene;
          var maxAniso = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
          model.traverse(function(node){
            if (!node.isMesh) return;
            (Array.isArray(node.material) ? node.material : [node.material]).forEach(function(m){
              // Nothing on a food pyramid is really metal, and with no
              // environment map any metalness would render near-black —
              // so ignore the metal channel and keep the roughness one.
              m.metalness = 0;
              m.metalnessMap = null;
              if (m.map) m.map.anisotropy = maxAniso;
              m.needsUpdate = true;
            });
          });
          scene.add(model);
          var box = new THREE.Box3().setFromObject(model);
          var size = box.getSize(new THREE.Vector3());
          fit.center = box.getCenter(new THREE.Vector3());
          fit.hx = size.x / 2;
          fit.hy = size.y / 2;
          fit.hz = size.z / 2;
          fit.rxz = Math.sqrt(size.x * size.x + size.z * size.z) / 2; // spins around Y, so use the footprint's radius
          resolve();
        }, function(evt){
          var total = (evt.lengthComputable && evt.total) ? evt.total : MODEL_BYTES_ESTIMATE;
          setStatus('Loading 3D model…', Math.min(evt.loaded / total, 0.95));
        }, function(err){
          reject(err || new Error('Could not load ' + MODEL_URL));
        });
      });
    }

    // Default camera distance: big and close — the pyramid is about
    // 60% of the panel's height and its base runs past the screen
    // edges (matches the size picked from a screenshot; pinch to zoom
    // out for the whole thing). On a very wide/short screen the
    // height limit wins so it never overflows top/bottom.
    function fitDistance(){
      var tanV = Math.tan(camera.fov * Math.PI / 360);
      var tanH = tanV * camera.aspect;
      var byWidth = fit.hx / (1.40 * tanH) + fit.hz;
      var byHeight = fit.hy / (0.92 * tanV) + fit.hz * 0.6;
      return Math.max(byWidth, byHeight);
    }

    // Stretch the card down to the top of the bottom nav (whose height
    // varies with the device's safe area).
    function layout(){
      if (!stage) return;
      var card = stage.parentNode;
      var nav = document.querySelector('.bottom-nav');
      if (card && nav) card.style.bottom = nav.offsetHeight + 'px';
    }

    function resize(){
      if (!stage || !renderer || !fit.center) return;
      var w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false); // CSS sizes the canvas (100% x 100%)
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      var d = fitDistance();
      controls.target.set(fit.center.x, fit.center.y + fit.lift, fit.center.z);
      if (!placed){
        var t = controls.target;
        camera.position.set(
          t.x + d * Math.sin(fit.az) * Math.cos(fit.el),
          t.y + d * Math.sin(fit.el),
          t.z + d * Math.cos(fit.az) * Math.cos(fit.el)
        );
        placed = true;
      } else if (!userMoved){
        var dir = camera.position.clone().sub(controls.target).normalize();
        camera.position.copy(controls.target).addScaledVector(dir, d);
      }
      controls.minDistance = d * 0.6;
      controls.maxDistance = d * 1.6;
      controls.update();
      dirty = true;
    }

    function tick(){
      rafId = requestAnimationFrame(tick);
      var moved = controls.update();
      if (moved || dirty || controls.autoRotate){
        renderer.render(scene, camera);
        dirty = false;
      }
    }
    function startLoop(){ if (!rafId) rafId = requestAnimationFrame(tick); }
    function stopLoop(){
      if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
    }

    function mount(container){
      stage = container;
      layout();
      if (!readyPromise){
        readyPromise = ensureLibs()
          .then(function(){ buildScene(); return loadModel(); })
          .catch(function(err){ readyPromise = null; throw err; });
      }
      readyPromise.then(function(){
        if (stage !== container) return; // panel was closed or re-rendered while loading
        container.appendChild(renderer.domElement);
        controls.autoRotate = !reduceMotion();
        layout();
        resize();
        hideStatus();
        if (resizeObserver) resizeObserver.disconnect();
        if (typeof ResizeObserver !== 'undefined'){
          resizeObserver = new ResizeObserver(resize);
          resizeObserver.observe(container);
        }
        startLoop();
      }, function(err){
        console.error('SaviorFuel: 3D model failed —', err);
        if (stage !== container) return;
        setStatus(err && err.noWebGL
          ? 'This device or browser can\'t show the 3D view.'
          : 'Couldn\'t load the 3D model. Check your connection, then reopen this tab.', null);
      });
    }

    function unmount(){
      if (!stage) return;
      stage = null;
      stopLoop();
      clearTimeout(resumeTimer);
      if (resizeObserver){ resizeObserver.disconnect(); resizeObserver = null; }
    }

    window.addEventListener('resize', function(){ layout(); });

    return { mount: mount, unmount: unmount };
  })();

  function renderInsightsTrends(){
    // Daily panel — the last 7 calendar days (today plus the 6 before
    // it), each bar showing that day's total calories, so day-to-day
    // swings are visible rather than smoothed into a weekly average.
    var DAYS_TO_SHOW = 7;
    var dayBuckets = [];
    for (var d = DAYS_TO_SHOW - 1; d >= 0; d--){
      var key = dateKey(Date.now() - d * 86400000);
      dayBuckets.push({
        label: d === 0 ? 'Today' : new Date(key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
        total: Math.round(totalsFor(mealsForDay(key)).calories)
      });
    }
    var dayMax = Math.max(STORE.goals.calories, Math.max.apply(null, dayBuckets.map(function(d2){ return d2.total; })), 1);

    var html = '<div class="card"><h3 class="section-label">Last 7 days — daily calories</h3>';
    html += dayBuckets.map(function(d3){
      return '<div class="insight-bar-row">' +
        '<div class="insight-bar-day">' + d3.label + '</div>' +
        '<div class="insight-bar-track"><div class="insight-bar-fill" style="width:' + pct(d3.total, dayMax) + '%"></div></div>' +
        '<div class="insight-bar-val">' + d3.total + '</div>' +
      '</div>';
    }).join('');
    html += '</div>';

    document.getElementById('view').innerHTML = html;
  }

  /* =========================================================
     PLAN CALCULATOR — Mifflin-St Jeor BMR -> TDEE -> goal-adjusted
     calories -> macro split. Standard formula used by most
     fitness/nutrition apps; not medical advice, just a starting
     estimate the person can always override manually below.
     ========================================================= */
  function selectOptionsHtml(options, selectedId){
    return options.map(function(o){
      return '<option value="' + o.id + '"' + (o.id === selectedId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('');
  }

  function profileFormHtml(){
    var p = STORE.profile;
    var imperial = STORE.appSettings.unit === 'imperial';
    var heightVal = imperial ? Math.round(cmToIn(p.heightCm)) : p.heightCm;
    var weightVal = imperial ? Math.round(kgToLb(p.weightKg)) : p.weightKg;
    return '<div class="settings-section"><h3>Your profile</h3><div class="card">' +
      '<div class="settings-goal-row"><label>Sex</label>' +
        '<select id="profSex">' +
          '<option value="male"' + (p.sex === 'male' ? ' selected' : '') + '>Male</option>' +
          '<option value="female"' + (p.sex === 'female' ? ' selected' : '') + '>Female</option>' +
        '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Age</label>' +
        '<input type="number" inputmode="numeric" id="profAge" value="' + p.age + '"></div>' +
      '<div class="settings-goal-row"><label>Height (' + (imperial ? 'in' : 'cm') + ')</label>' +
        '<input type="number" inputmode="numeric" id="profHeight" value="' + heightVal + '"></div>' +
      '<div class="settings-goal-row"><label>Bodyweight (' + (imperial ? 'lb' : 'kg') + ')</label>' +
        '<input type="number" inputmode="numeric" id="profWeight" value="' + weightVal + '"></div>' +
      '<div class="settings-goal-row"><label>Activity level</label>' +
        '<select id="profActivity">' + selectOptionsHtml(ACTIVITY_LEVELS, p.activityLevel) + '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Goal</label>' +
        '<select id="profGoal">' + selectOptionsHtml(GOAL_OPTIONS, p.goal) + '</select>' +
      '</div>' +
      '<button class="btn-primary" data-action="calculate-plan" style="margin-top:10px;">Calculate My Plan</button>' +
    '</div></div>';
  }

  function calculatePlanFromForm(){
    var imperial = STORE.appSettings.unit === 'imperial';
    var rawHeight = parseFloat(document.getElementById('profHeight').value) || (imperial ? cmToIn(DEFAULT_PROFILE.heightCm) : DEFAULT_PROFILE.heightCm);
    var rawWeight = parseFloat(document.getElementById('profWeight').value) || (imperial ? kgToLb(DEFAULT_PROFILE.weightKg) : DEFAULT_PROFILE.weightKg);
    var profile = {
      sex: document.getElementById('profSex').value,
      age: parseInt(document.getElementById('profAge').value, 10) || DEFAULT_PROFILE.age,
      heightCm: Math.round(imperial ? inToCm(rawHeight) : rawHeight),
      weightKg: Math.round(imperial ? lbToKg(rawWeight) : rawWeight),
      activityLevel: document.getElementById('profActivity').value,
      goal: document.getElementById('profGoal').value
    };
    STORE.profile = profile;

    // Mifflin-St Jeor BMR
    var bmr = profile.sex === 'male'
      ? (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) + 5
      : (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) - 161;

    var activityMult = (ACTIVITY_LEVELS.find(function(a){ return a.id === profile.activityLevel; }) || ACTIVITY_LEVELS[2]).mult;
    var tdee = bmr * activityMult;

    var goalAdjust = (GOAL_OPTIONS.find(function(g){ return g.id === profile.goal; }) || GOAL_OPTIONS[1]).calAdjust;
    var targetCalories = Math.max(1200, Math.round(tdee + goalAdjust)); // 1200 floor as a basic safety rail

    // Macro split: protein by bodyweight (1.8g/kg), fat at 25% of
    // total calories, carbs fill the remainder.
    var proteinG = Math.round(profile.weightKg * 1.8);
    var proteinCal = proteinG * 4;
    var fatCal = targetCalories * 0.25;
    var fatG = Math.round(fatCal / 9);
    var carbCal = Math.max(0, targetCalories - proteinCal - fatCal);
    var carbG = Math.round(carbCal / 4);

    // Merge rather than replace — the calculator only derives
    // calories/protein/carbs/fat, so fiber/sugar/sodium goals
    // (whatever the person set, or the defaults) carry over instead
    // of getting wiped to undefined.
    STORE.goals = Object.assign({}, STORE.goals, { calories: targetCalories, protein: proteinG, carbs: carbG, fat: fatG });
    STORE.lastPlanTdee = Math.round(tdee);
    saveStore();
    renderApp();
  }

              '<div class="seg">' +
                '<button data-action="toggle-haptic" data-val="on" class="' + (s.haptic !== false ? 'active' : '') + '">ON</button>' +
                '<button data-action="toggle-haptic" data-val="off" class="' + (s.haptic === false ? 'active' : '') + '">OFF</button>' +
              '</div></div>';
    html += '</div>';

    html += '<div class="section-label">Appearance</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div><div class="sr-label">Theme</div><div class="sr-sub">Header always stays dark either way</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-theme" data-theme="dark" class="' + (s.theme !== 'light' ? 'active' : '') + '">Dark</button>' +
                '<button data-action="set-theme" data-theme="light" class="' + (s.theme === 'light' ? 'active' : '') + '">Light</button>' +
              '</div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Background image</div><div class="sr-sub">The food illustration behind everything</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-bg-art" data-val="on" class="' + (s.bgArt !== false ? 'active' : '') + '">On</button>' +
                '<button data-action="set-bg-art" data-val="off" class="' + (s.bgArt === false ? 'active' : '') + '">Off</button>' +
              '</div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Density</div><div class="sr-sub">Fit more on screen in Log &amp; History</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-density" data-density="comfortable" class="' + (s.density === 'comfortable' ? 'active' : '') + '">Comfortable</button>' +
                '<button data-action="set-density" data-density="compact" class="' + (s.density === 'compact' ? 'active' : '') + '">Compact</button>' +
              '</div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Corners</div><div class="sr-sub">Rounded or sharp edges throughout the app</div></div>' +
              '<div class="seg">' +
                '<button data-action="set-corner-style" data-style="rounded" class="' + (s.corners === 'rounded' ? 'active' : '') + '">Rounded</button>' +
                '<button data-action="set-corner-style" data-style="sharp" class="' + (s.corners === 'sharp' ? 'active' : '') + '">Sharp</button>' +
              '</div></div>';
    html += '</div>';

    html += '<div class="section-label">Your data</div>';
    html += '<div class="settings-group">';
    html += '<div class="settings-row"><div><div class="sr-label">' + STORE.meals.length + ' meal' + (STORE.meals.length === 1 ? '' : 's') + ' logged</div>' +
              '<div class="sr-sub">Stored only on this device — no account or sync yet</div></div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">' + (STORE.savedFoods || []).length + ' food' + ((STORE.savedFoods || []).length === 1 ? '' : 's') + ' saved for offline search</div>' +
              '<div class="sr-sub">Foods you\'ve picked before — found instantly, even with no connection</div></div></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Export backup</div><div class="sr-sub">Download a JSON file of your log</div></div>' +
              '<button class="sr-action" data-action="export-data">Export</button></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Import backup</div><div class="sr-sub">Restore from a JSON file</div></div>' +

              '<a class="sr-action" href="https://instagram.com/im.savior_" target="_blank" rel="noopener">Open</a></div>';
    html += '<div class="settings-row"><div><div class="sr-label">Email</div><div class="sr-sub">xavierchua10@gmail.com</div></div>' +
              '<a class="sr-action" href="mailto:xavierchua10@gmail.com">Email</a></div>';
    html += '</div>';

    var dzOpen = !!ui.dangerZoneOpen;
    html += '<div class="section-label danger-zone-toggle' + (dzOpen ? ' open' : '') + '" data-action="toggle-danger-zone">' +

            '</div>';
    if (dzOpen){

    html += '<input type="file" id="importFile" accept="application/json" style="display:none;">';

    document.getElementById('view').innerHTML = html;
    var importInput = document.getElementById('importFile');
    if (importInput) importInput.addEventListener('change', handleImportFile);
  }

  /* =========================================================
     RENDER DISPATCH
     ========================================================= */
  /* =========================================================
     APP SETTINGS — density/corners (Appearance) applied as body
     data-attributes so the CSS overrides near the top of the file
     pick them up; haptic feedback fires directly where relevant
     (see addMealFromForm). Export/import is a straight JSON
     dump/restore of the whole STORE object.
     ========================================================= */
  function applyAppearanceSettings(){
    document.body.dataset.density = STORE.appSettings.density || 'comfortable';
    document.body.dataset.corners = STORE.appSettings.corners || 'rounded';
    document.body.dataset.theme = STORE.appSettings.theme || 'dark';
    document.body.dataset.bgArt = STORE.appSettings.bgArt === false ? 'off' : 'on';
  }

  function maybeVibrate(){
    if (STORE.appSettings.haptic === false) return;
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function exportData(){
    var blob = new Blob([JSON.stringify(STORE, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'saviorfuel-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.meals)) throw new Error('Not a valid SaviorFuel backup file');
        if (!window.confirm('Replace everything currently on this device with this backup?')) return;
        STORE = {
          meals: parsed.meals,
          goals: Object.assign({}, DEFAULT_GOALS, parsed.goals || {}),
          profile: parsed.profile || Object.assign({}, DEFAULT_PROFILE),
          appSettings: Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {}),
          savedFoods: Array.isArray(parsed.savedFoods) ? parsed.savedFoods : []
        };
        saveStore();
        applyAppearanceSettings();
        renderApp();
      } catch (err){
        console.error('SaviorFuel: import failed —', err);
        alert('That file doesn\'t look like a valid SaviorFuel backup.');
      }
    };
    reader.readAsText(file);
  }

  function renderApp(){
    // The 3D panel only exists on Insights > Daily Overview; stop its
    // render loop everywhere else so it isn't drawing off-screen.
    var showModel = state.tab === 'insights' && STORE.meals.length > 0 && ui.insightsView !== 'trends';
    if (!showModel) Model3D.unmount();
    document.getElementById('view').classList.toggle('model-fullscreen', showModel);
    document.querySelectorAll('.tabbar button').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    if (state.tab === 'log') renderLog();
    else if (state.tab === 'history') renderHistory();
    else if (state.tab === 'insights') renderInsights();
    else if (state.tab === 'settings') renderSettings();

    // Sticky Today / Trends switch — only exists on the Insights tab
    // once there's something to show, same pattern as SaviorFit
    // Logger's Volume overview / Exercise progression bar.
    var showInsightsSubtabbar = state.tab === 'insights' && STORE.meals.length > 0;
    document.body.classList.toggle('has-insights-subtab', showInsightsSubtabbar);
    var insightsSubtabbarEl = document.getElementById('insightsSubtabbar');
    insightsSubtabbarEl.classList.toggle('hidden', !showInsightsSubtabbar);
    if (showInsightsSubtabbar){
      insightsSubtabbarEl.querySelectorAll('button').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.view === ui.insightsView);
      });
    }
  }

  // Fades the current Insights sub-tab panel out, swaps to the new
  // one, then fades it in — same treatment as SaviorFit Logger's
  // switchProgressViewWithFade() for its Volume overview / Exercise
  // progression switch.
  function switchInsightsViewWithFade(newView){
    if (newView === ui.insightsView) return;
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion){
      ui.insightsView = newView;
      renderApp();
      return;
    }
    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');
    setTimeout(function(){
      ui.insightsView = newView;
      renderApp();
      var v = document.getElementById('view');
      v.classList.remove('subtab-fade-out');
      v.classList.add('subtab-fade-in');
      setTimeout(function(){
        v.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  // Same fade+shift treatment as SaviorFit Logger's switchTabWithFade.
  function switchTab(newTab){
    if (newTab === state.tab) return;
    closeScanner(); // safety: release the camera if it was somehow left open
    closeFoodSearchOverlay();
    closeAddMealOverlay();
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');

    setTimeout(function(){
      state.tab = newTab;
      renderApp();
      viewEl.classList.remove('subtab-fade-out');
      viewEl.classList.add('subtab-fade-in');
      setTimeout(function(){
        viewEl.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'set-tab'){
      switchTab(el.dataset.tab);
    } else if (action === 'set-insights-view'){
      switchInsightsViewWithFade(el.dataset.view);
    } else if (action === 'add-meal'){
      addMealFromForm();
    } else if (action === 'close-add-meal-overlay'){
      closeAddMealOverlay();
    } else if (action === 'show-nutrient-info'){
      showNutrientInfo();
    } else if (action === 'close-nutrient-info'){
      closeNutrientInfo();
    } else if (action === 'select-meal-category'){
      ui.selectedCategory = el.dataset.category;
      renderCategoryPicker();
    } else if (action === 'delete-meal'){
      deleteMeal(el.dataset.id);
    } else if (action === 'toggle-history-day'){
      var day = el.dataset.day;
      ui.historyOpenDay = (ui.historyOpenDay === day) ? null : day;
      renderApp();
    } else if (action === 'clear-data'){
      if (window.confirm('Erase all logged meals and reset goals? This can\'t be undone.')){
        STORE = { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [] };
        saveStore();
        applyAppearanceSettings();
        renderApp();
      }
    } else if (action === 'pick-food'){
      pickFoodResult(parseInt(el.dataset.index, 10));
    } else if (action === 'open-food-search-overlay'){
      openFoodSearchOverlay();
    } else if (action === 'use-custom-food-name'){
      ui.prefillName = el.dataset.name;
      ui.prefillCal = ui.prefillProtein = ui.prefillCarbs = ui.prefillFat = null;
      ui.selectedFood = null;
      ui.justFilledFood = false; // no real macro data was filled in, just the name — no glow needed
      closeFoodSearchOverlay();
      openAddMealOverlay();
    } else if (action === 'close-food-search-overlay'){
      closeFoodSearchOverlay();
    } else if (action === 'toggle-macro-card'){
      ui.macroCardCollapsed = !ui.macroCardCollapsed;
      renderApp();
    } else if (action === 'reset-today-log'){
      resetTodayLog();
    } else if (action === 'calculate-plan'){
      calculatePlanFromForm();
    } else if (action === 'open-scanner'){
      openScanner();
    } else if (action === 'capture-food-photo'){
      captureFoodPhoto();
    } else if (action === 'set-unit-mode'){
      ui.unitMode = el.dataset.mode;
      refreshSelectedFoodBanner();
    } else if (action === 'close-scanner'){
      closeScanner();
    } else if (action === 'set-unit'){
      STORE.appSettings.unit = el.dataset.unit;
      saveStore();
      renderApp();
    } else if (action === 'toggle-haptic'){
      STORE.appSettings.haptic = (el.dataset.val === 'on');
      saveStore();
      renderApp();
    } else if (action === 'set-density'){
      STORE.appSettings.density = el.dataset.density;
      saveStore();
      applyAppearanceSettings();
      renderApp();
    } else if (action === 'set-corner-style'){
      STORE.appSettings.corners = el.dataset.style;
      saveStore();
      applyAppearanceSettings();
      renderApp();
    } else if (action === 'set-theme'){
      STORE.appSettings.theme = el.dataset.theme;
      saveStore();
      applyAppearanceSettings();
      renderApp();
    } else if (action === 'set-bg-art'){
      STORE.appSettings.bgArt = (el.dataset.val === 'on');
      saveStore();
      applyAppearanceSettings();
      renderApp();
    } else if (action === 'toggle-danger-zone'){
      ui.dangerZoneOpen = !ui.dangerZoneOpen;
      renderApp();
    } else if (action === 'export-data'){
      exportData();
    } else if (action === 'import-data'){
      document.getElementById('importFile').click();
    }
  });

  // Live food search as you type (debounced inside searchFoodDebounced).
  document.addEventListener('input', function(e){
    if (e.target.id === 'foodSearchInput'){
      searchFoodDebounced(e.target.value);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && e.target.id === 'foodSearchInput'){
      e.preventDefault();
      closeFoodSearchOverlay();
    }
  });

  // Goal inputs save on change (blur/enter), not on every keystroke —
  // avoids writing to localStorage on every digit typed. Same event
  // also handles the "grams" field on a selected search result, which
  // just recomputes the prefill macros rather than saving anything.
  document.addEventListener('change', function(e){
    if (e.target.dataset && e.target.dataset.actionChange === 'save-goal'){
      saveGoalsFromInputs();
    } else if (e.target.id === 'foodGrams'){
      var raw = parseFloat(e.target.value) || 0;
      // In servings mode the field holds a serving count (can be
      // fractional, e.g. 0.5), converted to the actual gram amount —
      // ui.grams stays the single source of truth either way, same
      // as applySelectedFoodToForm() already expects.
      if (ui.unitMode === 'servings' && ui.selectedFood && ui.selectedFood.servingGrams){
        ui.grams = Math.round(raw * ui.selectedFood.servingGrams);
      } else {
        ui.grams = Math.round(raw);
      }
      applySelectedFoodToForm();
      renderApp();
    }
  });

  applyAppearanceSettings();
  document.getElementById('bootLoading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderApp();

  // Registered after boot so it never delays first paint — this is
  // what lets the app open at all with no connection, and caches
  // static assets (fonts, background image, the food-photo model
  // once used) opportunistically. Deliberately doesn't cache USDA/
  // OFF/Kalori search calls — see sw.js.
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')
        .catch(function(err){ console.error('SaviorFuel: service worker registration failed —', err); });
    });
  }
</script>
