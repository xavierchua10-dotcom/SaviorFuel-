    return FOOD_EMOJI_DEFAULT;
  }

  // Only ever put a plain https address in an <img src>; anything else
  // (javascript:, data:, odd characters) is ignored and the emoji shows.
  function safeImageUrl(u){
    if (typeof u !== 'string') return '';
    u = u.trim();
    if (/^http:\/\//i.test(u)) u = 'https://' + u.slice(7);
    return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : '';
  }

  function foodThumbHtml(p, tappable){
    var emoji = foodEmoji(p.product_name);
    var img = safeImageUrl(p._image);
    if (img && tappable){
      // Photo tile that opens the big viewer (see openFoodPhoto)
      return '<button type="button" class="food-thumb food-thumb-btn" data-action="open-food-photo" data-emoji="' + emoji + '" aria-label="View photo of ' + esc(p.product_name) + '"><img src="' + esc(img) + '" alt="" decoding="async" referrerpolicy="no-referrer"></button>';
    }
    if (img){
      return '<span class="food-thumb" data-emoji="' + emoji + '"><img src="' + esc(img) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"></span>';
    }
    return '<span class="food-thumb">' + emoji + '</span>';
  }

  // <img> load errors don't bubble, so listen in the capture phase once
  // on the results list and swap a broken photo for its emoji.
  // Big photo viewer. Open Food Facts stores each picture at several sizes
  // (…100.jpg, …200.jpg, …400.jpg, full), so the 100/200px thumbnail's
  // address is turned into the 400px one for the viewer; if that size
  // isn't there, the thumbnail itself is shown instead.
  function openFoodPhoto(){
    var f = ui.selectedFood;
    var thumb = f ? safeImageUrl(f.image) : '';
    if (!thumb) return;
    var big = thumb.replace(/\.(100|200)\.(jpe?g|png|webp)(\?.*)?$/i, '.400.$2$3');
    var img = document.getElementById('photoOverlayImg');
    img.setAttribute('data-thumb', thumb);
    img.removeAttribute('data-tried-thumb');
    img.alt = f.name || 'Food photo';
    img.src = big;
    document.getElementById('photoOverlayName').textContent = f.name + (f.brand ? ' \u00b7 ' + f.brand : '');
    document.getElementById('photoOverlay').classList.remove('hidden');
  }

  function closeFoodPhoto(){
    document.getElementById('photoOverlay').classList.add('hidden');
    document.getElementById('photoOverlayImg').removeAttribute('src'); // stop any download in progress
  }

  document.getElementById('photoOverlayImg').addEventListener('error', function(e){
    var img = e.target;
    if (!img.getAttribute('src')) return; // we just cleared it on close
    var thumb = img.getAttribute('data-thumb');
    if (thumb && !img.getAttribute('data-tried-thumb') && img.getAttribute('src') !== thumb){
      img.setAttribute('data-tried-thumb', '1');
      img.src = thumb; // the larger size isn't available — show the small one
    } else {
      document.getElementById('photoOverlayName').textContent = 'Couldn\u2019t load this photo.';
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !document.getElementById('photoOverlay').classList.contains('hidden')) closeFoodPhoto();
  });

  function foodThumbErrorHandler(e){
    var img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    var box = img.parentNode;
    if (box && box.classList && box.classList.contains('food-thumb')){
      box.textContent = box.getAttribute('data-emoji') || FOOD_EMOJI_DEFAULT;
      box.removeAttribute('data-action'); // nothing to open any more
      box.classList.remove('food-thumb-btn');
    }
  }
  document.getElementById('foodSearchResults').addEventListener('error', foodThumbErrorHandler, true);
  document.getElementById('addMealBody').addEventListener('error', foodThumbErrorHandler, true);

  function renderFoodSearchResults(){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;

    // Nothing fresh yet and the previous query's list is still up:
    // leave it alone (no flash-to-empty) and just say we're updating.
    if (foodSearch.stale){
      if (!resultsEl.querySelector('.food-suggest-status')){
        resultsEl.insertAdjacentHTML('beforeend', '<div class="food-suggest-status">Updating...</div>');
      }
      return;
    }

    var products = foodSearch.products;
    var trimmed = foodSearch.query;
    var exactMatch = products.some(function(p){ return p.product_name.toLowerCase() === trimmed.toLowerCase(); });
    // Pinned above the list whenever what's typed isn't already an
    // exact match below — same "use what I typed" pattern as
    // SaviorFit Logger's custom-exercise option — so a genuinely
    // uncommon or local dish can still be added in one tap even
    // when none of the sources have it.
    var customBtn = exactMatch ? '' :
      '<button type="button" class="food-suggest-custom" data-action="use-custom-food-name" data-name="' + esc(trimmed) + '">Use \u201c' + esc(trimmed) + '\u201d</button>';

    var rows = products.map(function(p, i){
      var cal = Math.round(p.nutriments['energy-kcal_100g'] || 0);
      // Right-hand tag is just the calories; the serving basis goes in
      // the small line under the name so the name gets the room.
      var meta = [];
      var brand = p.brands ? p.brands.split(',')[0].trim() : '';
      if (brand) meta.push(esc(brand));
      if (p._source === 'saved') meta.push(esc(p._servingLabel || '100g'), 'Saved');
      else if (p._source === 'techapi'){ if (p._serving) meta.push(esc(p._serving)); }
      else meta.push('per 100 g');
      return '<div class="food-suggest-item" data-action="pick-food" data-index="' + i + '">' +
        foodThumbHtml(p) +
        '<div class="food-suggest-name">' +
          '<div class="food-suggest-title">' + esc(p.product_name) + '</div>' +
          (meta.length ? '<div class="brand">' + meta.join(' \u00b7 ') + '</div>' : '') +
        '</div>' +
        '<div class="food-suggest-tag">' + cal + ' kcal</div>' +
      '</div>';
    }).join('');

    var status = '';
    if (foodSearch.pending > 0) status = '<div class="food-suggest-status">' + (products.length ? 'Searching more...' : 'Searching...') + '</div>';
    else if (products.length === 0) status = '<div class="food-suggest-status">No matches — add it as a custom food above, or type it in manually.</div>';

    resultsEl.innerHTML = customBtn + rows + status;
    ui.lastSearchProducts = products; // stashed so pick-food can look up by index without re-fetching
  }

  function runFoodSearch(query){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;
    if (searchAbort) searchAbort.abort(); // drop the previous query's requests
    searchAbort = new AbortController();
    var signal = searchAbort.signal;
    var thisRequest = ++searchRequestId;
    var trimmed = query.trim();

    // Saved foods (your own cache, works offline) are local, so they
    // show immediately, listed first.
    var saved = searchSavedFoods(trimmed);
    var hadResults = !!resultsEl.querySelector('.food-suggest-item');
    foodSearch = { id: thisRequest, query: trimmed, products: saved, pending: 3, stale: hadResults && saved.length === 0 };
    renderFoodSearchResults();

    // Then the three online sources, each landing as soon as it answers.
    // Each can fail independently without taking the others down.
    [['Kalori', fetchKalori], ['USDA', fetchUSDA], ['Open Food Facts', fetchOpenFoodFacts]].forEach(function(src){
      searchFoodSource(src[0], trimmed, src[1], signal).then(function(list){
        if (thisRequest !== searchRequestId) return; // a newer search has since superseded this one
        foodSearch.pending--;
        foodSearch.products = foodSearch.products.concat(list);
        if (list.length > 0 || foodSearch.pending === 0) foodSearch.stale = false;
        renderFoodSearchResults();
      });
    });
  }

  // ---- Offline food cache: every food actually picked from a live
  // search/scan gets saved here (name + macros, not the logged
  // instance), so searching that same food again — even fully
  // offline — finds it instantly instead of needing network. Merged
  // into runFoodSearch() as a 4th source alongside Kalori/USDA/OFF.
  function saveFoodToCache(food){
    var key = (food.name || '').trim().toLowerCase();
    if (!key) return;
    var src = food.whole || food.per100g; // per-serving foods are saved on their own per-serving basis
    var entry = {
      product_name: food.name,
      brands: food.brand || '',
      _image: food.image || '',
      _source: 'saved',
      _servingLabel: food.whole ? (food.servingLabel || '1 serving') : '100g',
      nutriments: {
        'energy-kcal_100g': src.cal || 0,
        'proteins_100g': src.protein || 0,
        'carbohydrates_100g': src.carbs || 0,
        'fat_100g': src.fat || 0,
        'fiber_100g': src.fiber || 0,
        'sugars_100g': src.sugar || 0,
        'sodium_100g_mg': src.sodium || 0 // already normalized to mg by this point regardless of original source
      }
    };
    if (!food.whole){ // per-100 g foods keep their serving / household measures, so the picker offers them next time too
      entry._servingGrams = food.servingGrams || null;
      entry._servingSizeText = food.servingSizeText || null;
      entry._measures = food.measures || [];
    }
    // De-dupe by name so re-picking the same food refreshes its
    // numbers and bumps it back to most-recently-used, rather than
    // piling up duplicate entries.
    STORE.savedFoods = (STORE.savedFoods || []).filter(function(f){
      return f.product_name.trim().toLowerCase() !== key;
    });
    STORE.savedFoods.unshift(entry);
    if (STORE.savedFoods.length > 200) STORE.savedFoods.length = 200; // cap so it doesn't grow forever
    saveStore();
  }

  function searchSavedFoods(query){
    var q = query.trim().toLowerCase();
    if (!q) return [];
    return (STORE.savedFoods || [])
      .filter(function(f){ return f.product_name.toLowerCase().indexOf(q) !== -1; })
      .slice(0, 8);
  }

  function pickFoodResult(index){
    var p = ui.lastSearchProducts && ui.lastSearchProducts[index];
    if (!p) return;
    var nut = p.nutriments || {};

    if (p._source === 'techapi' || p._source === 'saved'){
      // Kalori's numbers are per SERVING (see its 'serving' field), and
      // saved entries keep whatever basis they were saved with — either
      // per serving too, or per 100 g (label '100g').
      var basis = {
        cal: nut['energy-kcal_100g'] || 0,
        protein: nut['proteins_100g'] || 0,
        carbs: nut['carbohydrates_100g'] || 0,
        fat: nut['fat_100g'] || 0,
        // Kalori (techapi.my) doesn't report these yet — fine to
        // default to 0. Saved entries always carry real numbers here.
        fiber: nut['fiber_100g'] || 0,
        sugar: nut['sugars_100g'] || 0,
        sodium: nut['sodium_100g_mg'] || 0
      };
      var label = p._serving || p._servingLabel || '1 serving';
      var from = p._source === 'techapi' ? 'Kalori' : 'saved';
      if (p._source === 'saved' && /^\s*100\s*g\s*$/i.test(p._servingLabel || '')){
        // saved per-100 g food: comes back with its serving / measures
        ui.selectedFood = {
          name: p.product_name, image: p._image || '', brand: p.brands ? p.brands.split(',')[0] : '', from: from,
          servingGrams: p._servingGrams || null, servingSizeText: p._servingSizeText || null,
          measures: p._measures || [], per100g: basis
        };
      } else {
        var sg = parseServingGrams(label);
        ui.selectedFood = {
          name: p.product_name, image: p._image || '', from: from,
          whole: basis, servingLabel: label, servingGrams: sg, measures: []
        };
        // A serving with a known weight can also be measured in g / oz
        if (sg){
          var k = 100 / sg;
          ui.selectedFood.per100g = {
            cal: basis.cal * k, protein: basis.protein * k, carbs: basis.carbs * k, fat: basis.fat * k,
            fiber: basis.fiber * k, sugar: basis.sugar * k, sodium: basis.sodium * k
          };
        }
      }
    } else {
      var n = nut;
      ui.selectedFood = {
        name: p.product_name,
        image: p._image || '',
        brand: p.brands ? p.brands.split(',')[0] : '',
        from: 'search',
        // Only OFF products reliably carry a serving size (contributor-
        // entered, e.g. "38 g" / "1 slice (38g)"); USDA's generic foods
        // bring household measures instead (see usdaToProductShape).
        servingGrams: (p._source === 'off' && p.serving_quantity > 0) ? p.serving_quantity : null,
        servingSizeText: (p._source === 'off' && p.serving_size) ? p.serving_size : null,
        measures: p._measures || [],
        per100g: {
          cal: n['energy-kcal_100g'] || 0,
          protein: n['proteins_100g'] || 0,
          carbs: n['carbohydrates_100g'] || 0,
          fat: n['fat_100g'] || 0,
          fiber: n['fiber_100g'] || 0,
          sugar: n['sugars_100g'] || 0,
          // USDA already gives mg (sodium_100g_mg); OFF gives g like
          // its other per-100g fields, so it needs the *1000 here.
          sodium: p._source === 'usda' ? (n['sodium_100g_mg'] || 0) : (n['sodium_100g'] || 0) * 1000
        }
      };
    }
    // Remember this food locally (name + macros) so searching for it
    // again works even offline — skip re-caching an item that was
    // itself picked from the cache, nothing new to learn from that.
    if (p._source !== 'saved') saveFoodToCache(ui.selectedFood);
    initServing();
    applySelectedFoodToForm();
    ui.justFilledFood = true;
    closeFoodSearchOverlay();
    openAddMealOverlay();
  }

  // Recomputes the prefill macro values from the selected food and
  // the chosen serving (unit x amount): per-100 g foods scale by the
  // weight, a per-serving food with no known weight by the count.
  function applySelectedFoodToForm(){
    var f = ui.selectedFood;
    var u = currentServingUnit();
    var q = (ui.serving && ui.serving.qty) || 0;
    ui.prefillName = f.name;
    var src, factor;
    if (u.grams == null){ src = f.whole; factor = q; }
    else { src = f.per100g; factor = q * u.grams / 100; }
    ui.prefillCal = Math.round(src.cal * factor);
    ui.prefillProtein = Math.round(src.protein * factor);
    ui.prefillCarbs = Math.round(src.carbs * factor);
    ui.prefillFat = Math.round(src.fat * factor);
    ui.prefillFiber = Math.round((src.fiber || 0) * factor);
    ui.prefillSugar = Math.round((src.sugar || 0) * factor);
    ui.prefillSodium = Math.round((src.sodium || 0) * factor);
  }

  // Writes the computed prefill numbers into the visible Add Meal fields
  // (openAddMealOverlay does this once on open; this is for when the
  // serving unit or amount changes while the sheet is up).
  function syncMealFieldsFromPrefill(){
    var map = { mealCal: 'prefillCal', mealProtein: 'prefillProtein', mealCarbs: 'prefillCarbs', mealFat: 'prefillFat',
                mealFiber: 'prefillFiber', mealSugar: 'prefillSugar', mealSodium: 'prefillSodium' };
    Object.keys(map).forEach(function(id){
      var v = ui[map[id]];
      document.getElementById(id).value = v != null ? v : '';
    });
    updateMealSummary();
  }

  function setServingQty(qty){
    ui.serving.qty = Math.max(0, qty);
    applySelectedFoodToForm();
    syncMealFieldsFromPrefill();
    var eq = document.getElementById('servingEq');
    if (eq) eq.textContent = servingEqText();
  }

  function setServingUnit(unitId){
    var f = ui.selectedFood;
    if (!f) return;
    var old = currentServingUnit();
    var next = servingUnitsFor(f).filter(function(u){ return u.id === unitId; })[0];
    if (!next || next.id === old.id) return;
    // keep the same amount of food: 1 serving (380 g) -> 380 g -> 13.4 oz.
    // The exact value is kept (only the number shown is rounded), so
    // switching units never nudges the calories by a rounding error.
    var qty = (old.grams != null && next.grams != null)
      ? (ui.serving.qty || 0) * old.grams / next.grams
      : next.defaultQty;
    ui.serving = { unitId: next.id, qty: qty };
    applySelectedFoodToForm();
    syncMealFieldsFromPrefill();
    refreshSelectedFoodBanner();
  }

  function clearFoodSelection(){
    ui.selectedFood = null;
    ui.serving = null;
    ui.prefillName = ui.prefillCal = ui.prefillProtein = ui.prefillCarbs = ui.prefillFat =
      ui.prefillFiber = ui.prefillSugar = ui.prefillSodium = null;
  }

  /* =========================================================
     BARCODE SCANNER — native BarcodeDetector API (best support
     is Chrome/Chrome-based browsers on Android, which is exactly
     what the installed Play Store app runs on). No external
     library — if the API isn't available, we just tell the
     person to search by name instead rather than failing silently.
     ========================================================= */
  var scanState = { stream: null, loopId: null, detector: null };

  // mode: 'barcode' (watch for a barcode only), 'photo' (just the shutter
  // button — works even in browsers with no barcode reader), or nothing =
  // both at once (the scan button in food search).
  function openScanner(mode){
    mode = mode || 'both';
    var canBarcode = typeof BarcodeDetector !== 'undefined';
    if (!canBarcode){
      if (mode === 'barcode'){
        alert('Barcode scanning isn\'t supported in this browser. Try the installed app, or search by name instead.');
        return;
      }
      mode = 'photo'; // no barcode reader here, but the photo button still works
    }
    var overlay = document.getElementById('scanOverlay');
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(stream){
        scanState.stream = stream;
        video.srcObject = stream;
        overlay.classList.remove('hidden');
        document.getElementById('scanCaptureBtn').classList.toggle('hidden', mode === 'barcode');
        scanState.detector = (mode === 'photo') ? null : new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128']
        });
        statusEl.textContent = mode === 'photo' ? 'Frame your food, then tap the camera button'
          : mode === 'barcode' ? 'Point the camera at a barcode'
          : 'Point at a barcode, or snap a photo of the food';
        if (scanState.detector) scanLoop();
      })
      .catch(function(err){
        console.error('SaviorFuel: camera access failed —', err);
        alert('Couldn\'t access the camera. Check camera permission for this app in your phone settings, or search by name instead.');
      });
  }

  function scanLoop(){
    var video = document.getElementById('scanVideo');
    if (!scanState.stream || !scanState.detector) return; // scanner closed mid-loop, or photo-only mode
    scanState.detector.detect(video)
      .then(function(codes){
        if (codes.length > 0){
          onBarcodeDetected(codes[0].rawValue);
        } else {
          scanState.loopId = requestAnimationFrame(scanLoop);
        }
      })
      .catch(function(){
        // detect() can throw transiently (e.g. video not ready yet) — just keep trying
        scanState.loopId = requestAnimationFrame(scanLoop);
      });
  }

  function closeScanner(){
    if (scanState.stream){
      scanState.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.stream = null;
    scanState.loopId = null;
    document.getElementById('scanOverlay').classList.add('hidden');
    document.getElementById('scanCaptureBtn').classList.remove('loading'); // reset for next open
  }

  function onBarcodeDetected(code){
    var statusEl = document.getElementById('scanStatus');
    statusEl.textContent = 'Found ' + code + ' — looking it up...';
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;

    fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        closeScanner();
        closeFoodSearchOverlay();
        if (data.status !== 1 || !data.product || !data.product.nutriments){
          alert('That barcode isn\'t in the food database. Try searching by name instead.');
          return;
        }
        var p = data.product;
        var n = p.nutriments;
        ui.selectedFood = {
          name: p.product_name || 'Scanned item',
          image: p.image_front_thumb_url || p.image_thumb_url || p.image_small_url || '',
          brand: p.brands ? p.brands.split(',')[0] : '',
          from: 'search',
          servingGrams: (p.serving_quantity > 0) ? p.serving_quantity : null,
          servingSizeText: p.serving_size || null,
          measures: [],
          per100g: {
            cal: n['energy-kcal_100g'] || 0,
            protein: n['proteins_100g'] || 0,
            carbs: n['carbohydrates_100g'] || 0,
            fat: n['fat_100g'] || 0,
            fiber: n['fiber_100g'] || 0,
            sugar: n['sugars_100g'] || 0,
            sodium: (n['sodium_100g'] || 0) * 1000 // OFF reports sodium in g like everything else
          }
        };
        saveFoodToCache(ui.selectedFood); // works offline next time, even for a barcode
        initServing();
        applySelectedFoodToForm();
        ui.justFilledFood = true;
        openAddMealOverlay();
      })
      .catch(function(err){
        console.error('SaviorFuel: barcode lookup failed —', err);
        closeScanner();
        alert('Lookup failed — check your connection and try again, or search by name instead.');
      });
  }

  /* =========================================================
     ON-DEVICE FOOD PHOTO RECOGNITION — same camera view as the
     barcode scanner above (one lens, one permission prompt): the
     barcode loop keeps running in the background, and this button
     lets you snap a frame instead when there's no barcode to find.
     TFJS + MobileNet (Google's official, maintained pretrained
     model — not a food-specific one, there isn't a reliably-hosted
     one) load lazily from CDN the first time this is actually used,
     not on every app load, and stay cached in memory for the rest
     of the session once loaded. MobileNet only knows ImageNet's
     1000 general categories, so its guess is fed into the existing
     search rather than auto-logged — treat it as a head start on
     typing, not a real identification, especially for Malaysian
     dishes it has no concept of.
     ========================================================= */
  var foodClassifierState = { model: null, loading: null };

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  function loadFoodClassifier(){
    if (foodClassifierState.model) return Promise.resolve(foodClassifierState.model);
    if (foodClassifierState.loading) return foodClassifierState.loading;

    foodClassifierState.loading = Promise.resolve()
      .then(function(){
        if (typeof tf === 'undefined') return loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs');
      })
      .then(function(){
        if (typeof mobilenet === 'undefined') return loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet');
      })
      .then(function(){ return mobilenet.load(); })
      .then(function(model){
        foodClassifierState.model = model;
        foodClassifierState.loading = null;
        return model;
      })
      .catch(function(err){
        foodClassifierState.loading = null;
        throw err;
      });

    return foodClassifierState.loading;
  }

  function captureFoodPhoto(){
    if (!scanState.stream) return; // scanner already closed
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');
    var captureBtn = document.getElementById('scanCaptureBtn');

    // Stop only the barcode-detection loop, not the camera stream —
    // the video keeps showing behind the status text while the model
    // loads/runs, same as the "Found ... looking it up" moment in
    // onBarcodeDetected(). The frame itself is grabbed right now
    // regardless, so nothing changes about what gets classified.
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;
    captureBtn.classList.add('loading');

    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    // AI scan (Gemini via the proxy) when it's set up and we're online;
    // otherwise — or if it fails — the basic on-device guess below.
    if (aiScanEnabled()){
      statusEl.textContent = 'Analysing your meal...';
      runAiScan(canvas).catch(function(err){
        if (err && err.declined){ classifyFoodPhotoLegacy(canvas); return; }
        console.error('SaviorFuel: AI food scan failed —', err);
        if (err && err.status === 429){
          // Out of scans for today: say so, and stay on the camera so
          // barcode scanning still works.
          statusEl.textContent = err.userMessage || 'Scan limit reached for today.';
          captureBtn.classList.remove('loading');
          if (scanState.stream) scanLoop();
          return;
        }
        statusEl.textContent = 'AI scan unavailable — trying basic recognition...';
        classifyFoodPhotoLegacy(canvas);
      });
      return;
    }
    classifyFoodPhotoLegacy(canvas);
  }

  function classifyFoodPhotoLegacy(canvas){
    document.getElementById('scanStatus').textContent = 'Loading food recognition...';
    loadFoodClassifier()
      .then(function(model){
        document.getElementById('scanStatus').textContent = 'Identifying...';
        return model.classify(canvas);
      })
      .then(function(predictions){
        closeScanner();
        // MobileNet's ImageNet labels are comma-separated synonyms
        // (e.g. "cheeseburger, hamburger") — just use the first.
        var guess = predictions[0] ? predictions[0].className.split(',')[0].trim() : '';
        openFoodSearchOverlay();
        if (guess){
          document.getElementById('foodSearchInput').value = guess;
          runFoodSearch(guess);
        }
      })
      .catch(function(err){
        console.error('SaviorFuel: food photo recognition failed —', err);
        closeScanner();
        alert('Couldn\'t load food recognition — check your connection, or search by name instead.');
      });
  }

  /* =========================================================
     AI FOOD SCAN — snap a photo, an AI (Google Gemini, reached
     through the small proxy in /ai-proxy) lists what's on the plate
     with estimated grams and nutrition, and you confirm/edit it
     before anything is logged. The API key is NOT in this file —
     the proxy holds it, applies daily limits, and only accepts
     requests from this app's own site. Leave AI_SCAN_URL empty and
     the camera button just uses the basic on-device guess above.
     ========================================================= */
  var AI_SCAN_URL = ''; // e.g. 'https://your-site.netlify.app/api/scan-food' (see ai-proxy/README.md)
  var aiScan = { items: [], category: 'lunch' };

  function aiScanEnabled(){
    return !!AI_SCAN_URL && navigator.onLine !== false;
  }

  function aiNum(v){
    var n = Number(v);
    return (isFinite(n) && n > 0) ? n : 0;
  }

  // Photo -> ~1024px JPEG base64: keeps detail for recognition while
  // staying a few hundred KB, so it's quick on mobile data.
  function aiPhotoToBase64(canvas){
    var max = 1024;
    var scale = Math.min(1, max / Math.max(canvas.width, canvas.height));
    var out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(canvas.width * scale));
    out.height = Math.max(1, Math.round(canvas.height * scale));
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    return out.toDataURL('image/jpeg', 0.8).split(',')[1];
  }

  function runAiScan(canvas){
    if (!STORE.appSettings.aiScanConsent){
      var ok = window.confirm('AI food scan sends this photo to a server and on to Google\'s Gemini AI to estimate what\'s in it. SaviorFuel doesn\'t keep the photo. Continue?');
      if (!ok) return Promise.reject({ declined: true });
      STORE.appSettings.aiScanConsent = true;
      saveStore();
    }

    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 25000);
    return fetch(AI_SCAN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: aiPhotoToBase64(canvas), mime: 'image/jpeg' }),
      signal: ctrl.signal
    })
      .then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(data){
          if (!res.ok){
            var e = new Error(data.error || ('Scan failed (' + res.status + ')'));
            e.status = res.status;
            e.userMessage = data.error;
            throw e;
          }
          return data;
        });
      })
      .then(function(data){
        clearTimeout(timer);
        if (!scanState.stream) return; // they hit Cancel while we were waiting
        var items = Array.isArray(data.items) ? data.items : [];
        if (items.length === 0){
          document.getElementById('scanStatus').textContent = 'Couldn\'t spot any food — get closer, add light, and try again.';
          document.getElementById('scanCaptureBtn').classList.remove('loading');
          scanLoop(); // back to watching for barcodes
          return;
        }
        closeScanner();
        closeFoodSearchOverlay();
        openAiScanSheet(data);
      })
      .catch(function(err){
        clearTimeout(timer);
        throw err;
      });
  }

  function aiItemMacros(it){
    var f = it.base.grams > 0 ? it.grams / it.base.grams : 0;
    return {
      calories: it.base.calories * f, protein: it.base.protein * f, carbs: it.base.carbs * f,
      fat: it.base.fat * f, fiber: it.base.fiber * f, sugar: it.base.sugar * f, sodium: it.base.sodium * f
    };
  }

  function aiMacroLine(m){
    return Math.round(m.calories) + ' kcal · P' + Math.round(m.protein) + ' · C' + Math.round(m.carbs) + ' · F' + Math.round(m.fat);
  }

  function renderAiCategoryPicker(){
    document.getElementById('aiCategoryPicker').innerHTML = MEAL_CATEGORIES.map(function(c){
      return '<button type="button" class="category-pill' + (c.id === aiScan.category ? ' active' : '') + '" data-action="ai-select-category" data-category="' + c.id + '">' + c.label + '</button>';
    }).join('');
  }

  function renderAiScanTotal(){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    aiScan.items.forEach(function(it){
      var m = aiItemMacros(it);
      t.calories += m.calories; t.protein += m.protein; t.carbs += m.carbs; t.fat += m.fat;
    });
    document.getElementById('aiScanTotal').innerHTML = '<span>Total</span><span>' + aiMacroLine(t) + '</span>';
  }

  function renderAiScanItems(){
    document.getElementById('aiScanItems').innerHTML = aiScan.items.map(function(it, i){
      return '<div class="ai-item">' +
        '<div class="ai-item-top">' +
          '<input type="text" class="ai-item-name" data-ai-field="name" data-i="' + i + '" value="' + esc(it.name) + '" maxlength="60" aria-label="Food name">' +
          '<button type="button" class="ai-item-del" data-action="ai-remove-item" data-i="' + i + '" aria-label="Remove ' + esc(it.name) + '">&times;</button>' +
        '</div>' +
        '<div class="ai-item-bottom">' +
          '<input type="number" inputmode="decimal" class="ai-item-grams" data-ai-field="grams" data-i="' + i + '" value="' + it.grams + '" min="0" max="3000" aria-label="Grams">' +
          '<span class="ai-item-unit">g</span>' +
          '<span class="ai-item-macros" id="aiMacros' + i + '">' + aiMacroLine(aiItemMacros(it)) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
    renderAiScanTotal();
  }

  function openAiScanSheet(data){
    aiScan.items = data.items.map(function(it){
      var g = Math.max(1, aiNum(it.grams) || 100);
      return {
        name: String(it.name || 'Food').slice(0, 60),
        grams: Math.round(g),
        base: {
          grams: g, calories: aiNum(it.calories), protein: aiNum(it.protein_g), carbs: aiNum(it.carbs_g),
          fat: aiNum(it.fat_g), fiber: aiNum(it.fiber_g), sugar: aiNum(it.sugar_g), sodium: aiNum(it.sodium_mg)
        }
      };
    });
    aiScan.category = suggestCategoryForNow();
    document.getElementById('aiScanNote').textContent =
      (data.note ? data.note + ' ' : '') + 'These are estimates from a photo — check the names and portions before logging.';
    renderAiCategoryPicker();
    renderAiScanItems();
    showSheetOverlay(document.getElementById('aiScanOverlay'));
  }

  function closeAiScanSheet(){
    hideSheetOverlay(document.getElementById('aiScanOverlay'));
    aiScan.items = [];
  }

  attachSheetDrag(document.getElementById('addMealGrab'), closeAddMealOverlay);
  attachSheetDrag(document.getElementById('aiScanGrab'), closeAiScanSheet);

  function logAiScan(){
    var now = Date.now();
    var logged = 0;
    aiScan.items.forEach(function(it, i){
      var name = it.name.trim();
      var m = aiItemMacros(it);
      if (!name || it.grams <= 0 || m.calories <= 0) return; // skip blanks / zeroed-out rows
      STORE.meals.push({
        id: 'm_' + now + '_' + i + '_' + Math.random().toString(36).slice(2, 6),
        name: name,
        calories: Math.round(m.calories),
        protein: Math.round(m.protein),
        carbs: Math.round(m.carbs),
        fat: Math.round(m.fat),
        fiber: Math.round(m.fiber),
        sugar: Math.round(m.sugar),
        sodium: Math.round(m.sodium),
        category: aiScan.category,
        loggedAt: now
      });
      logged++;
    });
    if (logged === 0) return;
    expandMealGroup(aiScan.category);
    saveStore();
    maybeVibrate();
    closeAiScanSheet();
    if (state.tab === 'scan') state.tab = 'log';
    renderApp();
  }

  // Editing a name or grams updates that row's numbers and the total in
  // place (no re-render, so the keyboard and cursor stay put).
  document.addEventListener('input', function(e){
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var field = t.getAttribute('data-ai-field');
    if (!field) return;
    var i = parseInt(t.getAttribute('data-i'), 10);
    var it = aiScan.items[i];
    if (!it) return;
    if (field === 'name'){
      it.name = t.value;
    } else if (field === 'grams'){
      it.grams = Math.min(3000, Math.max(0, parseFloat(t.value) || 0));
      var line = document.getElementById('aiMacros' + i);
      if (line) line.textContent = aiMacroLine(aiItemMacros(it));
      renderAiScanTotal();
    }
  });


  function addMealFromForm(){
    var name = document.getElementById('mealName').value.trim();
    var cal = parseInt(document.getElementById('mealCal').value, 10) || 0;
    var protein = parseInt(document.getElementById('mealProtein').value, 10) || 0;
    var carbs = parseInt(document.getElementById('mealCarbs').value, 10) || 0;
    var fat = parseInt(document.getElementById('mealFat').value, 10) || 0;
    var fiber = parseInt(document.getElementById('mealFiber').value, 10) || 0;
    var sugar = parseInt(document.getElementById('mealSugar').value, 10) || 0;
    var sodium = parseInt(document.getElementById('mealSodium').value, 10) || 0;

    if (!name || cal <= 0) return; // require at least a name + calories

    var newId = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    STORE.meals.push({
      id: newId,
      name: name,
      calories: cal,
      protein: protein,
      carbs: carbs,
      fat: fat,
      fiber: fiber,
      sugar: sugar,
      sodium: sodium,
      category: ui.selectedCategory,
      loggedAt: Date.now()
    });
    expandMealGroup(ui.selectedCategory);
    saveStore();
    maybeVibrate();
    closeAddMealOverlay(); // also clears the food selection state
    if (state.tab === 'scan') state.tab = 'log'; // came from the Scan tab — show where the meal landed
    renderApp();

    // Same glow treatment as the Add Meal sheet gets when a food is
    // auto-filled — reused here to confirm the meal actually landed
    // in the list, once the row exists in the DOM post-render.
    var newRow = document.querySelector('.meal-row[data-id="' + newId + '"]');
    if (newRow){
      newRow.classList.add('glow-once');
      setTimeout(function(){ newRow.classList.remove('glow-once'); }, 900);
    }
  }

  function deleteMeal(id){
    STORE.meals = STORE.meals.filter(function(m){ return m.id !== id; });
    saveStore();
    renderApp();
  }

  /* ---- Confirmation bottom sheet ----
     opts: title, name, detail, kcal, note, confirmLabel, onConfirm.
     Slides up from the bottom; closes on Cancel, a tap outside, Escape,
     or by dragging the grab handle down. Nothing happens to the data
     until "Delete" is pressed. */
  var confirmState = { onConfirm: null, closeTimer: 0 };

  function openConfirmSheet(opts){
    clearTimeout(confirmState.closeTimer);
    confirmState.onConfirm = opts.onConfirm;
    document.getElementById('confirmTitle').textContent = opts.title;
    document.getElementById('confirmItemName').textContent = opts.name;
    document.getElementById('confirmItemDetail').textContent = opts.detail || '';
    document.getElementById('confirmItemKcal').textContent = opts.kcal != null ? opts.kcal + ' kcal' : '';
    document.getElementById('confirmNote').textContent = opts.note || '';
    document.getElementById('confirmYes').textContent = opts.confirmLabel || 'Delete';
    var overlay = document.getElementById('confirmOverlay');
    var sheet = overlay.querySelector('.confirm-sheet');
    sheet.style.transform = '';
    sheet.classList.remove('dragging');
    overlay.classList.remove('hidden');
    void overlay.offsetHeight;          // let the closed position paint first, so it animates up
    overlay.classList.add('open');
    // The safe choice is the default. preventScroll matters: the sheet is
    // still off-screen when this runs, and a plain focus() makes the
    // browser scroll the whole app to bring the button into view — that
    // was the "jump" on open.
    document.getElementById('confirmCancel').focus({ preventScroll: true });
  }

  function closeConfirmSheet(){
    var overlay = document.getElementById('confirmOverlay');
    if (overlay.classList.contains('hidden')) return;
    overlay.classList.remove('open');
    var sheet = overlay.querySelector('.confirm-sheet');
    sheet.classList.remove('dragging');
    sheet.style.transform = '';         // hand control back to the CSS slide-down
    confirmState.onConfirm = null;
    confirmState.closeTimer = setTimeout(function(){ overlay.classList.add('hidden'); }, prefersReducedMotion() ? 0 : 380);
  }

  function confirmYes(){
    var fn = confirmState.onConfirm;
    closeConfirmSheet();
    if (fn) fn();
  }

  function requestDeleteMeal(id){
    var meal = STORE.meals.filter(function(m){ return m.id === id; })[0];
    if (!meal) return;
    openConfirmSheet({
      title: 'Delete this food?',
      name: meal.name,
      detail: 'P' + (meal.protein || 0) + ' · C' + (meal.carbs || 0) + ' · F' + (meal.fat || 0),
      kcal: meal.calories,
      note: 'It will be removed from your log and from the day\u2019s totals.',
      confirmLabel: 'Delete',
      onConfirm: function(){ deleteMeal(id); maybeVibrate(); }
    });
  }

  (function(){
    // drag the grab handle down to dismiss
    var grab = document.getElementById('confirmGrab');
    var sheet = document.querySelector('#confirmOverlay .confirm-sheet');
    var startY = null;
    grab.addEventListener('pointerdown', function(e){
      startY = e.clientY;
      sheet.classList.add('dragging');
      if (grab.setPointerCapture){ try { grab.setPointerCapture(e.pointerId); } catch (err){} }
    });
    grab.addEventListener('pointermove', function(e){
      if (startY === null) return;
      sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
    });
    function endDrag(e){
      if (startY === null) return;
      var dy = Math.max(0, e.clientY - startY);
      startY = null;
      sheet.classList.remove('dragging');
      if (dy > 90) closeConfirmSheet(); else sheet.style.transform = '';
    }
    grab.addEventListener('pointerup', endDrag);
    grab.addEventListener('pointercancel', endDrag);
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && document.getElementById('confirmOverlay').classList.contains('open')) closeConfirmSheet();
    });
  })();

  // Clears only today's logged meals — a genuine blank slate for the
  // day, same idea as SaviorFit Logger's reset-log. History and every
  // other day's data stay untouched.
  function resetTodayLog(){
    if (!window.confirm('Reset today\u2019s log? This clears every meal logged today \u2014 History and other days aren\u2019t touched.')) return;
    var today = todayKey();
    STORE.meals = STORE.meals.filter(function(m){ return dateKey(m.loggedAt) !== today; });
    saveStore();
    renderApp();
  }

  /* =========================================================
     RENDER — HISTORY TAB
     ========================================================= */
  function renderHistory(){
    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>No meal history yet.<br>Logged meals will show up here.</p></div>';
      return;
    }

    var byDay = {};
    STORE.meals.forEach(function(m){
      var key = dateKey(m.loggedAt);
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(m);
    });
    var days = Object.keys(byDay).sort().reverse();

    var html = days.map(function(key){
      var meals = byDay[key].sort(function(a,b){ return b.loggedAt - a.loggedAt; });
      var totals = totalsFor(meals);
      var isOpen = ui.historyOpenDay === key;
      var inner = isOpen ? categorizedMealRowsHtml(meals) : '';
      return '<div class="card flat history-day-card">' +
        '<div class="history-day-head" data-action="toggle-history-day" data-day="' + key + '" style="cursor:pointer;">' +
          '<span class="date">' + formatDateLabel(key) + '</span>' +
          '<span class="total">' + totals.calories + ' kcal</span>' +
        '</div>' +
        inner +
      '</div>';
    }).join('');

    document.getElementById('view').innerHTML = html;
  }

  // Groups meals by category (Breakfast -> ... -> Dinner -> Other) and
  // returns rows with a small inline label before each group — all as
  // one continuous string meant to sit inside a single .card, unlike
  // groupedMealsHtml()'s separate card-per-category treatment (that
  // looked too broken-up for History specifically, per feedback).
  function categorizedMealRowsHtml(meals){
    var buckets = {};
    MEAL_CATEGORIES.forEach(function(c){ buckets[c.id] = []; });
    var other = [];
    meals.forEach(function(m){
      if (m.category && buckets[m.category]) buckets[m.category].push(m);
      else other.push(m);
    });

    var html = '';
    MEAL_CATEGORIES.forEach(function(c){
      var group = buckets[c.id];
      if (group.length === 0) return;
      html += '<div class="inline-category-label">' + c.label + '</div>' + group.map(mealRowHtml).join('');
    });
    if (other.length > 0){
      html += '<div class="inline-category-label">Other</div>' + other.map(mealRowHtml).join('');
    }
    return html;
  }

  /* =========================================================
     3D VIEWERS — Insights > Daily Overview (food pyramid) and
     Insights > Weekly Overview (week wheel)
     Three.js (r128) is loaded from CDN the first time a 3D panel
     is actually opened — same lazy pattern as the food-photo model —
     so it costs nothing on app start. createModelViewer() builds one
     viewer per model; each keeps ONE renderer/scene for the whole
     session: the panel's DOM is rebuilt on every render, so mount()
     just moves the existing canvas into the fresh container, and
     unmount() stops the render loop whenever the panel isn't on
     screen. The .glb files in /models are decimated copies of the
     source models (~60k triangles, 2048px colour map) so they load in
     seconds on a phone; the service worker caches them after the
     first load.
     ========================================================= */
  var THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  var GLTF_LOADER_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
  var ORBIT_CONTROLS_URL = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';

  function prefersReducedMotion(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  // cfg: url, bytes (size estimate for the progress bar), aria, az/el/lift
  // (starting camera angle and vertical nudge), widthFactor/heightFactor
  // (how much of the panel the model fills), autoRotateSpeed, tagMode
  // ('facing' = a tag fades with its side of the model turning away;
  // 'billboard' = always shown, a little fainter when far), and optional
  // hooks: onModel(ctx), onMount(ctx, state), onFrame(ctx, now) -> true
  // while animating, onTap(ctx, pickedObjectOrNull), onUnmount(ctx).
  function createModelViewer(cfg){
    var readyPromise = null;  // libs + scene + model; cleared on failure so reopening the tab retries
    var stage = null;         // container currently on screen, null when the panel isn't showing
    var scene, camera, renderer, controls, model = null;
    var ctx = {};             // shared with the hooks above
    var fit = { center: null, hx: 0.5, hy: 0.4, hz: 0.47, rxz: 0.69, az: cfg.az, el: cfg.el, lift: cfg.lift };
    var placed = false, userMoved = false, dirty = true;
    var rafId = 0, resumeTimer = 0, resizeObserver = null;
    var tagDefs = [], tagList = [], tagV = null, tagToCam = null; // labels pinned to points on the model (see updateTags)
    var mountState = null, pointerDown = null;

    function setStatus(text, progress){
      var box = document.getElementById('modelStatus');
      if (!box) return;
      box.classList.remove('hidden');
      var label = document.getElementById('modelStatusText');
      if (label) label.textContent = text;
      var barWrap = document.getElementById('modelBarWrap');
      if (barWrap) barWrap.classList.toggle('hidden', progress === null);
      var bar = document.getElementById('modelBar');
      if (bar && progress !== null) bar.style.width = Math.round(progress * 100) + '%';
    }
    function hideStatus(){
      var box = document.getElementById('modelStatus');
      if (box) box.classList.add('hidden');
    }

    function ensureLibs(){
      return Promise.resolve()
        .then(function(){ if (typeof THREE === 'undefined') return loadScriptOnce(THREE_URL); })
        .then(function(){
          var jobs = [];
          if (!THREE.GLTFLoader) jobs.push(loadScriptOnce(GLTF_LOADER_URL));
          if (!THREE.OrbitControls) jobs.push(loadScriptOnce(ORBIT_CONTROLS_URL));
          return Promise.all(jobs);
        });
    }

    function buildScene(){
      if (renderer) return;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      } catch (e){
        renderer = null;
        e.noWebGL = true; // lets mount() show a "device can't do 3D" message instead of "check your connection"
        throw e;
      }
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // 3x+ phones: lots of overdraw, little visible gain
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.setClearColor(0x000000, 0);
      renderer.domElement.setAttribute('role', 'img');
      renderer.domElement.setAttribute('aria-label', cfg.aria);
      // Phones drop the GL context when the browser is backgrounded;
      // three.js rebuilds its state on restore, we just need to redraw.
      renderer.domElement.addEventListener('webglcontextlost', function(e){ e.preventDefault(); });
      renderer.domElement.addEventListener('webglcontextrestored', function(){ dirty = true; });

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(36, 1, 0.05, 50);

      // Lighting: no environment map here, so a hemisphere fill plus
      // key / fill / warm rim lights (the rim uses the app's accent).
      scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f4a, 0.95));
      var key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(2, 3, 2.5);
      var fill = new THREE.DirectionalLight(0xbfd0ff, 0.4);
      fill.position.set(-3, 1.5, 1);
      var rim = new THREE.DirectionalLight(0xf2b134, 0.4);
      rim.position.set(0, 2, -3);
      scene.add(key, fill, rim);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.8;
      // Horizontal spin only: min = max pins the camera at one
      // elevation, so vertical drags do nothing.
      controls.minPolarAngle = controls.maxPolarAngle = Math.PI / 2 - fit.el;
      controls.autoRotateSpeed = cfg.autoRotateSpeed || 1.2;
      controls.addEventListener('start', function(){
        userMoved = true;
        controls.autoRotate = false;
        clearTimeout(resumeTimer);
      });
      controls.addEventListener('end', function(){
        if (prefersReducedMotion()) return;
        resumeTimer = setTimeout(function(){ controls.autoRotate = true; }, 3500);
      });
      controls.addEventListener('change', function(){ dirty = true; });

      // A short press with barely any movement is a tap (a drag is the
      // camera's): find which model part is under the finger.
      if (cfg.onTap){
        var el = renderer.domElement;
        el.addEventListener('pointerdown', function(e){ pointerDown = { x: e.clientX, y: e.clientY, t: Date.now() }; });
        el.addEventListener('pointerup', function(e){
          var d = pointerDown; pointerDown = null;
          if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8 || Date.now() - d.t > 450) return;
          var rect = el.getBoundingClientRect();
          var ndc = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
          var rc = new THREE.Raycaster();
          rc.setFromCamera(ndc, camera);
          scene.updateMatrixWorld();
          var hits = rc.intersectObjects(ctx.pickables || [], false);
          cfg.onTap(ctx, hits.length ? hits[0].object : null);
          dirty = true;
        });
      }
    }

    function loadModel(){
      if (model) return Promise.resolve();
      return new Promise(function(resolve, reject){
        new THREE.GLTFLoader().load(cfg.url, function(gltf){
          model = gltf.scene;
          var maxAniso = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
          model.traverse(function(node){
            if (!node.isMesh) return;
            (Array.isArray(node.material) ? node.material : [node.material]).forEach(function(m){
              // Nothing here is really metal, and with no environment
              // map any metalness would render near-black — so ignore
              // the metal channel and keep the roughness one.
              m.metalness = 0;
              m.metalnessMap = null;
              if (m.map) m.map.anisotropy = maxAniso;
              m.needsUpdate = true;
            });
          });
          scene.add(model);
          var box = new THREE.Box3().setFromObject(model);
          var size = box.getSize(new THREE.Vector3());
          fit.center = box.getCenter(new THREE.Vector3());
          fit.hx = size.x / 2;
          fit.hy = size.y / 2;
          fit.hz = size.z / 2;
          fit.rxz = Math.sqrt(size.x * size.x + size.z * size.z) / 2; // spins around Y, so use the footprint's radius
          ctx.model = model; ctx.scene = scene; ctx.camera = camera; ctx.controls = controls; ctx.renderer = renderer; ctx.fit = fit;
          if (cfg.onModel) cfg.onModel(ctx);
          resolve();
        }, function(evt){
          var total = (evt.lengthComputable && evt.total) ? evt.total : cfg.bytes;
          setStatus('Loading 3D model…', Math.min(evt.loaded / total, 0.95));
        }, function(err){
          reject(err || new Error('Could not load ' + cfg.url));
        });
      });
    }

    // Default camera distance: how much of the panel the model fills is
    // set by cfg.widthFactor (>1 = the model runs past the screen edges,
    // like the pyramid; <1 = fully in view with margin). On a very
    // wide/short screen the height limit wins so it never overflows.
    function fitDistance(){
      var tanV = Math.tan(camera.fov * Math.PI / 360);
      var tanH = tanV * camera.aspect;
      var byWidth = fit.hx / (cfg.widthFactor * tanH) + fit.hz;
      var byHeight = fit.hy / (cfg.heightFactor * tanV) + fit.hz * 0.6;
      return Math.max(byWidth, byHeight);
    }

    // Stretch the card down to the top of the bottom nav (whose height
    // varies with the device's safe area).
    function layout(){
      if (!stage) return;
      var card = stage.parentNode;
      var nav = document.querySelector('.bottom-nav');
      if (card && nav) card.style.bottom = nav.offsetHeight + 'px';
    }

    function resize(){
      if (!stage || !renderer || !fit.center) return;
      var w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false); // CSS sizes the canvas (100% x 100%)
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      var d = fitDistance();
      controls.target.set(fit.center.x, fit.center.y + fit.lift, fit.center.z);
      if (!placed){
        var t = controls.target;
        camera.position.set(
          t.x + d * Math.sin(fit.az) * Math.cos(fit.el),
          t.y + d * Math.sin(fit.el),
          t.z + d * Math.cos(fit.az) * Math.cos(fit.el)
        );
        placed = true;
      } else if (!userMoved){
        var dir = camera.position.clone().sub(controls.target).normalize();
        camera.position.copy(controls.target).addScaledVector(dir, d);
      }
      controls.minDistance = d * 0.6;
      controls.maxDistance = d * 1.6;
      controls.update();
      dirty = true;
    }

    // Pins HTML labels to points on the model: each frame the 3D point
    // is projected to screen coordinates, so the label rides along as
    // the model turns. 'facing' tags fade in as their side turns toward
    // the camera (fully visible within ~30 degrees, gone past ~60) and
    // shrink a little as it turns away; 'billboard' tags stay visible
    // and just get a little fainter and smaller on the far side.
    function updateTags(){
      if (!tagList.length || !stage) return;
      var cw = stage.clientWidth, ch = stage.clientHeight;
      var camDist = camera.position.distanceTo(controls.target);
      for (var i = 0; i < tagList.length; i++){
        var t = tagList[i];
        if (t.follow) t.follow(ctx, t.pos); // pinned to something that moves (e.g. a rising wedge)
        tagV.copy(t.pos).project(camera);
        var o, sc;
        if (cfg.tagMode === 'billboard'){
          var far = Math.max(0, Math.min(1, (camera.position.distanceTo(t.pos) - (camDist - fit.rxz)) / (2 * fit.rxz)));
          o = 1 - 0.5 * far;
          sc = 1 - 0.16 * far;
        } else {
          tagToCam.subVectors(camera.position, t.pos).normalize();
          o = Math.max(0, Math.min(1, (tagToCam.dot(t.n) - 0.55) / 0.3));
          sc = 0.82 + 0.18 * o;
          // Draw the ring as its tag starts to fade in; reset it only once the
          // tag has all but vanished, so nobody sees an emptied ring.
          if (!t.on && o > 0.35){ t.on = true; t.el.classList.add('in'); }
          else if (t.on && o < 0.05){ t.on = false; t.el.classList.remove('in'); }
        }
        var sx = (tagV.x * 0.5 + 0.5) * cw;
        var sy = (-tagV.y * 0.5 + 0.5) * ch;
        t.el.style.opacity = o.toFixed(3);
        t.el.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) translate(-50%,-50%) scale(' + sc.toFixed(3) + ')';
      }
    }

    function tick(){
      rafId = requestAnimationFrame(tick);
      var animating = cfg.onFrame ? cfg.onFrame(ctx, performance.now()) : false;
      var moved = controls.update();
      if (moved || dirty || controls.autoRotate || animating){
        renderer.render(scene, camera);
        updateTags();
        dirty = false;
      }
    }
    function startLoop(){ if (!rafId) rafId = requestAnimationFrame(tick); }
    function stopLoop(){
      if (rafId){ cancelAnimationFrame(rafId); rafId = 0; }
    }

    // tags: [{ el, pos: [x, y, z], normal: [nx, nz] }] — labels to pin
    // to points on the model (positions are in the model's own
    // coordinates; normal = the direction that side faces), or
    // [{ el, follow: function(ctx, outVector3) }] for labels that follow
    // a moving part. state: whatever the model's hooks need (the wheel
    // gets the week's numbers).
    function mount(container, tags, state){
      stage = container;
      tagDefs = tags || [];
      mountState = state || null;
      layout();
      if (!readyPromise){
        readyPromise = ensureLibs()
          .then(function(){ buildScene(); return loadModel(); })
          .catch(function(err){ readyPromise = null; throw err; });
      }
      readyPromise.then(function(){
        if (stage !== container) return; // panel was closed or re-rendered while loading
        container.appendChild(renderer.domElement);
        tagV = tagV || new THREE.Vector3();
        tagToCam = tagToCam || new THREE.Vector3();
        tagList = tagDefs.map(function(d){
          return {
            el: d.el,
            pos: d.pos ? new THREE.Vector3(d.pos[0], d.pos[1], d.pos[2]) : new THREE.Vector3(),
            n: d.normal ? new THREE.Vector3(d.normal[0], 0, d.normal[1]) : null,
            follow: d.follow || null,
            on: false
          };
        });
        if (cfg.onMount) cfg.onMount(ctx, mountState);
        controls.autoRotate = !prefersReducedMotion();
        layout();
        resize();
        hideStatus();
        if (resizeObserver) resizeObserver.disconnect();
        if (typeof ResizeObserver !== 'undefined'){
          resizeObserver = new ResizeObserver(resize);
          resizeObserver.observe(container);
        }
        startLoop();
      }, function(err){
        console.error('SaviorFuel: 3D model failed —', err);
        if (stage !== container) return;
        setStatus(err && err.noWebGL
          ? 'This device or browser can\'t show the 3D view.'
          : 'Couldn\'t load the 3D model. Check your connection, then reopen this tab.', null);
      });
    }

    function unmount(){
      if (!stage) return;
      stage = null;
      tagDefs = [];
      tagList = [];
      mountState = null;
      if (cfg.onUnmount) cfg.onUnmount(ctx);
      stopLoop();
      clearTimeout(resumeTimer);
      if (resizeObserver){ resizeObserver.disconnect(); resizeObserver = null; }
    }

    window.addEventListener('resize', function(){ layout(); });

    return {
      mount: mount,
      unmount: unmount,
      ctx: ctx,                                 // for the panel's own controls (e.g. closing the day card)
      redraw: function(){ dirty = true; }
    };
  }

  // Daily Overview: the food pyramid (four sides = four nutrients).
  var Model3D = createModelViewer({
    url: 'models/food-pyramid-v2.glb',
    bytes: 2748140, // for the progress bar when the server sends no length
    aria: 'Interactive 3D food pyramid. Drag to rotate, pinch to zoom.',
    az: 0.32, el: 0.2, lift: -0.04,
    widthFactor: 1.40, heightFactor: 0.92,
    autoRotateSpeed: 1.2,
    tagMode: 'facing'
  });

  // Weekly Overview: the week wheel — a wooden platter cut into seven
  // wedges, one per day (models/week-wheel-v1.glb has them as separate
  // parts named day0 = six days ago ... day6 = today). Each wedge rises
  // with that day's calories against the goal, dims if nothing was
  // logged, glows red when over the goal, and today gently pulses; a
  // thin ring marks the goal height. Tap a wedge to select it.
  var WHEEL_LIFT_MAX = 0.17;  // how far a wedge rises at 140% of the goal
  var WHEEL_LIFT_AT_CAP = 1.4;
  var WHEEL_PLATTER_TOP = 0.067; // height of the wooden surface, for the goal ring and tags
  var WeekWheel3D = createModelViewer({
    url: 'models/week-wheel-v1.glb',
    bytes: 2723556,
    aria: 'Interactive 3D week wheel: one wedge for each of the last seven days, rising with that day\'s calories. Drag to spin, tap a wedge for details.',
    az: 0, el: 0.85, lift: -0.02,
    widthFactor: 0.88, heightFactor: 0.92,
    autoRotateSpeed: 0.7,
    tagMode: 'billboard',

    onModel: function(ctx){
      ctx.wedges = [];
      ctx.pickables = [];
      ctx.model.children.forEach(function(mesh){
        if (!mesh.isMesh || mesh.userData.day == null) return;
        mesh.material = mesh.material.clone(); // its own copy, so each day can be tinted on its own
        ctx.wedges[mesh.userData.day] = {
          mesh: mesh, mat: mesh.material,
          cx: mesh.userData.cx, cz: mesh.userData.cz, topY: mesh.userData.topY,
          target: 0, selCur: 0, over: false, today: false
        };
        ctx.pickables.push(mesh);
      });
      // goal ring: sits just outside the platter at the height a wedge
      // reaches when the day exactly meets the calorie goal
      ctx.ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.535, 0.0035, 6, 120),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 })
      );
      ctx.ring.rotation.x = Math.PI / 2;
      ctx.scene.add(ctx.ring);
    },

    onMount: function(ctx, state){
      ctx.state = state;
      ctx.selected = null;
      ctx.startTime = performance.now();
      var goal = state && state.goal > 0 ? state.goal : 0;
      ctx.ring.visible = goal > 0;
      ctx.ring.position.y = WHEEL_PLATTER_TOP + WHEEL_LIFT_MAX / WHEEL_LIFT_AT_CAP;
      ctx.wedges.forEach(function(w, k){
        var d = state.days[k];
        var ratio = goal > 0 ? d.total / goal : 0;
        w.target = d.logged ? WHEEL_LIFT_MAX * Math.min(ratio, WHEEL_LIFT_AT_CAP) / WHEEL_LIFT_AT_CAP : 0;
        w.over = goal > 0 && d.total > goal;
        w.today = !!d.isToday;
        w.selCur = 0;
        w.mat.color.setScalar(d.logged ? 1 : 0.45); // days with nothing logged look faded
        w.mesh.position.y = 0;
      });
    },

    onFrame: function(ctx, now){
      if (!ctx.state) return false;
      var calm = prefersReducedMotion();
      var t = now - ctx.startTime, busy = false;
      var pulse = 0.5 + 0.5 * Math.sin(now / 420);
      ctx.wedges.forEach(function(w, k){
        var local = calm ? 1 : Math.max(0, Math.min(1, (t - k * 70) / 800)); // wedges rise one after another
        var e = 1 - Math.pow(1 - local, 3);
        if (local < 1) busy = true;
        var sel = ctx.selected === k ? 0.035 : 0;
        w.selCur += (sel - w.selCur) * (calm ? 1 : 0.22);
        if (Math.abs(sel - w.selCur) > 0.0005) busy = true;
        w.mesh.position.y = w.target * e + w.selCur;
        var r = 0, g = 0, b = 0;
        if (w.over){ r += 0.20; g += 0.045; b += 0.03; }                       // over the goal: red glow
        if (ctx.selected === k){ r += 0.30; g += 0.22; b += 0.05; }            // selected: gold
        else if (w.today){ var a = calm ? 0.12 : 0.06 + 0.12 * pulse; r += a * 0.95; g += a * 0.7; b += a * 0.2; } // today: soft gold pulse
        w.mat.emissive.setRGB(r, g, b);
      });
      return busy || !calm; // the today pulse needs a frame every tick
    },

    onTap: function(ctx, obj){
      var k = obj && obj.userData ? obj.userData.day : null;
      ctx.selected = (k == null || k === ctx.selected) ? null : k;
      if (ctx.state && ctx.state.onSelect) ctx.state.onSelect(ctx.selected);
    }
  });


  /* =========================================================
     RENDER — INSIGHTS TAB
     ========================================================= */
  // Dispatches to whichever Insights sub-tab panel is active — same
  // pattern as SaviorFit Logger's renderProgress() dispatching between
  // its Volume overview / Exercise progression views. The empty state
  // is shared: with nothing logged yet, neither panel has anything
  // meaningful to show.
  function renderInsights(){
    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>Nothing to chart yet.<br>Log a few meals and your trends will appear here.</p></div>';
      return;
    }

    if (ui.insightsView === 'trends') renderInsightsTrends();
    else renderInsightsToday();
  }

  // ---- Daily Overview has two modes, switched by the icon pair in its
  // corner: '3d' (the full-bleed food pyramid) and 'plain' (the
  // original rings / remaining macros / nutrient bars). The choice is
  // saved in appSettings so it sticks between visits.
  function overviewMode(){
    return STORE.appSettings.overviewMode === 'plain' ? 'plain' : '3d';
  }

  // The two-icon 3D / Plain switch. `action` is the click action to fire
  // (set-overview-mode for the Daily view, set-weekly-mode for the
  // Weekly view), `mode` the one currently showing.
  function modeToggleHtml(action, mode, plainIcon, plainLabel, extraClass){
    var svgAttrs = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
    return '<div class="mode-toggle' + (extraClass ? ' ' + extraClass : '') + '" role="group" aria-label="View style">' +
      '<button type="button" data-action="' + action + '" data-mode="3d" aria-label="3D view" aria-pressed="' + (mode === '3d') + '" class="' + (mode === '3d' ? 'active' : '') + '">' +
        '<svg ' + svgAttrs + '><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>' +
      '</button>' +
      '<button type="button" data-action="' + action + '" data-mode="plain" aria-label="' + plainLabel + '" aria-pressed="' + (mode === 'plain') + '" class="' + (mode === 'plain' ? 'active' : '') + '">' +
        '<svg ' + svgAttrs + '>' + plainIcon + '</svg>' +
      '</button>' +
    '</div>';
  }

  var ICON_PIE = '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path>';
  var ICON_BARS = '<line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>';

  function overviewModeToggleHtml(extraClass){
    return modeToggleHtml('set-overview-mode', overviewMode(), ICON_PIE, 'Plain view (rings and numbers)', extraClass);
  }

  // Weekly Overview has the same two modes: '3d' (the week wheel) and
  // 'plain' (the bars and averages).
  function weeklyMode(){
    return STORE.appSettings.weeklyMode === 'plain' ? 'plain' : '3d';
  }
  function weeklyModeToggleHtml(extraClass){
    return modeToggleHtml('set-weekly-mode', weeklyMode(), ICON_BARS, 'Plain view (bars and averages)', extraClass);
  }

  function renderInsightsToday(){
    if (overviewMode() === 'plain') renderInsightsPlain();
    else renderInsights3D();
  }

  // Each side of the 3D pyramid stands for one nutrient. A small tag
  // (ring + amount) is pinned to that side of the model and travels
  // with it as it turns. Order = the side facing the camera at
  // 0 / 90 / 180 / 270 degrees (+z, +x, -z, -x in the model's own
  // coordinates). y = height of the tag on the pyramid, r = how far
  // out the food surface is at that height (measured from the model).
  var PYRAMID_FACES = [
    { key: 'protein', label: 'Protein', y: 0.44, r: 0.245 },
    { key: 'carbs',   label: 'Carbs',   y: 0.08, r: 0.47 },
    { key: 'fiber',   label: 'Fibre',   y: 0.26, r: 0.345 },
    { key: 'fat',     label: 'Fat',     y: 0.60, r: 0.145 }
  ];
  var FACE_RING_R = 15;
  var FACE_RING_C = 2 * Math.PI * FACE_RING_R;

  function faceTagHtml(faceIndex, totals, goals){
    var f = PYRAMID_FACES[faceIndex];
    var value = totals[f.key] || 0;
    var goal = goals[f.key] || 0;
    var percent = pctUncapped(value, goal);
    var over = percent > 100;
    var offset = FACE_RING_C * (1 - Math.min(percent, 100) / 100);
    return '<div class="face-tag" id="faceTag' + faceIndex + '">' +
      '<div class="face-ring">' +
        '<svg viewBox="0 0 38 38">' +
          '<circle class="face-ring-track" cx="19" cy="19" r="' + FACE_RING_R + '"></circle>' +
          '<circle class="face-ring-fill ' + f.key + (over ? ' over' : '') + '" cx="19" cy="19" r="' + FACE_RING_R + '" ' +
            'style="stroke-dasharray:' + FACE_RING_C.toFixed(2) + ';--full:' + FACE_RING_C.toFixed(2) + ';--off:' + offset.toFixed(2) + ';"></circle>' +
        '</svg>' +
        '<div class="face-ring-pct' + (over ? ' over' : '') + '">' + percent + '%</div>' +
      '</div>' +
      '<div>' +
        '<div class="face-name">' + f.label + '</div>' +
        '<div class="face-amount' + (over ? ' over' : '') + '">' + Math.round(value) + ' / ' + goal + 'g</div>' +
      '</div>' +
    '</div>';
  }

  function renderInsights3D(){
    var todayMeals = mealsForDay(todayKey());
    var totals = totalsFor(todayMeals);
    var goals = STORE.goals;
    var tagsHtml = PYRAMID_FACES.map(function(f, k){ return faceTagHtml(k, totals, goals); }).join('');
    document.getElementById('view').innerHTML =
      '<div class="card model-card">' +
        '<div class="model-stage" id="modelStage"></div>' +
        tagsHtml +
        // slide-out "meals today" drawer, tucked into the top-left corner
        '<div class="meal-drawer" id="mealDrawer">' +
          '<div class="meal-drawer-panel" id="mealDrawerPanel">' + mealDrawerHtml(mealBreakdown(todayMeals), totals) + '</div>' +
          '<button type="button" class="meal-drawer-handle" data-action="toggle-meal-drawer" aria-label="Show today\'s meals" aria-expanded="false" aria-controls="mealDrawerPanel">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>' +
            '<span>Meals</span>' +
          '</button>' +
        '</div>' +
        '<div class="model-status" id="modelStatus">' +
          '<span id="modelStatusText">Loading 3D model…</span>' +
          '<div class="model-bar" id="modelBarWrap"><i id="modelBar"></i></div>' +
        '</div>' +
        overviewModeToggleHtml('floating') +
      '</div>';
    try {
      Model3D.mount(document.getElementById('modelStage'), PYRAMID_FACES.map(function(f, k){
        var a = k * Math.PI / 2;
        var nx = Math.round(Math.sin(a)), nz = Math.round(Math.cos(a)); // side k faces +z, +x, -z, -x
        return { el: document.getElementById('faceTag' + k), pos: [f.r * nx, f.y, f.r * nz], normal: [nx, nz] };
      }));
    } catch (err){
      console.error('SaviorFuel: 3D panel failed to start —', err);
    }
  }

  // Calories per meal time (Breakfast, Lunch ...) for a list of meals, in
  // the fixed meal order; meals with no category (logged before meal
  // times existed) fall into "Other". Only meal times that have
  // something logged are returned.
  function mealBreakdown(meals){
    var blank = function(id, label){ return { id: id, label: label, kcal: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, count: 0 }; };
    var rows = MEAL_CATEGORIES.map(function(c){ return blank(c.id, c.label); });
    var other = blank('other', 'Other');
    meals.forEach(function(m){
      var row = rows.filter(function(r){ return r.id === m.category; })[0] || other;
      row.kcal += m.calories || 0;
      row.protein += m.protein || 0;
      row.carbs += m.carbs || 0;
      row.fat += m.fat || 0;
      row.fiber += m.fiber || 0;
      row.count += 1;
    });
    if (other.count > 0) rows.push(other);
    return rows.filter(function(r){ return r.count > 0; }).map(function(r){
      return { id: r.id, label: r.label, kcal: Math.round(r.kcal), protein: r.protein, carbs: r.carbs, fat: r.fat, fiber: r.fiber, count: r.count };
    });
  }

  // The four tracked nutrients, in the colours used across the app.
  var MEAL_NUTRIENTS = [
    { key: 'protein', short: 'P', cls: 'p' },
    { key: 'carbs', short: 'C', cls: 'c' },
    { key: 'fat', short: 'F', cls: 'f' },
    { key: 'fiber', short: 'Fib', cls: 'fi' }
  ];

  // "P 35 · C 78 · F 52 · Fib 4" for one meal time (grams, divided by
  // `perDay` for a weekly average), each letter in its nutrient's colour.
  function mealMacrosHtml(r, perDay){
    return MEAL_NUTRIENTS.map(function(n){
      return '<span class="' + n.cls + '">' + n.short + ' <b>' + Math.round((r[n.key] || 0) / (perDay || 1)) + '</b></span>';
    }).join(' ');
  }

  // Open / close the pyramid's "Meals today" drawer. It also closes by
  // itself when you tap anywhere outside it (which includes touching the
  // pyramid to spin it — that starts with a touch on the canvas) or press
  // Escape, so it never lingers over the model.
  function setMealDrawer(open){
    var drawer = document.getElementById('mealDrawer');
    if (!drawer) return;
    drawer.classList.toggle('open', open);
    var handleBtn = drawer.querySelector('.meal-drawer-handle');
    handleBtn.setAttribute('aria-expanded', String(open));
    handleBtn.setAttribute('aria-label', open ? 'Hide today\'s meals' : 'Show today\'s meals');
  }
  document.addEventListener('pointerdown', function(e){
    var drawer = document.getElementById('mealDrawer');
    if (drawer && drawer.classList.contains('open') && !drawer.contains(e.target)) setMealDrawer(false);
  }, true); // capture phase, so it still fires when something on the page stops the event
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') setMealDrawer(false);
  });

  // Contents of the pyramid's slide-out "Meals today" drawer: one block per
  // meal time (name + kcal, a thin share bar, and its protein / carbs /
  // fat / fibre), then the day's totals.
  function mealDrawerHtml(rows, totals){
    var head = '<div class="meal-drawer-head"><b>Today by meal</b>' +
      '<button type="button" class="day-card-close" data-action="close-meal-drawer" aria-label="Close">&times;</button></div>';
    if (rows.length === 0) return head + '<div class="meal-drawer-empty">Nothing logged today.</div>';
    var total = rows.reduce(function(acc, r){ return acc + r.kcal; }, 0);
    return head + rows.map(function(r){
      var share = total > 0 ? Math.round(r.kcal / total * 100) : 0;
      return '<div class="meal-drawer-item">' +
        '<div class="meal-drawer-line"><span>' + esc(r.label) + '</span> <b>' + r.kcal + ' kcal</b></div>' +
        '<div class="meal-drawer-bar"><i style="width:' + Math.max(share, 2) + '%"></i></div>' +
        '<div class="meal-split-macros">' + mealMacrosHtml(r, 1) + '</div>' +
      '</div>';
    }).join('') +
    '<div class="meal-drawer-total"><span>Total</span> <b>' + Math.round(totals.calories) + ' kcal</b></div>' +
    '<div class="meal-split-macros">' +
      '<span class="p">P <b>' + Math.round(totals.protein) + '</b></span> ' +
      '<span class="c">C <b>' + Math.round(totals.carbs) + '</b></span> ' +
      '<span class="f">F <b>' + Math.round(totals.fat) + '</b></span> ' +
      '<span class="fi">Fib <b>' + Math.round(totals.fiber) + '</b></span>' +
    '</div>';
  }

  // One entry per meal time: label, a bar sized by its share of the total,
  // the kcal (divided by `perDay` for a weekly average) with its %, and a
  // line underneath with that meal's protein / carbs / fat / fibre.
  function mealSplitHtml(rows, total, perDay){
    return rows.map(function(r){
      var share = total > 0 ? Math.round(r.kcal / total * 100) : 0;
      return '<div class="meal-split-item"><div class="meal-split-row">' +
        '<div class="meal-split-label">' + esc(r.label) + '</div>' +
        '<div class="meal-split-track"><div class="meal-split-fill" style="width:' + Math.max(share, 2) + '%"></div></div>' +
        '<div class="meal-split-val">' + Math.round(r.kcal / (perDay || 1)) + '<span>' + share + '%</span></div>' +
      '</div><div class="meal-split-macros">' + mealMacrosHtml(r, perDay) + '</div></div>';
    }).join('');
  }

  function renderInsightsPlain(){
    var todayMeals = mealsForDay(todayKey());
    var todayTotals = totalsFor(todayMeals);
    var g = STORE.goals;

    var html = '<div class="overview-plain"><div class="today-card-head"><h3 class="section-label">Today</h3>' +
      overviewModeToggleHtml('') +
    '</div>';
    html += calorieRingHtml(todayTotals.calories, g.calories);
    html += '<div class="macro-ring-row">' +
      macroRingHtml('Protein', todayTotals.protein, g.protein, 'protein') +
      macroRingHtml('Carbs', todayTotals.carbs, g.carbs, 'carbs') +
      macroRingHtml('Fat', todayTotals.fat, g.fat, 'fat') +
    '</div>';
    html += '<div class="remaining-row">' +
      remainingStatHtml('Calories', todayTotals.calories, g.calories, ' kcal') +
      remainingStatHtml('Protein', todayTotals.protein, g.protein, 'g') +
      remainingStatHtml('Carbs', todayTotals.carbs, g.carbs, 'g') +
      remainingStatHtml('Fat', todayTotals.fat, g.fat, 'g') +
    '</div>';
    html += '<h3 class="section-label">Other nutrients</h3>';
    html += macroBarHtml('Fiber', todayTotals.fiber, g.fiber, 'fiber') +
      macroBarHtml('Sugar', todayTotals.sugar, g.sugar, 'sugar') +
      macroBarHtml('Sodium', todayTotals.sodium, g.sodium, 'sodium', 'mg');
    // how today's calories split across breakfast / lunch / dinner ...
    var todayByMeal = mealBreakdown(todayMeals);
    if (todayByMeal.length > 0){
      html += '<h3 class="section-label">Today by meal</h3>' + mealSplitHtml(todayByMeal, todayTotals.calories, 1);
    }
    var caption = macroBalanceCaption(todayMeals, todayTotals, g);
    html += '<div class="insight-caption ' + caption.tone + '">' + caption.text + '</div>';
    html += '</div>';

    document.getElementById('view').innerHTML = html;
