  // One entry per meal time: label, a bar sized by its share of the total,
  // the kcal (divided by `perDay` for a weekly average) with its %, and a
  // line underneath with that meal's protein / carbs / fat / fibre.
  function mealSplitHtml(rows, total, perDay){
    return rows.map(function(r){
      var share = total > 0 ? Math.round(r.kcal / total * 100) : 0;
      return '<div class="meal-split-item"><div class="meal-split-row">' +
        '<div class="meal-split-label">' + esc(r.label) + '</div>' +
        '<div class="meal-split-track"><div class="meal-split-fill" style="width:' + Math.max(share, 2) + '%"></div></div>' +
        '<div class="meal-split-val">' + Math.round(r.kcal / (perDay || 1)) + '<span>' + share + '%</span></div>' +
      '</div><div class="meal-split-macros">' + mealMacrosHtml(r, perDay) + '</div></div>';
    }).join('');
  }

  // Foods logged with no fiber, sugar or sodium at all (common for local
  // dishes whose database entries only list calories and macros) make
  // those three totals read lower than what you really had — say so.
  function microGapNote(meals){
    var gaps = meals.filter(function(m){ return !m.fiber && !m.sugar && !m.sodium; }).length;
    if (gaps === 0) return '';
    return '<div class="data-note">' + gaps + ' of ' + meals.length + ' food' + (meals.length === 1 ? '' : 's') + ' ' +
      (gaps === 1 ? 'has' : 'have') + ' no fiber, sugar or sodium data, so those totals are lower than what you actually had.</div>';
  }

  // The last 7 calendar days (today plus the 6 before it) worked out
  // from the meals: per-day totals, plus the numbers both Weekly views
  // share. days[0] is six days ago, days[6] is today.
  function weekData(){
    var g = STORE.goals;
    var days = [];
    var weekMeals = [];
    for (var d = 6; d >= 0; d--){
      var key = dateKeyDaysAgo(d);
      var dayMeals = mealsForDay(key);
      var t = totalsFor(dayMeals);
      weekMeals = weekMeals.concat(dayMeals);
      days.push({
        label: d === 0 ? 'Today' : new Date(key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' }),
        isToday: d === 0,
        logged: dayMeals.length > 0,
        total: Math.round(t.calories),
        t: t,
        byMeal: mealBreakdown(dayMeals)
      });
    }
    var loggedDays = days.filter(function(x){ return x.logged; });
    var sum = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
    loggedDays.forEach(function(x){
      Object.keys(sum).forEach(function(k){ sum[k] += x.t[k] || 0; });
    });
    return {
      days: days, goal: g.calories, goals: g, loggedDays: loggedDays, sum: sum,
      byMeal: mealBreakdown(weekMeals), weekMeals: weekMeals,
      avg: function(k){ return loggedDays.length ? sum[k] / loggedDays.length : 0; },
      highest: loggedDays.length ? Math.max.apply(null, loggedDays.map(function(x){ return x.total; })) : 0
    };
  }

  function renderInsightsTrends(){ renderTrendsPlain(); }

  // ---- Weekly Overview, plain: the bars, week numbers, average macros,
  // calorie split and consistency line.
  function renderTrendsPlain(){
    var wd = weekData();
    var g = wd.goals, days = wd.days, loggedDays = wd.loggedDays, avg = wd.avg, sum = wd.sum;
    var DAYS_TO_SHOW = 7;
    var dayMax = Math.max(g.calories, Math.max.apply(null, days.map(function(x){ return x.total; })), 1);
    var goalPos = pct(g.calories, dayMax); // where the goal line sits along each bar

    var html = '<div class="overview-plain"><div class="today-card-head"><h3 class="section-label">Last 7 days — daily calories</h3></div>';
    html += days.map(function(x){
      return '<div class="insight-bar-row">' +
        '<div class="insight-bar-day">' + x.label + '</div>' +
        '<div class="insight-bar-track">' +
          '<div class="insight-bar-fill' + (x.isToday ? ' today' : '') + (g.calories > 0 && x.total > g.calories ? ' over' : '') + '" style="width:' + pct(x.total, dayMax) + '%"></div>' +
          (g.calories > 0 ? '<i class="insight-goal-mark" style="left:' + goalPos + '%"></i>' : '') +
        '</div>' +
        '<div class="insight-bar-val">' + x.total + '</div>' +
      '</div>';
    }).join('');
    if (g.calories > 0) html += '<div class="week-legend-note"><i></i>Goal ' + g.calories + ' kcal</div>';

    if (loggedDays.length === 0){
      html += '<div class="insight-caption">Log a meal to see your weekly averages and macro split.</div></div>';
      document.getElementById('view').innerHTML = html;
      return;
    }

    // ---- where the week's calories came from (4 kcal/g protein & carbs, 9 kcal/g fat)
    var pKcal = sum.protein * 4, cKcal = sum.carbs * 4, fKcal = sum.fat * 9;
    var macroKcal = pKcal + cKcal + fKcal;
    if (macroKcal > 0){
      var pP = Math.round(pKcal / macroKcal * 100);
      var pC = Math.round(cKcal / macroKcal * 100);
      var pF = Math.max(0, 100 - pP - pC); // so the three always add to 100
      html += '<div class="week-divider"></div><h3 class="section-label">Where your calories come from</h3>' +
        '<div class="split-bar"><i class="p" style="width:' + pP + '%"></i><i class="c" style="width:' + pC + '%"></i><i class="f" style="width:' + pF + '%"></i></div>' +
        '<div class="split-legend">' +
          '<span><i class="p"></i>Protein <b>' + pP + '%</b></span>' +
          '<span><i class="c"></i>Carbs <b>' + pC + '%</b></span>' +
          '<span><i class="f"></i>Fat <b>' + pF + '%</b></span>' +
        '</div>';
    }

    // ---- consistency: days close to the calorie goal (85%–110%)
    if (g.calories > 0){
      var onTarget = loggedDays.filter(function(x){ return x.total >= 0.85 * g.calories && x.total <= 1.10 * g.calories; }).length;
      html += '<div class="insight-caption' + (onTarget * 2 >= loggedDays.length ? ' balanced' : '') + '">' +
        'Close to your calorie goal (85–110%) on <b>' + onTarget + ' of ' + loggedDays.length + '</b> logged day' + (loggedDays.length === 1 ? '' : 's') + '.</div>';
    }
    html += '</div>';

    document.getElementById('view').innerHTML = html;
  }

  // Mifflin-St Jeor plan from a profile (weightKg / heightCm / age / sex /
  // activityLevel / goal). Used by Settings > "Calculate my plan" and the
  // first-run welcome.
  function computePlan(profile){
    var bmr = profile.sex === 'male'
      ? (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) + 5
      : (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) - 161;
    var activityMult = (ACTIVITY_LEVELS.find(function(a){ return a.id === profile.activityLevel; }) || ACTIVITY_LEVELS[2]).mult;
    var tdee = bmr * activityMult;
    var goalAdjust = (GOAL_OPTIONS.find(function(g){ return g.id === profile.goal; }) || GOAL_OPTIONS[1]).calAdjust;
    var calories = Math.max(1200, Math.round(tdee + goalAdjust)); // 1200 floor as a basic safety rail
    // Macro split: protein by bodyweight (1.8g/kg), fat at 25% of calories, carbs fill the rest.
    var protein = Math.round(profile.weightKg * 1.8);
    var fatCal = calories * 0.25;
    var fat = Math.round(fatCal / 9);
    var carbs = Math.round(Math.max(0, calories - protein * 4 - fatCal) / 4);
    return { tdee: tdee, calories: calories, protein: protein, carbs: carbs, fat: fat };
  }

  function calculatePlanFromForm(){
    var imperial = STORE.appSettings.unit === 'imperial';
    var rawHeight = parseFloat(document.getElementById('profHeight').value) || (imperial ? cmToIn(DEFAULT_PROFILE.heightCm) : DEFAULT_PROFILE.heightCm);
    var rawWeight = parseFloat(document.getElementById('profWeight').value) || (imperial ? kgToLb(DEFAULT_PROFILE.weightKg) : DEFAULT_PROFILE.weightKg);
    var profile = {
      sex: document.getElementById('profSex').value,
      age: parseInt(document.getElementById('profAge').value, 10) || DEFAULT_PROFILE.age,
      heightCm: Math.round(imperial ? inToCm(rawHeight) : rawHeight),
      weightKg: Math.round(imperial ? lbToKg(rawWeight) : rawWeight),
      activityLevel: document.getElementById('profActivity').value,
      goal: document.getElementById('profGoal').value
    };
    STORE.profile = profile;

    var plan = computePlan(profile);
    var tdee = plan.tdee, targetCalories = plan.calories, proteinG = plan.protein, fatG = plan.fat, carbG = plan.carbs;

    // Merge rather than replace — the calculator only derives
    // calories/protein/carbs/fat, so fiber/sugar/sodium goals
    // (whatever the person set, or the defaults) carry over instead
    // of getting wiped to undefined.
    STORE.goals = Object.assign({}, STORE.goals, { calories: targetCalories, protein: proteinG, carbs: carbG, fat: fatG });
    STORE.lastPlanTdee = Math.round(tdee);
    saveStore();
    renderApp();
  }

  /* =========================================================
     RENDER DISPATCH
     ========================================================= */
  /* =========================================================
     APP SETTINGS — density/corners (Appearance) applied as body
     data-attributes so the CSS overrides near the top of the file
     pick them up; haptic feedback fires directly where relevant
     (see addMealFromForm). Export/import is a straight JSON
     dump/restore of the whole STORE object.
     ========================================================= */
  function applyAppearanceSettings(){
    document.body.dataset.density = STORE.appSettings.density || 'comfortable';
    document.body.dataset.corners = STORE.appSettings.corners || 'rounded';
    document.body.dataset.theme = STORE.appSettings.theme || 'dark';
    try{ var tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content', document.body.dataset.theme==='light' ? '#ebe6da' : '#1f232b'); }catch(e){}
    document.body.dataset.bgArt = STORE.appSettings.bgArt === false ? 'off' : 'on';
  }

  function maybeVibrate(){
    if (STORE.appSettings.haptic === false) return;
    if (navigator.vibrate) navigator.vibrate(15);
  }

  function exportData(){
    var blob = new Blob([JSON.stringify(STORE, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'saviorfuel-backup-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleImportFile(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.meals)) throw new Error('Not a valid SaviorFuel backup file');
        if (!window.confirm('Replace everything currently on this device with this backup?')) return;
        STORE = {
          meals: parsed.meals.map(sanitizeMeal).filter(Boolean),
          goals: Object.assign({}, DEFAULT_GOALS, parsed.goals || {}),
          profile: parsed.profile || Object.assign({}, DEFAULT_PROFILE),
          appSettings: Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {}),
          savedFoods: Array.isArray(parsed.savedFoods) ? parsed.savedFoods : [],
          myFoods: Array.isArray(parsed.myFoods) ? parsed.myFoods : [],
          water: (parsed.water && typeof parsed.water === 'object') ? parsed.water : {}
        };
        saveStore();
        applyAppearanceSettings();
        renderApp();
      } catch (err){
        console.error('SaviorFuel: import failed —', err);
        alert('That file doesn\'t look like a valid SaviorFuel backup.');
      }
    };
    reader.readAsText(file);
  }

      camera: svgOpen + '<path d="M4 8V6a2 2 0 0 1 2-2h1l1.5-2h7L17 4h1a2 2 0 0 1 2 2v2"></path><path d="M2 8h20v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"></path><circle cx="12" cy="14" r="4"></circle></svg>',

  // Moves the sliding highlight of a tab bar to tab number `index`.
  // Without `animate` it jumps there instantly (first paint, or when the
  // bar wasn't on screen), so nothing glides in from the first tab.
  function setSlider(barEl, index, animate){
    if (!barEl) return;
    if (!animate) barEl.classList.add('no-slide');
    barEl.style.setProperty('--i', String(index));
    if (!animate){
      void barEl.offsetWidth;
      barEl.classList.remove('no-slide');
    }
  }
  var slidersReady = false; // false until the first render has placed them

  function tabIndexOf(tab){
    var btns = document.querySelectorAll('.tabbar button');
    for (var i = 0; i < btns.length; i++) if (btns[i].dataset.tab === tab) return i;
    return 0;
  }

  function renderApp(){
    // The 3D panel only exists on Insights > Daily Overview; stop its
    // render loop everywhere else so it isn't drawing off-screen.
    var onInsights = state.tab === 'insights' && STORE.meals.length > 0;
    var weekly = ui.insightsView === 'trends';
    var showPyramid = onInsights && !weekly && overviewMode() === '3d';
    if (!showPyramid) Model3D.unmount();
    document.getElementById('view').classList.toggle('model-fullscreen', showPyramid);
    document.getElementById('view').classList.toggle('plain-fullscreen',
      onInsights && (weekly || overviewMode() === 'plain'));
    document.querySelectorAll('.tabbar button').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    setSlider(document.getElementById('tabbar'), tabIndexOf(state.tab), slidersReady);
    if (state.tab === 'log') renderLog();
    else if (state.tab === 'history') renderHistory();
    else if (state.tab === 'scan') renderScan();
    else if (state.tab === 'insights') renderInsights();
    else if (state.tab === 'settings') renderSettings();

    // Sticky Today / Trends switch — only exists on the Insights tab
    // once there's something to show, same pattern as SaviorFit
    // Logger's Volume overview / Exercise progression bar.
    var showInsightsSubtabbar = state.tab === 'insights' && STORE.meals.length > 0;
    document.body.classList.toggle('has-insights-subtab', showInsightsSubtabbar);
    var insightsSubtabbarEl = document.getElementById('insightsSubtabbar');
    insightsSubtabbarEl.classList.toggle('hidden', !showInsightsSubtabbar);
    if (showInsightsSubtabbar){
      insightsSubtabbarEl.querySelectorAll('button').forEach(function(btn){
        btn.classList.toggle('active', btn.dataset.view === ui.insightsView);
      });
      setSlider(insightsSubtabbarEl, ui.insightsView === 'trends' ? 1 : 0, slidersReady);
    }
    slidersReady = true;
  }

  // Fades the current Insights sub-tab panel out, swaps to the new
  // one, then fades it in — same treatment as SaviorFit Logger's
  // switchProgressViewWithFade() for its Volume overview / Exercise
  // progression switch.
  function switchInsightsViewWithFade(newView){
    if (newView === ui.insightsView) return;
    setSlider(document.getElementById('insightsSubtabbar'), newView === 'trends' ? 1 : 0, true);
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion){
      ui.insightsView = newView;
      renderApp();
      return;
    }
    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');
    setTimeout(function(){
      ui.insightsView = newView;
      renderApp();
      var v = document.getElementById('view');
      v.classList.remove('subtab-fade-out');
      v.classList.add('subtab-fade-in');
      setTimeout(function(){
        v.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  // 3D <-> Plain switch (Daily and Weekly Overview): the whole panel flips
  // like a card (see the flip-* CSS). With reduced motion on, it just swaps.
  function flipToMode(setting, newMode, currentMode){
    if (newMode === currentMode) return;
    function apply(){
      STORE.appSettings[setting] = newMode;
      saveStore();
      renderApp();
    }
    var viewEl = document.getElementById('view');
    if (prefersReducedMotion()){ apply(); return; }
    var dir = newMode === 'plain' ? 'l' : 'r';
    viewEl.classList.remove('subtab-fade-in', 'subtab-fade-out');
    viewEl.classList.add('flip-out-' + dir);
    setTimeout(function(){
      apply();
      var v = document.getElementById('view');
      v.classList.remove('flip-out-' + dir);
      v.classList.add('flip-in-' + dir);
      setTimeout(function(){ v.classList.remove('flip-in-' + dir); }, 250);
    }, 190);
  }
  function switchOverviewModeWithFade(newMode){ flipToMode('overviewMode', newMode, overviewMode()); }

  // Same fade+shift treatment as SaviorFit Logger's switchTabWithFade.
  function switchTab(newTab){
    if (newTab === state.tab) return;
    setSlider(document.getElementById('tabbar'), tabIndexOf(newTab), true); // the highlight starts gliding on the tap itself
    closeScanner(); // safety: release the camera if it was somehow left open
    closeFoodSearchOverlay();
    closeAddMealOverlay();
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');

    setTimeout(function(){
      state.tab = newTab;
      renderApp();
      viewEl.classList.remove('subtab-fade-out');
      viewEl.classList.add('subtab-fade-in');
      setTimeout(function(){
        viewEl.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  });

  // Picking a date in the Day row updates its one-line summary.
  document.addEventListener('change', function(e){
    if (e.target && e.target.id === 'mealDate') updateDayValue();
  });

  // Keep the Nutrition summary line in step with what's typed in the fields.
  document.addEventListener('input', function(e){
    var id = e.target && e.target.id;
    if (id === 'mealCal' || id === 'mealProtein' || id === 'mealCarbs' || id === 'mealFat') updateMealSummary();
  });

  // Typing in the amount box updates the macros live.
  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'servingQty' && ui.selectedFood){
      setServingQty(parseFloat(e.target.value) || 0);
    }
  });



  /* =========================================================
     INSTALL AS AN APP (PWA)
     Android/desktop Chrome: capture the browser's install prompt and
     offer it from Settings + a dismissible banner on Log.
     iPhone/iPad: no prompt exists, so show "Share > Add to Home Screen".
     ========================================================= */
  var deferredInstall = null;
  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }
  function isIOSDevice(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function canOfferInstall(){
    return !isStandalone() && (!!deferredInstall || isIOSDevice());
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();               // we show our own button instead of the mini-bar
    deferredInstall = e;
    if (state.tab === 'log' || state.tab === 'settings') renderApp();
  });
  window.addEventListener('appinstalled', function(){
    deferredInstall = null;
    STORE.appSettings.installDismissed = true;
    saveStore();
    renderApp();
    showToast('SaviorFuel installed');
  });

  function installApp(){
    if (deferredInstall){
      var promptEvent = deferredInstall;
      promptEvent.prompt();
      promptEvent.userChoice.then(function(choice){
        deferredInstall = null;
        if (choice && choice.outcome !== 'accepted'){ STORE.appSettings.installDismissed = true; saveStore(); }
        renderApp();
      });
    } else if (isIOSDevice()){
      openInstallHelp();
    }
  }

  function openInstallHelp(){
    if (document.getElementById('installHelp')) return;
    var el = document.createElement('div');
    el.id = 'installHelp';
    el.className = 'install-help';
    el.innerHTML = '<div class="install-help-card" role="dialog" aria-label="Install SaviorFuel">' +
        '<img src="images/logo-mark.png" alt="" class="install-help-logo">' +
        '<h3>Add to Home Screen</h3>' +
        '<ol><li>Tap the <b>Share</b> button <span class="ih-share">⬆︎</span> in Safari’s toolbar</li>' +
        '<li>Scroll down and tap <b>Add to Home Screen</b></li>' +
        '<li>Tap <b>Add</b> — SaviorFuel opens like a normal app</li></ol>' +
        '<button type="button" class="welcome-primary" data-action="close-install-help">Got it</button>' +
      '</div>';
    document.body.appendChild(el);
  }

  function installBannerHtml(){
    if (!canOfferInstall() || STORE.appSettings.installDismissed || STORE.meals.length === 0) return '';
    return '<div class="install-banner">' +
      '<img src="icons/icon-192.png" alt="" class="install-banner-icon">' +
      '<div class="install-banner-text"><b>Install SaviorFuel</b><span>Opens like an app, works offline</span></div>' +
      '<button type="button" class="install-banner-btn" data-action="install-app">Install</button>' +
      '<button type="button" class="install-banner-x" data-action="dismiss-install" aria-label="Dismiss">×</button>' +
    '</div>';
  }

  /* =========================================================
     FIRST-RUN WELCOME — 4 short steps, skippable at any point.
     Sets units, profile and daily goals, then never shows again.
     ========================================================= */
  var welcome = { step: 0, unit: 'metric', sex: 'male', age: '', height: '', weight: '', goal: 'maintain', activity: 'moderate', plan: null };

  function maybeShowWelcome(){
    if (STORE.appSettings.welcomed) return;
    if (STORE.meals.length > 0){ STORE.appSettings.welcomed = true; saveStore(); return; } // existing user
    welcome.unit = STORE.appSettings.unit === 'imperial' ? 'imperial' : 'metric';
    welcome.step = 0;
    renderWelcome();
  }

  function closeWelcome(){
    var el = document.getElementById('welcomeOverlay');
    if (el) el.remove();
  }

  function welcomeDone(applyPlan){
    STORE.appSettings.welcomed = true;
    if (applyPlan && welcome.plan){
      STORE.profile = welcome.plan.profile;
      STORE.goals = Object.assign({}, STORE.goals, { calories: welcome.plan.calories, protein: welcome.plan.protein, carbs: welcome.plan.carbs, fat: welcome.plan.fat });
      STORE.lastPlanTdee = Math.round(welcome.plan.tdee);
      STORE.appSettings.unit = welcome.unit;
    }
    saveStore();
    closeWelcome();
    applyAppearanceSettings();
    renderApp();
    if (applyPlan && welcome.plan) showToast('Daily target set: ' + welcome.plan.calories + ' kcal');
  }

  function welcomeCapture(){
    var g = function(id){ var e = document.getElementById(id); return e ? e.value : null; };
    if (g('wAge') !== null) welcome.age = g('wAge');
    if (g('wHeight') !== null) welcome.height = g('wHeight');
    if (g('wWeight') !== null) welcome.weight = g('wWeight');
    if (g('wActivity') !== null) welcome.activity = g('wActivity');
  }

  function welcomeBuildPlan(){
    var imperial = welcome.unit === 'imperial';
    var h = parseFloat(welcome.height), w = parseFloat(welcome.weight), age = parseInt(welcome.age, 10);
    var profile = {
      sex: welcome.sex,
      age: (age >= 10 && age <= 100) ? age : DEFAULT_PROFILE.age,
      heightCm: Math.round(h > 0 ? (imperial ? inToCm(h) : h) : DEFAULT_PROFILE.heightCm),
      weightKg: Math.round(w > 0 ? (imperial ? lbToKg(w) : w) : DEFAULT_PROFILE.weightKg),
      activityLevel: welcome.activity,
      goal: welcome.goal
    };
    var plan = computePlan(profile);
    plan.profile = profile;
    welcome.plan = plan;
  }

  function renderWelcome(){
    var el = document.getElementById('welcomeOverlay');
    if (!el){
      el = document.createElement('div');
      el.id = 'welcomeOverlay';
      el.className = 'welcome-overlay';
      document.getElementById('app').parentNode.appendChild(el);
    }
    var imperial = welcome.unit === 'imperial';
    var st = welcome.step;
    var dots = '<div class="welcome-dots">' + [0,1,2,3].map(function(i){ return '<i class="' + (i === st ? 'on' : (i < st ? 'done' : '')) + '"></i>'; }).join('') + '</div>';
    var body = '', footer = '';

    if (st === 0){
      body = '<img class="welcome-logo" src="images/logo-mark.png" alt="SaviorFuel">' +
        '<h2>Welcome to SaviorFuel</h2>' +
        '<p>Log your meals, see your macros and hit your daily goals. Let’s set your target in 30 seconds.</p>';
      footer = '<button class="welcome-primary" data-w="next">Get started</button><button class="welcome-skip" data-w="skip">Skip for now</button>';
    } else if (st === 1){
      body = '<h2>About you</h2><p>Used only to estimate your daily calories. It stays on this device.</p>' +
        '<div class="welcome-field"><label>Units</label><div class="welcome-seg">' +
          '<button data-w="unit" data-v="metric" class="' + (!imperial ? 'active' : '') + '">kg / cm</button>' +
          '<button data-w="unit" data-v="imperial" class="' + (imperial ? 'active' : '') + '">lb / in</button></div></div>' +
        '<div class="welcome-field"><label>Sex</label><div class="welcome-seg">' +
          '<button data-w="sex" data-v="male" class="' + (welcome.sex === 'male' ? 'active' : '') + '">Male</button>' +
          '<button data-w="sex" data-v="female" class="' + (welcome.sex === 'female' ? 'active' : '') + '">Female</button></div></div>' +
        '<div class="welcome-row">' +
          '<div class="welcome-field"><label for="wAge">Age</label><input id="wAge" type="number" inputmode="numeric" min="10" max="100" placeholder="' + DEFAULT_PROFILE.age + '" value="' + esc(welcome.age) + '"></div>' +
          '<div class="welcome-field"><label for="wHeight">Height (' + (imperial ? 'in' : 'cm') + ')</label><input id="wHeight" type="number" inputmode="decimal" placeholder="' + Math.round(imperial ? cmToIn(DEFAULT_PROFILE.heightCm) : DEFAULT_PROFILE.heightCm) + '" value="' + esc(welcome.height) + '"></div>' +
          '<div class="welcome-field"><label for="wWeight">Weight (' + (imperial ? 'lb' : 'kg') + ')</label><input id="wWeight" type="number" inputmode="decimal" placeholder="' + Math.round(imperial ? kgToLb(DEFAULT_PROFILE.weightKg) : DEFAULT_PROFILE.weightKg) + '" value="' + esc(welcome.weight) + '"></div>' +
        '</div>';
      footer = '<button class="welcome-primary" data-w="next">Next</button><button class="welcome-skip" data-w="skip">Skip for now</button>';
    } else if (st === 2){
      body = '<h2>Your goal</h2><p>Pick what fits you. You can change it any time in Settings.</p>' +
        '<div class="welcome-goals">' + GOAL_OPTIONS.map(function(o){
          return '<button data-w="goal" data-v="' + o.id + '" class="' + (welcome.goal === o.id ? 'active' : '') + '"><b>' + o.label + '</b><span>' +
            (o.calAdjust < 0 ? 'Eat a bit under maintenance' : (o.calAdjust > 0 ? 'Eat a bit over, with high protein' : 'Eat around maintenance')) + '</span></button>';
        }).join('') + '</div>' +
        '<div class="welcome-field"><label for="wActivity">Activity level</label><select id="wActivity">' +
          ACTIVITY_LEVELS.map(function(a){ return '<option value="' + a.id + '"' + (welcome.activity === a.id ? ' selected' : '') + '>' + a.label + '</option>'; }).join('') +
        '</select></div>';
      footer = '<button class="welcome-primary" data-w="next">See my plan</button><button class="welcome-skip" data-w="skip">Skip for now</button>';
    } else {
      var pl = welcome.plan;
      body = '<h2>Your daily target</h2>' +
        '<div class="welcome-plan-kcal">' + pl.calories.toLocaleString() + '<span>kcal / day</span></div>' +
        '<div class="macro-tiles">' +
          macroTileHtml('Protein', pl.protein, pl.protein, 'protein').replace(/<span>\/\d+g<\/span>/, '<span>g</span>') +
          macroTileHtml('Carbs', pl.carbs, pl.carbs, 'carbs').replace(/<span>\/\d+g<\/span>/, '<span>g</span>') +
          macroTileHtml('Fat', pl.fat, pl.fat, 'fat').replace(/<span>\/\d+g<\/span>/, '<span>g</span>') +
        '</div>' +
        '<p class="welcome-note">An estimate to start from. Adjust any number later in Settings.</p>';
      footer = '<button class="welcome-primary" data-w="finish">Start logging</button><button class="welcome-skip" data-w="back">Back</button>';
    }
    el.innerHTML = '<div class="welcome-card">' + dots + '<div class="welcome-body">' + body + '</div><div class="welcome-footer">' + footer + '</div></div>';
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-w]');
    if (!b || !document.getElementById('welcomeOverlay')) return;
    var w = b.dataset.w;
    welcomeCapture();
    if (w === 'skip'){ welcomeDone(false); return; }
    if (w === 'finish'){ welcomeDone(true); return; }
    if (w === 'unit'){
      // convert anything already typed so switching units doesn't scramble it
      var to = b.dataset.v;
      if (to !== welcome.unit){
        var h = parseFloat(welcome.height), wt = parseFloat(welcome.weight);
        if (h > 0) welcome.height = String(Math.round(to === 'imperial' ? cmToIn(h) : inToCm(h)));
        if (wt > 0) welcome.weight = String(Math.round(to === 'imperial' ? kgToLb(wt) : lbToKg(wt)));
        welcome.unit = to;
      }
    } else if (w === 'sex'){ welcome.sex = b.dataset.v; }
    else if (w === 'goal'){ welcome.goal = b.dataset.v; }
    else if (w === 'back'){ welcome.step = Math.max(0, welcome.step - 1); }
    else if (w === 'next'){
      welcome.step = Math.min(3, welcome.step + 1);
      if (welcome.step === 3) welcomeBuildPlan();
    }
    renderWelcome();
  });

  // App shortcuts (long-press the icon) open e.g. "./?tab=scan".
  try {
    var launchTab = new URLSearchParams(location.search).get('tab');
    if (['log', 'history', 'scan', 'insights', 'settings'].indexOf(launchTab) !== -1) state.tab = launchTab;
  } catch (e) {}

  applyAppearanceSettings();
  document.getElementById('bootLoading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderApp();
  maybeShowWelcome();

  // Registered after boot so it never delays first paint — this is
  // what lets the app open at all with no connection, and caches
  // static assets (fonts, background image, the food-photo model
  // once used) opportunistically. Deliberately doesn't cache USDA/
  // OFF/Kalori search calls — see sw.js.
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js')
        .catch(function(err){ console.error('SaviorFuel: service worker registration failed —', err); });
    });
  }
</script>

</body>
</html>
