  function saveFoodSheet(mode, id){
    var num = function(i){ var el = document.getElementById(i); var v = el ? parseFloat(el.value) : 0; return isFinite(v) ? Math.max(0, Math.round(v)) : 0; };
    var txt = function(i){ var el = document.getElementById(i); return el ? el.value.trim() : ''; };
    var cal = num('fsCal');
    var calRaw = document.getElementById('fsCal');
    if (!calRaw || calRaw.value.trim() === ''){ showToast('Add the calories first'); return; }   // 0 is allowed
    if (mode === 'quick'){
      var dayKey = logDayKey();
      var cat = suggestCategoryForNow();
      STORE.meals.push({
        id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        name: txt('fsName') || 'Quick add', calories: cal, protein: num('fsP'), carbs: num('fsC'), fat: num('fsF'),
        fiber: 0, sugar: 0, sodium: 0, category: cat, loggedAt: stampForDay(dayKey, Date.now(), null)
      });
      expandMealGroup(cat);
      saveStore(); maybeVibrate();
      closeFoodSheet(); closeFoodSearchOverlay();
      if (state.tab === 'scan') state.tab = 'log';
      renderApp();
      showToast('Added ' + cal + ' kcal');
      return;
    }
    var name = txt('fsName');
    if (!name){ showToast('Give the food a name'); return; }
    var food = { id: id || ('mf_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)), name: name, serving: txt('fsServing'),
      calories: cal, protein: num('fsP'), carbs: num('fsC'), fat: num('fsF'), barcode: sheetBarcode || undefined };
    var scannedBarcode = sheetBarcode;
    var list = STORE.myFoods || (STORE.myFoods = []);
    var at = -1;
    list.forEach(function(f, i){ if (f.id === food.id) at = i; });
    if (at >= 0) list[at] = food; else list.unshift(food);
    saveStore(); maybeVibrate();
    closeFoodSheet();
    if (scannedBarcode && at < 0){
      // saved straight from a scan: carry on to logging it
      ui.lastSearchProducts = [myFoodToProduct(food)];
      pickFoodResult(0);
      showToast('Saved — scan it again any time');
      return;
    }
    var input = document.getElementById('foodSearchInput');
    if (input && input.value.trim().length >= 2) searchFoodDebounced(input.value); else renderFoodHome();
    showToast('Saved to My Foods');
  }

  function deleteMyFood(id){
    if (!window.confirm('Delete this food from My Foods? Meals you already logged stay as they are.')) return;
    STORE.myFoods = (STORE.myFoods || []).filter(function(f){ return f.id !== id; });
    saveStore();
    closeFoodSheet();
    renderFoodHome();
  }

  // ---- Water ----
  function waterFor(key){ return Math.max(0, (STORE.water && STORE.water[key]) || 0); }
  function addWater(delta){
    var key = logDayKey();
    if (!STORE.water) STORE.water = {};
    var next = Math.max(0, waterFor(key) + delta);
    if (next === 0) delete STORE.water[key]; else STORE.water[key] = next;
    saveStore();
    maybeVibrate();
    // Swap just the water row so the 3D ring isn't rebuilt and the page doesn't jump back to the top.
    var row = document.querySelector('.water-row');
    if (row && state.tab === 'log') row.outerHTML = waterRowHtml(key);
    else renderApp();
  }
  function fmtWater(ml){ return ml >= 1000 ? (Math.round(ml / 10) / 100) + ' L' : ml + ' ml'; }
  function waterTileHtml(key){
    var goal = STORE.goals.water || DEFAULT_GOALS.water;
    var ml = waterFor(key);
    var p = goal > 0 ? Math.min(100, Math.round(ml / goal * 100)) : 0;
    return '<div class="log-tile water"><span class="lt-ic wt"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-3 4.2-6 7.3-6 11a6 6 0 0 0 12 0c0-3.7-3-6.8-6-11z"></path></svg></span>' +
      '<b>WATER</b><small>' + fmtWater(ml) + ' / ' + fmtWater(goal) + '</small>' +
      '<div class="water-bar"><i style="width:' + p + '%"></i></div>' +
      '<div class="lt-btns">' + (ml > 0 ? '<button type="button" class="water-btn minus" data-action="water-add" data-ml="-250" aria-label="Remove 250 ml">−</button>' : '') +
      '<button type="button" class="water-btn" data-action="water-add" data-ml="250" aria-label="Add 250 ml">+250 ml</button></div></div>';
  }

  function waterRowHtml(key){
    var goal = STORE.goals.water || DEFAULT_GOALS.water;
    var ml = waterFor(key);
    var p = goal > 0 ? Math.min(100, Math.round(ml / goal * 100)) : 0;
    return '<div class="water-row"><span class="water-ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-3 4.2-6 7.3-6 11a6 6 0 0 0 12 0c0-3.7-3-6.8-6-11z"></path></svg></span>' +
      '<div class="water-main"><div class="water-top"><b>Water</b><span>' + fmtWater(ml) + ' / ' + fmtWater(goal) + '</span></div>' +

      (ml > 0 ? '<button type="button" class="water-btn minus" data-action="water-add" data-ml="-250" aria-label="Remove 250 ml">−</button>' : '') +

  // One result row — shared by live search results and the empty-search
  // "Favorites / Recent" home. Saved foods get a star to pin them.
  var STAR_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><polygon points="12 2.5 14.9 8.6 21.5 9.4 16.6 14 17.9 20.6 12 17.3 6.1 20.6 7.4 14 2.5 9.4 9.1 8.6"></polygon></svg>';
  /* ---- Search row polish: highlight what you typed, split "Name (detail)"
     into a title and a quieter detail line, and remember the serving you
     used last for each food (kept on this phone only). ---- */
  var rowHl = '';
  function reEsc(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function hlHtml(text, q){
    var toks = String(q || '').toLowerCase().split(/\s+/).filter(function(t){ return t.length >= 2; });
    if (!toks.length) return esc(text);
    var re = new RegExp('(' + toks.map(reEsc).join('|') + ')', 'ig');
    return String(text).split(re).map(function(part, i){ return i % 2 ? '<span class="hl">' + esc(part) + '</span>' : esc(part); }).join('');
  }
  function splitFoodName(name){
    var m = /^(.+?)\s*\((.+)\)\s*$/.exec(String(name || ''));
    return m ? { main: m[1], extra: m[2] } : { main: String(name || ''), extra: '' };
  }
  function shortFoodName(name){ return splitFoodName(name).main || String(name || ''); }
  var LAST_SERV_KEY = 'saviorfuel_lastserv_v1', lastServCache = null;
  function lastServAll(){
    if (lastServCache) return lastServCache;
    try { lastServCache = JSON.parse(localStorage.getItem(LAST_SERV_KEY) || '{}') || {}; } catch (e) { lastServCache = {}; }
    return lastServCache;
  }
  function lastServKey(n){ return String(n || '').toLowerCase().trim().slice(0, 80); }
  function rememberServing(){
    var f = ui.selectedFood, u = f && ui.serving ? currentServingUnit() : null;
    if (!f || !u || !(ui.serving.qty > 0)) return;
    var q = roundQty(ui.serving.qty, u);
    var unitTxt = u.id === 'serving' ? (q === 1 ? 'serving' : 'servings') : (u.id === 'g' || u.id === 'oz') ? u.id : String(u.label || '').split(' \u00B7 ')[0];
    var all = lastServAll(), k = lastServKey(f.name);
    delete all[k];
    all[k] = { u: u.id, q: q, t: q + ' ' + unitTxt };
    var keys = Object.keys(all);
    if (keys.length > 200) keys.slice(0, keys.length - 200).forEach(function(x){ delete all[x]; });
    try { localStorage.setItem(LAST_SERV_KEY, JSON.stringify(all)); } catch (e) {}
  }

  function foodRowHtml(p, i){
    var cal = Math.round(p.nutriments['energy-kcal_100g'] || 0);
    // Right-hand tag is just the calories; the serving basis goes in
    // the small line under the name so the name gets the room.
    var meta = [];
    var brand = p.brands ? p.brands.split(',')[0].trim() : '';
    if (brand) meta.push(esc(brand));
    if (p._mine) meta.push(esc(p._servingLabel || '1 serving'), 'My food');
    else if (p._builtin) meta.push(esc(p._servingLabel || '1 serving'), 'Built-in \u00B7 estimate');
    else if (p._source === 'saved') meta.push(esc(p._servingLabel || '100g'), 'Saved');
    else if (p._source === 'techapi'){ if (p._serving) meta.push(esc(p._serving)); }
    else meta.push('per 100 g');
    if (p._source === 'saved' ? p._note : foodDataNote(p.nutriments)) meta.push('<span class="row-warn">⚠ check data</span>');
    var sn = splitFoodName(p.product_name);
    var ls = lastServAll()[lastServKey(p.product_name)];
    if (ls && ls.t && !(ls.u === 'serving' && ls.q === 1) && !(ls.u === 'g' && ls.q === 100)) meta.push('<span class="last-serv">last: ' + esc(ls.t) + '</span>');
    var star = p._mine
      ? '<button type="button" class="food-fav edit" data-action="edit-my-food" data-id="' + esc(p._myId) + '" aria-label="Edit ' + esc(p.product_name) + '">' + EDIT_SVG + '</button>'
      : p._builtin ? ''
      : p._source === 'saved'
      ? '<button type="button" class="food-fav' + (p._fav ? ' on' : '') + '" data-action="toggle-fav" data-name="' + esc(p.product_name) + '" aria-label="' + (p._fav ? 'Remove from favorites' : 'Add to favorites') + '" aria-pressed="' + (!!p._fav) + '">' + STAR_SVG + '</button>'
      : '';
    return '<div class="food-suggest-item" role="button" tabindex="0" data-action="pick-food" data-index="' + i + '">' +
      foodThumbHtml(p) +
      '<div class="food-suggest-name">' +
        '<div class="food-suggest-title">' + hlHtml(sn.main, rowHl) + (sn.extra ? '<small>' + esc(sn.extra) + '</small>' : '') + '</div>' +
        (meta.length ? '<div class="brand">' + meta.join(' · ') + '</div>' : '') +
      '</div>' +
      star +
      '<div class="food-suggest-tag">' + cal + ' kcal</div>' +
    '</div>';
  }

  // Empty search box: show your pinned favorites, then the foods you
  // logged most recently (the saved-foods cache is already newest-first),
  // so a food you eat often is one tap away.
  function renderFoodHome(){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;
    var all = STORE.savedFoods || [];
    var mine = myFoodProducts();
    var favs = all.filter(function(f){ return f._fav; });
    var recents = all.filter(function(f){ return !f._fav; }).slice(0, 8);
    var products = mine.concat(favs, recents);
    foodSearch = { id: searchRequestId, query: '', products: products, pending: 0, stale: false };
    ui.lastSearchProducts = products;
    var html = '<div class="food-home-actions">' +
      '<button type="button" data-action="open-quick-add">+ Quick add</button>' +
      '<button type="button" data-action="open-my-food">+ New food</button></div>';
    if (products.length === 0){
      resultsEl.innerHTML = html + '<div class="food-suggest-status">Foods you log show up here for one-tap logging. Tap the star to pin your favorites, or create your own with New food.</div>';
      return;
    }
    if (mine.length) html += '<div class="food-home-label">My foods</div>' + mine.map(function(p, i){ return foodRowHtml(p, i); }).join('');
    if (favs.length) html += '<div class="food-home-label">Favorites</div>' + favs.map(function(p, i){ return foodRowHtml(p, mine.length + i); }).join('');
    if (recents.length) html += '<div class="food-home-label">Recent</div>' + recents.map(function(p, i){ return foodRowHtml(p, mine.length + favs.length + i); }).join('');
    resultsEl.innerHTML = html;
  }

  function toggleFavorite(name){
    var key = (name || '').trim().toLowerCase();
    var entry = (STORE.savedFoods || []).filter(function(f){ return f.product_name.trim().toLowerCase() === key; })[0];
    if (!entry) return;
    if (entry._fav) delete entry._fav; else entry._fav = true;
    saveStore();
    maybeVibrate();
    if (!foodSearch.query) renderFoodHome(); else renderFoodSearchResults();
  }

  function renderFoodSearchResults(){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;

    // Nothing fresh yet and the previous query's list is still up:
    // leave it alone (no flash-to-empty) and just say we're updating.
    if (foodSearch.stale){
      if (!resultsEl.querySelector('.food-suggest-status')){
        resultsEl.insertAdjacentHTML('beforeend', '<div class="food-suggest-status">Updating...</div>');
      }
      return;
    }

    var products = foodSearch.products;
    var trimmed = foodSearch.query;
    var exactMatch = products.some(function(p){ return p.product_name.toLowerCase() === trimmed.toLowerCase(); });
    // Pinned above the list whenever what's typed isn't already an
    // exact match below — same "use what I typed" pattern as
    // SaviorFit Logger's custom-exercise option — so a genuinely
    // uncommon or local dish can still be added in one tap even
    // when none of the sources have it.
    var customBtn = exactMatch ? '' :
      '<button type="button" class="food-suggest-custom" data-action="use-custom-food-name" data-name="' + esc(trimmed) + '">Use \u201c' + esc(trimmed) + '\u201d</button>';

    rowHl = trimmed;
    var rows = products.map(foodRowHtml).join('');
    rowHl = '';

    var status = '';
    if (foodSearch.pending > 0) status = '<div class="food-suggest-status">' + (products.length ? 'Searching more...' : 'Searching...') + '</div>';
    else if (products.length === 0) status = '<div class="food-suggest-status">No matches — add it as a custom food above, or type it in manually.</div>';

    resultsEl.innerHTML = customBtn + rows + status;
    ui.lastSearchProducts = products; // stashed so pick-food can look up by index without re-fetching
  }

  function runFoodSearch(query){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;
    if (searchAbort) searchAbort.abort(); // drop the previous query's requests
    searchAbort = new AbortController();
    var signal = searchAbort.signal;
    var thisRequest = ++searchRequestId;
    var trimmed = query.trim();

    // Saved foods (your own cache, works offline) are local, so they
    // show immediately, listed first.
    var localSaved = searchSavedFoods(trimmed);
    var saved = localSaved.concat(searchBuiltinFoods(trimmed));
    var hadResults = !!resultsEl.querySelector('.food-suggest-item');
    foodSearch = { id: thisRequest, query: trimmed, products: saved, pending: 2, stale: hadResults && saved.length === 0 };
    renderFoodSearchResults();

    // First search of the session: the built-in list may still be loading;
    // when it arrives, slip its matches in right after your own foods.
    if (!builtinFoods && trimmed.length >= 2){
      loadBuiltinFoods().then(function(){
        if (thisRequest !== searchRequestId) return;
        var extra = searchBuiltinFoods(trimmed);
        if (!extra.length) return;
        foodSearch.products.splice.apply(foodSearch.products, [localSaved.length, 0].concat(extra));
        foodSearch.stale = false;
        renderFoodSearchResults();
      });
    }

    // Then the two online sources, each landing as soon as it answers.
    // Each can fail independently without taking the others down.
    [['USDA', fetchUSDA], ['Open Food Facts', fetchOpenFoodFacts]].forEach(function(src){
      searchFoodSource(src[0], trimmed, src[1], signal).then(function(list){
        if (thisRequest !== searchRequestId) return; // a newer search has since superseded this one
        foodSearch.pending--;
        foodSearch.products = foodSearch.products.concat(list);
        if (list.length > 0 || foodSearch.pending === 0) foodSearch.stale = false;
        renderFoodSearchResults();
      });
    });
  }

  // ---- Offline food cache: every food actually picked from a live
  // search/scan gets saved here (name + macros, not the logged
  // instance), so searching that same food again — even fully
  // offline — finds it instantly instead of needing network. Merged
  // into runFoodSearch() as a 4th source alongside Kalori/USDA/OFF.
  function saveFoodToCache(food){
    var key = (food.name || '').trim().toLowerCase();
    if (!key) return;
    var src = food.whole || food.per100g; // per-serving foods are saved on their own per-serving basis
    var entry = {
      product_name: food.name,
      brands: food.brand || '',
      _image: food.image || '',
      _note: food.dataNote || '',
      _source: 'saved',
      _servingLabel: food.whole ? (food.servingLabel || '1 serving') : '100g',
      nutriments: {
        'energy-kcal_100g': src.cal || 0,
        'proteins_100g': src.protein || 0,
        'carbohydrates_100g': src.carbs || 0,
        'fat_100g': src.fat || 0,
        'fiber_100g': src.fiber || 0,
        'sugars_100g': src.sugar || 0,
        'sodium_100g_mg': src.sodium || 0 // already normalized to mg by this point regardless of original source
      }
    };
    if (!food.whole){ // per-100 g foods keep their serving / household measures, so the picker offers them next time too
      entry._servingGrams = food.servingGrams || null;
      entry._servingSizeText = food.servingSizeText || null;
      entry._measures = food.measures || [];
    }
    // De-dupe by name so re-picking the same food refreshes its
    // numbers and bumps it back to most-recently-used, rather than
    // piling up duplicate entries.
    var prevEntry = (STORE.savedFoods || []).filter(function(f){ return f.product_name.trim().toLowerCase() === key; })[0];
    if (prevEntry && prevEntry._fav) entry._fav = true; // a pinned favorite stays pinned
    STORE.savedFoods = (STORE.savedFoods || []).filter(function(f){
      return f.product_name.trim().toLowerCase() !== key;
    });
    STORE.savedFoods.unshift(entry);
    if (STORE.savedFoods.length > 200) STORE.savedFoods.length = 200; // cap so it doesn't grow forever
    saveStore();
  }

  function searchSavedFoods(query){
    var q = query.trim().toLowerCase();
    if (!q) return [];
    var mine = myFoodProducts().filter(function(f){ return f.product_name.toLowerCase().indexOf(q) !== -1; });
    var saved = (STORE.savedFoods || [])
      .filter(function(f){ return f.product_name.toLowerCase().indexOf(q) !== -1; })
      .slice(0, 8);
    return mine.concat(saved);
  }

  /* ---- Built-in foods ----
     About 1,600 common foods (Malaysian dishes, kuih, drinks, staples, fruit,
     fast food) live in data/foods/*.txt, one food per line, values per
     serving. They are loaded in the background, searched on the phone (so
     they work offline) and shown after your own/saved foods, before the
     online sources. They are estimates, and are labelled that way. */
  var BUILTIN_FILES = ['rice-noodles-breakfast', 'malaysian-dishes', 'kuih-desserts-drinks', 'western-staples', 'fruit-veg-asian-more', 'malaysian-part1-malay', 'malaysian-part2-chinese-kopitiam', 'malaysian-part3-indian-mamak', 'malaysian-part4-nyonya-east-malaysia', 'malaysian-part5-drinks-fruit-staples', 'nutrition-part1-chains', 'nutrition-part2-packaged-brands', 'nutrition-part3-sg-th-id-ph-bn', 'nutrition-part4-japan-korea-vn-china', 'nutrition-part5-western-mideast-indian', 'nutrition-part6-raw-ingredients', 'nutrition-part7-snacks-bakery-fitness', 'nutrition2-part1-indonesian', 'nutrition2-part2-indo-brands-malaysian-regional', 'nutrition2-part3-convenience-hk-taiwan', 'nutrition2-part4-thai-vn-khmer-lao-burmese', 'nutrition3-part1-south-asian', 'nutrition3-part2-european-american-latin', 'nutrition3-part3-produce-meat-seafood', 'nutrition3-part4-healthy-special-diet', 'nutrition3-part5-dessert-cafe-bakery']; // file order = tie-break order in results
  var builtinFoods = null, builtinLoading = null;

  function parseBuiltin(text){
    var out = [];
    String(text || '').split('\n').forEach(function(line){
      if (!line || line.charAt(0) === '#') return;
      var p = line.split('|');
      if (p.length < 9 || !p[0]) return;
      var n = function(i){ var v = parseFloat(p[i]); return isFinite(v) && v > 0 ? v : 0; };
      var g = n(2);
      // "1 plate" -> "1 plate (300 g)" so the serving also works in grams / ounces
      var label = p[1] + ((g > 0 && !/(^|\s|\d)(g|ml)$/i.test(p[1])) ? ' (' + g + ' g)' : '');
      out.push({
        product_name: p[0], brands: '', _image: '', _note: '', _source: 'saved', _builtin: true,
        _servingLabel: label, _k: p[0].toLowerCase(),
        nutriments: { 'energy-kcal_100g': n(3), 'proteins_100g': n(4), 'carbohydrates_100g': n(5), 'fat_100g': n(6),
                      'fiber_100g': 0, 'sugars_100g': n(7), 'sodium_100g_mg': n(8) }
      });
    });
    return out;
  }

  function loadBuiltinFoods(){
    if (builtinFoods) return Promise.resolve(builtinFoods);
    if (!builtinLoading){
      builtinLoading = Promise.all(BUILTIN_FILES.map(function(f){
        return fetch('data/foods/' + f + '.txt')
          .then(function(r){ return r.ok ? r.text() : ''; })
          .catch(function(){ return ''; });
      })).then(function(texts){
        var all = [];
        texts.forEach(function(t){ all = all.concat(parseBuiltin(t)); });
        if (all.length) builtinFoods = all;
        else builtinLoading = null; // nothing came back (offline on first run): try again next time
        return all;
      });
    }
    return builtinLoading;
  }

  // Every word you typed must appear in the name; names that start with
  // what you typed (or match at the start of a word) come first.
  function searchBuiltinFoods(query){
    var q = query.trim().toLowerCase();
    if (!builtinFoods || q.length < 2) return [];
    var toks = q.split(/\s+/).filter(Boolean);
    var have = {};
    myFoodProducts().concat(STORE.savedFoods || []).forEach(function(f){ have[String(f.product_name || '').trim().toLowerCase()] = 1; });
    var scored = [];
    builtinFoods.forEach(function(f, idx){
      var k = f._k;
      if (have[k]) return;
      var score = 0;
      for (var i = 0; i < toks.length; i++){
        var at = k.indexOf(toks[i]);
        if (at === -1) return;
        var prev = at ? k.charAt(at - 1) : ' ';
        score += (prev === ' ' || prev === '(' || prev === '/') ? 0 : 2;
      }
      if (toks.length === 1 && k.indexOf(q) === 0) score -= 1; // a one-word search prefers names that start with it
      scored.push({ f: f, s: score + idx / 100000 }); // earlier in the files (the plain, common version) first
    });
    scored.sort(function(a, b){ return a.s - b.s; });
    return scored.slice(0, 12).map(function(x){ return x.f; });
  }

  function pickFoodResult(index){
    var p = ui.lastSearchProducts && ui.lastSearchProducts[index];
    if (!p) return;
    var nut = p.nutriments || {};

    if (p._source === 'techapi' || p._source === 'saved'){
      // Kalori's numbers are per SERVING (see its 'serving' field), and
      // saved entries keep whatever basis they were saved with — either
      // per serving too, or per 100 g (label '100g').
      var basis = {
        cal: nut['energy-kcal_100g'] || 0,
        protein: nut['proteins_100g'] || 0,
        carbs: nut['carbohydrates_100g'] || 0,
        fat: nut['fat_100g'] || 0,
        // Kalori (techapi.my) doesn't report these yet — fine to
        // default to 0. Saved entries always carry real numbers here.
        fiber: nut['fiber_100g'] || 0,
        sugar: nut['sugars_100g'] || 0,
        sodium: nut['sodium_100g_mg'] || 0
      };
      var label = p._serving || p._servingLabel || '1 serving';
      var from = p._source === 'techapi' ? 'Kalori' : (p._mine ? 'mine' : (p._builtin ? 'builtin' : 'saved'));
      var dataNote = p._source === 'saved' ? (p._note || '') : foodDataNote(nut);
      if (p._source === 'saved' && /^\s*100\s*g\s*$/i.test(p._servingLabel || '')){
        // saved per-100 g food: comes back with its serving / measures
        ui.selectedFood = {
          name: p.product_name, image: p._image || '', brand: p.brands ? p.brands.split(',')[0] : '', from: from,
          servingGrams: p._servingGrams || null, servingSizeText: p._servingSizeText || null,
          measures: p._measures || [], per100g: basis, dataNote: dataNote
        };
      } else {
        var sg = parseServingGrams(label);
        ui.selectedFood = {
          name: p.product_name, image: p._image || '', from: from,
          whole: basis, servingLabel: label, servingGrams: sg, measures: [], dataNote: dataNote
        };
        // A serving with a known weight can also be measured in g / oz
        if (sg){
          var k = 100 / sg;
          ui.selectedFood.per100g = {
            cal: basis.cal * k, protein: basis.protein * k, carbs: basis.carbs * k, fat: basis.fat * k,
            fiber: basis.fiber * k, sugar: basis.sugar * k, sodium: basis.sodium * k
          };
        }
      }
    } else {
      var n = nut;
      ui.selectedFood = {
        name: p.product_name,
        image: p._image || '',
        brand: p.brands ? p.brands.split(',')[0] : '',
        from: 'search',
        dataNote: foodDataNote(n),
        // Only OFF products reliably carry a serving size (contributor-
        // entered, e.g. "38 g" / "1 slice (38g)"); USDA's generic foods
        // bring household measures instead (see usdaToProductShape).
        servingGrams: (p._source === 'off' && p.serving_quantity > 0) ? p.serving_quantity : null,
        servingSizeText: (p._source === 'off' && p.serving_size) ? p.serving_size : null,
        measures: p._measures || [],
        per100g: {
          cal: n['energy-kcal_100g'] || 0,
          protein: n['proteins_100g'] || 0,
          carbs: n['carbohydrates_100g'] || 0,
          fat: n['fat_100g'] || 0,
          fiber: n['fiber_100g'] || 0,
          sugar: n['sugars_100g'] || 0,
          // USDA already gives mg (sodium_100g_mg); OFF gives g like
          // its other per-100g fields, so it needs the *1000 here.
          sodium: p._source === 'usda' ? (n['sodium_100g_mg'] || 0) : (n['sodium_100g'] || 0) * 1000
        }
      };
    }
    // Remember this food locally (name + macros) so searching for it
    // again works even offline — skip re-caching an item that was
    // itself picked from the cache, nothing new to learn from that.
    if (p._source !== 'saved') saveFoodToCache(ui.selectedFood);
    initServing();
    applySelectedFoodToForm();
    if (ui.replaceAiIdx != null){ aiReplaceFromSelected(); return; }
    ui.justFilledFood = true;
    closeFoodSearchOverlay();
    openAddMealOverlay();
  }

  // "Search instead" on the AI scan sheet: the picked food replaces the
  // AI's guess, with its numbers coming from the food list, not the AI.
  function aiReplaceFromSelected(){
    var idx = ui.replaceAiIdx;
    var f = ui.selectedFood;
    var u = currentServingUnit();
    var q = (ui.serving && ui.serving.qty) || 0;
    closeFoodSearchOverlay();                 // also clears replace mode
    if (!aiScan.items[idx] || !f){ clearFoodSelection(); return; }
    var base = {
      calories: ui.prefillCal || 0, protein: ui.prefillProtein || 0, carbs: ui.prefillCarbs || 0,
      fat: ui.prefillFat || 0, fiber: ui.prefillFiber || 0, sugar: ui.prefillSugar || 0, sodium: ui.prefillSodium || 0
    };
    var name = String(f.name || 'Food').slice(0, 60);
    if (u && u.grams != null && u.grams * q > 0){
      var g = Math.round(u.grams * q);
      base.grams = g;
      aiScan.items[idx] = { name: name, grams: g, base: base, state: 'list', matchName: name };
    } else {
      base.grams = 100;                       // per-serving food with no weight: one serving, calories editable
      aiScan.items[idx] = { name: name, grams: 100, manual: true, base: base, state: 'list', matchName: name };
    }
    clearFoodSelection();
    renderAiScanItems();
    showToast('Swapped to ' + name);
  }

  // Recomputes the prefill macro values from the selected food and
  // the chosen serving (unit x amount): per-100 g foods scale by the
  // weight, a per-serving food with no known weight by the count.
  function applySelectedFoodToForm(){
    var f = ui.selectedFood;
    var u = currentServingUnit();
    var q = (ui.serving && ui.serving.qty) || 0;
    ui.prefillName = f.name;
    var src, factor;
    if (u.grams == null){ src = f.whole; factor = q; }
    else { src = f.per100g; factor = q * u.grams / 100; }
    ui.prefillCal = Math.round(src.cal * factor);
    ui.prefillProtein = Math.round(src.protein * factor);
    ui.prefillCarbs = Math.round(src.carbs * factor);
    ui.prefillFat = Math.round(src.fat * factor);
    ui.prefillFiber = Math.round((src.fiber || 0) * factor);
    ui.prefillSugar = Math.round((src.sugar || 0) * factor);
    ui.prefillSodium = Math.round((src.sodium || 0) * factor);
  }

  // Writes the computed prefill numbers into the visible Add Meal fields
  // (openAddMealOverlay does this once on open; this is for when the
  // serving unit or amount changes while the sheet is up).
  function syncMealFieldsFromPrefill(){
    var map = { mealCal: 'prefillCal', mealProtein: 'prefillProtein', mealCarbs: 'prefillCarbs', mealFat: 'prefillFat',
                mealSugar: 'prefillSugar', mealSodium: 'prefillSodium' };
    Object.keys(map).forEach(function(id){
      var v = ui[map[id]];
      document.getElementById(id).value = v != null ? v : '';
    });
    updateMealSummary();
  }

  function setServingQty(qty){
    ui.serving.qty = Math.max(0, qty);
    applySelectedFoodToForm();
    syncMealFieldsFromPrefill();
    var eq = document.getElementById('servingEq');
    if (eq) eq.textContent = servingEqText();
  }

  function setServingUnit(unitId){
    var f = ui.selectedFood;
    if (!f) return;
    var old = currentServingUnit();
    var next = servingUnitsFor(f).filter(function(u){ return u.id === unitId; })[0];
    if (!next || next.id === old.id) return;
    // keep the same amount of food: 1 serving (380 g) -> 380 g -> 13.4 oz.
    // The exact value is kept (only the number shown is rounded), so
    // switching units never nudges the calories by a rounding error.
    var qty = (old.grams != null && next.grams != null)
      ? (ui.serving.qty || 0) * old.grams / next.grams
      : next.defaultQty;
    ui.serving = { unitId: next.id, qty: qty };
    applySelectedFoodToForm();
    syncMealFieldsFromPrefill();
    refreshSelectedFoodBanner();
  }

  function clearFoodSelection(){
    ui.selectedFood = null;
    ui.serving = null;
    ui.editingMealId = null;
    ui.prefillName = ui.prefillCal = ui.prefillProtein = ui.prefillCarbs = ui.prefillFat =
      ui.prefillFiber = ui.prefillSugar = ui.prefillSodium = null;
  }

  /* =========================================================
     BARCODE SCANNER — native BarcodeDetector API (best support
     is Chrome/Chrome-based browsers on Android, which is exactly
     what the installed Play Store app runs on). No external
     library — if the API isn't available, we just tell the
     person to search by name instead rather than failing silently.
     ========================================================= */
  var scanState = { stream: null, loopId: null, detector: null };

  // mode: 'barcode' (watch for a barcode only), 'photo' (just the shutter
  // button — works even in browsers with no barcode reader), or nothing =
  // both at once (the scan button in food search).
  function openScanner(mode){
    mode = mode || 'both';
    var canBarcode = typeof BarcodeDetector !== 'undefined';
    if (!canBarcode){
      if (mode === 'barcode'){
        alert('Barcode scanning isn\'t supported in this browser. Try the installed app, or search by name instead.');
        return;
      }
      mode = 'photo'; // no barcode reader here, but the photo button still works
    }
    var overlay = document.getElementById('scanOverlay');
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(stream){
        scanState.stream = stream;
        video.srcObject = stream;
        overlay.classList.remove('hidden');
        overlay.classList.toggle('photo-mode', mode !== 'barcode');
        document.getElementById('scanCaptureBtn').classList.toggle('hidden', mode === 'barcode');
        scanState.detector = (mode === 'photo') ? null : makeBarcodeDetector();
        statusEl.textContent = mode === 'photo' ? 'Fit your whole plate in the frame'
          : mode === 'barcode' ? 'Point the camera at a barcode'
          : 'Point at a barcode, or snap a photo of the food';
        var left = aiScanEnabled() ? aiLeftGet() : null;
        document.getElementById('scanPill').textContent = mode === 'barcode' ? 'Barcode scan'
          : mode === 'both' ? 'Barcode or photo'
          : (aiScanEnabled() ? 'AI photo' + (left == null ? '' : ' \u00b7 ' + left + ' scan' + (left === 1 ? '' : 's') + ' left') : 'Photo');
        document.getElementById('scanGalBtn').classList.toggle('unavail', mode === 'barcode');
        setupTorch(stream);
        if (scanState.detector) scanLoop();
      })
      .catch(function(err){
        console.error('SaviorFuel: camera access failed —', err);
        alert('Couldn\'t access the camera. Check camera permission for this app in your phone settings, or search by name instead.');
      });
  }

  function setupTorch(stream){
    var btn = document.getElementById('scanTorchBtn');
    btn.classList.remove('on');
    btn.setAttribute('aria-pressed', 'false');
    var ok = false;
    try {
      var track = stream.getVideoTracks()[0];
      var caps = track && track.getCapabilities ? track.getCapabilities() : null;
      ok = !!(caps && caps.torch);
    } catch (e){ ok = false; }
    btn.classList.toggle('unavail', !ok);
  }

  function toggleTorch(){
    var btn = document.getElementById('scanTorchBtn');
    if (!scanState.stream) return;
    var track = scanState.stream.getVideoTracks()[0];
    var want = !btn.classList.contains('on');
    track.applyConstraints({ advanced: [{ torch: want }] }).then(function(){
      btn.classList.toggle('on', want);
      btn.setAttribute('aria-pressed', want ? 'true' : 'false');
    }).catch(function(){ btn.classList.add('unavail'); });
  }

  // A meal photo already on the phone: same scan, no camera shot.
  function scanFromFile(file){
    if (!file || !scanState.stream) return;
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      var max = 1600;
      var sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * sc));
      c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      captureFoodPhoto(c);
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      document.getElementById('scanStatus').textContent = 'Couldn\'t open that photo. Try another one.';
    };
    img.src = url;
  }
  document.getElementById('scanFile').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    scanFromFile(f);
  });

  function makeBarcodeDetector(){
    var want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
    try { return new BarcodeDetector({ formats: want }); }
    catch (err){ try { return new BarcodeDetector(); } catch (err2){ return null; } }
  }

  function scanLoop(){
    var video = document.getElementById('scanVideo');
    if (!scanState.stream || !scanState.detector) return; // scanner closed mid-loop, or photo-only mode
    scanState.detector.detect(video)
      .then(function(codes){
        if (codes.length > 0){
          onBarcodeDetected(codes[0].rawValue);
        } else {
          scanState.loopId = requestAnimationFrame(scanLoop);
        }
      })
      .catch(function(){
        // detect() can throw transiently (e.g. video not ready yet) — just keep trying
        scanState.loopId = requestAnimationFrame(scanLoop);
      });
  }

  function closeScanner(){
    if (scanState.stream){
      scanState.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.stream = null;
    scanState.loopId = null;
    document.getElementById('scanOverlay').classList.add('hidden');
    document.getElementById('scanOverlay').classList.remove('analysing');
    if (typeof analysing !== 'undefined'){ analysing.timers.forEach(clearTimeout); analysing.timers = []; }
    document.getElementById('scanCaptureBtn').classList.remove('loading'); // reset for next open
  }

  // ---- Barcode lookup: no single database has every product, so try, in order:
  // (1) foods the person saved against this barcode, (2) Open Food Facts,
  // (3) USDA branded foods. If none has it, offer to save it once from the
  // label — next scan of that barcode then fills in instantly.
  function stripZeros(c){ return String(c || '').replace(/^0+/, ''); }

  function offKcal(n){
    var k = Number(n['energy-kcal_100g']);
    if (k > 0) return k;
    var kj = Number(n['energy-kj_100g'] || n['energy_100g']);
    if (kj > 0) return Math.round(kj / 4.184);
    var fromMacros = 4 * (Number(n['proteins_100g']) || 0) + 4 * (Number(n['carbohydrates_100g']) || 0) + 9 * (Number(n['fat_100g']) || 0);
    return fromMacros > 0 ? Math.round(fromMacros) : 0;
  }

  function lookupBarcodeOff(code){
    var url = 'https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json' +
      '?fields=product_name,brands,nutriments,serving_quantity,serving_size,image_front_thumb_url,image_thumb_url,image_small_url';
    return fetch(url).then(function(res){ return res.json(); }).then(function(data){
      if (data.status !== 1 || !data.product) return null;
      var p = data.product, n = p.nutriments || {};
      var kcal = offKcal(n);
      p._source = 'off';
      p._image = p.image_front_thumb_url || p.image_thumb_url || p.image_small_url || '';
      p._hasNutrition = kcal > 0;
      if (kcal > 0){ n = Object.assign({}, n); n['energy-kcal_100g'] = kcal; p.nutriments = n; }
      return p;
    });
  }

  function lookupBarcodeUsda(code){
    var url = FOODS_PROXY_URL + '/usda?q=' + encodeURIComponent(code) + '&type=branded';
    return fetch(url).then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); }).then(function(data){
      var want = stripZeros(code);
      var hit = (data.foods || []).filter(function(f){ return stripZeros(f.gtinUpc) === want; })[0];
      if (!hit) return null;
      var p = usdaToProductShape(hit);
      if (p.nutriments['energy-kcal_100g'] == null) return null;
      var sz = Number(hit.servingSize);
      if (sz > 0 && /^g/i.test(hit.servingSizeUnit || '')){
        var label = String(hit.householdServingFullText || 'serving').replace(/\s+/g, ' ').trim();
        p._measures = [{ label: label, grams: sz }];
      }
      p._hasNutrition = true;
      return p;
    });
  }

  function barcodeNotFound(code, name){
    closeScanner();
    closeFoodSearchOverlay();
    openFoodSheet('mine', null, { barcode: code, name: name || '', hint: 'This barcode isn’t in the food databases yet. Add it once from the label — next time you scan it, it fills in instantly.' });
  }

  function openBarcodeProduct(p){
    closeScanner();
    ui.lastSearchProducts = [p];
    pickFoodResult(0);
  }

  function onBarcodeDetected(code){
    var statusEl = document.getElementById('scanStatus');
    statusEl.textContent = 'Found ' + code + ' — looking it up...';
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;

    var mine = (STORE.myFoods || []).filter(function(f){ return f.barcode && stripZeros(f.barcode) === stripZeros(code); })[0];
    if (mine){ openBarcodeProduct(myFoodToProduct(mine)); return; }

    var partialName = '';
    lookupBarcodeOff(code)
      .catch(function(err){ console.error('SaviorFuel: Open Food Facts lookup failed —', err); return 'offline'; })
      .then(function(p){
        if (p && p !== 'offline'){
          if (p._hasNutrition){ openBarcodeProduct(p); return null; }
          partialName = p.product_name || '';
        }
        statusEl.textContent = 'Checking another database...';
        return lookupBarcodeUsda(code).catch(function(err){ console.error('SaviorFuel: USDA barcode lookup failed —', err); return null; })
          .then(function(u){
            if (u){ openBarcodeProduct(u); return; }
            if (p === 'offline'){
              closeScanner();
              alert('Lookup failed — check your connection and try again, or search by name instead.');
              return;
            }
            barcodeNotFound(code, partialName);
          });
      });
  }

  /* =========================================================
     ON-DEVICE FOOD PHOTO RECOGNITION — same camera view as the
     barcode scanner above (one lens, one permission prompt): the
     barcode loop keeps running in the background, and this button
     lets you snap a frame instead when there's no barcode to find.
     TFJS + MobileNet (Google's official, maintained pretrained
     model — not a food-specific one, there isn't a reliably-hosted
     one) load lazily from CDN the first time this is actually used,
     not on every app load, and stay cached in memory for the rest
     of the session once loaded. MobileNet only knows ImageNet's
     1000 general categories, so its guess is fed into the existing
     search rather than auto-logged — treat it as a head start on
     typing, not a real identification, especially for Malaysian
     dishes it has no concept of.
     ========================================================= */
  var foodClassifierState = { model: null, loading: null };

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src;
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  function loadFoodClassifier(){
    if (foodClassifierState.model) return Promise.resolve(foodClassifierState.model);
    if (foodClassifierState.loading) return foodClassifierState.loading;

    foodClassifierState.loading = Promise.resolve()
      .then(function(){
        if (typeof tf === 'undefined') return loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs');
      })
      .then(function(){
        if (typeof mobilenet === 'undefined') return loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet');
      })
      .then(function(){ return mobilenet.load(); })
      .then(function(model){
        foodClassifierState.model = model;
        foodClassifierState.loading = null;
        return model;
      })
      .catch(function(err){
        foodClassifierState.loading = null;
        throw err;
      });

    return foodClassifierState.loading;
  }

  // The video fills the screen with object-fit:cover, so work out which
  // part of the real camera frame sits under the on-screen guide frame.
  function cropToFrame(source, vw, vh){
    var full = function(){
      var c = document.createElement('canvas');
      c.width = vw; c.height = vh;
      c.getContext('2d').drawImage(source, 0, 0);
      return c;
    };
    try {
      var video = document.getElementById('scanVideo');
      var frame = document.querySelector('.scan-overlay-frame');
      var vr = video.getBoundingClientRect();
      var fr = frame.getBoundingClientRect();
      if (!vw || !vh || !vr.width || !vr.height || !fr.width || !fr.height) return full();
      var sc = Math.max(vr.width / vw, vr.height / vh);
      var ox = (vr.width - vw * sc) / 2, oy = (vr.height - vh * sc) / 2;
      var sx = (fr.left - vr.left - ox) / sc, sy = (fr.top - vr.top - oy) / sc;
      var sw = fr.width / sc, sh = fr.height / sc;
      sx = Math.max(0, sx); sy = Math.max(0, sy);
      sw = Math.min(vw - sx, sw); sh = Math.min(vh - sy, sh);
      if (sw < 50 || sh < 50) return full();
      var c = document.createElement('canvas');
      c.width = Math.round(sw); c.height = Math.round(sh);
      c.getContext('2d').drawImage(source, sx, sy, sw, sh, 0, 0, c.width, c.height);
      return c;
    } catch (e){ return full(); }
  }

  function captureFoodPhoto(srcCanvas){
    if (!scanState.stream) return; // scanner already closed
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');
    var captureBtn = document.getElementById('scanCaptureBtn');

    // Stop only the barcode-detection loop, not the camera stream —
    // the video keeps showing behind the status text while the model
    // loads/runs, same as the "Found ... looking it up" moment in
    // onBarcodeDetected(). The frame itself is grabbed right now
    // regardless, so nothing changes about what gets classified.
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;
    captureBtn.classList.add('loading');

    // What gets scanned and saved is exactly what sits inside the green frame.
    var canvas = srcCanvas || cropToFrame(video, video.videoWidth, video.videoHeight);

    // AI scan (Gemini via the proxy) when it's set up and we're online;
    // otherwise — or if it fails — the basic on-device guess below.
    if (aiScanEnabled()){
      aiScan.photo = aiPhotoThumb(canvas);
      startAnalysing();
      runAiScan(canvas).catch(function(err){
        stopAnalysing();
        if (err && err.declined){ classifyFoodPhotoLegacy(canvas); return; }
        console.error('SaviorFuel: AI food scan failed —', err);
        if (err && err.status){
          // The scanner answered with a problem (out of scans, key not
          // set, AI busy...): say what it said, and stay on the camera
          // so barcode scanning still works. Only a dead connection
          // falls back to the basic on-device guess below.
          statusEl.textContent = (err.userMessage || 'Scan failed.') + ' (' + (err.code || err.status) + ')';
          captureBtn.classList.remove('loading');
          if (scanState.stream) scanLoop();
          return;
        }
        statusEl.textContent = 'AI scan unavailable — trying basic recognition...';
        classifyFoodPhotoLegacy(canvas);
      });
      return;
    }
    classifyFoodPhotoLegacy(canvas);
  }

  function classifyFoodPhotoLegacy(canvas){
    document.getElementById('scanStatus').textContent = 'Loading food recognition...';
    loadFoodClassifier()
      .then(function(model){
        document.getElementById('scanStatus').textContent = 'Identifying...';
        return model.classify(canvas);
      })
      .then(function(predictions){
        closeScanner();
        // MobileNet's ImageNet labels are comma-separated synonyms
        // (e.g. "cheeseburger, hamburger") — just use the first.
        var guess = predictions[0] ? predictions[0].className.split(',')[0].trim() : '';
        openFoodSearchOverlay();
        if (guess){
          document.getElementById('foodSearchInput').value = guess;
          runFoodSearch(guess);
        }
      })
      .catch(function(err){
        console.error('SaviorFuel: food photo recognition failed —', err);
        closeScanner();
        alert('Couldn\'t load food recognition — check your connection, or search by name instead.');
      });
  }

  /* =========================================================
     AI FOOD SCAN — snap a photo, an AI (Google Gemini, reached
     through the small proxy in /ai-proxy) lists what's on the plate
     with estimated grams and nutrition, and you confirm/edit it
     before anything is logged. The API key is NOT in this file —
     the proxy holds it, applies daily limits, and only accepts
     requests from this app's own site. Leave AI_SCAN_URL empty and
     the camera button just uses the basic on-device guess above.
     ========================================================= */
  var AI_SCAN_URL = 'https://saviorfuel-ai.xavierchua10.workers.dev'; // Cloudflare Worker (repo: Saviorfuelwebhook)
  var aiScan = { items: [], category: 'lunch', photo: '' };

  function aiScanEnabled(){
    return !!AI_SCAN_URL && navigator.onLine !== false;
  }

  function aiNum(v){
    var n = Number(v);
    return (isFinite(n) && n > 0) ? n : 0;
  }

  // Photo -> ~1024px JPEG base64: keeps detail for recognition while
  // staying a few hundred KB, so it's quick on mobile data.
  function aiPhotoToBase64(canvas){
    var max = 1024;
    var scale = Math.min(1, max / Math.max(canvas.width, canvas.height));
    var out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(canvas.width * scale));
    out.height = Math.max(1, Math.round(canvas.height * scale));
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    return out.toDataURL('image/jpeg', 0.8).split(',')[1];
  }

  // The Worker tells us how many free scans are left; remember it for today
  // (UTC day, like the Worker's counter) so the Add food screen can show it.
  var AI_LEFT_KEY = 'saviorfuel_ai_left';
  function utcDay(){ return new Date().toISOString().slice(0, 10); }
  function aiLeftGet(){
    try {
      var v = JSON.parse(localStorage.getItem(AI_LEFT_KEY) || 'null');
      return (v && v.day === utcDay() && typeof v.n === 'number') ? v.n : null;
    } catch (e){ return null; }
  }
  function aiLeftSet(n){
    try { localStorage.setItem(AI_LEFT_KEY, JSON.stringify({ day: utcDay(), n: n })); } catch (e){}
    refreshAiLeftPill();
  }
  // One place builds the "N free scans left" pill so the Add food screen and
  // the camera always show the same number, even if the screen was drawn
  // before a scan used one up.
  function aiLeftPillHtml(left){
    return '<span class="ai-left-pill"><b>AI</b>' + (left == null ? 'Free daily scans' : (left === 0 ? 'No free scans left today' : left + ' free scan' + (left === 1 ? '' : 's') + ' left')) + '</span>';
  }
  function refreshAiLeftPill(){
    var el = document.querySelector('.ai-left-pill');
    if (!el || !aiScanEnabled()) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = aiLeftPillHtml(aiLeftGet());
    el.innerHTML = tmp.firstChild.innerHTML;
  }

  function runAiScan(canvas){
    if (!STORE.appSettings.aiScanConsent){
      var ok = window.confirm('AI food scan sends this photo to Google\'s Gemini AI to estimate what\'s in it. The server doesn\'t store it; a small thumbnail stays on this phone with your meal. Continue?');
      if (!ok) return Promise.reject({ declined: true });
      STORE.appSettings.aiScanConsent = true;
      saveStore();
    }

    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 25000);
    return fetch(AI_SCAN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: aiPhotoToBase64(canvas), mime: 'image/jpeg' }),
      signal: ctrl.signal
    })
      .then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(data){
          if (res.ok && typeof data.remainingToday === 'number') aiLeftSet(data.remainingToday);
          if (!res.ok && data.code === 'ip_limit') aiLeftSet(0);
          if (!res.ok){
            var e = new Error(data.error || ('Scan failed (' + res.status + ')'));
            e.status = res.status;
            e.code = data.code;
            e.userMessage = data.error;
            throw e;
          }
          return data;
        });
      })
      .then(function(data){
        clearTimeout(timer);
        if (!scanState.stream) return; // they hit Cancel while we were waiting
        stopAnalysing();
        var items = Array.isArray(data.items) ? data.items : [];
        if (items.length === 0){
          document.getElementById('scanStatus').textContent = 'Couldn\'t spot any food — get closer, add light, and try again.';
          document.getElementById('scanCaptureBtn').classList.remove('loading');
          scanLoop(); // back to watching for barcodes
          return;
        }
        closeScanner();
        closeFoodSearchOverlay();
        openAiScanSheet(data);
      })
      .catch(function(err){
        clearTimeout(timer);
        throw err;
      });
  }

  // Small JPEG kept with the meal (~300px) — separate from the bigger
  // one sent to the AI, so storage stays light.
  function aiPhotoThumb(canvas){
    try {
      var max = 480;
      var scale = Math.min(1, max / Math.max(canvas.width, canvas.height));
      var out = document.createElement('canvas');
      out.width = Math.max(1, Math.round(canvas.width * scale));
      out.height = Math.max(1, Math.round(canvas.height * scale));
      out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
      return out.toDataURL('image/jpeg', 0.6);
    } catch (e){ return ''; }
  }

  // While the AI works: freeze the camera on the shot, sweep a scan line
  // over it and walk through three steps (a guide to the wait, not a
  // measurement of it).
  var analysing = { timers: [] };
  function startAnalysing(){
    var ov = document.getElementById('scanOverlay');
    var statusEl = document.getElementById('scanStatus');
    try { document.getElementById('scanVideo').pause(); } catch (e){}
    ov.classList.add('analysing');
    var steps = ['Photo captured', 'Spotting foods', 'Estimating portions'];
    function paint(n){
      statusEl.innerHTML = '<div class="scan-steps">' + steps.map(function(t, i){
        return '<div class="scan-step' + (i < n ? ' done' : (i === n ? ' on' : '')) + '"><i></i>' + t + '</div>';
      }).join('') + '</div>';
    }
    paint(1);
    analysing.timers.forEach(clearTimeout);
    analysing.timers = [setTimeout(function(){ paint(2); }, 2200)];
  }
  function stopAnalysing(){
    analysing.timers.forEach(clearTimeout);
    analysing.timers = [];
    var ov = document.getElementById('scanOverlay');
    if (ov) ov.classList.remove('analysing');
    try { document.getElementById('scanVideo').play(); } catch (e){}
  }

  function aiItemMacros(it){
    var f = it.base.grams > 0 ? it.grams / it.base.grams : 0;
    return {
      calories: it.base.calories * f, protein: it.base.protein * f, carbs: it.base.carbs * f,
      fat: it.base.fat * f, fiber: it.base.fiber * f, sugar: it.base.sugar * f, sodium: it.base.sodium * f
    };
  }

  function aiMacroLine(m){
    return Math.round(m.calories) + ' kcal · P' + Math.round(m.protein) + ' · C' + Math.round(m.carbs) + ' · F' + Math.round(m.fat);
  }

  function renderAiCategoryPicker(){
    document.getElementById('aiCategoryPicker').innerHTML = MEAL_CATEGORIES.map(function(c){
      return '<button type="button" class="category-pill' + (c.id === aiScan.category ? ' active' : '') + '" data-action="ai-select-category" data-category="' + c.id + '">' + c.label + '</button>';
    }).join('');
    var cur = MEAL_CATEGORIES.filter(function(c){ return c.id === aiScan.category; })[0];
    var mv = document.getElementById('aiMealValue');
    if (mv) mv.textContent = cur ? cur.label : '';
  }

  function renderAiScanTotal(){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    aiScan.items.forEach(function(it){
      var m = aiItemMacros(it);
      t.calories += m.calories; t.protein += m.protein; t.carbs += m.carbs; t.fat += m.fat;
    });
    var pk = t.protein * 4, ck = t.carbs * 4, fk = t.fat * 9, sum = pk + ck + fk;
    function share(v){ return sum > 0 ? Math.max(3, Math.round(v / sum * 100)) : 0; }
    function col(label, g, v, c){
      return '<div><div class="t"><span>' + label + '</span><b>' + Math.round(g) + 'g</b></div><div class="bar"><i style="width:' + share(v) + '%;background:var(' + c + ')"></i></div></div>';
    }
    var kc = Math.round(t.calories);
    document.getElementById('aiScanTotal').innerHTML =
      '<div class="ai-total-kcal"><b>' + kc + '</b><span>kcal</span></div>' +
      '<div class="ai-macro3">' + col('Protein', t.protein, pk, '--c-protein') + col('Carbs', t.carbs, ck, '--c-carbs') + col('Fat', t.fat, fk, '--c-fat') + '</div>';
    var btn = document.getElementById('aiLogBtn');
    if (btn) btn.textContent = kc > 0 ? '+ Log meal \u00b7 ' + kc + ' kcal' : '+ Log meal';
  }

  function aiUpdateRowNumbers(i){
    var it = aiScan.items[i];
    if (!it) return;
    var m = aiItemMacros(it);
    var k = document.getElementById('aiKcal' + i);
    if (k) k.textContent = Math.round(m.calories) + ' kcal';
    var l = document.getElementById('aiMacros' + i);
    if (l) l.innerHTML = 'P' + Math.round(m.protein) + ' &middot; C' + Math.round(m.carbs) + ' &middot; F' + Math.round(m.fat);
  }

  function aiStep(it){ return Math.max(5, Math.round(it.base.grams * 0.1 / 5) * 5); }

  /* ---- Automatic database match for scanned items ----
     The AI names the food and guesses its weight. For each item we look
     the name up (your saved foods, USDA, Open Food Facts) and, when a
     close match with believable numbers turns up, use that food's real
     per-100 g values scaled to the weight. Anything uncertain stays an
     "AI estimate", and you can always change or undo the match. */
  var AI_STOP = { with: 1, and: 1, of: 1, the: 1, a: 1, in: 1, on: 1 };
  function aiTokens(str){
    return String(str || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(' ').filter(function(w){ return w && !AI_STOP[w]; })
      .map(function(w){ return w.length > 3 && /s$/.test(w) && !/ss$/.test(w) ? w.slice(0, -1) : w; });
  }
  function aiPer100(p){
    var n = p.nutriments || {};
    var sodium = p._source === 'off' ? (n['sodium_100g'] || 0) * 1000 : (n['sodium_100g_mg'] || 0);
    return { calories: Number(n['energy-kcal_100g']) || 0, protein: Number(n['proteins_100g']) || 0, carbs: Number(n['carbohydrates_100g']) || 0,
             fat: Number(n['fat_100g']) || 0, fiber: Number(n['fiber_100g']) || 0, sugar: Number(n['sugars_100g']) || 0, sodium: sodium };
  }
  function aiSrcName(p){ return p._source === 'usda' ? 'USDA' : p._source === 'off' ? 'Open Food Facts' : 'Your foods'; }
  function aiRankCandidates(name, list){
    var q = aiTokens(name);
    if (!q.length) return [];
    var seen = {}, out = [];
    list.forEach(function(p){
      if (p._source === 'saved' && p._servingLabel && !/^100\s*g$/i.test(p._servingLabel)) return;  // per-serving foods can't be scaled by weight
      if (!p.product_name || (p.nutriments || {})['energy-kcal_100g'] == null) return;
      var pt = aiTokens(p.product_name);
      var hit = q.filter(function(w){ return pt.indexOf(w) !== -1; }).length;
      var cover = hit / q.length;
      if (cover < (q.length <= 2 ? 0.99 : 0.75)) return;
      var extra = pt.length - hit;
      if (p._source === 'off' && extra > 4) return;
      if (extra > 10) return;
      var key = p.product_name.trim().toLowerCase();
      if (seen[key]) return;
      seen[key] = 1;
      out.push({ p: p, score: cover - 0.03 * extra + (p._source === 'saved' ? 0.25 : p._source === 'usda' ? 0.05 : 0) });
    });
    out.sort(function(a, b){ return b.score - a.score; });
    return out.slice(0, 4).map(function(x){ return x.p; });
  }
  function aiSane(it, p){
    var ai100 = it.ai && it.ai.grams > 0 ? it.ai.calories / it.ai.grams * 100 : 0;
    var c100 = aiPer100(p).calories;
    if (!(ai100 > 0)) return c100 > 0;
    var r = c100 / ai100;
    return r >= 0.5 && r <= 2;
  }
  function aiApplyMatch(it, p){
    var per = aiPer100(p), g = it.grams > 0 ? it.grams : (it.ai ? it.ai.grams : 100), f = g / 100;
    it.base = { grams: g, calories: per.calories * f, protein: per.protein * f, carbs: per.carbs * f, fat: per.fat * f,
                fiber: per.fiber * f, sugar: per.sugar * f, sodium: per.sodium * f };
    it.state = 'match';
    it.match = p;
  }
  function aiUseEstimate(it){
    var f = it.ai.grams > 0 ? it.grams / it.ai.grams : 1;
    it.base = { grams: it.grams > 0 ? it.grams : it.ai.grams, calories: it.ai.calories * f, protein: it.ai.protein * f, carbs: it.ai.carbs * f,
                fat: it.ai.fat * f, fiber: it.ai.fiber * f, sugar: it.ai.sugar * f, sodium: it.ai.sodium * f };
    it.state = 'estimate';
    it.match = null;
  }
  var AI_CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var AI_CHV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  function aiSrcHtml(it, i){
    if (it.manual && it.state !== 'list') return '';
    if (it.state === 'pending') return '<span class="src pend">Checking food databases…</span>';
    if (it.state === 'list') return '<span class="src db">' + AI_CHK + 'From food list <small>· ' + esc(String(it.matchName || '').slice(0, 26)) + '</small></span>';
    if (it.state === 'match' && it.match){

  function aiRefreshItem(i){
    var it = aiScan.items[i];
    if (!it) return;

  function startAiMatching(){
    var token = aiScan.token = (aiScan.token || 0) + 1;
    if (aiScan.abort){ try { aiScan.abort.abort(); } catch (e){} }
    var ctrl = aiScan.abort = new AbortController();
    aiScan.items.forEach(function(it, i){
      var finish = function(cands){
        if (token !== aiScan.token || aiScan.items[i] !== it) return;      // sheet closed or item swapped meanwhile
        if (it.state !== 'pending') return;
        it.cands = cands;
        var best = cands.filter(function(p){ return aiSane(it, p); })[0];
        if (best) aiApplyMatch(it, best); else it.state = 'estimate';
        aiRefreshItem(i);
      };
      var name = String(it.name || '').trim();
      if (name.length < 2){ finish([]); return; }
      var all = searchSavedFoods(name);
      if (navigator.onLine === false){ finish(aiRankCandidates(name, all)); return; }
      var settle = function(list){ return list || []; };
      Promise.all([
        searchFoodSource('USDA', name, fetchUSDA, ctrl.signal).then(settle, function(){ return []; }),
        searchFoodSource('Open Food Facts', name, fetchOpenFoodFacts, ctrl.signal).then(settle, function(){ return []; })
      ]).then(function(r){ finish(aiRankCandidates(name, all.concat(r[0], r[1]))); }, function(){ finish(aiRankCandidates(name, all)); });
    });
  }

  function addMealFromForm(){
    var name = document.getElementById('mealName').value.trim();
    // Decimals are rounded (12.7 g -> 13, not cut to 12), negatives count as 0.
    var field = function(id){
      var v = parseFloat(document.getElementById(id).value);
      return isFinite(v) ? Math.max(0, Math.round(v)) : 0;
    };
    var cal = field('mealCal');
    var protein = field('mealProtein');
    var carbs = field('mealCarbs');
    var fat = field('mealFat');
    var fiber = 0;
    var sugar = field('mealSugar');
    var sodium = field('mealSodium');

    // A name and a calories entry are required. 0 is fine when typed on purpose (black coffee, plain tea, water).
    if (!name || document.getElementById('mealCal').value.trim() === '') return;
    if (cal > 10000 || protein > 1000 || carbs > 1000 || fat > 1000){
      showToast('Those numbers look too high for one meal. Please check them.');
      return;
    }

    var dayKey = document.getElementById('mealDate').value;
    var editing = ui.editingMealId ? mealById(ui.editingMealId) : null;
    var savedId, movedTo = null;

    if (editing){
      // Change the existing entry in place (same id), keeping its time of
      // day unless the day was changed.
      var oldKey = dateKey(editing.loggedAt);
      editing.name = name; editing.calories = cal; editing.protein = protein; editing.carbs = carbs;
      editing.fat = fat; editing.sugar = sugar; editing.sodium = sodium;
      editing.category = ui.selectedCategory;
      editing.loggedAt = stampForDay(dayKey, editing.loggedAt, editing.loggedAt);
      savedId = editing.id;
      if (dateKey(editing.loggedAt) !== oldKey) movedTo = dateKey(editing.loggedAt);
    } else {
      savedId = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      rememberServing();
      var stamp = stampForDay(dayKey, Date.now(), null);
      STORE.meals.push({
        id: savedId,
        name: name,
        calories: cal,
        protein: protein,
        carbs: carbs,
        fat: fat,
        fiber: fiber,
        sugar: sugar,
        sodium: sodium,
        category: ui.selectedCategory,
        loggedAt: stamp
      });
      if (dateKey(stamp) !== todayKey()) movedTo = dateKey(stamp);
    }
    expandMealGroup(ui.selectedCategory);
    saveStore();
    maybeVibrate();
    closeAddMealOverlay(); // also clears the food selection state
    if (state.tab === 'scan') state.tab = 'log'; // came from the Scan tab — show where the meal landed
    renderApp();

    // Meals for another day don't show on today's Log, so say where it went.
    if (movedTo) showToast((editing ? 'Moved to ' : 'Added to ') + formatDateLabel(movedTo) + ' \u2014 see History');
    else if (editing) showToast('Changes saved');

    // Same glow treatment as the Add Meal sheet gets when a food is
    // auto-filled — reused here to confirm the meal actually landed
    // in the list, once the row exists in the DOM post-render.
    var newRow = document.querySelector('.meal-row[data-id="' + savedId + '"]');
    if (newRow){
      newRow.classList.add('glow-once');
      setTimeout(function(){ newRow.classList.remove('glow-once'); }, 900);
    }
  }

  /* ---- Confirmation bottom sheet ----
     opts: title, name, detail, kcal, note, confirmLabel, onConfirm.
     Slides up from the bottom; closes on Cancel, a tap outside, Escape,
     or by dragging the grab handle down. Nothing happens to the data
     until "Delete" is pressed. */
  var confirmState = { onConfirm: null, closeTimer: 0 };

  function openConfirmSheet(opts){
    clearTimeout(confirmState.closeTimer);
    confirmState.onConfirm = opts.onConfirm;
    document.getElementById('confirmTitle').textContent = opts.title;
    document.getElementById('confirmItemName').textContent = opts.name;
    document.getElementById('confirmItemDetail').textContent = opts.detail || '';
    document.getElementById('confirmItemKcal').textContent = opts.kcal != null ? opts.kcal + ' kcal' : '';
    document.getElementById('confirmNote').textContent = opts.note || '';
    document.getElementById('confirmYes').textContent = opts.confirmLabel || 'Delete';
    var overlay = document.getElementById('confirmOverlay');
    var sheet = overlay.querySelector('.confirm-sheet');
    sheet.style.transform = '';
    sheet.classList.remove('dragging');
    overlay.classList.remove('hidden');
    void overlay.offsetHeight;          // let the closed position paint first, so it animates up
    overlay.classList.add('open');
    // The safe choice is the default. preventScroll matters: the sheet is
    // still off-screen when this runs, and a plain focus() makes the
    // browser scroll the whole app to bring the button into view — that
    // was the "jump" on open.
    document.getElementById('confirmCancel').focus({ preventScroll: true });
  }

  function closeConfirmSheet(){
    var overlay = document.getElementById('confirmOverlay');
    if (overlay.classList.contains('hidden')) return;
    overlay.classList.remove('open');
    var sheet = overlay.querySelector('.confirm-sheet');
    sheet.classList.remove('dragging');
    sheet.style.transform = '';         // hand control back to the CSS slide-down
    confirmState.onConfirm = null;
    confirmState.closeTimer = setTimeout(function(){ overlay.classList.add('hidden'); }, prefersReducedMotion() ? 0 : 380);
  }

  function confirmYes(){
    var fn = confirmState.onConfirm;
    closeConfirmSheet();
    if (fn) fn();

  function requestDeleteMeal(id){
    var meal = STORE.meals.filter(function(m){ return m.id === id; })[0];
    if (!meal) return;
    openConfirmSheet({
      title: 'Delete this food?',
      name: meal.name,
      detail: 'P' + (meal.protein || 0) + ' · C' + (meal.carbs || 0) + ' · F' + (meal.fat || 0),
      kcal: meal.calories,
      note: 'It will be removed from your log and from the day\u2019s totals.',
      confirmLabel: 'Delete',
      onConfirm: function(){ deleteMeal(id); maybeVibrate(); }
    });

  (function(){
    // drag the grab handle down to dismiss
    var grab = document.getElementById('confirmGrab');
    var sheet = document.querySelector('#confirmOverlay .confirm-sheet');
    var startY = null;
    grab.addEventListener('pointerdown', function(e){
      startY = e.clientY;
      sheet.classList.add('dragging');
      if (grab.setPointerCapture){ try { grab.setPointerCapture(e.pointerId); } catch (err){} }
    });
    grab.addEventListener('pointermove', function(e){
      if (startY === null) return;
      sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
    });
    function endDrag(e){
      if (startY === null) return;
      var dy = Math.max(0, e.clientY - startY);
      startY = null;
      sheet.classList.remove('dragging');
      if (dy > 90) closeConfirmSheet(); else sheet.style.transform = '';
    }
    grab.addEventListener('pointerup', endDrag);
    grab.addEventListener('pointercancel', endDrag);

  /* =========================================================
     RENDER — HISTORY TAB
     ========================================================= */
  // ---- Per-day numbers shared by History and Insights ----
  // Every day that has at least one meal, with its totals. Keys are
  // YYYY-MM-DD so they sort as dates.
  function dayStatsMap(){
    var map = {};
    STORE.meals.forEach(function(m){
      var k = dateKey(m.loggedAt);
      if (!map[k]) map[k] = { key: k, meals: [], calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
      var d = map[k];
      d.meals.push(m);
      d.calories += m.calories || 0;
      d.protein += m.protein || 0;
      d.carbs += m.carbs || 0;
      d.fat += m.fat || 0;
      d.fiber += m.fiber || 0;
    });
    return map;
  }

  // A day counts as "on goal" when calories land between 75% and 110%
  // of the goal; above that it is "over", below it is "low".
  function dayStatus(calories, goal){
    if (!goal || calories <= 0) return 'none';
    var p = calories / goal;
    if (p > 1.1) return 'over';
    if (p >= 0.75) return 'on';
    return 'low';
  }

  // Current logging streak (consecutive days with a meal, still alive if
  // today is empty but yesterday was logged) and the longest streak ever.
  function streakInfo(map){
    var keys = Object.keys(map).sort();
    var cur = 0, d = map[todayKey()] ? 0 : 1;
    while (map[dateKeyDaysAgo(d)]){ cur++; d++; }
    var best = 0, run = 0, prev = null;
    keys.forEach(function(k){
      if (prev && addDaysKey(prev, 1) === k) run++; else run = 1;
      if (run > best) best = run;
      prev = k;
    });
    return { current: cur, best: best };
  }

  var CHEV_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';


  // ---- History: a month heat map up top, then the days of that month
  // (or every day matching the search). Rows stay slim; macros appear
  // only once a day is opened.
  function historyMonthKey(){
    var cur = todayKey().slice(0, 7);
    return (ui.histMonth && ui.histMonth <= cur) ? ui.histMonth : cur;
  }
  function addMonthKey(mk, n){
    var y = parseInt(mk.slice(0, 4), 10), m = parseInt(mk.slice(5, 7), 10) - 1 + n;
    var d = new Date(y, m, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function historyCalendarHtml(map, goal, mk){
    var y = parseInt(mk.slice(0, 4), 10), mo = parseInt(mk.slice(5, 7), 10) - 1;
    var daysIn = new Date(y, mo + 1, 0).getDate();
    var lead = (new Date(y, mo, 1).getDay() + 6) % 7; // Monday first
    var today = todayKey();
    var html = '<div class="hist-cal">' + ['M','T','W','T','F','S','S'].map(function(l){ return '<div class="hc-h">' + l + '</div>'; }).join('');
    for (var i = 0; i < lead; i++) html += '<div class="hc-blank"></div>';
    for (var d = 1; d <= daysIn; d++){
      var key = mk + '-' + String(d).padStart(2, '0');
      var info = map[key];
      var cls = 'hc-day';
      if (info) cls += ' ' + dayStatus(info.calories, goal);
      else if (key > today) cls += ' future';
      if (key === today) cls += ' now';
      html += info
        ? '<button type="button" class="' + cls + '" data-action="history-pick-day" data-day="' + key + '">' + d + '</button>'
        : '<div class="' + cls + '">' + d + '</div>';
    }
    html += '</div><div class="hist-legend"><span><i class="on"></i>On goal</span><span><i class="low"></i>Low</span><span><i class="over"></i>Over</span></div>';
    return html;
  }

  function historyDayHtml(day, goal, q){
    var key = day.key;
    var n = day.meals.length;
    var st = dayStatus(day.calories, goal);
    var pct = Math.min(100, pctUncapped(day.calories, goal));
    return '<div class="hist-item' + (key === todayKey() ? ' is-today' : '') + '" id="hd-' + key + '">' +
      '<div class="hist-item-head history-day-head" role="button" tabindex="0" data-action="open-day" data-day="' + key + '">' +
        '<div class="hist-item-main"><div class="hist-name">' + esc(formatDateLabel(key)) + '</div>' +
          '<div class="hist-sub">' + n + ' meal' + (n === 1 ? '' : 's') + '</div></div>' +
        '<div class="hist-item-side hist-kcal-col"><div class="hist-kcal">' + Math.round(day.calories).toLocaleString() + '<small>' + (goal > 0 ? '/ ' + Math.round(goal).toLocaleString() + ' kcal' : 'kcal') + '</small></div>' +
          '<div class="hist-pb ' + st + '"><i style="width:' + pct + '%"></i></div></div>' +
      '</div>' +
      (q ? '<div class="hist-hits">' + day.meals.filter(function(m){ return String(m.name || '').toLowerCase().indexOf(q) !== -1; }).slice(0, 3).map(function(m){
        return '<span class="hist-hit">' + esc(tidyName(m.name)) + ' \u00B7 ' + Math.round(m.calories) + '</span>'; }).join('') + '</div>' : '') +
    '</div>';
  }

  /* ---- Full-screen day (like SaviorFit Logger's workout detail) ----
     Opens from a timeline row, a week-strip day or the calendar. A hero with
     the day's calories vs goal, three macro cards, the meals by category and
     a bar to copy the whole day to today. Re-drawn by renderApp() so edits,
     deletes and copies show up straight away. */
  function dayHeroName(key){
    var t = formatDateLabel(key);
    if (t === 'Today' || t === 'Yesterday') return t;

  function dayMealCardHtml(m){
    return '<div class="dy-meal" data-action="edit-meal" data-id="' + m.id + '">' +
      '<i class="dy-dot"></i>' +
      '<div class="dy-meal-main"><div class="dy-meal-name">' + esc(tidyName(m.name)) + '</div>' +
        '<div class="dy-meal-macros">P' + (m.protein || 0) + ' · C' + (m.carbs || 0) + ' · F' + (m.fat || 0) + '</div></div>' +
      '<div class="dy-meal-kcal">' + m.calories + '<small>kcal</small></div>' +
      '<button type="button" class="dy-more" data-action="day-meal-menu" data-id="' + m.id + '" aria-label="Options for ' + esc(m.name) + '">&#8943;</button>' +

  function dayOverlayInner(key){
    var meals = mealsForDay(key).slice().sort(function(a, b){ return b.loggedAt - a.loggedAt; });
    var goals = STORE.goals;
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    meals.forEach(function(m){ t.calories += m.calories || 0; t.protein += m.protein || 0; t.carbs += m.carbs || 0; t.fat += m.fat || 0; });
    var st = dayStatus(t.calories, goals.calories);
    var stLabel = st === 'on' ? 'ON GOAL' : st === 'over' ? 'OVER' : 'LOW';
    var dateMono = new Date(key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }).replace(/,/g, '').toUpperCase();
    function macro(label, v, g, col){
      var w = g ? Math.min(100, Math.round(v / g * 100)) : 0;
      return '<div class="dy-macro"><div class="dy-macro-v">' + Math.round(v) + '<small>g</small></div><div class="dy-macro-l">' + label + '</div>' +
        '<div class="dy-macro-bar"><i style="width:' + w + '%;background:' + col + '"></i></div></div>';
    }
    var buckets = {}, other = [];
    MEAL_CATEGORIES.forEach(function(c){ buckets[c.id] = []; });
    meals.forEach(function(m){ if (m.category && buckets[m.category]) buckets[m.category].push(m); else other.push(m); });
    var list = '';
    MEAL_CATEGORIES.forEach(function(c){
      if (buckets[c.id].length) list += '<div class="dy-cat">' + c.label + '</div>' + buckets[c.id].map(dayMealCardHtml).join('');
    });
    if (other.length) list += '<div class="dy-cat">Other</div>' + other.map(dayMealCardHtml).join('');
    var pct = Math.min(100, pctUncapped(t.calories, goals.calories));
    return '<div class="dy-scroll">' +
      '<div class="dy-hero"><button type="button" class="dy-x" data-action="close-day" aria-label="Close">&times;</button>' +
        '<div class="dy-date">' + esc(dateMono) + '</div><h2 class="dy-name">' + esc(dayHeroName(key)) + '</h2>' +
        '<div class="dy-hero-row"><div><div class="dy-big">' + Math.round(t.calories).toLocaleString() + '<small>/ ' + Math.round(goals.calories).toLocaleString() + ' kcal</small></div>' +
          '<div class="dy-big-l">CALORIES</div></div><span class="dy-tag ' + st + '">' + stLabel + '</span></div>' +
        '<div class="dy-goalbar ' + st + '"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="dy-macros">' + macro('PROTEIN', t.protein, goals.protein, 'var(--c-protein)') + macro('CARBS', t.carbs, goals.carbs, 'var(--c-carbs)') + macro('FAT', t.fat, goals.fat, 'var(--c-fat)') + '</div>' +
      list + '</div>' +
      (key !== todayKey() ? '<div class="dy-bar"><button type="button" class="dy-copy" data-action="copy-day" data-day="' + key + '">Copy day to today</button></div>' : '');
  }
  function openDayOverlay(key){
    closeDayOverlay();
    if (!mealsForDay(key).length) return;
    ui.dayOpen = key;
    var el = document.createElement('div');
    el.id = 'dayOverlay'; el.className = 'day-overlay dy-in';
