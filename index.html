<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>SaviorFuel — Food Tracker</title>
<meta name="description" content="Log your meals and macros. A free food tracker by Savior, built to pair with SaviorFit Logger.">
<link rel="icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaviorFuel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN SYSTEM — copied 1:1 from SaviorFit Logger (IronLedger
     repo) so SaviorFuel matches it visually out of the box. Keep
     these tokens in sync by hand if the Logger's palette ever
     changes; there's no shared stylesheet between the two repos.
     ========================================================= */
  :root{
    --bg:#14161a;
    --panel:#1c1f24;
    --panel-2:#242830;
    --panel-3:#2a2f38;
    --line:#2e333b;
    --text:#e9e6df;
    --text-dim:#8b9098;
    --text-faint:#82878f;
    --accent:#f2b134;
    --accent-dim:#7a6224;
    --accent-rgb:242,177,52;
    --accent-2:#c1443c;
    --accent-2-dim:#4a2321;
    --success:#5fb86a;
    --success-dim:#233821;
    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --radius-xl:20px;
    --radius-pill:999px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;}
  button:active, [data-action]:active{
    filter:brightness(1.2);
    transition:filter 70ms ease-out;
  }
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }

  /* ---------- Topbar (same structure/classes as SaviorFit Logger) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(16,18,21,0.72);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .topbar h1 span{color:var(--accent);}

  /* ---------- Main content area ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(90px + var(--safe-bottom));
  }

  /* Fade+shift tab transition — same treatment as SaviorFit Logger's
     switchTabWithFade, so switching tabs feels identical across both
     apps. See switchTab() below. */
  #view.subtab-fade-out{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 140ms ease, transform 140ms ease;
  }
  #view.subtab-fade-in{
    opacity:1;
    transform:translateY(0);
    transition:opacity 160ms ease, transform 160ms ease;
  }

  /* ---------- Bottom tab bar (same classes as SaviorFit Logger) ---------- */
  .tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
  }
  .tabbar button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:10px 4px 8px;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--accent);}
  .tab-glyph svg{width:22px;height:22px;}

  /* ---------- Empty state (same pattern as SaviorFit Logger) ---------- */
  .empty.tab-empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--text-dim);
    padding:60px 24px;
    gap:14px;
  }
  .empty .glyph{
    width:48px;height:48px;
    color:var(--text-faint);
  }
  .empty p{margin:0;font-size:14px;line-height:1.5;}

  /* ---------- Cards (same pattern as SaviorFit Logger) ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px 14px 12px;
    margin-bottom:14px;
  }

  /* ---------- Buttons (same pattern as SaviorFit Logger) ---------- */
  .btn-primary{
    display:block;
    width:100%;
    background:var(--accent);
    color:#1c1500;
    border:none;
    border-radius:var(--radius-xl);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px;
    cursor:pointer;
  }

  /* ---------- Macro summary + bars ---------- */
  .macro-summary-card{margin-bottom:16px;}
  .macro-cal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .macro-cal-row .num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
  .macro-cal-row .num span{font-size:14px;font-weight:500;color:var(--text-faint);}
  .macro-bar-row{margin-bottom:10px;}
  .macro-bar-row:last-child{margin-bottom:0;}
  .macro-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .macro-bar-label b{color:var(--text);}
  .macro-bar-track{height:6px;border-radius:var(--radius-pill);background:var(--panel-3);overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);}
  .macro-bar-fill.protein{background:var(--success);}
  .macro-bar-fill.carbs{background:#5fa8d6;}
  .macro-bar-fill.fat{background:var(--accent-2);}

  /* ---------- Quick-add meal form ---------- */
  .add-meal-card .field-row{display:flex;gap:8px;margin-bottom:8px;}
  .add-meal-card input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
  }
  .add-meal-card input:focus{outline:none;border-color:var(--accent);}
  .add-meal-card input::placeholder{color:var(--text-faint);}

  /* ---------- Meal list rows ---------- */
  .meal-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .meal-row:last-child{border-bottom:none;}
  .meal-row-name{font-size:14px;color:var(--text);flex:1;min-width:0;}
  .meal-row-macros{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .meal-row-cal{font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);white-space:nowrap;}
  .meal-row-del{
    background:none;border:none;color:var(--text-faint);
    font-size:18px;line-height:1;padding:4px 6px;cursor:pointer;
  }

  /* ---------- History day groups ---------- */
  .history-day-card .history-day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .history-day-head .date{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--text);}
  .history-day-head .total{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);}

  /* ---------- Insights bars ---------- */
  .insight-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .insight-bar-day{width:34px;font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .insight-bar-track{flex:1;height:16px;background:var(--panel-3);border-radius:var(--radius-xs);overflow:hidden;}
  .insight-bar-fill{height:100%;background:var(--accent);border-radius:var(--radius-xs);}
  .insight-bar-val{width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);flex-shrink:0;}

  /* ---------- Settings ---------- */
  .settings-group{margin-bottom:18px;}
  .settings-group h3{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);
    margin:0 0 10px;
  }
  .settings-goal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .settings-goal-row label{font-size:13px;color:var(--text-dim);}
  .settings-goal-row input{
    width:80px;text-align:right;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 8px;
  }
  .settings-goal-row input:focus{outline:none;border-color:var(--accent);}
  .settings-goal-row select{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'Inter',sans-serif;font-size:13px;padding:7px 8px;
    max-width:150px;
  }
  .settings-goal-row select:focus{outline:none;border-color:var(--accent);}
  .plan-result-banner{
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--text-dim);
  }
  .plan-result-banner b{color:var(--accent);}
  .btn-danger{
    display:block;width:100%;background:none;border:1px solid var(--accent-2);
    color:var(--accent-2);border-radius:var(--radius-xl);font-family:'Oswald',sans-serif;
    font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:12px;cursor:pointer;
  }

  /* ---------- Food search ---------- */
  .food-search-card{margin-bottom:14px;}
  .food-search-card input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:14px;
    padding:11px 12px;
  }
  .food-search-card input:focus{outline:none;border-color:var(--accent);}
  .food-search-card input::placeholder{color:var(--text-faint);}
  .food-search-results{margin-top:10px;max-height:260px;overflow-y:auto;}
  .food-search-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .food-search-row:last-child{border-bottom:none;}
  .food-search-row:active{background:var(--panel-2);}
  .food-search-row-name{font-size:13px;color:var(--text);flex:1;min-width:0;}
  .food-search-row-name .brand{display:block;font-size:11px;color:var(--text-faint);}
  .food-search-row-cal{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);white-space:nowrap;}
  .food-search-status{font-size:12px;color:var(--text-faint);padding:8px 0;}
  .selected-food-banner{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel-3);border-radius:var(--radius-sm);
    padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--text-dim);
  }
  .selected-food-banner b{color:var(--text);}
  .selected-food-banner .grams-input{
    width:60px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius-xs);color:var(--text);font-family:'JetBrains Mono',monospace;
    font-size:12px;padding:5px 6px;text-align:center;
  }

  /* ---------- Barcode scanner overlay ---------- */
  .scan-btn{
    display:block;width:100%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);border-radius:var(--radius-sm);font-family:'Oswald',sans-serif;
    font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:11px;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .scan-btn svg{width:16px;height:16px;}
  .scan-overlay{
    position:fixed;inset:0;background:#000;z-index:999;
    display:flex;flex-direction:column;
  }
  .scan-overlay video{flex:1;width:100%;object-fit:cover;}
  .scan-overlay-status{
    position:absolute;top:calc(18px + var(--safe-bottom));left:0;right:0;
    text-align:center;color:#fff;font-size:13px;padding:0 20px;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
  }
  .scan-overlay-frame{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:80%;max-width:320px;aspect-ratio:2/1;
    border:2px solid var(--accent);border-radius:var(--radius-md);
    box-shadow:0 0 0 2000px rgba(0,0,0,0.4);
  }
  .scan-overlay-cancel{
    position:absolute;bottom:calc(30px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:var(--radius-pill);font-family:'Oswald',sans-serif;font-size:13px;
    font-weight:700;letter-spacing:0.03em;text-transform:uppercase;padding:12px 28px;cursor:pointer;
  }

  .hidden{display:none !important;}

  .boot-loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .boot-loading-mark{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .boot-loading-mark span{color:var(--accent);}
</style>
</head>
<body>

<div id="bootLoading" class="boot-loading"><div class="boot-loading-mark">SAVIOR<span>FUEL</span></div></div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1>SAVIOR<span>FUEL</span></h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-action="set-tab" data-tab="log" class="active">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="4" width="4" height="16" rx="1.3"/><rect x="19" y="4" width="4" height="16" rx="1.3"/><rect x="5" y="10.4" width="14" height="3.2" rx="1"/></svg></span>
      Log
    </button>
    <button data-action="set-tab" data-tab="history">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="16" width="12" height="3" rx="1"/></svg></span>
      History
    </button>
    <button data-action="set-tab" data-tab="insights">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></span>
      Insights
    </button>
    <button data-action="set-tab" data-tab="settings">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></span>
      Settings
    </button>
  </nav>
</div>

<div id="scanOverlay" class="scan-overlay hidden">
  <video id="scanVideo" playsinline autoplay muted></video>
  <div class="scan-overlay-status" id="scanStatus">Point camera at a barcode</div>
  <div class="scan-overlay-frame"></div>
  <button class="scan-overlay-cancel" data-action="close-scanner">Cancel</button>
</div>

<script>
  // =========================================================
  // SAVIORFUEL — local-state working version
  // Visual shell copied from SaviorFit Logger. Data layer here
  // is 100% local (in-memory + localStorage) — no Firebase, no
  // auth, no sync across devices yet. That's intentional: this
  // is meant to prove out the actual product before wiring up a
  // backend. Data model (meal shape, settings shape) is written
  // to already look like what would eventually go in Firestore,
  // so swapping in real persistence later is mostly mechanical.
  //
  // Storage key: everything lives under one localStorage key,
  // 'saviorfuel_local_v1'. Bump the version suffix if the shape
  // of STORE ever changes in a way that would break old data.
  // =========================================================

  var STORAGE_KEY = 'saviorfuel_local_v1';

  var DEFAULT_GOALS = { calories: 2000, protein: 150, carbs: 200, fat: 65 };
  var DEFAULT_PROFILE = { sex: 'male', age: 25, heightCm: 170, weightKg: 70, activityLevel: 'moderate', goal: 'maintain' };

  var ACTIVITY_LEVELS = [
    { id: 'sedentary', label: 'Sedentary (little/no exercise)', mult: 1.2 },
    { id: 'light', label: 'Light (1-3 days/week)', mult: 1.375 },
    { id: 'moderate', label: 'Moderate (3-5 days/week)', mult: 1.55 },
    { id: 'active', label: 'Very active (6-7 days/week)', mult: 1.725 },
    { id: 'extra', label: 'Extra active (physical job + training)', mult: 1.9 }
  ];
  var GOAL_OPTIONS = [
    { id: 'lose', label: 'Lose weight', calAdjust: -500 },
    { id: 'maintain', label: 'Maintain', calAdjust: 0 },
    { id: 'gain', label: 'Build muscle', calAdjust: 300 }
  ];

  var STORE = loadStore();
  var state = { tab: 'log' };
  var ui = {
    historyOpenDay: null,
    selectedFood: null,   // { name, brand, per100g: {cal,protein,carbs,fat} } once a search result is tapped
    grams: 100,            // serving size in grams, scales the selected food's macros
    prefillName: null, prefillCal: null, prefillProtein: null, prefillCarbs: null, prefillFat: null,
    searchDebounce: null
  };

  function loadStore(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE) };
      var parsed = JSON.parse(raw);
      if (!parsed.goals) parsed.goals = Object.assign({}, DEFAULT_GOALS);
      if (!parsed.meals) parsed.meals = [];
      if (!parsed.profile) parsed.profile = Object.assign({}, DEFAULT_PROFILE);
      return parsed;
    } catch (e){
      console.error('SaviorFuel: failed to load local store, starting fresh —', e);
      return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE) };
    }
  }

  function saveStore(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
    } catch (e){
      console.error('SaviorFuel: failed to save local store —', e);
    }
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function dateKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayKey(){ return dateKey(Date.now()); }

  function formatDateLabel(key){
    var today = todayKey();
    var yesterday = dateKey(Date.now() - 86400000);
    if (key === today) return 'Today';
    if (key === yesterday) return 'Yesterday';
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mealsForDay(key){
    return STORE.meals.filter(function(m){ return dateKey(m.loggedAt) === key; });
  }

  function totalsFor(meals){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    meals.forEach(function(m){
      t.calories += m.calories || 0;
      t.protein += m.protein || 0;
      t.carbs += m.carbs || 0;
      t.fat += m.fat || 0;
    });
    return t;
  }

  function pct(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.min(100, Math.round((value / goal) * 100)));
  }

  /* =========================================================

  function searchFoodDebounced(query){
    clearTimeout(ui.searchDebounce);
    if (!query || query.trim().length < 2){

    ui.searchDebounce = setTimeout(function(){ runFoodSearch(query.trim()); }, 400);

  function runFoodSearch(query){
    var resultsEl = document.getElementById('foodSearchResults');
    if (!resultsEl) return;
    resultsEl.innerHTML = '<div class="food-search-status">Searching...</div>';

    var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
      encodeURIComponent(query) + '&search_simple=1&action=process&json=1&page_size=15';

    fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){
        var products = (data.products || []).filter(function(p){
          return p.product_name && p.nutriments && p.nutriments['energy-kcal_100g'] != null;
        });
        if (products.length === 0){
          resultsEl.innerHTML = '<div class="food-search-status">No results — try a different search, or just type it in manually below.</div>';
          return;
        }
        resultsEl.innerHTML = products.map(function(p, i){
          var cal = Math.round(p.nutriments['energy-kcal_100g'] || 0);
          return '<div class="food-search-row" data-action="pick-food" data-index="' + i + '">' +
            '<div class="food-search-row-name">' + esc(p.product_name) +
              (p.brands ? '<span class="brand">' + esc(p.brands.split(',')[0]) + '</span>' : '') +
            '</div>' +
            '<div class="food-search-row-cal">' + cal + ' kcal/100g</div>' +
          '</div>';
        }).join('');
        ui.lastSearchProducts = products; // stashed so pick-food can look up by index without re-fetching
      })
      .catch(function(err){
        console.error('SaviorFuel food search failed —', err);
        resultsEl.innerHTML = '<div class="food-search-status">Search failed — check your connection, or type the meal in manually below.</div>';
      });
  }

  /* =========================================================
     BARCODE SCANNER — native BarcodeDetector API (best support
     is Chrome/Chrome-based browsers on Android, which is exactly
     what the installed Play Store app runs on). No external
     library — if the API isn't available, we just tell the
     person to search by name instead rather than failing silently.
     ========================================================= */
  var scanState = { stream: null, loopId: null, detector: null };

  function openScanner(){
    if (typeof BarcodeDetector === 'undefined'){
      alert('Barcode scanning isn\'t supported in this browser. Try the installed app, or search by name instead.');
      return;
    }
    var overlay = document.getElementById('scanOverlay');
    var video = document.getElementById('scanVideo');
    var statusEl = document.getElementById('scanStatus');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function(stream){
        scanState.stream = stream;
        video.srcObject = stream;
        overlay.classList.remove('hidden');
        scanState.detector = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128']
        });
        statusEl.textContent = 'Point camera at a barcode';
        scanLoop();
      })
      .catch(function(err){
        console.error('SaviorFuel: camera access failed —', err);
        alert('Couldn\'t access the camera. Check camera permission for this app in your phone settings, or search by name instead.');
      });
  }

  function scanLoop(){
    var video = document.getElementById('scanVideo');
    if (!scanState.stream) return; // scanner was closed mid-loop
    scanState.detector.detect(video)
      .then(function(codes){
        if (codes.length > 0){
          onBarcodeDetected(codes[0].rawValue);
        } else {
          scanState.loopId = requestAnimationFrame(scanLoop);
        }
      })
      .catch(function(){
        // detect() can throw transiently (e.g. video not ready yet) — just keep trying
        scanState.loopId = requestAnimationFrame(scanLoop);
      });
  }

  function closeScanner(){
    if (scanState.stream){
      scanState.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.stream = null;
    scanState.loopId = null;
    document.getElementById('scanOverlay').classList.add('hidden');
  }

  function onBarcodeDetected(code){
    var statusEl = document.getElementById('scanStatus');
    statusEl.textContent = 'Found ' + code + ' — looking it up...';
    if (scanState.loopId) cancelAnimationFrame(scanState.loopId);
    scanState.loopId = null;

    fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        closeScanner();
        if (data.status !== 1 || !data.product || !data.product.nutriments){
          alert('That barcode isn\'t in the food database. Try searching by name instead.');
          return;
        }
        var p = data.product;
        var n = p.nutriments;
        ui.selectedFood = {
          name: p.product_name || 'Scanned item',
          brand: p.brands ? p.brands.split(',')[0] : '',
          per100g: {
            cal: n['energy-kcal_100g'] || 0,
            protein: n['proteins_100g'] || 0,
            carbs: n['carbohydrates_100g'] || 0,
            fat: n['fat_100g'] || 0
          }
        };
        ui.grams = 100;
        applySelectedFoodToForm();
        renderApp();
      })
      .catch(function(err){
        console.error('SaviorFuel: barcode lookup failed —', err);
        closeScanner();
        alert('Lookup failed — check your connection and try again, or search by name instead.');
      });
  }

  function addMealFromForm(){
    var name = document.getElementById('mealName').value.trim();

    STORE.meals.push({
      id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      name: name,
      calories: cal,
      protein: protein,
      carbs: carbs,
      fat: fat,
      loggedAt: Date.now()
    });
    saveStore();
    clearFoodSelection();
    renderApp();

  /* =========================================================

  function renderHistory(){

      document.getElementById('view').innerHTML =

          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +

  /* =========================================================
     PLAN CALCULATOR — Mifflin-St Jeor BMR -> TDEE -> goal-adjusted
     calories -> macro split. Standard formula used by most
     fitness/nutrition apps; not medical advice, just a starting
     estimate the person can always override manually below.
     ========================================================= */
  function selectOptionsHtml(options, selectedId){
    return options.map(function(o){
      return '<option value="' + o.id + '"' + (o.id === selectedId ? ' selected' : '') + '>' + esc(o.label) + '</option>';
    }).join('');
  }

  function profileFormHtml(){
    var p = STORE.profile;
    return '<div class="settings-group"><h3>Your profile</h3><div class="card">' +
      '<div class="settings-goal-row"><label>Sex</label>' +
        '<select id="profSex">' +
          '<option value="male"' + (p.sex === 'male' ? ' selected' : '') + '>Male</option>' +
          '<option value="female"' + (p.sex === 'female' ? ' selected' : '') + '>Female</option>' +
        '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Age</label>' +
        '<input type="number" inputmode="numeric" id="profAge" value="' + p.age + '"></div>' +
      '<div class="settings-goal-row"><label>Height (cm)</label>' +
        '<input type="number" inputmode="numeric" id="profHeight" value="' + p.heightCm + '"></div>' +
      '<div class="settings-goal-row"><label>Bodyweight (kg)</label>' +
        '<input type="number" inputmode="numeric" id="profWeight" value="' + p.weightKg + '"></div>' +
      '<div class="settings-goal-row"><label>Activity level</label>' +
        '<select id="profActivity">' + selectOptionsHtml(ACTIVITY_LEVELS, p.activityLevel) + '</select>' +
      '</div>' +
      '<div class="settings-goal-row"><label>Goal</label>' +
        '<select id="profGoal">' + selectOptionsHtml(GOAL_OPTIONS, p.goal) + '</select>' +
      '</div>' +
      '<button class="btn-primary" data-action="calculate-plan" style="margin-top:10px;">Calculate My Plan</button>' +
    '</div></div>';
  }

  function calculatePlanFromForm(){
    var profile = {
      sex: document.getElementById('profSex').value,
      age: parseInt(document.getElementById('profAge').value, 10) || DEFAULT_PROFILE.age,
      heightCm: parseInt(document.getElementById('profHeight').value, 10) || DEFAULT_PROFILE.heightCm,
      weightKg: parseInt(document.getElementById('profWeight').value, 10) || DEFAULT_PROFILE.weightKg,
      activityLevel: document.getElementById('profActivity').value,
      goal: document.getElementById('profGoal').value
    };
    STORE.profile = profile;

    // Mifflin-St Jeor BMR
    var bmr = profile.sex === 'male'
      ? (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) + 5
      : (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) - 161;

    var activityMult = (ACTIVITY_LEVELS.find(function(a){ return a.id === profile.activityLevel; }) || ACTIVITY_LEVELS[2]).mult;
    var tdee = bmr * activityMult;

    var goalAdjust = (GOAL_OPTIONS.find(function(g){ return g.id === profile.goal; }) || GOAL_OPTIONS[1]).calAdjust;
    var targetCalories = Math.max(1200, Math.round(tdee + goalAdjust)); // 1200 floor as a basic safety rail

    // Macro split: protein by bodyweight (1.8g/kg), fat at 25% of
    // total calories, carbs fill the remainder.
    var proteinG = Math.round(profile.weightKg * 1.8);
    var proteinCal = proteinG * 4;
    var fatCal = targetCalories * 0.25;
    var fatG = Math.round(fatCal / 9);
    var carbCal = Math.max(0, targetCalories - proteinCal - fatCal);
    var carbG = Math.round(carbCal / 4);

    STORE.goals = { calories: targetCalories, protein: proteinG, carbs: carbG, fat: fatG };
    STORE.lastPlanTdee = Math.round(tdee);
    saveStore();
    renderApp();
  }

  function renderSettings(){
    var g = STORE.goals;
    var html = profileFormHtml();

    if (STORE.lastPlanTdee){
      html += '<div class="plan-result-banner">Estimated maintenance (TDEE): <b>' + STORE.lastPlanTdee + ' kcal/day</b> — your goals below were calculated from this.</div>';
    }

    html += '<div class="settings-group"><h3>Daily goals</h3><div class="card">' +
      settingsGoalRow('Calories', 'goalCalories', g.calories) +
      settingsGoalRow('Protein (g)', 'goalProtein', g.protein) +
      settingsGoalRow('Carbs (g)', 'goalCarbs', g.carbs) +
      settingsGoalRow('Fat (g)', 'goalFat', g.fat) +
    '</div></div>' +
    '<div class="settings-group"><h3>Data</h3>' +
      '<button class="btn-danger" data-action="clear-data">Erase all data</button>' +
    '</div>';
    document.getElementById('view').innerHTML = html;
  }

  /* =========================================================
     RENDER DISPATCH
     ========================================================= */
  function renderApp(){
    document.querySelectorAll('.tabbar button').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    if (state.tab === 'log') renderLog();
    else if (state.tab === 'history') renderHistory();
    else if (state.tab === 'insights') renderInsights();
    else if (state.tab === 'settings') renderSettings();
  }

  // Same fade+shift treatment as SaviorFit Logger's switchTabWithFade.
  function switchTab(newTab){
    if (newTab === state.tab) return;
    closeScanner(); // safety: release the camera if it was somehow left open
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');

    setTimeout(function(){
      state.tab = newTab;
      renderApp();
      viewEl.classList.remove('subtab-fade-out');
      viewEl.classList.add('subtab-fade-in');
      setTimeout(function(){
        viewEl.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'set-tab'){
      switchTab(el.dataset.tab);
    } else if (action === 'add-meal'){
      addMealFromForm();
    } else if (action === 'delete-meal'){
      deleteMeal(el.dataset.id);
    } else if (action === 'toggle-history-day'){
      var day = el.dataset.day;
      ui.historyOpenDay = (ui.historyOpenDay === day) ? null : day;
      renderApp();
    } else if (action === 'clear-data'){
      if (window.confirm('Erase all logged meals and reset goals? This can\'t be undone.')){
        STORE = { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE) };
        saveStore();
        renderApp();
      }
    } else if (action === 'pick-food'){
      pickFoodResult(parseInt(el.dataset.index, 10));
    } else if (action === 'calculate-plan'){
      calculatePlanFromForm();
    } else if (action === 'open-scanner'){
      openScanner();
    } else if (action === 'close-scanner'){
      closeScanner();
    }
  });

  // Live food search as you type (debounced inside searchFoodDebounced).
  document.addEventListener('input', function(e){
    if (e.target.id === 'foodSearchInput'){
      searchFoodDebounced(e.target.value);
    }
  });

  // Goal inputs save on change (blur/enter), not on every keystroke —
  // avoids writing to localStorage on every digit typed. Same event
  // also handles the "grams" field on a selected search result, which
  // just recomputes the prefill macros rather than saving anything.
  document.addEventListener('change', function(e){
    if (e.target.dataset && e.target.dataset.actionChange === 'save-goal'){
      saveGoalsFromInputs();
    } else if (e.target.id === 'foodGrams'){
      ui.grams = parseInt(e.target.value, 10) || 0;
      applySelectedFoodToForm();
      renderApp();
    }
  });

  document.getElementById('bootLoading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderApp();
</script>

</body>
</html>
