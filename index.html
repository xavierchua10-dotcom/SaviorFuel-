<body>

<div id="bootLoading" class="boot-loading"><img class="boot-loading-logo" src="images/logo-mark.png" alt="SaviorFuel"></div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1 class="topbar-brand"><img src="images/logo-mark.png" alt="SaviorFuel" class="topbar-logo"></h1>
    <button class="topbar-streak" id="topStreak" data-action="set-tab" data-tab="insights" aria-label="Logging streak"></button>
  </header>


  <main id="view"></main>

  <div class="bottom-nav" id="bottomNav">
  <nav class="tabbar" id="tabbar">
    <button data-action="set-tab" data-tab="log" class="active">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v7.2c0 1 .7 1.8 1.6 2V22h2V11.2c.9-.2 1.6-1 1.6-2V2h-1.6v5.6h-1.1V2H8.7v5.6H7.6V2zM17.2 2c-2 1.3-3.2 3.8-3.2 6.6 0 2 .9 3.2 2.2 3.6V22h2V2z"/></svg></span>
      Log
    </button>
    <button data-action="set-tab" data-tab="history">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="16" width="12" height="3" rx="1"/></svg></span>
      History
    </button>
    <button data-action="set-tab" data-tab="scan" aria-label="Add food">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h6v2.4H5.4V9H3z"/><path d="M15 3h6v6h-2.4V5.4H15z"/><path d="M3 15h2.4v3.6H9V21H3z"/><path d="M18.6 15H21v6h-6v-2.4h3.6z"/><rect x="7" y="11" width="10" height="2" rx="1"/><rect x="11" y="7" width="2" height="10" rx="1"/></svg></span>
      Scan
    </button>
    <button data-action="set-tab" data-tab="insights">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></span>
      Insights
    </button>
    <button data-action="set-tab" data-tab="settings">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.2"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7v.5H4z"/></svg></span>
      Profile
    </button>
  </nav>
  </div>
</div>

<div class="food-search-overlay hidden" id="foodSearchOverlay" role="dialog" aria-modal="true">
  <div class="food-search-overlay-panel">
    <div class="food-search-overlay-head">
      <button class="food-search-back" data-action="close-food-search-overlay" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <input type="text" class="food-search-overlay-input" id="foodSearchInput" placeholder="Search a food..." autocomplete="off">
      <button type="button" class="food-search-clear" data-action="clear-food-search" aria-label="Clear search">&times;</button>
      <button class="food-search-scan-btn" data-action="open-scanner" aria-label="Scan barcode or food photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M17 8h4M3 16h4M17 16h4"/></svg>
      </button>

  </div>
</div>

<div id="scanOverlay" class="scan-overlay hidden">
  <video id="scanVideo" playsinline autoplay muted></video>
  <div class="scan-line" id="scanLine"></div>
  <div class="scan-overlay-frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <div class="scan-top">
    <button type="button" class="scan-ib" data-action="close-scanner" aria-label="Close camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="scan-pill" id="scanPill"></div>
    <button type="button" class="scan-ib scan-torch unavail" id="scanTorchBtn" data-action="toggle-torch" aria-label="Torch" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    </button>
  </div>
  <div class="scan-overlay-status" id="scanStatus">Point at a barcode, or snap a photo of the food</div>
  <div class="scan-overlay-controls">
    <button type="button" class="scan-ib scan-gal unavail" id="scanGalBtn" data-action="pick-scan-photo" aria-label="Choose a photo from your gallery">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
    </button>
    <button class="scan-overlay-capture" id="scanCaptureBtn" data-action="capture-food-photo" aria-label="Identify food from photo"><span></span></button>
    <span class="scan-spacer"></span>
  </div>
  <input type="file" id="scanFile" accept="image/*" hidden>
</div>

<div class="add-meal-overlay hidden" id="addMealOverlay" role="dialog" aria-modal="true">
  <div class="add-meal-backdrop" data-action="close-add-meal-overlay"></div>
  <div class="add-meal-sheet" id="addMealSheet">
    <div class="sheet-grab" id="addMealGrab" aria-hidden="true"><i></i></div>
    <div class="add-meal-head">
      <h2 id="addMealTitle">Add Meal</h2>
      <button class="add-meal-close" data-action="close-add-meal-overlay" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="add-meal-body" id="addMealBody">
      <div class="meal-photo hidden" id="mealPhotoBox">
        <img id="mealPhotoImg" alt="Photo of this meal">
        <div class="meal-photo-row"><span>Photo stays on this phone</span><button type="button" data-action="remove-meal-photo">Remove photo</button></div>
      </div>
      <div class="field-row"><input type="text" id="mealName" placeholder="Meal name"></div>

      <!-- Which day this counts for (today by default; change it to log something you forgot, or to move an entry) -->
      <button type="button" class="sum-row" id="dayRow" data-action="toggle-day-picker" aria-expanded="false">
        <span class="sum-row-label">Day</span>
        <span class="sum-row-value" id="dayValue">Today</span>
        <span class="sum-row-edit">Change</span><svg class="sum-row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="acc" id="dayAcc"><div class="acc-fields">
        <div class="day-quick">
          <button type="button" class="day-chip" data-action="set-meal-day" data-days="0">Today</button>
          <button type="button" class="day-chip" data-action="set-meal-day" data-days="1">Yesterday</button>
          <button type="button" class="day-chip" data-action="set-meal-day" data-days="2">2 days ago</button>
        </div>
        <div class="field-row"><input type="date" id="mealDate" aria-label="Pick a date"></div>
      </div></div>

      <!-- Meal time and nutrition are shown as one-line summaries; tap to open the pills / the number fields -->
      <button type="button" class="sum-row" id="mealTimeRow" data-action="toggle-category-picker" aria-expanded="false">
        <span class="sum-row-label">Meal</span>
        <span class="sum-row-value" id="mealTimeValue"></span>
        <span class="sum-row-edit">Change</span><svg class="sum-row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="acc" id="categoryAcc"><div><div class="category-picker" id="categoryPicker"></div></div></div>

      <button type="button" class="sum-row" id="nutriRow" data-action="toggle-nutrition-fields" aria-expanded="false">
        <span class="sum-row-label">Nutrition</span>
        <span class="sum-row-value" id="nutriSummaryValue"></span>
        <span class="sum-row-edit">Edit</span><svg class="sum-row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="acc" id="nutriAcc"><div class="acc-fields">
        <div class="field-row">
          <div class="field-labeled"><label>Calories</label><input type="number" inputmode="numeric" id="mealCal" placeholder="0"></div>
          <div class="field-labeled"><label>Protein (g)</label><input type="number" inputmode="numeric" id="mealProtein" placeholder="0"></div>
        </div>
        <div class="field-row">
          <div class="field-labeled"><label>Carbs (g)</label><input type="number" inputmode="numeric" id="mealCarbs" placeholder="0"></div>
          <div class="field-labeled"><label>Fat (g)</label><input type="number" inputmode="numeric" id="mealFat" placeholder="0"></div>
        </div>
        <button type="button" class="more-link" id="moreNutriBtn" data-action="show-more-nutrition">+ More details (sugar, sodium)</button>
        <div class="field-row hidden" id="moreNutriRow">
          <div class="field-labeled"><label>Sugar (g)</label><input type="number" inputmode="numeric" id="mealSugar" placeholder="0"></div>
          <div class="field-labeled"><label>Sodium (mg)</label><input type="number" inputmode="numeric" id="mealSodium" placeholder="0"></div>
        </div>
      </div></div>
    </div>
    <div class="add-meal-footer">
      <button class="btn-primary" id="addMealSubmit" data-action="add-meal">+ Add Meal</button>
      <button type="button" class="meal-del-link hidden" id="addMealDelete" data-action="delete-editing-meal">Delete this meal</button>
    </div>
  </div>
</div>

<div class="add-meal-overlay hidden" id="aiScanOverlay" role="dialog" aria-modal="true">
  <div class="add-meal-backdrop" data-action="close-ai-scan"></div>
  <div class="add-meal-sheet">
    <div class="sheet-grab" id="aiScanGrab" aria-hidden="true"><i></i></div>
    <div class="add-meal-head">
      <h2>Scanned meal</h2>
      <button class="add-meal-close" data-action="close-ai-scan" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="add-meal-body">
      <div class="ai-total-card">
        <button type="button" class="ai-photo-btn hidden" id="aiScanHero" data-action="zoom-ai-photo" aria-label="Enlarge your meal photo"><img id="aiScanThumb" alt="Your meal photo"><span class="ai-badge">AI</span></button>
        <div class="ai-total-main" id="aiScanTotal"></div>
      </div>
      <div class="ai-scan-note" id="aiScanNote"></div>
      <button type="button" class="sum-row ai-meal-row" id="aiMealRow" data-action="toggle-ai-category" aria-expanded="false">
        <span class="sum-row-label">Meal</span>
        <span class="sum-row-value" id="aiMealValue"></span>
        <span class="sum-row-edit">Change</span><svg class="sum-row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="acc" id="aiCategoryAcc"><div><div class="category-picker ai-cats" id="aiCategoryPicker"></div></div></div>
      <div id="aiScanItems"></div>
      <button type="button" class="ai-add-item" data-action="ai-add-item">+ Add another item</button>
      <div class="ai-foot">Estimates from a photo. Check portions before logging.</div>
      <button class="btn-primary" id="aiLogBtn" data-action="ai-scan-log">+ Log meal</button>
    </div>
  </div>
</div>

<div class="add-meal-overlay hidden" id="recentOverlay" role="dialog" aria-modal="true">
  <div class="add-meal-backdrop" data-action="close-recent-sheet"></div>
  <div class="add-meal-sheet">
    <div class="sheet-grab" id="recentGrab" aria-hidden="true"><i></i></div>
    <div class="add-meal-head">
      <h2>Log again?</h2>
      <button class="add-meal-close" data-action="close-recent-sheet" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="add-meal-body" id="recentBody"></div>
  </div>
</div>

<div class="ai-zoom hidden" id="aiZoom" role="dialog" aria-modal="true" aria-label="Meal photo">
  <img id="aiZoomImg" alt="Your meal photo">
  <button type="button" class="ai-zoom-x" data-action="close-ai-zoom" aria-label="Close photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="confirm-overlay hidden" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-backdrop" data-action="cancel-confirm"></div>
  <div class="confirm-sheet">
    <div class="confirm-grab" id="confirmGrab" aria-hidden="true"><i></i></div>
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </div>

      <div class="confirm-item-kcal" id="confirmItemKcal"></div>
    </div>
    <p class="confirm-note" id="confirmNote"></p>
    <button type="button" class="confirm-yes" id="confirmYes" data-action="confirm-yes">Delete</button>
    <button type="button" class="confirm-cancel" id="confirmCancel" data-action="cancel-confirm">Cancel</button>
  </div>
</div>

<div class="photo-overlay hidden" id="photoOverlay" role="dialog" aria-modal="true" aria-label="Food photo">
  <div class="photo-overlay-backdrop" data-action="close-food-photo"></div>
  <div class="photo-overlay-card">
    <button class="add-meal-close photo-overlay-close" data-action="close-food-photo" aria-label="Close photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="photo-overlay-frame"><img id="photoOverlayImg" alt="" referrerpolicy="no-referrer"></div>
    <div class="photo-overlay-name" id="photoOverlayName"></div>
    <div class="photo-overlay-credit" id="photoOverlayCredit">Photo: Open Food Facts contributors · CC BY-SA</div>

</div>

  <div class="nutrient-info-backdrop" data-action="close-nutrient-info"></div>
  <div class="nutrient-info-card">
    <div class="nutrient-info-head">
      <h3 id="nutrientInfoTitle"></h3>
      <button data-action="close-nutrient-info" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

</div>

<script>
/*! SaviorFuel — Copyright (c) 2026 Xavier Chua (Savior). All rights reserved. See LICENSE. */
  // =========================================================
  // SAVIORFUEL — local-state working version
  // Visual shell copied from SaviorFit Logger. Data layer here
  // is 100% local (in-memory + localStorage) — no Firebase, no
  // auth, no sync across devices yet. That's intentional: this
  // is meant to prove out the actual product before wiring up a
  // backend. Data model (meal shape, settings shape) is written
  // to already look like what would eventually go in Firestore,
  // so swapping in real persistence later is mostly mechanical.
  //
  // Storage key: everything lives under one localStorage key,
  // 'saviorfuel_local_v1'. Bump the version suffix if the shape
  // of STORE ever changes in a way that would break old data.
  // =========================================================

  var STORAGE_KEY = 'saviorfuel_local_v1';

  // Fiber/sugar/sodium defaults follow the FDA's general Daily
  // Values (28g, 50g added sugar, 2300mg) — same starting-point
  // convention as the Mifflin-St Jeor calculator below: a sensible
  // default, always overridable in Settings.
  var DEFAULT_GOALS = { calories: 2000, protein: 150, carbs: 200, fat: 65, sugar: 50, sodium: 2300, water: 2500 };

  var MEAL_CATEGORIES = [
    { id: 'breakfast', label: 'Breakfast' },
    { id: 'morning-snack', label: 'Morning Snacks' },
    { id: 'lunch', label: 'Lunch' },
    { id: 'evening-snack', label: 'Evening Snacks' },
    { id: 'dinner', label: 'Dinner' }
  ];
  var CATEGORY_LABELS = MEAL_CATEGORIES.reduce(function(acc, c){ acc[c.id] = c.label; return acc; }, {});

  // Sensible default for whichever category button is pre-selected
  // when the Add Meal overlay opens — always overridable by the user.
  function suggestCategoryForNow(){
    var h = new Date().getHours();
    if (h < 10) return 'breakfast';
    if (h < 12) return 'morning-snack';
    if (h < 15) return 'lunch';
    if (h < 18) return 'evening-snack';
    return 'dinner';
  }
  var DEFAULT_PROFILE = { sex: 'male', age: 25, heightCm: 170, weightKg: 70, activityLevel: 'moderate', goal: 'maintain' };
  var DEFAULT_APP_SETTINGS = { unit: 'metric', haptic: true, density: 'comfortable', corners: 'rounded', theme: 'dark', bgArt: true, overviewMode: '3d', macroCardCollapsed: true, aiScanConsent: false };
  var APP_VERSION = '0.1.0';

  function cmToIn(cm){ return cm / 2.54; }
  function inToCm(inches){ return inches * 2.54; }
  function kgToLb(kg){ return kg * 2.20462; }
  function lbToKg(lb){ return lb / 2.20462; }

  var ACTIVITY_LEVELS = [
    { id: 'sedentary', label: 'Sedentary · no exercise', mult: 1.2 },
    { id: 'light', label: 'Light · 1-3 days/wk', mult: 1.375 },
    { id: 'moderate', label: 'Moderate · 3-5 days/wk', mult: 1.55 },
    { id: 'active', label: 'Very active · 6-7 days/wk', mult: 1.725 },
    { id: 'extra', label: 'Extra active · hard job + training', mult: 1.9 }
  ];
  var GOAL_OPTIONS = [
    { id: 'lose', label: 'Lose weight', pct: -0.20, protein: 2.0, desc: 'About 20% under maintenance, with high protein to keep your muscle.' },
    { id: 'maintain', label: 'Maintain', pct: 0, protein: 1.6, desc: 'Around maintenance calories with balanced protein.' },
    { id: 'gain', label: 'Build muscle', pct: 0.10, protein: 2.0, desc: 'About 10% over maintenance, with high protein to build muscle.' }
  ];
  // Sensible limits for the body details (stored as kg / cm)
  var PLAN_LIMITS = { age: [10, 100], heightCm: [100, 250], weightKg: [30, 300] };
  function goalById(id){ return GOAL_OPTIONS.find(function(g){ return g.id === id; }) || GOAL_OPTIONS[1]; }

  var STORE = loadStore();
  var state = { tab: 'log' };
  var ui = {
    histFind: false,      // History filter bar is open
    dayOpen: null,
    histShow: 21,
    histMonth: null,
    settingsOpen: null,
    logDay: null,         // day the Log tab shows (null = today); set by the week strip
    selectedFood: null,   // { name, brand, per100g: {cal,protein,carbs,fat} } once a search result is tapped
    grams: 100,            // serving size in grams, scales the selected food's macros
    prefillName: null, prefillCal: null, prefillProtein: null, prefillCarbs: null, prefillFat: null,
    prefillFiber: null, prefillSugar: null, prefillSodium: null,
    searchDebounce: null,
    dangerZoneOpen: false,
    justFilledFood: false,
    selectedCategory: 'breakfast', // set properly each time the Add Meal overlay opens
    insightsView: 'today', // 'today' | 'trends' — which Insights sub-tab panel is showing
    serving: null // { unitId, qty } — how the picked food is being measured (see the serving picker)
  };

  function loadStore(){
    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [], myFoods: [], water: {}, photos: {} };
      var parsed = JSON.parse(raw);
      // Merge (not replace) so existing saved goals keep whatever the
      // person already customized, while newly-added goal fields
      // (e.g. fiber/sugar/sodium) backfill from defaults instead of
      // coming back undefined.
      parsed.goals = Object.assign({}, DEFAULT_GOALS, parsed.goals || {});
      parsed.meals = Array.isArray(parsed.meals) ? parsed.meals.map(sanitizeMeal).filter(Boolean) : [];
      if (!parsed.profile) parsed.profile = Object.assign({}, DEFAULT_PROFILE);
      // Same merge reasoning as goals above — existing density/corners/
      // unit choices are kept, newly-added settings (theme) backfill.
      parsed.appSettings = Object.assign({}, DEFAULT_APP_SETTINGS, parsed.appSettings || {});
      // Foods picked from a live search/scan, cached locally so the
      // same food can be found and re-logged without network next
      // time (see saveFoodToCache / searchSavedFoods).
      if (!parsed.savedFoods) parsed.savedFoods = [];
      if (!Array.isArray(parsed.myFoods)) parsed.myFoods = [];
      if (!parsed.water || typeof parsed.water !== 'object') parsed.water = {};
      parsed.photos = cleanPhotos(parsed.photos, parsed.meals);
      return parsed;
    } catch (e){
      console.error('SaviorFuel: failed to load local store, starting fresh —', e);
      // Keep the unreadable data (the next save would overwrite it) so it can still be recovered.
      try { if (raw) localStorage.setItem(STORAGE_KEY + '_unreadable', raw); } catch (e2){}
      return { meals: [], goals: Object.assign({}, DEFAULT_GOALS), profile: Object.assign({}, DEFAULT_PROFILE), appSettings: Object.assign({}, DEFAULT_APP_SETTINGS), savedFoods: [], myFoods: [], water: {}, photos: {} };
    }
  }

  // If the browser refuses the write (storage full, private mode, blocked)
  // the meal only exists in memory and vanishes on reload — so say so once,
  // instead of failing silently.
  var saveFailureShown = false;
  function saveStore(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
      saveFailureShown = false;
      syncSchedule();
    } catch (e){
      console.error('SaviorFuel: failed to save local store —', e);
      if (!saveFailureShown){
        saveFailureShown = true;
        alert('SaviorFuel couldn\u2019t save to this device (storage may be full or blocked by the browser), so what you just logged may be lost when you close the app. Export a backup from Settings, and free up some space or leave private browsing.');
      }
    }
  }

  // Ask the browser not to evict our saved data when it's short of space
  // (best effort — the browser decides).
  if (navigator.storage && navigator.storage.persist){
    try { navigator.storage.persist(); } catch (e){}
  }

  // Coerces one logged meal to safe types: numbers are numbers (a string
  // "100" would make totals concatenate text), never negative, and an
  // entry without a usable timestamp is dropped. Used for stored data and
  // for imported backups.
  // Small meal photos (from the AI scan) live in STORE.photos, keyed by id,
  // and meals point at them with photoId. Only small JPEG data URLs are
  // accepted, photos no meal uses are dropped, and only the newest few
  // are kept so the app's storage can't fill up.
  function cleanPhotos(photos, meals){
    var out = {};
    if (!photos || typeof photos !== 'object') return out;
    var used = {};
    (meals || []).forEach(function(m){ if (m.photoId) used[m.photoId] = m.loggedAt; });
    Object.keys(photos).forEach(function(id){
      var d = photos[id];
      if (used[id] != null && typeof d === 'string' && d.indexOf('data:image/jpeg;base64,') === 0 && d.length < 120000) out[id] = d;
    });
    return capPhotos(out, meals);
  }
  function capPhotos(photos, meals){
    var MAX_PHOTOS = 60;
    var ids = Object.keys(photos);
    if (ids.length <= MAX_PHOTOS) return photos;
    var when = {};
    (meals || []).forEach(function(m){ if (m.photoId) when[m.photoId] = Math.max(when[m.photoId] || 0, m.loggedAt); });
    ids.sort(function(a, b){ return (when[b] || 0) - (when[a] || 0); });
    ids.slice(MAX_PHOTOS).forEach(function(id){ delete photos[id]; });
    return photos;
  }
  function mealPhoto(m){
    return (m && m.photoId && STORE.photos && STORE.photos[m.photoId]) || '';
  }

  function sanitizeMeal(m){
    if (!m || typeof m !== 'object') return null;
    var t = Number(m.loggedAt);
    if (!isFinite(t) || t <= 0) return null;
    var n = function(v, max){ v = Number(v); return (isFinite(v) && v > 0) ? Math.min(v, max) : 0; };
    var clean = {
      id: String(m.id || ('m_' + t + '_' + Math.random().toString(36).slice(2, 7))),
      name: String(m.name == null ? 'Food' : m.name).slice(0, 120),
      calories: n(m.calories, 20000), protein: n(m.protein, 2000), carbs: n(m.carbs, 2000), fat: n(m.fat, 2000),
      fiber: n(m.fiber, 1000), sugar: n(m.sugar, 2000), sodium: n(m.sodium, 50000),
      loggedAt: t
    };
    if (typeof m.category === 'string') clean.category = m.category;
    if (typeof m.photoId === 'string' && m.photoId) clean.photoId = m.photoId.slice(0, 60);
    return clean;
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function dateKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayKey(){ return dateKey(Date.now()); }

  // Date key for N calendar days ago. Counted by calendar (via the noon
  // of today), NOT by subtracting N x 24 hours — on the day clocks go
  // forward (a 23-hour day) that subtraction lands a day too early and
  // "yesterday" / the weekly chart skip or repeat a date.
  function dateKeyDaysAgo(n){
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - n);
    return dateKey(d.getTime());
  }

  function formatDateLabel(key){
    var today = todayKey();
    var yesterday = dateKeyDaysAgo(1);
    if (key === today) return 'Today';
    if (key === yesterday) return 'Yesterday';
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mealsForDay(key){
    return STORE.meals.filter(function(m){ return dateKey(m.loggedAt) === key; });
  }

  function totalsFor(meals){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, sodium: 0 };
    meals.forEach(function(m){
      t.calories += m.calories || 0;
      t.protein += m.protein || 0;
      t.carbs += m.carbs || 0;
      t.fat += m.fat || 0;
      t.fiber += m.fiber || 0;
      t.sugar += m.sugar || 0;
      t.sodium += m.sodium || 0;
    });
    return t;
  }

  function pct(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.min(100, Math.round((value / goal) * 100)));
  }

  // Same as pct() but never caps the upper end — for anywhere the
  // actual number is shown (ring center text, etc.), so 250g against
  // a 100g goal reads as "250%", not a misleading capped "100%".
  // Fill widths/ring offsets still need pct() (capped) since they're
  // physically bounded by the container — this one's for display only.
  function pctUncapped(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.round((value / goal) * 100));
  }

  function showNutrientInfo(){
    document.getElementById('nutrientInfoTitle').textContent = 'Macros';
    // Reference image rather than generated text — kept as its own
    // file rather than inlined,

     RENDER — LOG TAB
     ========================================================= */
  // ---- Log day / week strip helpers ----
  // ui.logDay is the day the Log tab is showing (null = today). The week
  // strip above the ring lets you flip to any earlier day and see/edit it.
  function addDaysKey(key, n){
    var d = new Date(key + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return dateKey(d.getTime());
  }
  function logDayKey(){
    var t = todayKey();
    return (ui.logDay && ui.logDay <= t) ? ui.logDay : t;
  }
  function weekStartKey(key){
    var d = new Date(key + 'T00:00:00');
    return addDaysKey(key, -((d.getDay() + 6) % 7)); // Monday
  }

  var HERO_RINGS = [
    { id: 'cal',     r: 119, w: 14 },
    { id: 'protein', r: 99,  w: 9 },
    { id: 'carbs',   r: 85,  w: 9 },
    { id: 'fat',     r: 71,  w: 9 }
  ];
  function heroRingSvg(totals, g){
    var vals = { cal: [totals.calories, g.calories], protein: [totals.protein, g.protein], carbs: [totals.carbs, g.carbs], fat: [totals.fat, g.fat] };
    var out = '<svg class="hero-ring-svg" viewBox="0 0 260 260" aria-hidden="true">';
    ring3dData = {};
    HERO_RINGS.forEach(function(rg){
      var c = 2 * Math.PI * rg.r;
      var v = vals[rg.id];
      var frac = v[1] > 0 ? Math.min(v[0] / v[1], 1) : 0;
      var over = v[1] > 0 && v[0] > v[1];
      ring3dData[rg.id] = { frac: frac, over: over };
      out += '<circle class="hero-ring-track" cx="130" cy="130" r="' + rg.r + '" style="stroke-width:' + rg.w + '"></circle>';
      if (frac > 0){
        out += '<circle class="hero-ring-fill ring-' + rg.id + (over && rg.id === 'cal' ? ' over' : '') + '" cx="130" cy="130" r="' + rg.r + '" ' +
          'style="stroke-width:' + rg.w + ';stroke-dasharray:' + c.toFixed(2) + ';stroke-dashoffset:' + (c * (1 - frac)).toFixed(2) + '"></circle>';
      }
    });
    return out + '</svg>';
  }


  /* =========================================================
     3D hero ring. The SVG above is the always-works version; once
     Three.js (same CDN copy the Insights pyramid uses) is ready, a
     canvas is laid over it with glossy extruded rings. Drag sideways
     to spin it; it coasts, then eases back to face front. One renderer
     is kept and moved into each fresh .hero-ring, so re-rendering the
     Log tab never creates a new WebGL context.
     ========================================================= */
  var ring3dData = null;
  var ring3d = { state: 'idle', canvas: null, renderer: null, scene: null, camera: null, group: null,
    size: 0, rot: 0, vel: 0, drag: null, raf: 0, last: 0, idleAt: 0 };
  var RINGS3D = [
    { id: 'cal',     r: 3.15, w: 0.5,  css: 'var(--c-cal)' },
    { id: 'protein', r: 2.6,  w: 0.36, css: 'var(--c-protein)' },
    { id: 'carbs',   r: 2.12, w: 0.36, css: 'var(--c-carbs)' },
    { id: 'fat',     r: 1.64, w: 0.36, css: 'var(--c-fat)' }
  ];

  function ring3dColor(expr){
    var probe = document.createElement('i');
    probe.style.cssText = 'position:absolute;visibility:hidden;color:' + expr;
    document.body.appendChild(probe);
    var c = getComputedStyle(probe).color;
    probe.remove();
    return new THREE.Color(c).convertSRGBToLinear();
  }
  function ring3dAnnulus(ri, ro, a0, a1){
    var sh = new THREE.Shape();
    sh.absarc(0, 0, ro, a0, a1, true);
    sh.absarc(0, 0, ri, a1, a0, false);
    sh.closePath();
    return sh;
  }

  function ring3dBuild(){
    var r = ring3d, g = r.group, T = THREE;
    while (g.children.length){
      var old = g.children.pop();
      if (old.geometry) old.geometry.dispose();
      if (old.material) old.material.dispose();
    }
    var trackCol = ring3dColor('var(--panel-2)');
    trackCol.multiplyScalar(trackCol.r + trackCol.g + trackCol.b > 1.5 ? 0.8 : 0.62);   // lighter themes need less darkening
    var TH = 0.35, LIFT = 0.2, BV = 0.04, TAU = Math.PI * 2, A0 = Math.PI / 2;
    RINGS3D.forEach(function(rg){
      var d = (ring3dData && ring3dData[rg.id]) || { frac: 0, over: false };
      var ri = rg.r - rg.w / 2, ro = rg.r + rg.w / 2;
      var track = new T.Mesh(
        new T.ExtrudeGeometry(ring3dAnnulus(ri, ro, A0, A0 - TAU + 0.0001), { depth: TH, bevelEnabled: true, bevelSize: BV, bevelThickness: BV, bevelSegments: 3, curveSegments: 48 }),
        new T.MeshStandardMaterial({ color: trackCol, roughness: 0.55, metalness: 0.1 }));
      track.rotation.x = -Math.PI / 2;
      g.add(track);
      if (d.frac <= 0) return;
      var frac = Math.max(d.frac, 0.015);
      var col = ring3dColor(d.over && rg.id === 'cal' ? 'var(--accent-2)' : rg.css);
      var mat = new T.MeshPhysicalMaterial({ color: col, roughness: 0.22, metalness: 0.15, clearcoat: 1, clearcoatRoughness: 0.15, emissive: col, emissiveIntensity: 0.12 });
      var a1 = A0 - TAU * Math.min(frac, 0.9999);
      var arc = new T.Mesh(
        new T.ExtrudeGeometry(ring3dAnnulus(ri + 0.03, ro - 0.03, A0, a1), { depth: TH + LIFT, bevelEnabled: true, bevelSize: BV * 1.2, bevelThickness: BV * 1.6, bevelSegments: 4, curveSegments: 48 }),
        mat);
      arc.rotation.x = -Math.PI / 2;
      arc.position.y = TH * 0.5;
      g.add(arc);
      if (frac < 0.999){   // round end caps
        [A0, a1].forEach(function(a){
          var cap = new T.Mesh(new T.CylinderGeometry(rg.w / 2 - 0.03, rg.w / 2 - 0.03, TH + LIFT + BV * 2.8, 28), mat);
          cap.position.set(Math.cos(a) * rg.r, TH * 0.5 + (TH + LIFT) / 2, -Math.sin(a) * rg.r);
          g.add(cap);
        });
      }
    });
    r.group.rotation.y = r.rot;
    ring3dKick();
  }

  function ring3dInit(){
    var T = THREE, r = ring3d;
    r.renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    r.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.renderer.outputEncoding = T.sRGBEncoding;
    r.renderer.setClearColor(0x000000, 0);
    r.canvas = r.renderer.domElement;
    r.canvas.className = 'ring3d';
    r.canvas.setAttribute('aria-hidden', 'true');
    r.scene = new T.Scene();
    r.camera = new T.PerspectiveCamera(34.6, 1, 0.1, 100)   /* 30deg fov widened to match the 116% canvas, so the ring keeps its size but has room to spin */;
    r.camera.position.set(0, 10.4, 8.1);
    r.camera.lookAt(0, 0.2, 0);
    r.scene.add(new T.HemisphereLight(0xffffff, 0x303846, 0.55));
    var key = new T.DirectionalLight(0xffffff, 0.85); key.position.set(-4, 9, 6);
    var back = new T.DirectionalLight(0x88aaff, 0.3); back.position.set(6, 3, -4);
    r.scene.add(key, back);
    r.group = new T.Group();
    r.scene.add(r.group);
    // Spin by dragging sideways. touch-action: pan-y lets a vertical swipe still scroll the page.
    r.canvas.addEventListener('pointerdown', function(e){
      r.drag = { id: e.pointerId, x: e.clientX, t: performance.now() };
      r.vel = 0;
      try { r.canvas.setPointerCapture(e.pointerId); } catch (_) {}
      ring3dKick();
    });
    r.canvas.addEventListener('pointermove', function(e){
      if (!r.drag || r.drag.id !== e.pointerId) return;
      var now = performance.now(), dx = e.clientX - r.drag.x, dt = Math.max(1, now - r.drag.t) / 1000;
      var step = dx * 0.012;
      r.rot += step;
      r.vel = r.vel * 0.5 + (step / dt) * 0.5;
      r.drag.x = e.clientX; r.drag.t = now;
      ring3dKick();
    });
    var end = function(e){
      if (!r.drag || (e && r.drag.id !== e.pointerId)) return;
      r.drag = null;
      r.idleAt = performance.now();
      if (Math.abs(r.vel) > 14) r.vel = r.vel > 0 ? 14 : -14;
      ring3dKick();
    };
    r.canvas.addEventListener('pointerup', end);
    r.canvas.addEventListener('pointercancel', end);
    r.canvas.addEventListener('webglcontextlost', function(e){ e.preventDefault(); });
    r.canvas.addEventListener('webglcontextrestored', function(){ ring3dKick(); });
  }

  function ring3dKick(){
    if (!ring3d.raf) { ring3d.last = performance.now(); ring3d.raf = requestAnimationFrame(ring3dFrame); }
  }
  function ring3dFrame(now){
    var r = ring3d;
    r.raf = 0;
    if (!r.canvas || !r.canvas.isConnected) return;
    var dt = Math.min(0.05, Math.max(0.001, (now - r.last) / 1000));
    r.last = now;
    var moving = !!r.drag;
    if (!r.drag){
      if (Math.abs(r.vel) > 0.02){
        r.rot += r.vel * dt;
        r.vel *= Math.pow(0.06, dt);
        r.idleAt = now;
        moving = true;
      } else {
        r.vel = 0;
        var target = Math.round(r.rot / (Math.PI * 2)) * Math.PI * 2;   // nearest "facing front"
        if (Math.abs(target - r.rot) > 0.001 && now - r.idleAt > 2200){
          r.rot += (target - r.rot) * Math.min(1, dt * 2.6);
          moving = true;
        } else if (Math.abs(target - r.rot) > 0.001){
          moving = true;   // waiting out the idle delay
        } else {
          r.rot = target;
        }
      }
    }
    r.group.rotation.y = r.rot;
    r.renderer.render(r.scene, r.camera);
    if (moving) r.raf = requestAnimationFrame(ring3dFrame);
  }

  function ring3dAttach(host){
    var r = ring3d;
    var prev = r.canvas.parentNode;
    if (prev && prev !== host){
      prev.classList.remove('is3d');
      prev.removeChild(r.canvas);
    }
    var size = Math.round((host.clientWidth || 250) * 1.16);
    if (size !== r.size){
      r.size = size;
      r.renderer.setSize(size, size, false);
    }
    if (r.canvas.parentNode !== host) host.appendChild(r.canvas);
    host.classList.add('is3d');
  }

  function mountHeroRing3d(){
    var host = document.querySelector('.hero-ring');
    var r = ring3d;
    if (!host || !ring3dData || r.state === 'failed') return;
    if (r.state === 'ready'){ ring3dAttach(host); ring3dBuild(); return; }
    if (r.state === 'loading') return;
    r.state = 'loading';
    Promise.resolve()
      .then(function(){ if (typeof THREE === 'undefined') return loadScriptOnce(THREE_URL); })
      .then(function(){
        ring3dInit();
        r.state = 'ready';
        var h = document.querySelector('.hero-ring');
        if (h){
          if (!prefersReducedMotion()){ r.rot = -Math.PI * 1.1; r.idleAt = performance.now() - 2200; }  // a little spin-in the first time
          ring3dAttach(h); ring3dBuild();
        }
      })
      .catch(function(){ r.state = 'failed'; });
  }

  function weekStripHtml(viewKey){
    var today = todayKey();
    var start = weekStartKey(viewKey);
    var names = ['M','T','W','T','F','S','S'];
    var html = '<div class="week-strip" role="tablist" aria-label="Pick a day">';
    for (var i = 0; i < 7; i++){

  function renderLog(){
    var viewKey = logDayKey();
    var isToday = viewKey === todayKey();
    var dayMeals = mealsForDay(viewKey).sort(function(a,b){ return b.loggedAt - a.loggedAt; });
    var totals = totalsFor(dayMeals);
    var g = STORE.goals;
    var left = g.calories - totals.calories;
    var overCal = g.calories > 0 && totals.calories > g.calories;

    var dayNext = addDaysKey(viewKey, 1) <= todayKey();
    var chevL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
    var chevR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

    // Headline: greeting + "N kcal to go" (accent word), SaviorFit-style.
    var hr = new Date().getHours();
    var greet = isToday ? (hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ' 👋' : formatDateLabel(viewKey);
    var bigNum = (g.calories > 0 ? Math.abs(Math.round(left)) : Math.round(totals.calories)).toLocaleString();
    var headWord = g.calories > 0 ? (overCal ? 'over' : (isToday ? 'to go' : 'left')) : 'eaten';

    // Hero card: what's next, a tip worked out from what's left, big Add button.
    var heroLab, heroTitle, heroTip;
    if (!isToday){
      heroLab = formatDateLabel(viewKey).toUpperCase();

    } else if (g.calories > 0 && left <= 0){
      heroLab = 'TODAY';
      heroTitle = overCal ? 'Over goal' : 'Goal reached';
      heroTip = overCal ? 'You are ' + Math.abs(Math.round(left)).toLocaleString() + ' kcal over. A lighter next meal evens it out.' : 'You hit your calories for today. Nice.';
    } else {
      var nextCat = suggestCategoryForNow();

      heroTitle = CATEGORY_LABELS[nextCat] || 'Next meal';
      var tg = mealTarget(nextCat, 1);
      var got = totalsFor(dayMeals.filter(function(m){ return m.category === nextCat; }));
      var remK = tg.cal - got.calories, remP = tg.p - got.protein;
      if (g.calories <= 0) heroTip = 'Log what you eat to see how your day adds up.';
      else if (tg.cal <= 0) heroTip = 'No target set for this meal. Change it in My plan.';
      else if (remK <= 0) heroTip = 'You\u2019ve covered your ' + heroTitle.toLowerCase() + ' target.';
      else heroTip = 'Aim for about ' + Math.round(remK / 10) * 10 + ' kcal' + (remP > 0 ? ' and ' + Math.round(remP) + 'g protein' : '') + '.';
    }
    var mc = function(l, v, gl){ return '<span class="mc">' + l + ' <b>' + Math.round(v) + '/' + gl + '</b></span>'; };

    var html = installBannerHtml() +
      '<div class="log-top">' +
        '<div class="log-greet">' + greet + '</div>' +
        '<h2 class="log-headline"><span class="hl-num' + (overCal ? ' over' : '') + '">' + bigNum + '</span> kcal <em class="' + (overCal ? 'over' : '') + '">' + headWord + '</em></h2>' +
        '<div class="log-top-row">' +
          '<span class="log-chip">' + ROW_PLATE + dayMeals.length + (dayMeals.length === 1 ? ' meal ' : ' meals ') + (isToday ? 'today' : 'logged') + '</span>' +
          '<span class="log-top-nav">' +
            (!isToday ? '<button type="button" class="log-today-pill" data-action="set-log-day" data-day="' + todayKey() + '">Today</button>' : '') +
            '<button class="week-nav" data-action="log-day" data-dir="-1" aria-label="Previous day">' + chevL + '</button>' +
            '<button class="week-nav" data-action="log-day" data-dir="1" aria-label="Next day"' + (dayNext ? '' : ' disabled') + '>' + chevR + '</button>' +
          '</span>' +
        '</div>' +
      '</div>' +
      '<div class="log-hero-card' + (g.calories > 0 && left <= 0 && !overCal ? ' goal' : '') + '">' +
        '<div class="hero-ring">' + heroRingSvg(totals, g) + '</div>' +
        '<div class="lab">' + heroLab + '</div>' +
        '<h3>' + heroTitle + '</h3>' +
        '<p>' + heroTip + '</p>' +
        '<div class="hc-chips">' + mc('P', totals.protein, g.protein) + mc('C', totals.carbs, g.carbs) + mc('F', totals.fat, g.fat) + '</div>' +
        '<div class="hc-cta"><button type="button" class="hc-btn" data-action="set-tab" data-tab="scan">+ ADD MEAL</button>' +
          '<button type="button" class="hc-lnk" data-action="open-scanner" data-mode="photo">Scan food →</button></div>' +
      '</div>' +
      '<div class="log-tiles">' + waterTileHtml(viewKey) +
        '<button type="button" class="log-tile dash" data-action="open-food-search-overlay"><span class="lt-ic">' + STAR_SVG + '</span><b>FAVOURITES</b><small>Re-log in one tap</small></button>' +
      '</div>';

    if (dayMeals.length > 0){
      html += groupedMealsHtml(dayMeals);
    } else {
      var prev = null;
      STORE.meals.forEach(function(x){ if (dateKey(x.loggedAt) < viewKey && (!prev || x.loggedAt > prev.loggedAt)) prev = x; });
      var pl = prev ? formatDateLabel(dateKey(prev.loggedAt)) : '';
      html += '<div class="log-empty"><b>Nothing logged ' + (isToday ? 'yet' : 'this day') + '</b>' +
        '<span>Snap your plate or search a food.' + (isToday && prev ? '<br>' + (pl === 'Yesterday' ? 'Yesterday' : 'On ' + esc(pl)) + ' you had ' + esc(shortFoodName(tidyName(prev.name))) + ', ' + Math.round(prev.calories) + ' kcal.' : '') + '</span>' +
        (isToday && prev
          ? '<button type="button" data-action="copy-meal" data-id="' + prev.id + '">LOG IT AGAIN</button>'
          : '<button type="button" data-action="set-tab" data-tab="scan">ADD A MEAL</button>') +
      '</div>';
    }

    document.getElementById('view').innerHTML = html;
  }

  // Groups a list of meals into category sections (Breakfast, Morning
  // Snacks, Lunch, Evening Snacks, Dinner — in that fixed order) each
  // with its own header, calorie subtotal, and card of rows. Meals
  // logged before this feature existed have no category field, so
  // they land in a trailing "Other" bucket rather than being hidden
  // or crashing the grouping.
  function groupedMealsHtml(meals){
    var buckets = {};
    MEAL_CATEGORIES.forEach(function(c){ buckets[c.id] = []; });
    var other = [];
    meals.forEach(function(m){
      if (m.category && buckets[m.category]) buckets[m.category].push(m);
      else other.push(m);
    });

    var html = '';
    MEAL_CATEGORIES.forEach(function(c){
      if (buckets[c.id].length > 0) html += mealGroupHtml(c.id, c.label, buckets[c.id]);
    });
    if (other.length > 0) html += mealGroupHtml('other', 'Other', other);
    return html;
  }

  // One meal time on the Log tab: a header you can tap to fold the group
  // away (chevron, name, kcal — and a food count while it's folded), and
  // the rows underneath. Which groups are folded is remembered.
  function mealGroupHtml(id, label, group){
    var collapsed = !!(STORE.appSettings.collapsedMeals && STORE.appSettings.collapsedMeals[id]);
    var subtotal = totalsFor(group).calories;
    return '<button type="button" class="category-section-label cat-toggle" data-action="toggle-meal-group" data-category="' + id + '" aria-expanded="' + !collapsed + '">' +
        '<svg class="cat-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
        '<span class="cat-name">' + label + '</span>' +
        '<span class="cat-count">' + group.length + (group.length === 1 ? ' food' : ' foods') + '</span>' +
        '<span class="category-section-total">' + Math.round(subtotal).toLocaleString() + ' kcal</span>' +
      '</button>' +
      '<div class="acc meal-group' + (collapsed ? '' : ' open') + '"><div><div class="card flat">' + mealRowsHtml(group) + '</div></div></div>';
  }

  // Foods that came from one photo (an AI scan logs each food on the plate
  // separately but with the same photo) show the picture once, as a small
  // header with the plate's total, and the foods listed under it.
  function mealRowsHtml(group){
    var byPhoto = {};
    group.forEach(function(m){ if (m.photoId && mealPhoto(m)) (byPhoto[m.photoId] = byPhoto[m.photoId] || []).push(m); });
    var done = {};
    return group.map(function(m){
      var items = m.photoId ? byPhoto[m.photoId] : null;
      if (!items || items.length < 2) return mealRowHtml(m);

      done[m.photoId] = true;

        '<div class="pg-head"><img class="pg-thumb" src="' + mealPhoto(m) + '" alt="">' +
          '<div class="pg-meta"><b>Photo plate</b><span>' + items.length + ' foods \u00B7 ' + kcal + ' kcal</span></div></div>' +
        items.map(function(x){ return mealRowHtml(x, true); }).join('') +
      '</div>';
    }).join('');
  }

  function macroBarHtml(label, value, goal, cls, unit){
    unit = unit || 'g';
    var over = goal > 0 && value > goal;
    return '<div class="macro-bar-row">' +
      '<div class="macro-bar-label"><span>' + label + '</span><b>' + Math.round(value) + unit + ' / ' + goal + unit + '</b></div>' +
      '<div class="macro-bar-track"><div class="macro-bar-fill ' + cls + (over ? ' over' : '') + '" style="width:' + pct(value, goal) + '%"></div></div>' +
    '</div>';

  // One row of the Insights "Today" table — plain consumed/goal/%
  // numbers, no bar, since this panel is meant to read as a quick
  // reference table rather than a repeat of the Log tab's bars.
  // Ring circumference is fixed (r=32), so the stroke-dasharray is
  // constant and only stroke-dashoffset moves to reveal the arc.
  // Fill offset stays capped at 100% (a ring can't physically show
  // more than a full circle), but the center text uses the real,
  // uncapped percentage — and switches to the "over" red once past
  // 100% — so exceeding a goal never just looks identical to hitting
  // it exactly.


  // Bigger hero ring above the macro rings, same technique but its
  // own radius/stroke and the accent gold color rather than a macro
  // color, so calories reads as the headline stat.



  // A one-line read on today's macros — calls out whichever macro is
  // furthest behind its own goal, or says so if all three are
  // tracking evenly. Recomputed fresh from today's actual totals on
  // every render, so it always reflects the current numbers rather
  // than being a static message.
  // A calorie-% floor before making any balance claim — at very low
  // intake (e.g. one small snack) every macro's % of goal is near
  // zero, so the spread looks tiny and reads as "balanced" even
  // though nothing meaningful has been logged yet. Below the floor,
  // say so instead of drawing a conclusion from too little data.


  var ROW_PLATE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/></svg>';
  var ROW_CHEV = '<svg class="mr-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  // Packaged-food names often arrive in ALL CAPS ("SPICY CHICKEN PIZZA"); show those in normal capitals.
  function tidyName(name){
    var n = String(name == null ? '' : name);
    if (!/[A-Z]/.test(n) || n !== n.toUpperCase()) return n;
    return n.toLowerCase().replace(/(^|[\s\-\/(])('?)([a-z])/g, function(_, a, b, c){ return a + b + c.toUpperCase(); }).replace(/\b(Mc)([a-z])/g, function(_, a, b){ return a + b.toUpperCase(); });
  }

  // The small picture on a Log row when there is no photo: the dish's own
  // icon if it has one, otherwise the food's emoji.
  function mealBadgeHtml(name){
    var ico = foodIcon(name);
    if (ico) return '<span class="meal-badge ico" aria-hidden="true"><img src="data/icons/' + ico + '.webp" alt="" loading="lazy" decoding="async"></span>';
    return '<span class="meal-badge emo" aria-hidden="true">' + foodEmoji(name) + '</span>';
  }

  function mealRowHtml(m, inPhotoGroup){
    var photo = inPhotoGroup === true ? '' : mealPhoto(m);
    return '<div class="mr-w"><div class="mr-del">Delete</div>' +
      '<div class="meal-row" data-action="edit-meal" data-id="' + m.id + '">' +
      (photo ? '<img class="meal-thumb" src="' + photo + '" alt="">' : mealBadgeHtml(m.name)) +
      '<div class="meal-row-name">' +
        '<div class="meal-row-name-text" title="' + esc(m.name) + '">' + esc(tidyName(m.name)) + '</div>' +
        '<div class="meal-row-macros"><span class="mm-p">P' + (m.protein||0) + '</span> · <span class="mm-c">C' + (m.carbs||0) + '</span> · <span class="mm-f">F' + (m.fat||0) + '</span></div>' +
      '</div>' +
      '<div class="meal-row-cal">' + m.calories + '</div>' +
      (dateKey(m.loggedAt) !== todayKey()
        ? '<button class="meal-row-copy" data-action="copy-meal" data-id="' + m.id + '" aria-label="Copy ' + esc(m.name) + ' to today">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>' +
          '</button>'
        : '') +
      ROW_CHEV +

  /* ---- Serving picker ----
     Every picked food gets a choice of how to measure it: its own
     serving (when the data has one — Kalori's "1 plate (550g)", Open
     Food Facts' serving size), household measures where USDA gives them
     ("cup, chopped"), and always plain grams and ounces. You pick the
     unit and how many; the calories/macros below rescale. Switching
     units keeps the amount the same (1 serving of 380 g becomes 380 g,
     then 13.4 oz). A per-serving food with no known weight (some Kalori
     items) can only be measured in multiples of its serving. */
  var OZ_GRAMS = 28.3495;

  // Sanity-check a food's numbers before it is logged. Food databases
  // (Open Food Facts especially) have gaps and typos: a missing protein /
  // carbs / fat field counts as 0, which quietly understates your totals,
  // and calories that don't roughly match the macros (4/4/9 kcal per gram)
  // usually mean a mistyped label. Returns a short warning, or ''.
  function foodDataNote(nut){
    if (!nut) return '';
    var missing = [];
    if (nut['proteins_100g'] == null) missing.push('protein');
    if (nut['carbohydrates_100g'] == null) missing.push('carbs');
    if (nut['fat_100g'] == null) missing.push('fat');
    if (missing.length) return 'This food has no ' + missing.join(' / ') + ' data, so it counts as 0 — your totals may come out low.';
    var kcal = nut['energy-kcal_100g'] || 0;
    var fromMacros = 4 * nut['proteins_100g'] + 4 * nut['carbohydrates_100g'] + 9 * nut['fat_100g'];
    if (kcal >= 60 && fromMacros > 0 && Math.abs(kcal - fromMacros) / kcal > 0.35){
      return 'Its calories (' + Math.round(kcal) + ') and macros (about ' + Math.round(fromMacros) + ' kcal worth) don\u2019t agree — worth checking the label.';
    }
    return '';
  }

  // "1 plate (550g)" / "(38 g)" / "250 g" -> grams, or null
  function parseServingGrams(text){
    var m = /\(\s*(\d+(?:\.\d+)?)\s*g(?:ram|rams|m)?\b/i.exec(text || '') ||
            /^\s*(\d+(?:\.\d+)?)\s*g(?:ram|rams|m)?\s*$/i.exec(text || '');
    return m ? parseFloat(m[1]) : null;
  }

  function servingUnitsFor(f){
    var units = [];
    var label = f.servingLabel || f.servingSizeText || '';
    if (f.servingGrams > 0){
      units.push({ id: 'serving', label: 'Serving' + (label ? ' · ' + label : ''), grams: f.servingGrams, step: 0.5, defaultQty: 1 });
    } else if (f.whole){
      units.push({ id: 'serving', label: 'Serving' + (label ? ' · ' + label : ''), grams: null, step: 0.5, defaultQty: 1 });
    }
    (f.measures || []).slice(0, 4).forEach(function(m, i){
      units.push({ id: 'm' + i, label: m.label + ' · ' + Math.round(m.grams) + ' g', grams: m.grams, step: 0.5, defaultQty: 1 });
    });
    if (f.per100g){
      units.push({ id: 'g', label: 'g', grams: 1, step: 10, defaultQty: 100 });
      units.push({ id: 'oz', label: 'oz', grams: OZ_GRAMS, step: 0.5, defaultQty: 1 });
    }
    return units;
  }

  function currentServingUnit(){
    var f = ui.selectedFood;
    if (!f) return null;
    var units = servingUnitsFor(f);
    for (var i = 0; i < units.length; i++) if (units[i].id === (ui.serving && ui.serving.unitId)) return units[i];
    return units[0];
  }

  // Start on the food's own serving if it has one, otherwise 100 g.
  function initServing(){
    var units = servingUnitsFor(ui.selectedFood);
    var u = units[0];
    if (u.id !== 'serving'){
      for (var i = 0; i < units.length; i++) if (units[i].id === 'g') u = units[i];
    }
    ui.serving = { unitId: u.id, qty: u.defaultQty };
    var ls = lastServAll()[lastServKey(ui.selectedFood.name)];
    if (ls && ls.q > 0 && isFinite(ls.q)){
      for (var j = 0; j < units.length; j++) if (units[j].id === ls.u){ ui.serving = { unitId: ls.u, qty: ls.q }; break; }
    }
  }

  function roundQty(n, unit){
    return unit && unit.id === 'g' ? Math.round(n) : Math.round(n * 100) / 100;
  }

  function servingEqText(){
    var u = currentServingUnit();
    if (!u || u.grams == null) return '';
    var grams = (ui.serving.qty || 0) * u.grams;
    if (u.id === 'g') return '= ' + (Math.round(grams / OZ_GRAMS * 10) / 10) + ' oz';
    return '= ' + (Math.round(grams * 10) / 10) + ' g';
  }

  function selectedFoodBannerHtml(){
    var f = ui.selectedFood;
    var units = servingUnitsFor(f);
    var cur = currentServingUnit();
    var from = f.from === 'Kalori' ? 'From Kalori' : (f.from === 'mine' ? 'From My Foods' : (f.from === 'saved' ? 'From your saved foods' : (f.from === 'builtin' ? 'Built-in food (estimate)' : 'From search')));
    var chips = units.length > 1
      ? '<div class="serving-label">Serving size</div><div class="serving-chips" role="group" aria-label="Serving size">' +
          units.map(function(u){
            return '<button type="button" class="serving-chip' + (u.id === cur.id ? ' active' : '') + '" data-action="set-serving-unit" data-unit="' + u.id + '">' + esc(u.label) + '</button>';
          }).join('') +
        '</div>'
      : '';
    return '<div class="selected-food-banner">' +
      '<div class="selected-food-banner-row">' +
        '<span class="banner-food">' + foodThumbHtml({ product_name: f.name, _image: f.image }, true) +
          '<span>' + from + ': <b>' + esc(f.name) + '</b>' + (f.brand ? ' (' + esc(f.brand) + ')' : '') + '</span></span>' +
      '</div>' +
      chips +
      (f.dataNote ? '<div class="food-note">\u26a0 ' + esc(f.dataNote) + '</div>' : '') +
      '<div class="serving-qty">' +
        '<span class="serving-label">Amount</span>' +
        '<button type="button" class="qty-btn" data-action="qty-step" data-dir="-1" aria-label="Less">&minus;</button>' +
        '<input type="number" id="servingQty" inputmode="decimal" step="any" min="0" value="' + roundQty(ui.serving.qty, cur) + '" aria-label="Amount">' +
        '<button type="button" class="qty-btn" data-action="qty-step" data-dir="1" aria-label="More">+</button>' +
        '<span class="serving-eq" id="servingEq">' + servingEqText() + '</span>' +
      '</div>' +
    '</div>';
  }

  // Add Meal is a bottom-sheet overlay rather than an inline card —

  function setAccordion(rowId, accId, open){

  function renderCategoryPicker(){

      return '<button type="button" class="category-pill' + (c.id === ui.selectedCategory ? ' active' : '') + '" data-action="select-meal-category" data-category="' + c.id + '">' + c.label + '</button>';
    }).join('');

  // Just the banner portion — used on its own by the unit-mode toggle
  // so switching grams/servings doesn't also re-run openAddMealOverlay()'s
  // category auto-suggestion (which would discard a category the person
  // already picked manually).
  function refreshSelectedFoodBanner(){
    var bodyEl = document.getElementById('addMealBody');
    var oldChips = bodyEl.querySelector('.serving-chips');
    var scrolled = oldChips ? oldChips.scrollLeft : 0;
    bodyEl.querySelectorAll('.selected-food-banner').forEach(function(el){ el.remove(); });
    if (ui.selectedFood){
      bodyEl.insertAdjacentHTML('afterbegin', selectedFoodBannerHtml());

  /* ---- bottom-sheet helpers, shared by Add Meal and the Scanned-meal sheet ---- */
  function showSheetOverlay(overlay){
    clearTimeout(overlay._closeTimer);
    var sheet = overlay.querySelector('.add-meal-sheet');
    sheet.style.transform = '';

  // drag the little handle at the top of a sheet down to dismiss it
  function attachSheetDrag(grab, closeFn){
    var sheet = grab.parentNode;
    var startY = null;
    grab.addEventListener('pointerdown', function(e){
      startY = e.clientY;
      sheet.classList.add('dragging');
      if (grab.setPointerCapture){ try { grab.setPointerCapture(e.pointerId); } catch (err){} }
    });
    grab.addEventListener('pointermove', function(e){
      if (startY === null) return;
      sheet.style.transform = 'translateY(' + Math.max(0, e.clientY - startY) + 'px)';
    });
    function endDrag(e){
      if (startY === null) return;
      var dy = Math.max(0, e.clientY - startY);
      startY = null;
      sheet.classList.remove('dragging');
      if (dy > 90) closeFn(); else sheet.style.transform = '';
    }
    grab.addEventListener('pointerup', endDrag);
    grab.addEventListener('pointercancel', endDrag);
  }

  // While the on-screen keyboard is up, tell the CSS how much of the
  // screen it covers (--kb) and how much is left (--vvh), so a sheet
  // with fields in it lifts above the keyboard instead of hiding behind it.
  if (window.visualViewport){
    (function(){
      var vv = window.visualViewport;
      function update(){
        var kb = Math.round(window.innerHeight - vv.height - vv.offsetTop);
        var root = document.documentElement.style;
        if (kb > 80){ root.setProperty('--kb', kb + 'px'); root.setProperty('--vvh', Math.round(vv.height) + 'px'); }
        else { root.removeProperty('--kb'); root.removeProperty('--vvh'); }
      }
      vv.addEventListener('resize', update);
      vv.addEventListener('scroll', update);
    })();
  }

  /* ---- Editing a logged meal, and choosing the day ---- */
  var toastTimer = 0;
  function showToast(message, actionLabel, onAction){
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.toggle('has-action', !!actionLabel);
    if (actionLabel){
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'toast-action'; btn.textContent = actionLabel;
      btn.addEventListener('click', function(){
        el.classList.remove('show'); clearTimeout(toastTimer);
        if (onAction) onAction();
      });
      el.appendChild(btn);
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, actionLabel ? 6000 : 2600);

  // The Day row's one-line summary ("Today", "Yesterday", "Mon, Mar 9").

    document.querySelectorAll('.day-chip').forEach(function(chip){

  // The timestamp a meal should get for the picked day: that calendar day
  // at `timeOfDay`'s clock time (so entries keep a sensible order), never
  // in the future. Returns `keep` unchanged when the day didn't change.
  function stampForDay(dayKey, timeOfDay, keep){
    var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dayKey || '');
    if (!parts) return keep || Date.now();
    if (keep && dateKey(keep) === dayKey) return keep;
    var t = new Date(timeOfDay);
    var stamp = new Date(+parts[1], +parts[2] - 1, +parts[3], t.getHours(), t.getMinutes(), t.getSeconds(), 0).getTime();
    return Math.min(stamp, Date.now());
  }

  function searchFoodDebounced(query){
    clearTimeout(ui.searchDebounce);
    if (!query || query.trim().length < 2){
      if (searchAbort) searchAbort.abort(); // drop any search still in flight
      searchRequestId++;
      renderFoodHome();
      return;
    }
    // Foods you've saved before are local, so if nothing's on screen yet
    // show those on the very first keystroke rather than waiting out the
    // debounce; the online sources follow (see runFoodSearch).
    var resultsNow = document.getElementById('foodSearchResults');
    if (resultsNow && !resultsNow.querySelector('.food-suggest-item')){
      var savedNow = searchSavedFoods(query);
      if (savedNow.length > 0){
        foodSearch = { id: searchRequestId, query: query.trim(), products: savedNow, pending: 1, stale: false };
        renderFoodSearchResults();
      }
    }
    // Shorter debounce than you might expect for a network call — paired
    // with not blanking the list below, this is the closest a remote
    // search can feel to SaviorFit Logger's instant local exercise search.
    ui.searchDebounce = setTimeout(function(){ runFoodSearch(query.trim()); }, 180);
  }

  var searchRequestId = 0; // guards against a slow older request overwriting a newer one's results
  // Food lookups (USDA search and barcode) go through your own Cloudflare Worker,
  // which holds the key privately. No API keys live in this file.
  var FOODS_PROXY_URL = 'https://saviorfuel-ai.xavierchua10.workers.dev';

  // (Kalori search was removed — its key leaked. Foods saved from it earlier still show.)


  // Normalizes a USDA FoodData Central food into the same shape as an
  // Open Food Facts product, so the rest of the search/pick pipeline
  // (pickFoodResult, applySelectedFoodToForm) doesn't need to know or
  // care which source a result came from.
  function usdaToProductShape(food){
    var n = {};
    var atwaterKcal = null; // Foundation Foods often report energy only via Atwater factors
    (food.foodNutrients || []).forEach(function(fn){
      if (fn.unitName === 'KCAL' && /^Energy \(Atwater/.test(fn.nutrientName || '')){ if (atwaterKcal == null) atwaterKcal = fn.value; }
      else if (fn.nutrientName === 'Energy' && fn.unitName === 'KCAL') n['energy-kcal_100g'] = fn.value;
      else if (fn.nutrientName === 'Protein') n['proteins_100g'] = fn.value;
      else if (fn.nutrientName === 'Carbohydrate, by difference') n['carbohydrates_100g'] = fn.value;
      else if (fn.nutrientName === 'Total lipid (fat)') n['fat_100g'] = fn.value;
      else if (fn.nutrientName === 'Fiber, total dietary') n['fiber_100g'] = fn.value;
      else if (fn.nutrientName === 'Sugars, total including NLEA' || fn.nutrientName === 'Total Sugars' || fn.nutrientName === 'Sugars, Total') n['sugars_100g'] = fn.value;
      // USDA reports sodium in mg (unitName 'MG') already, unlike OFF
      // which reports it in g like the other nutrients — kept under
      // its own key so the mg-vs-g unit mismatch can't get mixed up
      // downstream (see pickFoodResult / onBarcodeDetected).
      else if (fn.nutrientName === 'Sodium, Na') n['sodium_100g_mg'] = fn.value;
    });
    if (n['energy-kcal_100g'] == null && atwaterKcal != null) n['energy-kcal_100g'] = atwaterKcal;
    // USDA's bulk/commodity entries carry long bureaucratic annotations
    // like "(Includes foods for USDA's Food Distribution Program)" —
    // meaningless noise for a personal food log, so strip any
    // parenthetical that mentions USDA rather than log it verbatim.
    var name = (food.description || '').replace(/\s*\([^)]*USDA[^)]*\)/gi, '').trim();
    // Household measures ("1 cup, chopped" = 160 g) when USDA includes
    // them, so the serving picker can offer cups etc. (not confirmed for
    // every item — foods without them just get grams / ounces).
    var measures = [];
    (food.foodMeasures || []).forEach(function(m){
      var g = Number(m.gramWeight);
      var text = String(m.disseminationText || '').replace(/\s+/g, ' ').trim();
      if (!(g > 0) || !text || /quantity not specified/i.test(text)) return;
      var label = text.replace(/^1\s+/, ''); // "1 cup" -> "cup" (the amount field supplies the number)
      if (!measures.some(function(x){ return x.label === label; })) measures.push({ label: label, grams: g });
    });
    return { product_name: name, brands: food.brandOwner || '', nutriments: n, _source: 'usda', _measures: measures.slice(0, 4) };
  }

  // Foundation + SR Legacy are USDA's generic/whole-food datasets —
  // exactly the "plain chicken breast," "egg" category Open Food Facts
  // is weakest at, since OFF mostly covers branded/packaged items.
  function fetchUSDA(query, signal){
    var url = FOODS_PROXY_URL + '/usda?q=' + encodeURIComponent(query);
    return fetch(url, { signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data){
        return (data.foods || [])
          .map(usdaToProductShape)
          .filter(function(p){ return p.product_name && p.nutriments['energy-kcal_100g'] != null; });
      });
  }

  // `fields` trims the response to what the app actually uses — Open Food
  // Facts products are huge (ingredients, images, dozens of tags), and
  // that payload is a big part of why this source is the slow one.
  function fetchOpenFoodFacts(query, signal){
    var url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
      encodeURIComponent(query) + '&search_simple=1&action=process&json=1&page_size=10' +
      '&fields=product_name,brands,nutriments,serving_quantity,serving_size,image_front_thumb_url,image_thumb_url,image_small_url';
    return fetch(url, { signal: signal })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function(data){
        return (data.products || [])
          .map(function(p){
            p._source = 'off';
            p._image = p.image_front_thumb_url || p.image_thumb_url || p.image_small_url || '';
            return p;
          })
          .filter(function(p){ return p.product_name && p.nutriments && p.nutriments['energy-kcal_100g'] != null; });
      });
  }

  /* ---- Food search: fast and progressive ----
     Kalori, USDA and Open Food Facts are asked in parallel and their
     results appear as each one answers, instead of waiting for the
     slowest (Open Food Facts can take many seconds). Saved foods show
     instantly; an old search is cancelled as soon as you keep typing;
     each source gets a timeout; and a repeated query is answered from
     a short-lived memory cache. Results already on screen never move —
     later sources only add to the bottom — so a tap always lands on
     the row you aimed at. */
  var FOOD_SOURCE_TIMEOUT_MS = 7000;
  var FOOD_CACHE_TTL_MS = 10 * 60 * 1000;
  var foodSearchCache = {};   // 'source|query' -> { t, list }
  var searchAbort = null;
  var foodSearch = { id: 0, query: '', products: [], pending: 0, stale: false };

  function pruneFoodCache(){
    var keys = Object.keys(foodSearchCache);
    if (keys.length <= 80) return;
    keys.sort(function(a, b){ return foodSearchCache[a].t - foodSearchCache[b].t; });
    keys.slice(0, keys.length - 80).forEach(function(k){ delete foodSearchCache[k]; });
  }

  // One source, with cache + timeout + cancel. Never rejects: a source
  // that fails just contributes nothing (and isn't cached, so it gets
  // another chance next time).
  function searchFoodSource(name, query, fetcher, signal){
    var key = name + '|' + query.toLowerCase();
    var hit = foodSearchCache[key];
    if (hit && Date.now() - hit.t < FOOD_CACHE_TTL_MS) return Promise.resolve(hit.list);
    var ctrl = new AbortController();
    var onAbort = function(){ ctrl.abort(); };
    signal.addEventListener('abort', onAbort);
    var timer = setTimeout(function(){ ctrl.abort(); }, FOOD_SOURCE_TIMEOUT_MS);
    var done = function(){ clearTimeout(timer); signal.removeEventListener('abort', onAbort); };
    return fetcher(query, ctrl.signal)
      .then(function(list){
        done();
        foodSearchCache[key] = { t: Date.now(), list: list };
        pruneFoodCache();
        return list;
      }, function(err){
        done();
        if (!(err && err.name === 'AbortError')) console.error('SaviorFuel: ' + name + ' search failed —', err);
        return [];
      });
  }

  function foodIcon(name){
    var n = String(name || '');
    for (var i = 0; i < FOOD_ICON_RULES.length; i++){
      if (FOOD_ICON_RULES[i][0].test(n)) return FOOD_ICON_RULES[i][1];
    }
    return '';
  }
  var FOOD_EMOJI_DEFAULT = '\uD83C\uDF7D\uFE0F'; // plate with cutlery

  function foodEmoji(name){
    var n = String(name || '');
    for (var i = 0; i < FOOD_EMOJI_RULES.length; i++){
      if (FOOD_EMOJI_RULES[i][0].test(n)) return FOOD_EMOJI_RULES[i][1];
    }
    return FOOD_EMOJI_DEFAULT;
  }

  // Only ever put a plain https address in an <img src>; anything else
  // (javascript:, data:, odd characters) is ignored and the emoji shows.
  function safeImageUrl(u){
    if (typeof u !== 'string') return '';
    u = u.trim();
    if (/^http:\/\//i.test(u)) u = 'https://' + u.slice(7);
    return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : '';
  }

  function foodThumbHtml(p, tappable){
    var emoji = foodEmoji(p.product_name);

    if (img && tappable){
      // Photo tile that opens the big viewer (see openFoodPhoto)
      return '<button type="button" class="food-thumb food-thumb-btn" data-action="open-food-photo" data-emoji="' + emoji + '" aria-label="View photo of ' + esc(p.product_name) + '"><img src="' + esc(img) + '" alt="" decoding="async" referrerpolicy="no-referrer"></button>';
    }
    if (img){
      return '<span class="food-thumb" data-emoji="' + emoji + '"><img src="' + esc(img) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"></span>';
    }
    var ico = foodIcon(p.product_name);
    if (ico) return '<span class="food-thumb has-ico"><img class="food-ico" src="data/icons/' + ico + '.webp" alt="" loading="lazy" decoding="async"></span>';
    return '<span class="food-thumb">' + emoji + '</span>';
  }

  // <img> load errors don't bubble, so listen in the capture phase once
  // on the results list and swap a broken photo for its emoji.
  // Big photo viewer. Open Food Facts stores each picture at several sizes
  // (…100.jpg, …200.jpg, …400.jpg, full), so the 100/200px thumbnail's
  // address is turned into the 400px one for the viewer; if that size
  // isn't there, the thumbnail itself is shown instead.
  function openFoodPhoto(){
    var f = ui.selectedFood;
    var thumb = f ? safeImageUrl(f.image) : '';
    if (!thumb) return;
    var big = thumb.replace(/\.(100|200)\.(jpe?g|png|webp)(\?.*)?$/i, '.400.$2$3');
    var img = document.getElementById('photoOverlayImg');
    img.setAttribute('data-thumb', thumb);
    img.removeAttribute('data-tried-thumb');
    img.alt = f.name || 'Food photo';
    img.src = big;
    document.getElementById('photoOverlayName').textContent = f.name + (f.brand ? ' \u00b7 ' + f.brand : '');
    document.getElementById('photoOverlay').classList.remove('hidden');
  }

  function closeFoodPhoto(){
    document.getElementById('photoOverlay').classList.add('hidden');
    document.getElementById('photoOverlayImg').removeAttribute('src'); // stop any download in progress
  }

  document.getElementById('photoOverlayImg').addEventListener('error', function(e){
    var img = e.target;
    if (!img.getAttribute('src')) return; // we just cleared it on close
    var thumb = img.getAttribute('data-thumb');
    if (thumb && !img.getAttribute('data-tried-thumb') && img.getAttribute('src') !== thumb){
      img.setAttribute('data-tried-thumb', '1');
      img.src = thumb; // the larger size isn't available — show the small one
    } else {
      document.getElementById('photoOverlayName').textContent = 'Couldn\u2019t load this photo.';
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !document.getElementById('photoOverlay').classList.contains('hidden')) closeFoodPhoto();
  });

  function foodThumbErrorHandler(e){
    var img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    var box = img.parentNode;
    if (box && box.classList && box.classList.contains('food-thumb')){
      box.textContent = box.getAttribute('data-emoji') || FOOD_EMOJI_DEFAULT;
      box.removeAttribute('data-action'); // nothing to open any more
      box.classList.remove('food-thumb-btn');
    }
  }

  var EDIT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>';

  function openFoodSheet(mode, id, opts){
