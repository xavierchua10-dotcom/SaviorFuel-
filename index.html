<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>SaviorFuel — Food Tracker</title>
<meta name="description" content="Log your meals and macros. A free food tracker by Savior, built to pair with SaviorFit Logger.">
<link rel="icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SaviorFuel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN SYSTEM — copied 1:1 from SaviorFit Logger (IronLedger
     repo) so SaviorFuel matches it visually out of the box. Keep
     these tokens in sync by hand if the Logger's palette ever
     changes; there's no shared stylesheet between the two repos.
     ========================================================= */
  :root{
    --bg:#14161a;
    --panel:#1c1f24;
    --panel-2:#242830;
    --panel-3:#2a2f38;
    --line:#2e333b;
    --text:#e9e6df;
    --text-dim:#8b9098;
    --text-faint:#82878f;
    --accent:#f2b134;
    --accent-dim:#7a6224;
    --accent-rgb:242,177,52;
    --accent-2:#c1443c;
    --accent-2-dim:#4a2321;
    --success:#5fb86a;
    --success-dim:#233821;
    --radius-xs:6px;
    --radius-sm:8px;
    --radius:10px;
    --radius-md:12px;
    --radius-lg:14px;
    --radius-xl:20px;
    --radius-pill:999px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  button{font-family:inherit;}
  button:active, [data-action]:active{
    filter:brightness(1.2);
    transition:filter 70ms ease-out;
  }
  input,select{font-family:inherit;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  .display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  #app{
    max-width:480px;
    margin:0 auto;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }

  /* ---------- Topbar (same structure/classes as SaviorFit Logger) ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(16,18,21,0.72);
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .topbar h1 span{color:var(--accent);}

  /* ---------- Main content area ---------- */
  main#view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px 16px calc(90px + var(--safe-bottom));
  }

  /* Fade+shift tab transition — same treatment as SaviorFit Logger's
     switchTabWithFade, so switching tabs feels identical across both
     apps. See switchTab() below. */
  #view.subtab-fade-out{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 140ms ease, transform 140ms ease;
  }
  #view.subtab-fade-in{
    opacity:1;
    transform:translateY(0);
    transition:opacity 160ms ease, transform 160ms ease;
  }

  /* ---------- Bottom tab bar (same classes as SaviorFit Logger) ---------- */
  .tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
  }
  .tabbar button{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    padding:10px 4px 8px;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--accent);}
  .tab-glyph svg{width:22px;height:22px;}

  /* ---------- Empty state (same pattern as SaviorFit Logger) ---------- */
  .empty.tab-empty-state{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:var(--text-dim);
    padding:60px 24px;
    gap:14px;
  }
  .empty .glyph{
    width:48px;height:48px;
    color:var(--text-faint);
  }
  .empty p{margin:0;font-size:14px;line-height:1.5;}

  /* ---------- Cards (same pattern as SaviorFit Logger) ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:14px 14px 12px;
    margin-bottom:14px;
  }

  /* ---------- Buttons (same pattern as SaviorFit Logger) ---------- */
  .btn-primary{
    display:block;
    width:100%;
    background:var(--accent);
    color:#1c1500;
    border:none;
    border-radius:var(--radius-xl);
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px;
    cursor:pointer;
  }

  /* ---------- Macro summary + bars ---------- */
  .macro-summary-card{margin-bottom:16px;}
  .macro-cal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .macro-cal-row .num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--text);}
  .macro-cal-row .num span{font-size:14px;font-weight:500;color:var(--text-faint);}
  .macro-bar-row{margin-bottom:10px;}
  .macro-bar-row:last-child{margin-bottom:0;}
  .macro-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:4px;}
  .macro-bar-label b{color:var(--text);}
  .macro-bar-track{height:6px;border-radius:var(--radius-pill);background:var(--panel-3);overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);}
  .macro-bar-fill.protein{background:var(--success);}
  .macro-bar-fill.carbs{background:#5fa8d6;}
  .macro-bar-fill.fat{background:var(--accent-2);}

  /* ---------- Quick-add meal form ---------- */
  .add-meal-card .field-row{display:flex;gap:8px;margin-bottom:8px;}
  .add-meal-card input{
    flex:1;
    min-width:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    color:var(--text);
    font-size:14px;
    padding:10px 12px;
  }
  .add-meal-card input:focus{outline:none;border-color:var(--accent);}
  .add-meal-card input::placeholder{color:var(--text-faint);}

  /* ---------- Meal list rows ---------- */
  .meal-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .meal-row:last-child{border-bottom:none;}
  .meal-row-name{font-size:14px;color:var(--text);flex:1;min-width:0;}
  .meal-row-macros{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-faint);white-space:nowrap;}
  .meal-row-cal{font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);white-space:nowrap;}
  .meal-row-del{
    background:none;border:none;color:var(--text-faint);
    font-size:18px;line-height:1;padding:4px 6px;cursor:pointer;
  }

  /* ---------- History day groups ---------- */
  .history-day-card .history-day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .history-day-head .date{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:var(--text);}
  .history-day-head .total{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);}

  /* ---------- Insights bars ---------- */
  .insight-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .insight-bar-day{width:34px;font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .insight-bar-track{flex:1;height:16px;background:var(--panel-3);border-radius:var(--radius-xs);overflow:hidden;}
  .insight-bar-fill{height:100%;background:var(--accent);border-radius:var(--radius-xs);}
  .insight-bar-val{width:48px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);flex-shrink:0;}

  /* ---------- Settings ---------- */
  .settings-group{margin-bottom:18px;}
  .settings-group h3{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:0.05em;text-transform:uppercase;color:var(--text-faint);
    margin:0 0 10px;
  }
  .settings-goal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .settings-goal-row label{font-size:13px;color:var(--text-dim);}
  .settings-goal-row input{
    width:80px;text-align:right;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:7px 8px;
  }
  .settings-goal-row input:focus{outline:none;border-color:var(--accent);}
  .btn-danger{
    display:block;width:100%;background:none;border:1px solid var(--accent-2);
    color:var(--accent-2);border-radius:var(--radius-xl);font-family:'Oswald',sans-serif;
    font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    padding:12px;cursor:pointer;
  }

  .hidden{display:none !important;}

  .boot-loading{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  .boot-loading-mark{
    font-family:'Oswald',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
  }
  .boot-loading-mark span{color:var(--accent);}
</style>
</head>
<body>

<div id="bootLoading" class="boot-loading"><div class="boot-loading-mark">SAVIOR<span>FUEL</span></div></div>

<div id="app" class="hidden">
  <header class="topbar">
    <h1>SAVIOR<span>FUEL</span></h1>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-action="set-tab" data-tab="log" class="active">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="4" width="4" height="16" rx="1.3"/><rect x="19" y="4" width="4" height="16" rx="1.3"/><rect x="5" y="10.4" width="14" height="3.2" rx="1"/></svg></span>
      Log
    </button>
    <button data-action="set-tab" data-tab="history">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="16" width="12" height="3" rx="1"/></svg></span>
      History
    </button>
    <button data-action="set-tab" data-tab="insights">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></span>
      Insights
    </button>
    <button data-action="set-tab" data-tab="settings">
      <span class="tab-glyph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></span>
      Settings
    </button>
  </nav>
</div>

<script>
  // =========================================================
  // SAVIORFUEL — local-state working version
  // Visual shell copied from SaviorFit Logger. Data layer here
  // is 100% local (in-memory + localStorage) — no Firebase, no
  // auth, no sync across devices yet. That's intentional: this
  // is meant to prove out the actual product before wiring up a
  // backend. Data model (meal shape, settings shape) is written
  // to already look like what would eventually go in Firestore,
  // so swapping in real persistence later is mostly mechanical.
  //
  // Storage key: everything lives under one localStorage key,
  // 'saviorfuel_local_v1'. Bump the version suffix if the shape
  // of STORE ever changes in a way that would break old data.
  // =========================================================

  var STORAGE_KEY = 'saviorfuel_local_v1';

  var DEFAULT_GOALS = { calories: 2000, protein: 150, carbs: 200, fat: 65 };

  var STORE = loadStore();
  var state = { tab: 'log' };
  var ui = { historyOpenDay: null };

  function loadStore(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { meals: [], goals: Object.assign({}, DEFAULT_GOALS) };
      var parsed = JSON.parse(raw);
      if (!parsed.goals) parsed.goals = Object.assign({}, DEFAULT_GOALS);
      if (!parsed.meals) parsed.meals = [];
      return parsed;
    } catch (e){
      console.error('SaviorFuel: failed to load local store, starting fresh —', e);
      return { meals: [], goals: Object.assign({}, DEFAULT_GOALS) };
    }
  }

  function saveStore(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE));
    } catch (e){
      console.error('SaviorFuel: failed to save local store —', e);
    }
  }

  function esc(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function dateKey(ts){
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayKey(){ return dateKey(Date.now()); }

  function formatDateLabel(key){
    var today = todayKey();
    var yesterday = dateKey(Date.now() - 86400000);
    if (key === today) return 'Today';
    if (key === yesterday) return 'Yesterday';
    var d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function mealsForDay(key){
    return STORE.meals.filter(function(m){ return dateKey(m.loggedAt) === key; });
  }

  function totalsFor(meals){
    var t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    meals.forEach(function(m){
      t.calories += m.calories || 0;
      t.protein += m.protein || 0;
      t.carbs += m.carbs || 0;
      t.fat += m.fat || 0;
    });
    return t;
  }

  function pct(value, goal){
    if (!goal) return 0;
    return Math.max(0, Math.min(100, Math.round((value / goal) * 100)));
  }

  /* =========================================================
     RENDER — LOG TAB
     ========================================================= */
  function renderLog(){
    var todayMeals = mealsForDay(todayKey()).sort(function(a,b){ return b.loggedAt - a.loggedAt; });
    var totals = totalsFor(todayMeals);
    var g = STORE.goals;

    var html = '<div class="card macro-summary-card">' +
      '<div class="macro-cal-row"><div class="num">' + totals.calories + ' <span>/ ' + g.calories + ' kcal</span></div></div>' +
      macroBarHtml('Protein', totals.protein, g.protein, 'protein') +
      macroBarHtml('Carbs', totals.carbs, g.carbs, 'carbs') +
      macroBarHtml('Fat', totals.fat, g.fat, 'fat') +
    '</div>';

    html += '<div class="card add-meal-card">' +
      '<div class="field-row"><input type="text" id="mealName" placeholder="Meal name"></div>' +
      '<div class="field-row">' +
        '<input type="number" inputmode="numeric" id="mealCal" placeholder="kcal">' +
        '<input type="number" inputmode="numeric" id="mealProtein" placeholder="protein g">' +
      '</div>' +
      '<div class="field-row">' +
        '<input type="number" inputmode="numeric" id="mealCarbs" placeholder="carbs g">' +
        '<input type="number" inputmode="numeric" id="mealFat" placeholder="fat g">' +
      '</div>' +
      '<button class="btn-primary" data-action="add-meal">+ Add Meal</button>' +
    '</div>';

    if (todayMeals.length === 0){
      html += '<div class="empty tab-empty-state"><div class="glyph">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
        '</svg></div><p>Nothing logged yet today.<br>Add your first meal above.</p></div>';
    } else {
      html += '<div class="card">' + todayMeals.map(mealRowHtml).join('') + '</div>';
    }

    document.getElementById('view').innerHTML = html;
  }

  function macroBarHtml(label, value, goal, cls){
    return '<div class="macro-bar-row">' +
      '<div class="macro-bar-label"><span>' + label + '</span><b>' + Math.round(value) + 'g / ' + goal + 'g</b></div>' +
      '<div class="macro-bar-track"><div class="macro-bar-fill ' + cls + '" style="width:' + pct(value, goal) + '%"></div></div>' +
    '</div>';
  }

  function mealRowHtml(m){
    return '<div class="meal-row">' +
      '<div class="meal-row-name">' + esc(m.name) +
        '<div class="meal-row-macros">P' + (m.protein||0) + ' · C' + (m.carbs||0) + ' · F' + (m.fat||0) + '</div>' +
      '</div>' +
      '<div class="meal-row-cal">' + m.calories + '</div>' +
      '<button class="meal-row-del" data-action="delete-meal" data-id="' + m.id + '" aria-label="Delete">&times;</button>' +
    '</div>';
  }

  function addMealFromForm(){
    var name = document.getElementById('mealName').value.trim();
    var cal = parseInt(document.getElementById('mealCal').value, 10) || 0;
    var protein = parseInt(document.getElementById('mealProtein').value, 10) || 0;
    var carbs = parseInt(document.getElementById('mealCarbs').value, 10) || 0;
    var fat = parseInt(document.getElementById('mealFat').value, 10) || 0;

    if (!name || cal <= 0) return; // require at least a name + calories

    STORE.meals.push({
      id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      name: name,
      calories: cal,
      protein: protein,
      carbs: carbs,
      fat: fat,
      loggedAt: Date.now()
    });
    saveStore();
    renderApp();
  }

  function deleteMeal(id){
    STORE.meals = STORE.meals.filter(function(m){ return m.id !== id; });
    saveStore();
    renderApp();
  }

  /* =========================================================
     RENDER — HISTORY TAB
     ========================================================= */
  function renderHistory(){
    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>No meal history yet.<br>Logged meals will show up here.</p></div>';
      return;
    }

    var byDay = {};
    STORE.meals.forEach(function(m){
      var key = dateKey(m.loggedAt);
      if (!byDay[key]) byDay[key] = [];
      byDay[key].push(m);
    });
    var days = Object.keys(byDay).sort().reverse();

    var html = days.map(function(key){
      var meals = byDay[key].sort(function(a,b){ return b.loggedAt - a.loggedAt; });
      var totals = totalsFor(meals);
      var isOpen = ui.historyOpenDay === key;
      var inner = isOpen ? meals.map(mealRowHtml).join('') : '';
      return '<div class="card history-day-card">' +
        '<div class="history-day-head" data-action="toggle-history-day" data-day="' + key + '" style="cursor:pointer;">' +
          '<span class="date">' + formatDateLabel(key) + '</span>' +
          '<span class="total">' + totals.calories + ' kcal</span>' +
        '</div>' +
        inner +
      '</div>';
    }).join('');

    document.getElementById('view').innerHTML = html;
  }

  /* =========================================================
     RENDER — INSIGHTS TAB
     ========================================================= */
  function renderInsights(){
    var days = [];
    for (var i = 6; i >= 0; i--){
      days.push(dateKey(Date.now() - i * 86400000));
    }
    var dayTotals = days.map(function(key){
      return { key: key, total: totalsFor(mealsForDay(key)).calories };
    });
    var maxVal = Math.max(STORE.goals.calories, Math.max.apply(null, dayTotals.map(function(d){ return d.total; })), 1);

    if (STORE.meals.length === 0){
      document.getElementById('view').innerHTML =
        '<div class="empty tab-empty-state"><div class="glyph">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path>' +
          '</svg></div><p>Nothing to chart yet.<br>Log a few meals and your trends will appear here.</p></div>';
      return;
    }

    var html = '<div class="card"><h3 class="section-label" style="margin:0 0 14px;color:var(--text-faint);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;">Last 7 days — calories</h3>';
    html += dayTotals.map(function(d){
      var label = new Date(d.key + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short' });
      return '<div class="insight-bar-row">' +
        '<div class="insight-bar-day">' + label + '</div>' +
        '<div class="insight-bar-track"><div class="insight-bar-fill" style="width:' + pct(d.total, maxVal) + '%"></div></div>' +
        '<div class="insight-bar-val">' + d.total + '</div>' +
      '</div>';
    }).join('');
    html += '</div>';

    document.getElementById('view').innerHTML = html;
  }

  /* =========================================================
     RENDER — SETTINGS TAB
     ========================================================= */
  function renderSettings(){
    var g = STORE.goals;
    var html = '<div class="settings-group"><h3>Daily goals</h3><div class="card">' +
      settingsGoalRow('Calories', 'goalCalories', g.calories) +
      settingsGoalRow('Protein (g)', 'goalProtein', g.protein) +
      settingsGoalRow('Carbs (g)', 'goalCarbs', g.carbs) +
      settingsGoalRow('Fat (g)', 'goalFat', g.fat) +
    '</div></div>' +
    '<div class="settings-group"><h3>Data</h3>' +
      '<button class="btn-danger" data-action="clear-data">Erase all data</button>' +
    '</div>';
    document.getElementById('view').innerHTML = html;
  }

  function settingsGoalRow(label, id, value){
    return '<div class="settings-goal-row"><label>' + label + '</label>' +
      '<input type="number" inputmode="numeric" id="' + id + '" value="' + value + '" data-action-change="save-goal">' +
    '</div>';
  }

  function saveGoalsFromInputs(){
    STORE.goals = {
      calories: parseInt(document.getElementById('goalCalories').value, 10) || DEFAULT_GOALS.calories,
      protein: parseInt(document.getElementById('goalProtein').value, 10) || DEFAULT_GOALS.protein,
      carbs: parseInt(document.getElementById('goalCarbs').value, 10) || DEFAULT_GOALS.carbs,
      fat: parseInt(document.getElementById('goalFat').value, 10) || DEFAULT_GOALS.fat
    };
    saveStore();
  }

  /* =========================================================
     RENDER DISPATCH
     ========================================================= */
  function renderApp(){
    document.querySelectorAll('.tabbar button').forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });
    if (state.tab === 'log') renderLog();
    else if (state.tab === 'history') renderHistory();
    else if (state.tab === 'insights') renderInsights();
    else if (state.tab === 'settings') renderSettings();
  }

  // Same fade+shift treatment as SaviorFit Logger's switchTabWithFade.
  function switchTab(newTab){
    if (newTab === state.tab) return;
    var viewEl = document.getElementById('view');
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion){
      state.tab = newTab;
      renderApp();
      return;
    }

    viewEl.classList.remove('subtab-fade-in');
    viewEl.classList.add('subtab-fade-out');

    setTimeout(function(){
      state.tab = newTab;
      renderApp();
      viewEl.classList.remove('subtab-fade-out');
      viewEl.classList.add('subtab-fade-in');
      setTimeout(function(){
        viewEl.classList.remove('subtab-fade-in');
      }, 170);
    }, 140);
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'set-tab'){
      switchTab(el.dataset.tab);
    } else if (action === 'add-meal'){
      addMealFromForm();
    } else if (action === 'delete-meal'){
      deleteMeal(el.dataset.id);
    } else if (action === 'toggle-history-day'){
      var day = el.dataset.day;
      ui.historyOpenDay = (ui.historyOpenDay === day) ? null : day;
      renderApp();
    } else if (action === 'clear-data'){
      if (window.confirm('Erase all logged meals and reset goals? This can\'t be undone.')){
        STORE = { meals: [], goals: Object.assign({}, DEFAULT_GOALS) };
        saveStore();
        renderApp();
      }
    }
  });

  // Goal inputs save on change (blur/enter), not on every keystroke —
  // avoids writing to localStorage on every digit typed.
  document.addEventListener('change', function(e){
    if (e.target.dataset && e.target.dataset.actionChange === 'save-goal'){
      saveGoalsFromInputs();
    }
  });

  document.getElementById('bootLoading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderApp();
</script>

</body>
</html>
